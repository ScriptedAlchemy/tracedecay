[workspace]
members = [
    "crates/tracedecay",
    "crates/tracedecay-agent-hosts",
    "crates/tracedecay-api",
    "crates/tracedecay-application",
    "crates/tracedecay-automation",
    "crates/tracedecay-capture",
    "crates/tracedecay-cli",
    "crates/tracedecay-code-extraction",
    "crates/tracedecay-code-index",
    "crates/tracedecay-dashboard-api",
    "crates/tracedecay-domain",
    "crates/tracedecay-global-db",
    "crates/tracedecay-graph-db",
    "crates/tracedecay-host-integration",
    "crates/tracedecay-hooks",
    "crates/tracedecay-jsonrpc",
    "crates/tracedecay-lsp",
    "crates/tracedecay-policy",
    "crates/tracedecay-private-fs",
    "crates/tracedecay-query",
    "crates/tracedecay-runtime-core",
    "crates/tracedecay-sdk",
    "crates/tracedecay-search-eval",
    "crates/tracedecay-semantic",
    "crates/tracedecay-sessions",
    "crates/tracedecay-temporal-query",
    "crates/tracedecay-rusqlite-runtime",
    "crates/tracedecay-store",
    "crates/tracedecay-tool-catalog",
    "crates/tracedecay-usecases",
]
exclude = [".worktrees", ".codex-worktrees"]
resolver = "3"

[workspace.metadata.cargo-shear]
ignored-paths = [
    # Consumed only by scripts/check-distribution-acceptance.sh, which copies
    # this file into the extracted package's `examples/` dir and builds it as
    # `--example fastembed_distribution_acceptance`. It is deliberately not a
    # source-repo target, so its "unlinked file" report is a false positive.
    "tests/distribution/fastembed/acceptance.rs",
    "evals/hermetic/fixtures/tool-args/*.rs",
    "evals/hermetic/fixtures/tool-args-other/*.rs",
    "evals/agent_adoption/fixture_broken/*.rs",
    "tests/fixtures/context_eval_project/src/**/*.rs",
    "tests/fixtures/search_quality/corpus/**/*.rs",
    "tests/fixtures/search_quality/incremental/**/*.rs",
]

# Declared once here; every package inherits via
# `edition.workspace = true`. Cargo has no config-level edition default — this
# inheritance table is the sanctioned single source of truth.
[workspace.package]
edition = "2024"
version = "0.1.0-beta.37"

[workspace.dependencies]
# Opt-in profiler, pinned once for the whole workspace. Non-optional on purpose:
# the macros must always resolve, and with no profiling feature selected the
# crate pulls only `hotpath-macros` and expands every macro to a no-op, so the
# explicit feature-off comparison build carries no measurable profiler weight.
hotpath = { version = "0.24", default-features = false, features = ["threads"] }
grafeo-adapters = { version = "=0.5.42", default-features = false, features = ["algos"] }
grafeo-common = { version = "=0.5.42", default-features = false }
grafeo-core = { version = "=0.5.42", default-features = false, features = ["lpg", "vector-index"] }
grafeo-engine = { version = "=0.5.42", default-features = false, features = ["lpg", "gql", "algos", "wal", "grafeo-file", "vector-index"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup", "cache"] }

[profile.bench]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

# Workspace crates retain line tables and incremental state; dependencies omit
# debuginfo to reduce compile, cache, and link costs. CI explicitly disables
# incremental compilation through CARGO_INCREMENTAL.
[profile.dev]
debug = 1
incremental = true
opt-level = 1

[profile.test]
debug = 1
incremental = true
opt-level = 1

# Focused root unit tests retain test assertions while keeping rustc's
# code-generation working set bounded on developer hosts.
[profile.bounded-test]
inherits = "test"
debug = 0
incremental = false
opt-level = 0
codegen-units = 1

[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0

# Opt-in profile for hot-kernel runs: `cargo test --profile perf ...` or
# `cargo build --profile perf ...`. It mirrors dev/test (line tables for
# workspace crates, no dependency debuginfo) but keeps the critical-path
# kernels below optimized. Default `cargo build` / `cargo test` no longer
# optimize any specific package, so ordinary edit-compile loops stay cheap;
# reach for this profile when running the generation-scale code-index or
# graph-publication suites at production-like speed. The full-suite gates
# (`cargo test-all` / `cargo test-ci` in .cargo/config.toml) pin it via
# `--cargo-profile perf` so those suites keep their kernel opt-levels.
[profile.perf]
inherits = "dev"

[profile.perf.package."*"]
debug = 0

# Code-index lifecycle tests exercise six-figure production generations under
# the same bounded readiness contracts as the daemon. Keep the owning kernels
# optimized without hiding assertions or optimizing unrelated workspace code.
[profile.perf.package.tracedecay-code-extraction]
opt-level = 2

[profile.perf.package.tracedecay-code-index]
opt-level = 2

[profile.perf.package.tracedecay-domain]
opt-level = 2

[profile.perf.package.tracedecay-graph-db]
opt-level = 2

[profile.perf.package.tracedecay-runtime-core]
opt-level = 2

[profile.perf.package.tracedecay-rusqlite-runtime]
opt-level = 2

[profile.perf.package.tracedecay-store]
opt-level = 2

[profile.perf.package.grafeo-adapters]
opt-level = 2

[profile.perf.package.grafeo-common]
opt-level = 2

[profile.perf.package.grafeo-core]
opt-level = 2

[profile.perf.package.grafeo-engine]
opt-level = 2

[profile.perf.package.grafeo-storage]
opt-level = 2

[profile.perf.package.serde_json]
opt-level = 2

# The first token count pays a one-time BPE model load (embedded-vocabulary
# base64 decode + BPE regex compile) that costs seconds in unoptimized
# builds; the dashboard token-count warm task and its tests hit it on every
# test-process start.
[profile.perf.package.tiktoken-rs]
opt-level = 2

[profile.perf.package.regex]
opt-level = 2

# Graph publication digest checks hash multi-megabyte canonical replay
# sources on every durable read/write; unoptimized sha2 alone exceeds the
# exact-SQL test transaction budget.
[profile.perf.package.sha2]
opt-level = 3

# Workspace dependencies keep the upstream package API while the canonical
# patched grammar sources ship inside the standalone code-extraction package.
[patch.crates-io]
tree-sitter-rust = { path = "vendor/tree-sitter-rust" }
