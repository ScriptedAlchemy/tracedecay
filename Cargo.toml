[workspace]
members = [
    "crates/tracedecay-automation",
    "crates/tracedecay-capture",
    "crates/tracedecay-domain",
    "crates/tracedecay-code-extraction",
    "crates/tracedecay-code-index",
    "crates/tracedecay-jsonrpc",
    "crates/tracedecay-lsp",
    "crates/tracedecay-runtime-core",
]
resolver = "3"

[package]
name = "tracedecay"
version = "0.0.67"
publish = false
edition = "2024"
description = "Code intelligence tool that builds a semantic knowledge graph from Rust, Go, Java, Scala, TypeScript, Python, C, C++, Kotlin, C#, Swift, and many more codebases"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
homepage = "https://github.com/ScriptedAlchemy/tracedecay"
readme = "README.md"
keywords = ["code-intelligence", "knowledge-graph", "mcp", "tree-sitter", "claude"]
categories = ["development-tools", "command-line-utilities"]
# Explicit whitelist so `cargo package`/`cargo publish` ship everything the
# build needs — including the PREBUILT dashboard dist bundles, which are
# gitignored (an `exclude`-style package can never pick them up). Run
# `cd dashboard && npm ci && npm run build` before packaging; build.rs fails
# fast (or auto-builds from a git checkout) when they are missing.
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/rust-toolchain.toml",
    "/.cargo/config.toml",
    "/build.rs",
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/fixtures/redundancy_eval_labeled.json",
    "/benchmarks/queries/default.toml",
    "/plugin/**",
    "/vendor/**",
    "/dashboard/shell/dist/**",
    "/dashboard/holographic/dist/**",
    "/dashboard/lcm/dist/**",
    "/dashboard/graph/dist/**",
    "/dashboard/code-diagnostics/dist/**",
    "/dashboard/savings/dist/**",
    "/dashboard/settings/dist/**",
    "/dashboard/hermes-wrapper/manifest.json",
    "/dashboard/hermes-wrapper/plugin_api.py",
    "/dashboard/hermes-wrapper/src/**",
]

[features]
default = ["full", "token-counting"]

# Exact token counting for the Savings & Cost dashboard (tiktoken BPE).
# Embeds the o200k_base/cl100k_base vocabularies (~4 MB of binary weight);
# vocab decoding is lazy (first count pays it, idle servers never do).
# Disable for a leaner binary — cost estimation falls back to chars/4.
token-counting = ["dep:tiktoken-rs"]

# Lite tier (11 languages) — always compiled, no feature flag needed:
# Rust, Go, Java, Scala, TypeScript/JavaScript, Python, C, C++, Kotlin, C#, Swift
lite = ["tracedecay-code-extraction/lite", "tracedecay-code-index/lite"]

medium = ["tracedecay-code-index/medium", "lang-dart", "lang-pascal", "lang-php", "lang-ruby", "lang-bash", "lang-protobuf", "lang-powershell", "lang-nix", "lang-vbnet"]
full = ["tracedecay-code-index/full", "medium", "lang-lua", "lang-zig", "lang-objc", "lang-perl", "lang-batch", "lang-fortran", "lang-cobol", "lang-msbasic2", "lang-gwbasic", "lang-qbasic", "lang-dockerfile", "lang-glsl", "lang-wgsl", "lang-hlsl", "lang-metal", "lang-markdown", "lang-r", "lang-sql", "lang-julia", "lang-haskell", "lang-ocaml", "lang-clojure", "lang-erlang", "lang-elixir", "lang-fsharp", "lang-quint", "lang-toml", "lang-lean"]

# Language features backed by the bundled tree-sitter grammar crate.
lang-dart = ["tracedecay-code-extraction/lang-dart", "tracedecay-code-index/lang-dart"]
lang-pascal = ["tracedecay-code-extraction/lang-pascal", "tracedecay-code-index/lang-pascal"]
lang-php = ["tracedecay-code-extraction/lang-php", "tracedecay-code-index/lang-php"]
lang-ruby = ["tracedecay-code-extraction/lang-ruby", "tracedecay-code-index/lang-ruby"]
lang-bash = ["tracedecay-code-extraction/lang-bash", "tracedecay-code-index/lang-bash"]
lang-protobuf = ["tracedecay-code-extraction/lang-protobuf", "tracedecay-code-index/lang-protobuf"]
lang-powershell = ["tracedecay-code-extraction/lang-powershell", "tracedecay-code-index/lang-powershell"]
lang-nix = ["tracedecay-code-extraction/lang-nix", "tracedecay-code-index/lang-nix"]
lang-vbnet = ["tracedecay-code-extraction/lang-vbnet", "tracedecay-code-index/lang-vbnet"]
lang-lua = ["tracedecay-code-extraction/lang-lua", "tracedecay-code-index/lang-lua"]
lang-zig = ["tracedecay-code-extraction/lang-zig", "tracedecay-code-index/lang-zig"]
lang-objc = ["tracedecay-code-extraction/lang-objc", "tracedecay-code-index/lang-objc"]
lang-perl = ["tracedecay-code-extraction/lang-perl", "tracedecay-code-index/lang-perl"]
lang-batch = ["tracedecay-code-extraction/lang-batch", "tracedecay-code-index/lang-batch"]
lang-fortran = ["tracedecay-code-extraction/lang-fortran", "tracedecay-code-index/lang-fortran"]
lang-cobol = ["tracedecay-code-extraction/lang-cobol", "tracedecay-code-index/lang-cobol"]
lang-msbasic2 = ["tracedecay-code-extraction/lang-msbasic2", "tracedecay-code-index/lang-msbasic2"]
lang-gwbasic = ["tracedecay-code-extraction/lang-gwbasic", "tracedecay-code-index/lang-gwbasic"]
lang-qbasic = ["tracedecay-code-extraction/lang-qbasic", "tracedecay-code-index/lang-qbasic"]
lang-dockerfile = ["tracedecay-code-extraction/lang-dockerfile", "tracedecay-code-index/lang-dockerfile"]
lang-glsl = ["tracedecay-code-extraction/lang-glsl", "tracedecay-code-index/lang-glsl"]
lang-wgsl = ["tracedecay-code-extraction/lang-wgsl", "tracedecay-code-index/lang-wgsl"]
lang-hlsl = ["tracedecay-code-extraction/lang-hlsl", "tracedecay-code-index/lang-hlsl"]
lang-metal = ["tracedecay-code-extraction/lang-metal", "tracedecay-code-index/lang-metal"]
lang-markdown = ["tracedecay-code-extraction/lang-markdown", "tracedecay-code-index/lang-markdown"]
lang-r = ["tracedecay-code-extraction/lang-r", "tracedecay-code-index/lang-r"]
lang-sql = ["tracedecay-code-extraction/lang-sql", "tracedecay-code-index/lang-sql"]
lang-julia = ["tracedecay-code-extraction/lang-julia", "tracedecay-code-index/lang-julia"]
lang-haskell = ["tracedecay-code-extraction/lang-haskell", "tracedecay-code-index/lang-haskell"]
lang-ocaml = ["tracedecay-code-extraction/lang-ocaml", "tracedecay-code-index/lang-ocaml"]
lang-clojure = ["tracedecay-code-extraction/lang-clojure", "tracedecay-code-index/lang-clojure"]
lang-erlang = ["tracedecay-code-extraction/lang-erlang", "tracedecay-code-index/lang-erlang"]
lang-elixir = ["tracedecay-code-extraction/lang-elixir", "tracedecay-code-index/lang-elixir"]
lang-fsharp = ["tracedecay-code-extraction/lang-fsharp", "tracedecay-code-index/lang-fsharp"]
lang-quint = ["tracedecay-code-extraction/lang-quint", "tracedecay-code-index/lang-quint"]
lang-toml = ["tracedecay-code-extraction/lang-toml", "tracedecay-code-index/lang-toml"]
lang-lean = ["tracedecay-code-extraction/lang-lean", "tracedecay-code-index/lang-lean"]
test-transport = []

[lib]
name = "tracedecay"

[[bin]]
name = "tracedecay"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tower = "0.5"
libsql = "0.9.30"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tracedecay-domain = { path = "crates/tracedecay-domain" }
tracedecay-code-extraction = { path = "crates/tracedecay-code-extraction", default-features = false }
tracedecay-code-index = { path = "crates/tracedecay-code-index", default-features = false }
tracedecay-jsonrpc = { path = "crates/tracedecay-jsonrpc" }
tracedecay-lsp = { path = "crates/tracedecay-lsp" }
tracedecay-capture = { path = "crates/tracedecay-capture" }
tracedecay-automation = { path = "crates/tracedecay-automation" }
tracedecay-runtime-core = { path = "crates/tracedecay-runtime-core" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3", features = ["json"] }
url = "2"
webpki-roots = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
sha2 = "0.11"
glob = "0.3"
walkdir = "2"
ignore = "0.4"
gix = { version = "0.81", default-features = false, features = ["revision", "blob-diff", "sha1"] }
dirs = "6"
hex = "0.4"
rayon = "1"
bincode = "1.3"
getrandom = "0.2"
self-replace = "1"
memmap2 = "0.9"
crossterm = "0.28"
fs2 = "0.4"
same-file = "1"
reflink-copy = "0.1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
amari-holographic = "0.23.0"
regex = "1.12.3"
shell-words = "1.1"
open = "5.3"
tiktoken-rs = { version = "0.12", optional = true }
# Raw filesystem watcher for the daemon git-metadata watcher (src/daemon/git_watch.rs).
# We deliberately use the raw watcher (not notify-debouncer-full) and debounce
# ourselves so a monorepo's git-ref churn coalesces into a single sync.
notify = "6"

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[build-dependencies]
logo-art = "0.2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.11"
hex = "0.4"
filetime = "0.2"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
# test-util enables tokio::test(start_paused = true) so timer-driven unit
# tests (daemon restart-grace windows) run on virtual time instead of real
# sleeps.
tokio = { version = "1", features = ["full", "test-util"] }
jsonschema = { version = "0.46.8", default-features = false }

[[bench]]
name = "large_repos"
harness = false

# Full debuginfo makes each large integration-test binary 500-700 MB and
# dominates local/CI link time. Level 1 preserves source line tables for
# useful panic backtraces while substantially shrinking linker input/output.
[profile.test]
debug = 1

# Compile the SQLite stack with optimizations even in dev/test builds. The
# bundled SQLite C sources in libsql-ffi are otherwise built at -O0 (cc honors
# cargo's OPT_LEVEL), and nearly every test creates databases and runs many
# queries — unoptimized SQLite dominates test runtime, worst on Windows CI.
# The `test` profile inherits these dev package overrides. Deliberately
# scoped to the libsql and tokenizer layers only; do not blanket-override "*".
[profile.dev.package.libsql-ffi]
opt-level = 2

[profile.dev.package.libsql-sys]
opt-level = 2

[profile.dev.package.libsql-rusqlite]
opt-level = 2

# The first token count pays a one-time BPE model load (embedded-vocabulary
# base64 decode + BPE regex compile) that costs seconds in unoptimized
# builds; the dashboard token-count warm task and its tests hit it on every
# test-process start.
[profile.dev.package.tiktoken-rs]
opt-level = 2

[profile.dev.package.base64]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

# libsql 0.9.30 vendored with a one-line teardown fix (vendor/libsql):
# upstream drops the local connection twice (tursodatabase/libsql#2251),
# double-closing the sqlite3 handle. The use-after-free intermittently
# aborts Windows test processes with STATUS_ACCESS_VIOLATION (0xc0000005).
# Drop the patch once an upstream release makes `disconnect` idempotent.
[patch.crates-io]
libsql = { path = "vendor/libsql" }
