[workspace]
members = [
    "crates/tracedecay-agent-hosts",
    "crates/tracedecay-api",
    "crates/tracedecay-application",
    "crates/tracedecay-automation",
    "crates/tracedecay-capture",
    "crates/tracedecay-code-extraction",
    "crates/tracedecay-code-index",
    "crates/tracedecay-dashboard-api",
    "crates/tracedecay-domain",
    "crates/tracedecay-global-db",
    "crates/tracedecay-graph-db",
    "crates/tracedecay-host-integration",
    "crates/tracedecay-hooks",
    "crates/tracedecay-jsonrpc",
    "crates/tracedecay-lsp",
    "crates/tracedecay-migrate",
    "crates/tracedecay-policy",
    "crates/tracedecay-query",
    "crates/tracedecay-runtime-core",
    "crates/tracedecay-sdk",
    "crates/tracedecay-search-eval",
    "crates/tracedecay-semantic",
    "crates/tracedecay-sessions",
    "crates/tracedecay-temporal-query",
    "crates/tracedecay-rusqlite-parity",
    "crates/tracedecay-rusqlite-runtime",
    "crates/tracedecay-sqlite-parity-protocol",
    "crates/tracedecay-store",
    "crates/tracedecay-tool-catalog",
    "crates/tracedecay-usecases",
]
resolver = "3"

[workspace.metadata.cargo-shear]
ignored-paths = [
    # Consumed only by scripts/check-distribution-acceptance.sh, which copies
    # this file into the extracted package's `examples/` dir and builds it as
    # `--example fastembed_distribution_acceptance`. It is deliberately not a
    # source-repo target, so its "unlinked file" report is a false positive.
    "tests/distribution/fastembed/acceptance.rs",
    "eval/hermetic/fixtures/tool-args/*.rs",
    "eval/hermetic/fixtures/tool-args-other/*.rs",
    "evals/agent_adoption/fixture_broken/*.rs",
    "tests/fixtures/context_eval_project/src/**/*.rs",
    "tests/fixtures/search_quality/corpus/**/*.rs",
]

# Declared once here; every member (including the root package) inherits via
# `edition.workspace = true`. Cargo has no config-level edition default — this
# inheritance table is the sanctioned single source of truth.
[workspace.package]
edition = "2024"

[workspace.dependencies]

[package]
name = "tracedecay"
version = "0.0.67"
edition.workspace = true
description = "Code intelligence tool that builds a semantic knowledge graph from Rust, Go, Java, Scala, TypeScript, Python, C, C++, Kotlin, C#, Swift, and many more codebases"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
homepage = "https://github.com/ScriptedAlchemy/tracedecay"
readme = "README.md"
keywords = ["code-intelligence", "knowledge-graph", "mcp", "tree-sitter", "claude"]
categories = ["development-tools", "command-line-utilities"]
# Explicit whitelist so `cargo package`/`cargo publish` ship everything the
# build needs, including the prebuilt canonical dashboard/app-dist. Frontend
# sources are deliberately not packaged: build.rs detects their absence and
# embeds app-dist as-is, so a registry install never needs Node. Keep that
# packaged-asset check in build.rs in sync if the dashboard entries below
# change.
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/rust-toolchain.toml",
    "/.cargo/config.toml",
    "/build.rs",
    "/build-support/dashboard_cache.rs",
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/fixtures/analytics/**",
    "/tests/fixtures/packaged_host_events/**",
    "/tests/fixtures/provider_normalization/**",
    "/tests/fixtures/redundancy_eval_labeled.json",
    "/tests/fixtures/search_quality/query-semantic-candidate-workload-v1.json",
    "/tests/fixtures/transcript_golden/cline_like/**",
    "/benchmarks/queries/default.toml",
    "/benchmarks/pr5-observation/**",
    "/benchmarks/pr7-memory/**",
    "/benchmarks/pr8-temporal/**",
    "/benchmarks/query-code-index/**",
    "/benchmarks/search-quality/query-fallback-report-v1.json",
    "/scripts/run-pr8-temporal-benchmark.sh",
    "/plugin/.claude-plugin/**",
    "/plugin/.cursor-plugin/**",
    "/plugin/.codex-plugin/**",
    "/plugin/.kimi-plugin/**",
    "/plugin/.lsp.json",
    "/plugin/.mcp.json",
    "/plugin/README*.md",
    "/plugin/agents/**",
    "/plugin/commands/**",
    "/plugin/hooks/**",
    "/plugin/mcp-cursor.json",
    "/plugin/opencode/**",
    "/plugin/overlays/**",
    "/plugin/rules/**",
    "/plugin/skills/**",
    "/plugin/cursor-native-extension/package.json",
    "/plugin/cursor-native-extension/README.md",
    "/plugin/cursor-native-extension/LICENSE",
    "/plugin/cursor-native-extension/dist/extension.js",
    "/vendor/**",
    "/dashboard/app-dist/**",
    "/dashboard/hermes-wrapper/manifest.json",
    "/dashboard/hermes-wrapper/plugin_api.py",
    "/dashboard/hermes-wrapper/src/**",
]

[features]
# Default and explicitly selected production artifacts resolve through the
# same feature. Release packaging must use `--no-default-features --features
# production`; `--all-features` is test-only because it includes
# `test-transport`.
default = ["production"]
production = [
    "token-counting",
    "lite",
    "full",
    "semantic-fastembed",
]

# Exact token counting for the Savings & Cost dashboard (tiktoken BPE).
# Embeds the o200k_base/cl100k_base vocabularies (~4 MB of binary weight);
# vocab decoding is lazy (first count pays it, idle servers never do).
# Disable for a leaner binary — cost estimation falls back to chars/4.
token-counting = ["dep:tiktoken-rs", "tracedecay-agent-hosts/token-counting", "tracedecay-dashboard-api/token-counting"]

# Lite tier (11 languages) — always compiled, no feature flag needed:
# Rust, Go, Java, Scala, TypeScript/JavaScript, Python, C, C++, Kotlin, C#, Swift
lite = ["tracedecay-code-index/lite"]

medium = ["lang-dart", "lang-pascal", "lang-php", "lang-ruby", "lang-bash", "lang-protobuf", "lang-powershell", "lang-nix", "lang-vbnet"]
full = ["medium", "lang-lua", "lang-zig", "lang-objc", "lang-perl", "lang-batch", "lang-fortran", "lang-cobol", "lang-msbasic2", "lang-gwbasic", "lang-qbasic", "lang-dockerfile", "lang-glsl", "lang-wgsl", "lang-hlsl", "lang-metal", "lang-markdown", "lang-r", "lang-sql", "lang-julia", "lang-haskell", "lang-ocaml", "lang-clojure", "lang-erlang", "lang-elixir", "lang-fsharp", "lang-quint", "lang-toml", "lang-lean"]

# Language features backed by the bundled tree-sitter grammar crate.
lang-dart = ["tracedecay-code-index/lang-dart"]
lang-pascal = ["tracedecay-code-index/lang-pascal"]
lang-php = ["tracedecay-code-index/lang-php"]
lang-ruby = ["tracedecay-code-index/lang-ruby"]
lang-bash = ["tracedecay-code-index/lang-bash"]
lang-protobuf = ["tracedecay-code-index/lang-protobuf"]
lang-powershell = ["tracedecay-code-index/lang-powershell"]
lang-nix = ["tracedecay-code-index/lang-nix"]
lang-vbnet = ["tracedecay-code-index/lang-vbnet"]
lang-lua = ["tracedecay-code-index/lang-lua"]
lang-zig = ["tracedecay-code-index/lang-zig"]
lang-objc = ["tracedecay-code-index/lang-objc"]
lang-perl = ["tracedecay-code-index/lang-perl"]
lang-batch = ["tracedecay-code-index/lang-batch"]
lang-fortran = ["tracedecay-code-index/lang-fortran"]
lang-cobol = ["tracedecay-code-index/lang-cobol"]
lang-msbasic2 = ["tracedecay-code-index/lang-msbasic2"]
lang-gwbasic = ["tracedecay-code-index/lang-gwbasic"]
lang-qbasic = ["tracedecay-code-index/lang-qbasic"]
lang-dockerfile = ["tracedecay-code-index/lang-dockerfile"]
lang-glsl = ["tracedecay-code-index/lang-glsl"]
lang-wgsl = ["tracedecay-code-index/lang-wgsl"]
lang-hlsl = ["tracedecay-code-index/lang-hlsl"]
lang-metal = ["tracedecay-code-index/lang-metal"]
lang-markdown = ["tracedecay-code-index/lang-markdown"]
lang-r = ["tracedecay-code-index/lang-r"]
lang-sql = ["tracedecay-code-index/lang-sql"]
lang-julia = ["tracedecay-code-index/lang-julia"]
lang-haskell = ["tracedecay-code-index/lang-haskell"]
lang-ocaml = ["tracedecay-code-index/lang-ocaml"]
lang-clojure = ["tracedecay-code-index/lang-clojure"]
lang-erlang = ["tracedecay-code-index/lang-erlang"]
lang-elixir = ["tracedecay-code-index/lang-elixir"]
lang-fsharp = ["tracedecay-code-index/lang-fsharp"]
lang-quint = ["tracedecay-code-index/lang-quint"]
lang-toml = ["tracedecay-code-index/lang-toml"]
lang-lean = ["tracedecay-code-index/lang-lean"]
test-transport = [
    "tracedecay-rusqlite-runtime/test-transport",
    "tracedecay-runtime-core/test-transport",
    "tracedecay-migrate/test-transport",
    "tracedecay-agent-hosts/test-transport",
    "tracedecay-dashboard-api/test-transport",
    "tracedecay-usecases/test-transport",
]
# Builds the root-package helper shim for integration tests. The rusqlite
# dependency is used only by that bin target; normal root targets never import
# it and are link-checked separately.
rusqlite-parity-helper = ["dep:tracedecay-rusqlite-parity"]

# SEMANTIC FastEmbed adapter (Plan 31). Bundles ORT while leaving FastEmbed's
# image defaults disabled. Runtime inference still loads only from locally
# verified artifact bytes; daemon-owned acquisition uses hf-hub against the
# immutable catalog pins, never query-time ambient cache discovery. The
# adapter itself lives in `tracedecay-semantic`, which owns the pins.
semantic-fastembed = [
    "tracedecay-semantic/semantic-fastembed",
    "tracedecay-usecases/semantic-fastembed",
]

[lib]
name = "tracedecay"

[[bin]]
name = "tracedecay"
path = "src/main.rs"

# Cargo exposes this target to same-package integration tests through
# CARGO_BIN_EXE_tracedecay-rusqlite-parity when the feature is enabled. The
# binary is a process boundary; it is not linked into the normal CLI or lib.
[[bin]]
name = "tracedecay-rusqlite-parity"
path = "src/bin/tracedecay-rusqlite-parity.rs"
required-features = ["rusqlite-parity-helper"]
test = false
bench = false

# Process-isolated storage runtime parity suite. Requires the root helper
# shim so CARGO_BIN_EXE_tracedecay-rusqlite-parity names a built binary.
[[test]]
name = "storage_runtime_suite"
path = "tests/storage_runtime_suite/main.rs"
required-features = ["rusqlite-parity-helper"]

# Plan 36 portability: symlink-alias snapshot capture (test-transport only).
[[test]]
name = "git_index_snapshot_root_canonicalization"
path = "tests/git_index_snapshot_root_canonicalization.rs"
required-features = ["test-transport"]

# Integration harnesses that intentionally exercise in-process daemon/test
# transport seams stay out of the default production feature graph.
[[test]]
name = "dashboard_api_test"
path = "tests/dashboard_api_test/main.rs"
required-features = ["test-transport"]

[[test]]
name = "daemon_fault_harness_test"
path = "tests/daemon_fault_harness_test.rs"
required-features = ["test-transport"]

[[test]]
name = "host_lifecycle_cli_acceptance"
path = "tests/host_lifecycle_cli_acceptance.rs"
required-features = ["test-transport"]

[[test]]
name = "graph_rebuild_status_test"
path = "tests/graph_rebuild_status_test.rs"
required-features = ["test-transport"]

[[test]]
name = "serve_proxy_lifecycle_test"
path = "tests/serve_proxy_lifecycle_test.rs"
required-features = ["test-transport"]

# Operator-run suite that exercises the *real* running managed daemon. Every
# test is `#[ignore]` and additionally gated on TRACEDECAY_LIVE_DAEMON_TESTS=1,
# so it stays inert in CI and in ordinary `cargo test` runs. Entry point:
# `scripts/live-daemon-check.sh`.
[[test]]
name = "live_daemon_suite"
path = "tests/live_daemon_suite.rs"

[dependencies]
axum = "0.8"
tower = "0.5"
tree-sitter = "0.26"
constant_time_eq = "0.5.0"
tracedecay-agent-hosts = { path = "crates/tracedecay-agent-hosts", version = "0.1.0" }
tracedecay-api = { path = "crates/tracedecay-api", version = "0.1.0" }
tracedecay-application = { path = "crates/tracedecay-application", version = "0.1.0", features = ["native-git"] }
tracedecay-automation = { path = "crates/tracedecay-automation", version = "0.1.0" }
tracedecay-code-extraction = { path = "crates/tracedecay-code-extraction", version = "0.1.0", default-features = false }
tracedecay-code-index = { path = "crates/tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-dashboard-api = { path = "crates/tracedecay-dashboard-api", version = "0.1.0" }
tracedecay-domain = { path = "crates/tracedecay-domain", version = "0.1.0" }
tracedecay-host-integration = { path = "crates/tracedecay-host-integration", version = "0.1.0" }
tracedecay-hooks = { path = "crates/tracedecay-hooks", version = "0.1.0" }
tracedecay-jsonrpc = { path = "crates/tracedecay-jsonrpc", version = "0.1.0" }
tracedecay-lsp = { path = "crates/tracedecay-lsp", version = "0.1.0" }
tracedecay-global-db = { path = "crates/tracedecay-global-db", version = "0.1.0" }
tracedecay-migrate = { path = "crates/tracedecay-migrate", version = "0.1.0" }
tracedecay-policy = { path = "crates/tracedecay-policy", version = "0.1.0" }
tracedecay-query = { path = "crates/tracedecay-query", version = "0.1.0" }
tracedecay-runtime-core = { path = "crates/tracedecay-runtime-core", version = "0.1.0" }
tracedecay-search-eval = { path = "crates/tracedecay-search-eval", version = "0.1.0" }
tracedecay-semantic = { path = "crates/tracedecay-semantic", version = "0.1.0" }
tracedecay-sessions = { path = "crates/tracedecay-sessions", version = "0.1.0" }
tracedecay-temporal-query = { path = "crates/tracedecay-temporal-query", version = "0.1.0" }
tracedecay-rusqlite-parity = { path = "crates/tracedecay-rusqlite-parity", version = "0.1.0", optional = true, default-features = false }
tracedecay-rusqlite-runtime = { path = "crates/tracedecay-rusqlite-runtime", version = "0.1.0" }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
tracedecay-store = { path = "crates/tracedecay-store", version = "0.1.0" }
tracedecay-tool-catalog = { path = "crates/tracedecay-tool-catalog", version = "0.1.0" }
tracedecay-usecases = { path = "crates/tracedecay-usecases", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
url = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
sha2 = "0.11"
glob = "0.3"
walkdir = "2"
ignore = "0.4"
gix = { version = "0.81", default-features = false, features = ["revision", "blob-diff", "sha1", "status"] }
dirs = "6"
hex = "0.4"
rayon = "1"
bincode = "1.3"
getrandom = "0.2"
self-replace = "1"
memmap2 = "0.9"
crossterm = "0.28"
fs2 = "0.4"
same-file = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
regex = "1.12.3"
shell-words = "1.1"
open = "5.3"
tiktoken-rs = { version = "0.12", optional = true }
# Raw filesystem watcher for the daemon git-metadata watcher (src/daemon/git_watch.rs).
# We deliberately use the raw watcher (not notify-debouncer-full) and debounce
# ourselves so a monorepo's git-ref churn coalesces into a single sync.
notify = "6"
zeroize = "1.9.0"
keyring = { version = "4.1.5", features = ["v1"] }
tempfile = "3"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
lsp-types = "0.97.0"
schemars = "1.2.1"
futures-util = "0.3.33"
rmcp = { version = "3.0.1", default-features = false, features = ["server"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
xattr = "1"

# `statfs(2)` for daemon store-locality detection (src/daemon/store_runtime/
# resolver.rs). Linux reads `/proc/self/mountinfo` instead; macOS has no such
# file, and `MNT_LOCAL` is the kernel's direct answer to "is this volume local".
[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

[build-dependencies]
logo-art = "0.2"

[dev-dependencies]
sha2 = "0.11"
hex = "0.4"
filetime = "0.2"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
# test-util enables tokio::test(start_paused = true) so timer-driven unit
# tests (daemon restart-grace windows) run on virtual time instead of real
# sleeps.
tokio = { version = "1", features = ["full", "test-util"] }
jsonschema = { version = "0.46.8", default-features = false }
tracedecay-sqlite-parity-protocol = { path = "crates/tracedecay-sqlite-parity-protocol", version = "0.1.0" }
# Test builds opt into the query kernel's `*_for_test` constructors; the
# feature stays off for production builds.
tracedecay-query = { path = "crates/tracedecay-query", version = "0.1.0", features = ["test-helpers"] }
tracedecay-semantic = { path = "crates/tracedecay-semantic", version = "0.1.0", features = ["test-helpers"] }
tracedecay-temporal-query = { path = "crates/tracedecay-temporal-query", version = "0.1.0", features = ["test-helpers"] }
# Same policy for the extracted global-db harness the root test suite drives.
tracedecay-global-db = { path = "crates/tracedecay-global-db", version = "0.1.0", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "crates/tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
tracedecay-sessions = { path = "crates/tracedecay-sessions", version = "0.1.0", features = ["test-helpers"] }
tracedecay-usecases = { path = "crates/tracedecay-usecases", version = "0.1.0", features = ["test-helpers"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }

[[bench]]
name = "large_repos"
harness = false

[[bench]]
name = "session_temporal"
harness = false
# The custom benchmark CLI is not a libtest harness and cannot answer the
# `--list --format terse` probe used by `cargo test` and nextest.
test = false

[profile.bench]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

# Workspace crates retain line tables and incremental state; dependencies omit
# debuginfo to reduce compile, cache, and link costs. CI explicitly disables
# incremental compilation through CARGO_INCREMENTAL.
[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0

# The first token count pays a one-time BPE model load (embedded-vocabulary
# base64 decode + BPE regex compile) that costs seconds in unoptimized
# builds; the dashboard token-count warm task and its tests hit it on every
# test-process start.
[profile.dev.package.tiktoken-rs]
opt-level = 2

[profile.dev.package.regex]
opt-level = 2

# Workspace dependencies keep the upstream package API while the canonical
# patched grammar sources ship inside the standalone code-extraction package.
[patch.crates-io]
tree-sitter-rust = { path = "vendor/tree-sitter-rust" }
