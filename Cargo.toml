harness = false
# The custom benchmark CLI is not a libtest harness and cannot answer the
# `--list --format terse` probe used by `cargo test` and nextest.
test = false

[profile.bench]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

# Workspace crates retain line tables and incremental state; dependencies omit
# debuginfo to reduce compile, cache, and link costs. CI explicitly disables
# incremental compilation through CARGO_INCREMENTAL.
[profile.dev]
debug = 1
incremental = true
opt-level = 1

[profile.test]
debug = 1
incremental = true
opt-level = 1

# Focused root unit tests retain test assertions while keeping rustc's
# code-generation working set bounded on developer hosts.
[profile.bounded-test]
inherits = "test"
debug = 0
incremental = false
opt-level = 0
codegen-units = 1

[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0

# Code-index lifecycle tests exercise six-figure production generations under
# the same bounded readiness contracts as the daemon. Keep the owning kernels
# optimized without hiding assertions or optimizing unrelated workspace code.
[profile.dev.package.tracedecay-code-extraction]
opt-level = 2

[profile.dev.package.tracedecay-code-index]
opt-level = 2

[profile.dev.package.tracedecay-domain]
opt-level = 2

[profile.dev.package.tracedecay-graph-db]
opt-level = 2

[profile.dev.package.tracedecay-runtime-core]
opt-level = 2

[profile.dev.package.tracedecay-rusqlite-runtime]
opt-level = 2

[profile.dev.package.tracedecay-store]
opt-level = 2

[profile.dev.package.grafeo-adapters]
