[profile.dev.package.grafeo-common]
opt-level = 2

[profile.dev.package.grafeo-core]
opt-level = 2

[profile.dev.package.grafeo-engine]
opt-level = 2

[profile.dev.package.grafeo-storage]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.test.package.tracedecay-code-extraction]
opt-level = 2

[profile.test.package.tracedecay-code-index]
opt-level = 2

[profile.test.package.tracedecay-domain]
opt-level = 2

