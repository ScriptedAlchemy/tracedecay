title = "TraceDecay V2 candidate policy"

[extend]
useDefault = true

[[allowlists]]
description = "Exclude Git metadata and scanner receipts that cannot scan themselves"
paths = [
  '''(^|/)\.git(?:/|$)''',
  '''(^|/)target/v2-privacy/receipts/gitleaks-8\.30\.1\.json$''',
  '''(^|/)target/v2-privacy/receipts/detect-secrets-1\.5\.0\.json$''',
]

[[allowlists]]
description = "PR2B-HISTORICAL-ADJUDICATION-001: remediated detect-secrets hash inventory"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["0854a00a3ed8cc17c98cc34e580f3cc720a2c7b3"]
paths = ['''^\.secrets\.baseline$''']
regexTarget = "line"
regexes = ['''^\s*"hashed_secret": "[0-9a-f]{40}",$''']

[[allowlists]]
description = "PR2B-HISTORICAL-ADJUDICATION-002: remediated synthetic private-key baseline pattern"
condition = "AND"
targetRules = ["private-key"]
commits = ["ee5090a6e041d7a084dedf055a7566e86a11f2f8"]
paths = ['''^\.secrets\.baseline$''']
regexTarget = "line"
regexes = ['''^\s*"pattern": \[.*NOT-A-VALID-PRIVATE-KEY.*LOSSLESSPRIVATEKEY1234567890.*\]$''']

[[allowlists]]
description = "PR2B-HISTORICAL-ADJUDICATION-003: remediated synthetic private-key scanner pattern"
condition = "AND"
targetRules = ["private-key"]
commits = ["ee5090a6e041d7a084dedf055a7566e86a11f2f8"]
paths = ['''^scripts/check-v2-detect-secrets\.sh$''']
regexTarget = "line"
regexes = ['''^\s*"pattern": \[r".*NOT-A-VALID-PRIVATE-KEY.*LOSSLESSPRIVATEKEY1234567890.*\],$''']
