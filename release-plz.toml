[workspace]
allow_dirty = false
dependencies_update = false
repo_url = "https://github.com/ScriptedAlchemy/tracedecay"
release_always = false
git_release_enable = true
git_release_name = "v{{ version }}"
git_release_body = "{{ changelog }}"
git_release_type = "prod"
git_release_draft = false
git_release_latest = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]
publish = true
publish_allow_dirty = true
publish_timeout = "1h"
semver_check = true

# Publish workspace libraries before the root crate, but reserve the root
# package's v{{ version }} tag and GitHub release for binary distribution.
[[package]]
name = "tracedecay-domain"
git_release_enable = false
git_tag_enable = false

[[package]]
name = "tracedecay-store"
git_release_enable = false
git_tag_enable = false

[[package]]
name = "tracedecay-sdk"
git_release_enable = false
git_tag_enable = false
