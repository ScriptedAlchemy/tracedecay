name: TraceDecay warm CI experiment
description: Compare three fresh Cargo targets with one warm Hauler lane on a trusted TraceDecay checkout.
inputs:
  head:
    description: Commit at the end of the three-commit experiment.
    required: true
  output:
    description: Absolute path for the JSON measurement report.
    required: true
runs:
  using: composite
  steps:
    - name: Measure fresh and warm snapshots, then reject changed failing source
      shell: bash
      env:
        SOURCE_HEAD: ${{ inputs.head }}
        OUTPUT: ${{ inputs.output }}
      run: python3 "$GITHUB_ACTION_PATH/warm.py" "$GITHUB_WORKSPACE" --head "$SOURCE_HEAD" --output "$OUTPUT"
