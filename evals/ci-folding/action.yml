name: TraceDecay warm CI experiment
description: Measure two manually trusted PR heads in one hosted worker with a cold comparison and source failure proof.
inputs:
  plan:
    description: Immutable admission plan from the trusted planner job.
    required: true
  output:
    description: Absolute output directory for measurements, logs and JUnit.
    required: true
runs:
  using: composite
  steps:
    - name: Measure admitted heads and verify changed source
      shell: bash
      env:
        TRIAL_PLAN: ${{ inputs.plan }}
        OUTPUT: ${{ inputs.output }}
      run: python3 "$GITHUB_ACTION_PATH/warm.py" measure "$GITHUB_WORKSPACE" --output "$OUTPUT"
