[build]
# Keep this portable. On this machine and in CI, `target` is repo-local.
target-dir = "target"

[env]
# Disable C/C++ assertions in vendored tree-sitter grammars so that grammar
# bugs (e.g. the tree-sitter-markdown autolink assertion) produce a failed
# parse rather than aborting the process.  NDEBUG is the standard production
# setting; it has no effect on Rust code.
CFLAGS = { value = "-DNDEBUG", force = false }
CXXFLAGS = { value = "-DNDEBUG", force = false }

# Global accounting (savings ledger, worldwide-counter flushes) is ON by
# default for installed binaries, but `cargo test` / `cargo run` would then
# write temp-project rows into the developer's real ~/.tracedecay/global.db.
# Keep cargo-launched processes hermetic; tests that exercise the ledger opt
# back in with TRACEDECAY_ENABLE_GLOBAL_DB=1.
# Installed binaries run outside cargo and are unaffected.
TRACEDECAY_DISABLE_GLOBAL_DB = { value = "1", force = false }

# Point cargo-launched processes at a workspace-local profile. Without this,
# any test (or `tracedecay` binary a test spawns) that doesn't set
# TRACEDECAY_DATA_DIR itself resolves storage to the developer's real
# ~/.tracedecay, enrolling temp fixture repos into the real profile and
# contending with a live daemon. Tests that need a private profile override
# this per-test (`force = false`); the HOME-fallback tests remove the variable
# in-process. Installed binaries run outside cargo and are unaffected, but the
# profile does apply to `cargo run` — use the installed binary (or set
# TRACEDECAY_DATA_DIR yourself) for real `daemon install-service` runs.
# Enforced by tests/core_cli_suite/test_profile_isolation_test.rs.
TRACEDECAY_DATA_DIR = { value = "target/test-profile/.tracedecay", force = false, relative = true }

# Cheaper Linux links, scoped to the gnu triples so Windows (MSVC supports
# only packed split-debuginfo) and macOS (already defaults to unpacked) keep
# their platform defaults. `split-debuginfo=unpacked` leaves debuginfo in the
# object files instead of linking it into every binary; it is a no-op for
# profiles that build without debuginfo. The `-B` flags append the mold
# linker's driver directories (Debian/Ubuntu/Fedora package and source-install
# locations): GCC and clang silently skip nonexistent `-B` dirs, so hosts
# without mold fall back to the toolchain default, and any GCC accepts `-B`
# (unlike `-fuse-ld=mold`, which needs GCC >= 12 — see
# .github/actions/setup-linux-mold). Search order keeps faster defaults
# intact: on x86_64-unknown-linux-gnu, recent rustc already links with its
# bundled rust-lld through an earlier `-B`, so mold engages only where that
# self-contained lld default is absent (e.g. aarch64 gnu hosts or lld-less
# toolchains) — never a regression, mold-or-better everywhere. CI separately
# symlinks ld -> mold, which these flags do not disturb. A user-set RUSTFLAGS
# env var replaces these flags entirely; these sections set no `linker` key.
[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "split-debuginfo=unpacked",
  "-C", "link-arg=-B/usr/libexec/mold",
  "-C", "link-arg=-B/usr/local/libexec/mold",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
  "-C", "split-debuginfo=unpacked",
  "-C", "link-arg=-B/usr/libexec/mold",
  "-C", "link-arg=-B/usr/local/libexec/mold",
]

[alias]
# Local default for the full Rust test suite. Requires cargo-nextest:
# https://nexte.st/docs/installation/pre-built-binaries/
test-all = "nextest run --workspace --all-features --no-fail-fast"
test-ci = "nextest run --workspace --all-features --no-fail-fast"
