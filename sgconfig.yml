# ast-grep project configuration (https://ast-grep.github.io).
#
# These are structural ownership gates, not style lint. Plan 11's acceptance
# criteria require AST/import-boundary tests that fail when renderer code
# computes product semantics it is only allowed to render. `npm run
# boundary:check` in dashboard/ and the CI `dashboard` job both run
# `ast-grep scan` against the rules below.
#
# Rule `files:`/`ignores:` globs are resolved against this file's directory,
# so they are written repo-relative regardless of the caller's cwd.
ruleDirs:
  - tools/ast-grep/rules
