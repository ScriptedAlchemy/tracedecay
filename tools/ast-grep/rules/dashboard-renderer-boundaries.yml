# Plan 11 renderer/import boundary gates for the dashboard.
#
# docs/plans/tracedecay-v2/11-dashboard-frontend.md, Acceptance:
#   "AST/import-boundary tests fail if renderer or Kanban code computes
#    identity, rank, semantic clusters, causality, readiness, critical path,
#    health, severity, coverage, routes, legal actions, or remediation;
#    persists a board, task/runtime state, expanded evidence, or adapter
#    layout; treats lane/order/process exit/heartbeat/provider output as
#    canonical state; ..."
#
# The ownership line these encode is from the same plan:
#   Owns          - "A renderer-neutral graph/timeline view model ... Renderer
#                    adapters own drawing and interaction acceleration only."
#   Does not own  - "Graph/query/storage authority, renderer-local ranking,
#                    health, readiness, scheduling, repair, or model-route
#                    calculations."
#
# Layering this implies, and which the `files:` globs below follow:
#   dashboard/src/viz/trace/model.ts  - the renderer-neutral view model. It may
#     arrange and budget, and it accounts for every exclusion in `coverage`.
#   dashboard/src/viz/graph, .../chart - drawing adapters. They receive a view
#     model and draw it. They decide nothing about what the numbers mean.
#
# ast-grep resolves `.ts` as language TypeScript and `.tsx` as language Tsx and
# will not apply one to the other, so every rule below is written twice. Keep
# the pairs identical apart from `id` and `language`.
#
# Tests are excluded throughout: a test may legitimately construct the very
# shapes production renderers are forbidden to build.

# ---------------------------------------------------------------------------
# 1. Renderers receive server state; they never reach for it.
# ---------------------------------------------------------------------------
id: viz-renderer-imports-server-state
language: TypeScript
severity: error
message: Renderer under dashboard/src/viz imports server-state or wire machinery.
note: |
  Plan 11: renderer adapters "own drawing and interaction acceleration only",
  and the dashboard "does not own ... graph/query/storage authority,
  renderer-local ranking, health, readiness, scheduling, repair, or
  model-route calculations".

  A renderer that imports src/data (queries, scope store, SSE), src/contracts
  (wire decoders), TanStack Query, or Zustand has stopped rendering values it
  was handed and started deriving and owning them. Pass a typed view model in
  as props, and let the workspace above the renderer do the fetching.

  `import type` is allowed - naming a type is not deriving one. Write
  type-only imports as `import type { X } from ...`, not `import { type X }`.
files:
  - dashboard/src/viz/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - all:
        - kind: import_statement
        - regex: 'from\s*[''"](((\.{1,2}/)+(data|contracts)(/|[''"]))|(@tanstack/react-query)|(zustand))'
        - not:
            regex: '^import\s+type\b'
    - all:
        - kind: call_expression
        - regex: '^import\s*\(\s*[''"](((\.{1,2}/)+(data|contracts)(/|[''"]))|(@tanstack/react-query)|(zustand))'

---
id: viz-renderer-imports-server-state-tsx
language: Tsx
severity: error
message: Renderer under dashboard/src/viz imports server-state or wire machinery.
note: |
  See viz-renderer-imports-server-state. Renderer adapters receive a typed
  view model as props; they never import src/data, src/contracts, TanStack
  Query, or Zustand to derive one.
files:
  - dashboard/src/viz/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - all:
        - kind: import_statement
        - regex: 'from\s*[''"](((\.{1,2}/)+(data|contracts)(/|[''"]))|(@tanstack/react-query)|(zustand))'
        - not:
            regex: '^import\s+type\b'
    - all:
        - kind: call_expression
        - regex: '^import\s*\(\s*[''"](((\.{1,2}/)+(data|contracts)(/|[''"]))|(@tanstack/react-query)|(zustand))'

# ---------------------------------------------------------------------------
# 2. Renderers do not open transports.
# ---------------------------------------------------------------------------
---
id: viz-renderer-opens-transport
language: TypeScript
severity: error
message: Renderer under dashboard/src/viz opens its own network transport.
note: |
  Plan 11 routes every byte through one generated wire boundary and one SSE
  module. A renderer that calls `fetch` or opens a socket is a second, ungated
  source of canonical state: it bypasses the Zod decoders, the monotone SSE
  reducer's stale-generation rejection, and the exact scope the workspace
  resolved. Take the data as props.
files:
  - dashboard/src/viz/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - pattern: fetch($$$)
    - pattern: new WebSocket($$$)
    - pattern: new XMLHttpRequest($$$)

---
id: viz-renderer-opens-transport-tsx
language: Tsx
severity: error
message: Renderer under dashboard/src/viz opens its own network transport.
note: |
  See viz-renderer-opens-transport. Renderers take data as props; they do not
  fetch it.
files:
  - dashboard/src/viz/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - pattern: fetch($$$)
    - pattern: new WebSocket($$$)
    - pattern: new XMLHttpRequest($$$)

# ---------------------------------------------------------------------------
# 3. One SSE module. "Workspaces never open ad hoc EventSources." (Plan 11)
# ---------------------------------------------------------------------------
---
id: dashboard-ad-hoc-eventsource
language: TypeScript
severity: error
message: EventSource opened outside dashboard/src/data/sse.
note: |
  Plan 11: "One SSE module implements the monotone event reducer (dedupe by
  stream/event/revision, stale-generation rejection, refetch-on-gap) and feeds
  TanStack Query patches/invalidations. Workspaces never open ad hoc
  EventSources."

  A second EventSource has none of that reducer's protections, so live events
  arriving out of order or from a superseded generation are treated as
  canonical. Subscribe through dashboard/src/data/sse.
files:
  - dashboard/src/**
ignores:
  - dashboard/src/data/sse/**
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  pattern: new EventSource($$$)

---
id: dashboard-ad-hoc-eventsource-tsx
language: Tsx
severity: error
message: EventSource opened outside dashboard/src/data/sse.
note: |
  See dashboard-ad-hoc-eventsource. Subscribe through dashboard/src/data/sse
  so the monotone reducer's dedupe and stale-generation rejection apply.
files:
  - dashboard/src/**
ignores:
  - dashboard/src/data/sse/**
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  pattern: new EventSource($$$)

# ---------------------------------------------------------------------------
# 4. Renderers do not persist adapter layout or selection.
# ---------------------------------------------------------------------------
---
id: viz-renderer-persists-adapter-state
language: TypeScript
severity: error
message: Renderer under dashboard/src/viz touches localStorage/sessionStorage.
note: |
  Plan 11 acceptance fails renderer code that "persists ... expanded evidence,
  or adapter layout". Storage-backed node positions, camera state, expansion,
  or selection outlive the server state they were computed against, so the
  next visit draws a layout over data that has since changed and the reader
  cannot tell. Layout is recomputed from the view model; durable presentation
  state belongs to the app shell.

  Exempt: dashboard/src/viz/trace/reducedMotion.ts. It persists only the
  user's three-state motion preference, which Plan 11 explicitly OWNS
  ("accessibility ... and client-side presentation") and which is not adapter
  layout or product state.
files:
  - dashboard/src/viz/**
ignores:
  - dashboard/src/viz/trace/reducedMotion.ts
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - all:
        - kind: identifier
        - regex: '^(localStorage|sessionStorage)$'
    - all:
        - kind: property_identifier
        - regex: '^(localStorage|sessionStorage)$'

---
id: viz-renderer-persists-adapter-state-tsx
language: Tsx
severity: error
message: Renderer under dashboard/src/viz touches localStorage/sessionStorage.
note: |
  See viz-renderer-persists-adapter-state. Adapter layout, camera, expansion,
  and selection are recomputed from the view model, never persisted here.
files:
  - dashboard/src/viz/**
ignores:
  - dashboard/src/viz/trace/reducedMotion.ts
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - all:
        - kind: identifier
        - regex: '^(localStorage|sessionStorage)$'
    - all:
        - kind: property_identifier
        - regex: '^(localStorage|sessionStorage)$'

# ---------------------------------------------------------------------------
# 5. Renderers do not grade health, severity, or readiness.
# ---------------------------------------------------------------------------
---
id: viz-renderer-grades-state
language: TypeScript
severity: error
message: Renderer under dashboard/src/viz decides a health/severity/readiness grade.
note: |
  Plan 11 acceptance fails renderer code that "computes ... readiness ...
  health, severity", and the plan puts finding "identity, diagnosis,
  aggregation, severity, health state, or remediation orchestration" in the
  Doctor application kernel, not here. "The frontend never ... infers health."

  A threshold in a renderer is a second, undocumented grading rule that will
  disagree with the daemon's the moment either moves, and the reader has no
  way to see which one produced the colour. Render the typed state the API
  supplied; if the API does not supply one, that is a backend gap to fill, not
  a ternary to write.
files:
  - dashboard/src/viz/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - kind: ternary_expression
      any:
        - has:
            field: consequence
            kind: string
            regex: '^[''"](critical|severe|error|warning|warn|degraded|unhealthy|failing|healthy|ok|passing|blocked|ready|not_ready|stale)[''"]$'
        - has:
            field: alternative
            kind: string
            regex: '^[''"](critical|severe|error|warning|warn|degraded|unhealthy|failing|healthy|ok|passing|blocked|ready|not_ready|stale)[''"]$'
    - kind: return_statement
      inside:
        kind: statement_block
        inside:
          kind: if_statement
          stopBy: end
      has:
        kind: string
        regex: '^[''"](critical|severe|error|warning|warn|degraded|unhealthy|failing|healthy|ok|passing|blocked|ready|not_ready|stale)[''"]$'

---
id: viz-renderer-grades-state-tsx
language: Tsx
severity: error
message: Renderer under dashboard/src/viz decides a health/severity/readiness grade.
note: |
  See viz-renderer-grades-state. Render the typed state the API supplied; the
  frontend never infers health.
files:
  - dashboard/src/viz/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - kind: ternary_expression
      any:
        - has:
            field: consequence
            kind: string
            regex: '^[''"](critical|severe|error|warning|warn|degraded|unhealthy|failing|healthy|ok|passing|blocked|ready|not_ready|stale)[''"]$'
        - has:
            field: alternative
            kind: string
            regex: '^[''"](critical|severe|error|warning|warn|degraded|unhealthy|failing|healthy|ok|passing|blocked|ready|not_ready|stale)[''"]$'
    - kind: return_statement
      inside:
        kind: statement_block
        inside:
          kind: if_statement
          stopBy: end
      has:
        kind: string
        regex: '^[''"](critical|severe|error|warning|warn|degraded|unhealthy|failing|healthy|ok|passing|blocked|ready|not_ready|stale)[''"]$'

# ---------------------------------------------------------------------------
# 6. Drawing adapters preserve the order they are given.
# ---------------------------------------------------------------------------
---
id: viz-adapter-ranks-locally
language: TypeScript
severity: error
message: Drawing adapter re-ranks its input by a measured field.
note: |
  Plan 11 puts "renderer-local ranking" in "Does not own" and fails renderer
  code that "computes ... rank". Ordering by degree, call sites, score, or
  severity inside a drawing adapter silently overrides whatever ordering the
  daemon and the view model already established, and nothing on screen says
  the two disagree.

  Scope note: this covers dashboard/src/viz/graph and dashboard/src/viz/chart,
  the drawing adapters. dashboard/src/viz/trace holds the renderer-neutral
  view model Plan 11 DOES own, which arranges within a stated budget and
  accounts for every exclusion in `coverage`.

  Ordering by a stable identity (`a.id.localeCompare(b.id)`) or by geometry
  the adapter itself produced is fine - that is drawing, not ranking.
files:
  - dashboard/src/viz/graph/**
  - dashboard/src/viz/chart/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - pattern: $LIST.sort($CB)
    - pattern: $LIST.toSorted($CB)
constraints:
  CB:
    regex: '(degree|vitality|calls|count|score|severity|weight|rank|priority|health|coverage|freshness|recency|activity|impact)'

---
id: viz-adapter-ranks-locally-tsx
language: Tsx
severity: error
message: Drawing adapter re-ranks its input by a measured field.
note: |
  See viz-adapter-ranks-locally. A drawing adapter preserves the order the
  view model handed it; ordering by a measured field is ranking.
files:
  - dashboard/src/viz/graph/**
  - dashboard/src/viz/chart/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - pattern: $LIST.sort($CB)
    - pattern: $LIST.toSorted($CB)
constraints:
  CB:
    regex: '(degree|vitality|calls|count|score|severity|weight|rank|priority|health|coverage|freshness|recency|activity|impact)'

# ---------------------------------------------------------------------------
# 7. Renderers hold no route authority.
# ---------------------------------------------------------------------------
---
id: viz-renderer-owns-routes
language: TypeScript
severity: error
message: Renderer under dashboard/src/viz names an API route or drives navigation.
note: |
  Plan 11 acceptance fails renderer code that "computes ... routes ... legal
  actions, or remediation", and "generated compatibility views, route
  inventories, or a second model of backend behavior" are in "Does not own".

  An endpoint path spelled inside a renderer is a second route inventory that
  the generated contracts do not cover and `contracts:check` cannot see, and a
  renderer that navigates is deciding a legal action rather than reporting the
  interaction. Take a callback prop; let the workspace own the route.
files:
  - dashboard/src/viz/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - all:
        - kind: string
        - regex: '^[''"]/api/'
    - all:
        - kind: template_string
        - regex: '^`/api/'
    - all:
        - kind: import_statement
        - regex: 'from\s*[''"]react-router'

---
id: viz-renderer-owns-routes-tsx
language: Tsx
severity: error
message: Renderer under dashboard/src/viz names an API route or drives navigation.
note: |
  See viz-renderer-owns-routes. Renderers take callback props; the workspace
  owns routes and navigation.
files:
  - dashboard/src/viz/**
ignores:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  any:
    - all:
        - kind: string
        - regex: '^[''"]/api/'
    - all:
        - kind: template_string
        - regex: '^`/api/'
    - all:
        - kind: import_statement
        - regex: 'from\s*[''"]react-router'
