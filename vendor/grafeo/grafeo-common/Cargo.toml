[workspace]

[package]
edition = "2024"
rust-version = "1.91.1"
name = "grafeo-common"
version = "0.5.42"
authors = ["S.T. Grond"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Common types, memory allocators, and utilities for Grafeo"
readme = false
license = "Apache-2.0"
repository = "https://github.com/GrafeoDB/grafeo"
resolver = "2"

[features]
default = []
encryption = [
    "dep:aes-gcm",
    "dep:hkdf",
    "dep:argon2",
    "dep:zeroize",
    "dep:sha2",
    "dep:rand",
]
temporal = []
testing-crash-injection = []
testing-statement-injection = []
tiered-storage = []
tracing = ["dep:tracing"]

[lib]
name = "grafeo_common"
path = "src/lib.rs"

[[bench]]
name = "arena_bench"
path = "benches/arena_bench.rs"
harness = false

[dependencies.aes-gcm]
version = "0.10"
optional = true

[dependencies.arcstr]
version = "1"
features = ["serde"]

[dependencies.argon2]
version = "0.5"
optional = true

[dependencies.bincode]
version = "2.0"
features = ["serde"]

[dependencies.bumpalo]
version = "3"

[dependencies.byteorder]
version = "1"

[dependencies.bytes]
version = "1"

[dependencies.dashmap]
version = "6"

[dependencies.foldhash]
version = "0.2"

[dependencies.hashbrown]
version = "0.17"
features = ["serde"]

[dependencies.hkdf]
version = "0.13"
optional = true

[dependencies.indexmap]
version = "2"

[dependencies.parking_lot]
version = "0.12"

[dependencies.rand]
version = "0.10.1"
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "rc",
]

[dependencies.sha2]
version = "0.11"
optional = true

[dependencies.smallvec]
version = "1"

[dependencies.thiserror]
version = "2.0"

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.zeroize]
version = "1"
features = ["derive"]
optional = true

[dev-dependencies.criterion]
version = "4"
package = "codspeed-criterion-compat"

