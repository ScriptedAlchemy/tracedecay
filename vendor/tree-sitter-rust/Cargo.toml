[package]
# Workspace-only compatibility wrapper. The canonical patched grammar sources
# ship inside tracedecay-code-extraction so its registry package is standalone.
name = "tree-sitter-rust"
description = "Rust grammar for tree-sitter"
version = "0.24.2"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "rust"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-rust"
edition = "2021"
publish = false
autoexamples = false

build = "bindings/rust/build.rs"
include = ["LICENSE", "README.md", "bindings/rust/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.25"

[workspace]
