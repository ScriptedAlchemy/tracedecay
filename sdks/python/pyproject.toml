[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracedecay-sdk"
version = "0.1.0"
description = "Typed TraceDecay lifecycle client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TraceDecay contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/ScriptedAlchemy/tracedecay"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
tracedecay_sdk = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
