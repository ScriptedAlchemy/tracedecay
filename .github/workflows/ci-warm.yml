name: Warm Linux CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A batch owns its six workers until every admitted head has a verdict. Later
# events recheck the live PR state instead of replacing an in-flight batch.
concurrency:
  group: warm-linux-ci
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'ScriptedAlchemy/tracedecay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      plan: ${{ steps.admit.outputs.plan }}
      count: ${{ steps.admit.outputs.count }}
      matrix: ${{ steps.admit.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit current compatible pull request heads
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="$(python3 evals/ci-folding/automatic.py plan)"
          {
            echo "plan=$plan"
            echo "count=$(jq '.heads | length' <<< "$plan")"
            echo "matrix=$(python3 scripts/linux-test-partitions.py linux-matrix)"
          } >> "$GITHUB_OUTPUT"

  measure:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Warm Linux ${{ matrix.group }}
    runs-on: ubuntu-24.04-arm
    # Two heads can each consume the existing 160-minute transport budget.
    timeout-minutes: 350
    permissions: {}
    steps:
      - name: Fetch reviewed controller without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
        run: |
          git -c credential.helper= clone --no-checkout "https://github.com/$GITHUB_REPOSITORY.git" .
          git checkout --detach "$GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PR code runs later on this worker. Do not let it write a base-branch
      # dependency cache through this pull_request_target workflow.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the tested toolchain and runner tools
        run: |
          rustup show active-toolchain
          rustup which rust-analyzer
          npm install --global cargo-hauler@0.10.0

      - uses: ./.github/actions/setup-linux-mold
      - uses: ./.github/actions/install-ast-grep
        with:
          version: '0.44.0'
      - uses: taiki-e/install-action@acdba816b0980ba6b63f1109f89a046e15fc301a
        with:
          tool: nextest

      - name: Run all partitions for each admitted head
        env:
          WARM_PLAN: ${{ needs.plan.outputs.plan }}
          GROUP: ${{ matrix.group }}
          OUTPUT: ${{ runner.temp }}/warm-linux/${{ matrix.group }}
        run: python3 evals/ci-folding/automatic.py measure "$GITHUB_WORKSPACE" --group "$GROUP" --output "$OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warm-linux-${{ matrix.group }}
          path: ${{ runner.temp }}/warm-linux/${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 7

  report:
    needs: [plan, measure]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # This runner executes only reviewed controller code, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: warm-linux-*
          path: ${{ runner.temp }}/warm-linux-artifacts
      - name: Publish exact-head Linux verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          WARM_PLAN: ${{ needs.plan.outputs.plan }}
          WORKER_RESULT: ${{ needs.measure.result }}
          ARTIFACTS: ${{ runner.temp }}/warm-linux-artifacts
        run: python3 evals/ci-folding/automatic.py report --artifacts "$ARTIFACTS" --worker-result "$WORKER_RESULT"
