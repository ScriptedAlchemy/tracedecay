name: Hermetic evaluation tests

on:
  pull_request:
    paths:
      - "evals/hermetic/**"
      - "evals/agent_adoption/**"
      - "scripts/build-eval-binary.sh"
      - ".github/workflows/hermetic-evals.yml"
  push:
    branches: [master]
    paths:
      - "evals/hermetic/**"
      - "evals/agent_adoption/**"
      - "scripts/build-eval-binary.sh"
      - ".github/workflows/hermetic-evals.yml"

permissions:
  contents: read

concurrency:
  group: hermetic-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    name: Hermetic evaluation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bazel
        with:
          cache-key: hermetic-eval-tests
          tailscale-client-id: >-
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                && ((github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
                    || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID)) || '' }}
      - name: Check runner syntax
        run: |
          bash -n evals/hermetic/run.sh
          bash -n evals/agent_adoption/run.sh
          bash -n evals/agent_adoption/claude_tools.sh
          bash -n scripts/build-eval-binary.sh
      - name: Run scorer and shell-runner regressions
        run: >-
          bazel test
          //evals/hermetic:score_test
          //evals/hermetic:run_test
          //evals/hermetic:scorecard_test
          //evals/agent_adoption:selftest
          //scripts:build_eval_binary_test
          --test_output=errors
      - name: Execute stock-edit oracle regressions
        run: python3 evals/agent_adoption/stock_check_selftest.py
