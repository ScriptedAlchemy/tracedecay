# Release channels.
#
# Every push to master proposes the next beta prerelease: release-please
# (release-please-config.json, versioning "prerelease") opens or updates a
# "chore(release): release X.Y.Z-beta.N" PR. Merging it tags the merge commit
# and publishes a GitHub *prerelease*, which release-beta.yml turns into
# attested `tracedecay-beta-<tag>-<platform>` assets, the names the CLI beta
# upgrade channel resolves.
#
# A stable release never happens on its own. Dispatch this workflow with
# channel=stable and the exact version to ship; release-please then opens a
# "chore(release): release X.Y.Z" PR from release-please-config-stable.json,
# and merging that publishes a full release for release.yml.
#
# Recover assets for an existing tag:
#   gh workflow run release-beta.yml --ref master -f release_tag=vX.Y.Z-beta.N
#   gh workflow run release.yml      --ref master -f release_tag=vX.Y.Z

name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      channel:
        description: "beta proposes the next prerelease; stable opens a release PR for the exact version below"
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: "Stable version to ship, e.g. 0.1.0 (required when channel=stable)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open release PR or create GitHub release
    if: github.repository == 'ScriptedAlchemy/tracedecay'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Resolve the release channel
        id: channel
        env:
          CHANNEL: ${{ inputs.channel || 'beta' }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "channel=$CHANNEL" >>"$GITHUB_OUTPUT"
          case "$CHANNEL" in
            beta)
              [[ -z "$VERSION" ]] ||
                { echo "channel=beta does not take a version; release-please derives the next prerelease" >&2; exit 1; }
              echo "config=release-please-config.json" >>"$GITHUB_OUTPUT"
              echo "release_as=" >>"$GITHUB_OUTPUT"
              ;;
            stable)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
                { echo "channel=stable requires an exact X.Y.Z version, got '${VERSION}'" >&2; exit 1; }
              echo "config=release-please-config-stable.json" >>"$GITHUB_OUTPUT"
              echo "release_as=$VERSION" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

      - name: Open release PR or create GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          target-branch: master
          config-file: ${{ steps.channel.outputs.config }}
          manifest-file: .release-please-manifest.json
          release-as: ${{ steps.channel.outputs.release_as }}

      # Build on the default-branch run ref, not the unique tag ref. The build
      # still checks out and validates the immutable tag, but GitHub permits
      # this run to restore the previous release's dependency cache.
      - name: Dispatch beta asset build on master
        if: steps.release.outputs.release_created == 'true' && steps.channel.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release-beta.yml --repo "$GITHUB_REPOSITORY" --ref master --field "release_tag=$RELEASE_TAG"

      - name: Dispatch stable asset build on master
        if: steps.release.outputs.release_created == 'true' && steps.channel.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master --field "release_tag=$RELEASE_TAG"

      - name: Checkout release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # The release PR is opened as a draft and stays one until it carries a
      # lockfile matching the bumped Cargo.toml, the same invariant the later
      # locked release build enforces.
      - name: Update release PR lockfile
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          RELEASE_PR_NUMBER=$(
            jq --exit-status --raw-output \
              '.number | select(type == "number")' \
              <<<"$RELEASE_PR_JSON"
          )
          scripts/update-release-pr-lockfile.sh
          gh pr ready "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Checkout master
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Check GitHub release version drift
        if: always()
        run: scripts/check-release-drift.sh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
