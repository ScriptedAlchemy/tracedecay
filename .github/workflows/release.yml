name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable release tag to recover"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
  TRACEDECAY_SKIP_DASHBOARD_BUILD: "1"

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Resolve release source
    if: >-
      github.repository == 'ScriptedAlchemy/tracedecay' &&
      (
        (github.event_name == 'release' && !github.event.release.prerelease) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      source_epoch: ${{ steps.release.outputs.source_epoch }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      matrix: ${{ steps.release.outputs.matrix }}
      build_required: ${{ steps.release.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate manual stable recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'false\tfalse'

      - name: Resolve release identity
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_epoch="$(git show -s --format=%ct "$source_sha")"
          version="$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "tracedecay") | .version')"
          test -n "$version"
          test "$version" != "null"
          [[ "$version" != *-* ]]
          tag="v${version}"
          test "$RELEASE_TAG" = "$tag"
          test "$GITHUB_REF" = "refs/tags/${tag}"
          test "$GITHUB_SHA" = "$source_sha"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$source_sha" ]]; then
              echo "::error::${tag} targets ${tag_sha}, not release source ${source_sha}"
              exit 1
            fi
          fi
          {
            echo "source_sha=${source_sha}"
            echo "source_epoch=${source_epoch}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=false"
          } >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/releases/tags/${tag}" \
            --jq '.assets[].name' > remote-asset-names
          python3 scripts/plan-release-recovery.py \
            --manifest .github/release-targets.json \
            --tag "$tag" \
            --profile stable \
            --asset-names remote-asset-names \
            --retained-output retained-asset-names \
            --github-output "$GITHUB_OUTPUT"
          mkdir retained-assets
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            gh release download "$tag" --repo "${{ github.repository }}" \
              --pattern "$asset" --dir retained-assets
            gh attestation verify "retained-assets/$asset" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${tag}" \
              --source-digest "$source_sha" \
              --deny-self-hosted-runners >/dev/null
          done < retained-asset-names

  dashboard-assets:
    name: Build dashboard artifact
    needs: validate-release
    if: needs.validate-release.outputs.build_required == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}
          path: .release-automation

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Validate dashboard bundle
        run: python3 .release-automation/scripts/check-dashboard-bundle.py dashboard/app-dist

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist
          if-no-files-found: error
          include-hidden-files: true

  build:
    name: Build ${{ matrix.name }}
    needs: [validate-release, dashboard-assets]
    if: needs.validate-release.outputs.build_required == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-release.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}
          path: .release-automation

      - name: Download dashboard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist

      - name: Validate downloaded dashboard bundle
        run: python3 .release-automation/scripts/check-dashboard-bundle.py dashboard/app-dist

      - name: Validate portable distribution harnesses
        run: |
          python3 .release-automation/scripts/test-check-packaged-lsp-bridge.py
          python3 .release-automation/scripts/test-build-mcpb.py
          python3 .release-automation/scripts/test-resolve-installed-binary.py
          python3 .release-automation/scripts/test-check-packaged-mcp-stdio.py
          python3 .release-automation/scripts/test-resolve-release-source-profile.py

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@acdba816b0980ba6b63f1109f89a046e15fc301a # nextest

      - name: Resolve release source feature profile
        id: release-profile
        shell: bash
        run: |
          python3 .release-automation/scripts/resolve-release-source-profile.py \
            --source . \
            --github-output "$GITHUB_OUTPUT"

      # make-default symlinks ld to mold, which works on this
      # runner's GCC 11 (unlike -fuse-ld=mold, which needs GCC 12+).
      - name: Install mold
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: 2.41.0
          make-default: true

      - name: Verify mold is the default linker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mold --version
          ld --version | head -n 1 | grep -i mold

      - name: Use lld-link
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          where.exe lld-link
          lld-link --version
          "RUSTFLAGS=-C linker=lld-link.exe" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Test release distribution
        run: cargo test --workspace --release --target ${{ matrix.target }} --all-features --locked

      # Runs before the default build so it never leaves an all-features
      # binary (e.g. test-transport) on disk at the shared release output
      # path for later packaging steps to pick up.
      - name: Verify all-feature release build compiles
        run: cargo build --release --target ${{ matrix.target }} --all-features --locked

      - name: Build release binary for packaging
        run: cargo build --release --target ${{ matrix.target }} ${{ steps.release-profile.outputs.cargo_args }} --locked

      - name: Install modern Bash for distribution acceptance
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Validate immutable FastEmbed fixture pins
        if: steps.release-profile.outputs.profile == 'production'
        shell: bash
        run: |
          set -euo pipefail
          gate="scripts/check-distribution-acceptance.sh"
          prepare="tests/distribution/fastembed/prepare_fixture.py"
          validator="tests/distribution/fastembed/validate_fixture.py"
          if [[ ! -x "$gate" || ! -f "$prepare" || ! -f "$validator" ]]; then
            echo "::error title=FastEmbed acceptance setup missing::Expected executable $gate plus $prepare and $validator from the distribution fixture work."
            exit 1
          fi
          # Pins live in-repo; real model bytes are acquired later by the gate.
          if ! python3 "$prepare" --check tests/distribution/fastembed; then
            echo "::error title=FastEmbed fixture pins invalid::The immutable Jina fixture pins must validate before release acceptance acquires real model bytes."
            exit 1
          fi
          cargo fetch --locked --target ${{ matrix.target }}

      - name: Run distribution acceptance
        if: steps.release-profile.outputs.profile == 'production'
        shell: bash
        run: |
          set -euo pipefail
          gate_shell="bash"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            gate_shell="$(brew --prefix)/bin/bash"
          fi
          lockfile_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest())')"
          # Allow curl fixture acquisition; keep Cargo and HF hub offline for the
          # packaged library/CLI and ORT inference phases inside the gate.
          CARGO_NET_OFFLINE=true HF_HUB_OFFLINE=1 \
            "$gate_shell" scripts/check-distribution-acceptance.sh
          actual_lockfile_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest())')"
          if [[ "$actual_lockfile_sha" != "$lockfile_sha" ]]; then
            echo "::error title=Cargo.lock changed::Distribution acceptance must preserve the checked-in lockfile."
            exit 1
          fi

      - name: Run historical release binary smoke
        if: steps.release-profile.outputs.profile == 'legacy-default'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          test -f "$binary"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "tag=${{ needs.validate-release.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.validate-release.outputs.version }}" >> "$GITHUB_OUTPUT"

      # --- MCP Registry bundle (all platforms) ---

      - name: Package MCPB
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          bundle="tracedecay-${{ steps.version.outputs.tag }}-${{ matrix.name }}.mcpb"
          python3 .release-automation/scripts/build-mcpb.py build \
            --binary "$binary" \
            --output "$bundle" \
            --version "${{ steps.version.outputs.version }}" \
            --platform "${{ matrix.name }}"
          test -s "$bundle"
          python3 .release-automation/scripts/build-mcpb.py verify \
            --bundle "$bundle" \
            --version "${{ steps.version.outputs.version }}" \
            --platform "${{ matrix.name }}"

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-${{ matrix.name }}
          path: tracedecay-${{ steps.version.outputs.tag }}-${{ matrix.name }}.mcpb
          if-no-files-found: error

      # --- Binary archive (all platforms) ---

      - name: Package binary archive
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          entry_name="tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
            entry_name="${entry_name}.exe"
          fi
          python3 .release-automation/scripts/package-release-archive.py \
            --binary "$binary" \
            --output "tracedecay-${{ steps.version.outputs.tag }}-${{ matrix.name }}.${{ matrix.archive }}" \
            --format "${{ matrix.archive }}" \
            --entry-name "$entry_name" \
            --epoch "${{ needs.validate-release.outputs.source_epoch }}"

      - name: Verify binary archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          archive="tracedecay-${{ steps.version.outputs.tag }}-${{ matrix.name }}.tar.gz"
          rm -rf verify-binary
          mkdir verify-binary
          tar xzf "$archive" -C verify-binary
          test -x verify-binary/tracedecay
          verify-binary/tracedecay --version
          verify-binary/tracedecay --help >/dev/null

      - name: Verify binary archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "tracedecay-${{ steps.version.outputs.tag }}-${{ matrix.name }}.zip"
          Remove-Item verify-binary -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $archive -DestinationPath verify-binary
          & "./verify-binary/tracedecay.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged binary failed --version" }
          & "./verify-binary/tracedecay.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaged binary failed --help" }

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.name }}
          path: tracedecay-${{ steps.version.outputs.tag }}-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  verify-release:
    name: Verify immutable GitHub release
    needs: [validate-release, dashboard-assets, build]
    if: >-
      always() &&
      needs.validate-release.result == 'success' &&
      (needs.dashboard-assets.result == 'success' || needs.dashboard-assets.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.source_sha }}
          persist-credentials: false

      - name: Download validated dashboard artifact
        if: needs.validate-release.outputs.build_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist

      - name: Validate downloaded dashboard bundle
        if: needs.validate-release.outputs.build_required == 'true'
        run: python3 scripts/check-dashboard-bundle.py dashboard/app-dist

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Revalidate release tag target
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          fi

      - name: Verify published tag and release target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null

  publish-assets:
    name: Publish release assets
    needs: [validate-release, build, verify-release]
    if: >-
      always() &&
      needs.validate-release.result == 'success' &&
      needs.verify-release.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}
          path: .release-automation
          persist-credentials: false

      - name: Get release tag
        id: release
        run: |
          echo "tag=${{ needs.validate-release.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Download newly built binary artifacts
        if: needs.validate-release.outputs.build_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: new-binaries
          merge-multiple: true

      - name: Download newly built MCPB artifacts
        if: needs.validate-release.outputs.build_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mcpb-*
          path: new-mcpbs
          merge-multiple: true

      - name: Assemble exact retained and newly built artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          SOURCE_SHA="${{ needs.validate-release.outputs.source_sha }}"
          VERSION="${TAG#v}"
          mkdir binaries mcpbs retained-assets
          gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq '.assets[].name' > remote-asset-names
          python3 .release-automation/scripts/plan-release-recovery.py \
            --manifest .release-automation/.github/release-targets.json \
            --tag "$TAG" \
            --profile stable \
            --asset-names remote-asset-names \
            --retained-output retained-asset-names \
            --github-output planner-output
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            gh release download "$TAG" --repo "${{ github.repository }}" \
              --pattern "$asset" --dir retained-assets
            gh attestation verify "retained-assets/$asset" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${TAG}" \
              --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners >/dev/null
            if [[ "$asset" == *.mcpb ]]; then
              cp "retained-assets/$asset" "mcpbs/$asset"
            else
              cp "retained-assets/$asset" "binaries/$asset"
            fi
          done < retained-asset-names
          if [[ "${{ needs.validate-release.outputs.build_required }}" == "true" ]]; then
            for artifact in new-binaries/tracedecay-*; do
              destination="binaries/$(basename "$artifact")"
              [[ -e "$destination" ]] || cp "$artifact" "$destination"
            done
            for artifact in new-mcpbs/*.mcpb; do
              destination="mcpbs/$(basename "$artifact")"
              [[ -e "$destination" ]] || cp "$artifact" "$destination"
            done
          fi
          python3 .release-automation/scripts/check-release-artifacts.py \
            --manifest .release-automation/.github/release-targets.json \
            --tag "$TAG" \
            --binaries binaries \
            --mcpbs mcpbs
          for bundle in mcpbs/*.mcpb; do
            platform="${bundle#mcpbs/tracedecay-"${TAG}"-}"
            platform="${platform%.mcpb}"
            python3 .release-automation/scripts/build-mcpb.py verify \
              --bundle "$bundle" \
              --version "$VERSION" \
              --platform "$platform"
          done

      - name: Attest newly built binary archives
        if: needs.validate-release.outputs.build_required == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: new-binaries/tracedecay-*

      - name: Attest newly built MCPBs
        if: needs.validate-release.outputs.build_required == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: new-mcpbs/*.mcpb

      - name: Upload validated artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          binaries=(binaries/tracedecay-*)
          bundles=(mcpbs/*.mcpb)
          assets=("${binaries[@]}" "${bundles[@]}")
          (
            cd binaries
            sha256sum tracedecay-*
          ) > SHA256SUMS
          (
            cd mcpbs
            sha256sum -- *.mcpb
          ) >> SHA256SUMS
          assets+=(SHA256SUMS install.sh)
          TAG="${{ steps.release.outputs.tag }}"
          SOURCE_SHA="${{ needs.validate-release.outputs.source_sha }}"
          git -C .release-automation fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git -C .release-automation rev-list -n 1 "$TAG")" = "$SOURCE_SHA"

          gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq '.assets[].name' > remote-asset-names
          while IFS= read -r remote_name; do
            [[ -z "$remote_name" ]] && continue
            found=false
            for asset in "${assets[@]}"; do
              if [[ "$(basename "$asset")" == "$remote_name" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != true ]]; then
              echo "::error::unexpected existing release asset: ${remote_name}"
              exit 1
            fi
          done < remote-asset-names
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" remote-asset-names; then
              if [[ "$name" != tracedecay-* ]]; then
                mkdir -p retained-metadata
                gh release download "$TAG" --repo "${{ github.repository }}" \
                  --pattern "$name" --dir retained-metadata
                if ! cmp -s "$asset" "retained-metadata/$name"; then
                  echo "::error::existing release metadata differs: ${name}"
                  exit 1
                fi
              fi
            else
              gh release upload "$TAG" "$asset" --repo "${{ github.repository }}"
            fi
          done

          mkdir -p remote-assets/{binaries,mcpbs}
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "tracedecay-${TAG}-*.tar.gz" --dir remote-assets/binaries
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "tracedecay-${TAG}-*.zip" --dir remote-assets/binaries
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "tracedecay-${TAG}-*.mcpb" --dir remote-assets/mcpbs
          python3 .release-automation/scripts/check-release-artifacts.py \
            --manifest .release-automation/.github/release-targets.json \
            --tag "$TAG" \
            --binaries remote-assets/binaries \
            --mcpbs remote-assets/mcpbs
          for artifact in remote-assets/binaries/* remote-assets/mcpbs/*; do
            gh attestation verify "$artifact" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${TAG}" \
              --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners >/dev/null
          done

      - name: Mark stable release as latest
        if: needs.validate-release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "${{ needs.validate-release.outputs.tag }}"
          --repo "${{ github.repository }}"
          --latest

  # Rewrites the MCP registry manifest (server.json) from the actual nonempty
  # platform MCPBs so version, URLs, and fileSha256 values describe uploaded
  # assets. A missing package is a release failure, never a successful skip.
  update-server-json:
    name: Update server.json manifest
    if: >-
      always() &&
      needs.validate-release.result == 'success' &&
      needs.publish-assets.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.validate-release.outputs.prerelease == 'false'
    needs: [validate-release, build, publish-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Rewrite server.json from release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.validate-release.outputs.tag }}"
          VERSION="${{ needs.validate-release.outputs.version }}"
          REPO="${{ github.repository }}"

          mkdir -p assets
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "tracedecay-${TAG}-*.mcpb" \
            --dir assets
          shopt -s nullglob
          bundles=(assets/tracedecay-"${TAG}"-*.mcpb)
          test "${#bundles[@]}" -gt 0
          for bundle in "${bundles[@]}"; do
            platform="${bundle#*tracedecay-"${TAG}"-}"
            platform="${platform%.mcpb}"
            python3 scripts/build-mcpb.py verify \
              --bundle "$bundle" \
              --version "$VERSION" \
              --platform "$platform"
          done

          printf '[' > sha-map.json
          sep=""
          for bundle in "${bundles[@]}"; do
            platform="${bundle#*tracedecay-"${TAG}"-}"
            platform="${platform%.mcpb}"
            sha=$(sha256sum "$bundle" | cut -d' ' -f1)
            printf '%s{"platform":"%s","sha":"%s"}' "$sep" "$platform" "$sha" >> sha-map.json
            sep=","
          done
          printf ']' >> sha-map.json

          jq --arg v "$VERSION" --arg tag "$TAG" --arg repo "$REPO" --slurpfile map sha-map.json '
            .version = $v
            | .packages = ($map[0] | map(
                {
                  "registryType": "mcpb",
                  "identifier": "https://github.com/\($repo)/releases/download/\($tag)/tracedecay-\($tag)-\(.platform).mcpb",
                  "version": $v,
                  "fileSha256": .sha,
                  "transport": {
                    "type": "stdio"
                  }
                }
              )
              )
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          test "$(jq '.packages | length' server.json)" -gt 0
          jq -e '
            all(
              .packages[];
              .registryType == "mcpb"
              and (.identifier | length > 0)
              and (.version | length > 0)
              and (.fileSha256 | test("^[0-9a-f]{64}$"))
              and .transport.type == "stdio"
            )
          ' server.json >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server.json
          git diff --cached --quiet || git commit -m "chore(release): update server.json for ${VERSION}"
          git push
