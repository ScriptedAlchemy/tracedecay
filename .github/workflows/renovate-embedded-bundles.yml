# Renovate's hosted app cannot run postUpgradeTasks for committed host bundles.
# The build job installs the updated dependencies with a read-only token. Only
# the push job holds RELEASE_PLZ_TOKEN, and it runs no repository code. A
# GITHUB_TOKEN push would not retrigger CI; the PAT push does, and its actor is
# not renovate[bot], so this workflow skips that run. renovate.json ignores the
# github-actions[bot] author, so Renovate keeps rebasing the branch.
name: Renovate embedded bundles

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild embedded host bundles
    if: >-
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-bazel
        with:
          cache-key: ci-embedded-bundles

      - name: Build TypeScript SDK for the ChatGPT extension
        working-directory: sdks/typescript
        run: pnpm run build

      - name: Build ChatGPT extension embedded artifacts
        working-directory: plugin/chatgpt-extension
        run: pnpm run build

      - name: Build Cursor extension embedded artifact
        run: bazel run @nodejs//:node -- "$GITHUB_WORKSPACE/plugin/cursor-native-extension/scripts/build-extension.mjs"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-host-bundles
          path: |
            plugin/chatgpt-extension/embedded/
            plugin/cursor-native-extension/embedded/
          if-no-files-found: error
          retention-days: 1

      - name: Report final build disk usage
        if: ${{ always() && hashFiles('.github/actions/setup-bazel/report_disk.sh') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: bash .github/actions/setup-bazel/report_disk.sh

  push:
    name: Push regenerated bundles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A push authenticated with RELEASE_PLZ_TOKEN starts the next CI run as
      # the token owner, which is the identity the private fleet trusts. That
      # is the only reason this workflow may not use GITHUB_TOKEN (GitHub
      # suppresses workflow runs for pushes authenticated by it, so the
      # regenerated bundles would never be validated). The gate below is
      # therefore explicit rather than implied by the workflow trigger.
      - name: Require a same-repository Renovate pull request
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "::error::Embedded bundle pushes run only for pull request events; got '$EVENT_NAME'."
            exit 1
          fi
          if [[ "$ACTOR" != 'renovate[bot]' ]]; then
            echo "::error::Embedded bundle pushes are restricted to Renovate; got actor '$ACTOR'."
            exit 1
          fi
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Embedded bundle pushes require a same-repository branch; got '$HEAD_REPOSITORY'."
            exit 1
          fi
          if [[ -z "$HEAD_REF" || "$HEAD_REF" == "$DEFAULT_BRANCH" ]]; then
            echo "::error::Embedded bundle pushes require a pull request branch; got '$HEAD_REF'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # The privileged push must extend the commit CI reviewed, not whatever
      # the branch happens to point at now.
      - name: Verify the checked out commit is the pull request head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out $actual, not the pull request head $EXPECTED_SHA."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: embedded-host-bundles
          path: plugin/

      # Pushing the built SHA to the branch fails if Renovate moved it in the
      # meantime; the newer push starts its own run. The generated commit may
      # touch only the two embedded bundle directories: a build step that
      # wrote anywhere else is a bug to surface, not something to publish
      # under a maintainer identity.
      - name: Commit and push when the bundles changed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          bundles='^(plugin/chatgpt-extension|plugin/cursor-native-extension)/embedded/'
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            path="${line:3}"
            path="${path##* -> }"
            if [[ ! "$path" =~ $bundles ]]; then
              echo "::error::Refusing to push a change outside the embedded bundles: $path"
              exit 1
            fi
          done < <(git status --porcelain --untracked-files=all)
          git add -A -- plugin/chatgpt-extension/embedded plugin/cursor-native-extension/embedded
          if git diff --cached --quiet; then
            echo "Embedded bundles already match the build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(plugin): regenerate embedded host bundles" -- plugin/chatgpt-extension/embedded plugin/cursor-native-extension/embedded
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ ! "$path" =~ $bundles ]]; then
              echo "::error::The generated commit contains $path."
              exit 1
            fi
          done < <(git show --pretty=format: --name-only HEAD)
          git push origin "HEAD:refs/heads/$BRANCH"
