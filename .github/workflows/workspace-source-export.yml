name: Workspace formatter export
on:
  push:
    branches: [work/automation-retirement-source-20261030]
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare the repository-pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          formatter="$(rustup which --toolchain 1.99.1 rustfmt)"
          root="$(dirname "$(dirname "$formatter")")"
          mkdir -p "$RUNNER_TEMP/formatter/bin" "$RUNNER_TEMP/formatter/lib"
          cp "$formatter" "$RUNNER_TEMP/formatter/bin/"
          find "$root/lib" -maxdepth 1 -type f -name '*.so*' -exec cp {} "$RUNNER_TEMP/formatter/lib/" \;
          "$RUNNER_TEMP/formatter/bin/rustfmt" --version
          tar -C "$RUNNER_TEMP/formatter" -czf "$RUNNER_TEMP/rustfmt-1.99.1.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustfmt-1.99.1-linux
          path: ${{ runner.temp }}/rustfmt-1.99.1.tar.gz
          if-no-files-found: error
          retention-days: 1
