name: Memory lifecycle verification
on:
  push:
    branches: [fix/4205-memory-evaluation-lifecycle]
    paths:
      - .github/workflows/memory-lifecycle-verification.yml
      - scripts/ci/apply-memory-evaluation-lifecycle.py
      - evals/memory/**
permissions:
  contents: read
concurrency:
  group: memory-lifecycle-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'ScriptedAlchemy/tracedecay' && github.actor == 'ScriptedAlchemy'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the pinned lifecycle and fact-contract changes
        run: python3 scripts/ci/apply-memory-evaluation-lifecycle.py
      - name: Run the offline harness regressions before compilation
        run: |
          python3 -m py_compile evals/memory/*.py
          python3 -m unittest discover -s evals/memory -p 'test_run_real_model.py' -v
          python3 -m unittest discover -s evals/memory -p 'test_run_lifecycle.py' -v
          python3 -m unittest discover -s evals/memory -p 'test_isolated_environment.py' -v
          python3 -m unittest discover -s evals/memory -p 'test_fact_evidence.py' -v
      - uses: ./.github/actions/setup-bazel
        with:
          cache-key: ci-linux-test-v2
          test-tools: 'true'
      - name: Verify Bazel wiring and the real CLI fixture without model turns
        run: |
          bazel test --config=ci //evals/memory:fact_evidence_test //evals/memory:isolated_environment_test //evals/memory:runner_lifecycle_test //evals/memory:cli_fixture_test --test_output=errors
          git diff --check
      - name: Stage only verified source edits
        run: |
          mkdir -p "$RUNNER_TEMP/memory-lifecycle"
          git diff --binary -- evals/memory/run_real_model.py evals/memory/test_run_real_model.py scripts/BUILD.bazel > "$RUNNER_TEMP/memory-lifecycle/verified.patch"
          test -s "$RUNNER_TEMP/memory-lifecycle/verified.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-memory-lifecycle
          path: ${{ runner.temp }}/memory-lifecycle/verified.patch
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'ScriptedAlchemy/tracedecay' && github.actor == 'ScriptedAlchemy'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-memory-lifecycle
          path: ${{ runner.temp }}/memory-lifecycle
      - name: Publish tested code without overwriting a moved branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/4205-memory-evaluation-lifecycle
          actual=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git apply --check "$RUNNER_TEMP/memory-lifecycle/verified.patch"
          git apply "$RUNNER_TEMP/memory-lifecycle/verified.patch"
          git diff --check
          git add -- evals/memory/run_real_model.py evals/memory/test_run_real_model.py scripts/BUILD.bazel
          git rm -- scripts/ci/apply-memory-evaluation-lifecycle.py .github/workflows/memory-lifecycle-verification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(evals): own memory fixture and daemon lifetimes' -m 'Fixes #4205'
          git push origin "HEAD:refs/heads/$branch"
