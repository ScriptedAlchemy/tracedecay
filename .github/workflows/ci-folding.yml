name: TraceDecay CI folding experiment

on:
  workflow_dispatch:
    inputs:
      pull_requests:
        description: 'Two trusted, ready, same-repository PR numbers (e.g. 123,124). Both execute in one trust domain.'
        type: string
        required: true

permissions:
  contents: read

# Reuse stays inside the ephemeral worker, without durable cache writes.
cache-mode: none

concurrency:
  group: ci-folding-experiment
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'ScriptedAlchemy/tracedecay' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.admit.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and validate the two explicitly trusted heads
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUESTS: ${{ inputs.pull_requests }}
        run: |
          plan="$(python3 evals/ci-folding/warm.py plan --pull-requests "$PULL_REQUESTS")"
          printf 'plan=%s\n' "$plan" >> "$GITHUB_OUTPUT"

  measure:
    needs: plan
    runs-on: ubuntu-24.04-arm
    # Three measurements of the existing 55-minute group plus setup and the
    # small-crate controls; production CI's budgets and selections are intact.
    timeout-minutes: 200
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - run: pnpm install --frozen-lockfile

      - name: Install Hauler and the pinned Rust toolchain
        run: |
          npm install --global cargo-hauler@0.10.0
          rustup show active-toolchain

      - uses: ./.github/actions/setup-linux-mold
      - uses: ./.github/actions/install-ast-grep
        with:
          version: '0.44.0'
      - uses: taiki-e/install-action@acdba816b0980ba6b63f1109f89a046e15fc301a
        with:
          tool: nextest

      - uses: ./evals/ci-folding
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          plan: ${{ needs.plan.outputs.plan }}
          output: ${{ runner.temp }}/ci-folding

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-folding-measurements
          path: ${{ runner.temp }}/ci-folding/
          if-no-files-found: error
          retention-days: 7

  report:
    needs: [plan, measure]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # A fresh runner executes only the immutable controller, never either PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-folding-measurements
          path: ${{ runner.temp }}/ci-folding
      - name: Report non-required checks on the admitted SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_PLAN: ${{ needs.plan.outputs.plan }}
          WORKER_RESULT: ${{ needs.measure.result }}
          RESULTS: ${{ runner.temp }}/ci-folding/report.json
        run: python3 evals/ci-folding/warm.py report --results "$RESULTS" --worker-result "$WORKER_RESULT"
