name: TraceDecay CI folding experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-folding-experiment
  cancel-in-progress: false

jobs:
  measure:
    if: github.repository == 'ScriptedAlchemy/tracedecay'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: ./.github/actions/setup-pnpm

      - name: Install Hauler and the pinned Rust toolchain
        run: |
          npm install --global cargo-hauler@0.9.14
          rustup show active-toolchain

      - uses: ./evals/ci-folding
        with:
          head: ${{ github.sha }}
          output: ${{ runner.temp }}/ci-folding.json

      - uses: actions/upload-artifact@v4
        with:
          name: ci-folding-measurements
          path: ${{ runner.temp }}/ci-folding.json
          if-no-files-found: error
