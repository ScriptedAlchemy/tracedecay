# Manual TypeScript SDK release, split into an unprivileged build/test/
# conformance job and a minimal, environment-protected npm publish job.
#
# The build/test job never holds `id-token: write` or registry credentials.
# It builds the exact npm tarball once, runs typecheck, unit tests, and
# real-daemon installed-package conformance against that same artifact, and
# records its digest. It also stages and digest-verifies the reviewed npm CLI.
# Only the publish job gets the protected environment and OIDC authority; it
# downloads and verifies those exact bytes without installing executable code.
name: SDK publish

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-typescript:
    if: github.repository == 'ScriptedAlchemy/tracedecay' && github.ref == 'refs/heads/master'
    name: Build & test @tracedecay/sdk (unprivileged)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install reviewed npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Typecheck
        working-directory: sdks/typescript
        run: npm run typecheck

      - name: Fast unit suite
        working-directory: sdks/typescript
        run: npm test

      - name: Build
        working-directory: sdks/typescript
        run: npm run build

      - name: Pack the exact publish artifact once
        id: pack
        working-directory: sdks/typescript
        run: |
          set -euo pipefail
          json="$(npm pack --json --ignore-scripts)"
          filename="$(node -e 'console.log(JSON.parse(process.argv[1])[0].filename)' "$json")"
          test -f "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Stage the reviewed npm publish tool
        working-directory: sdks/typescript
        run: |
          set -euo pipefail
          npm pack npm@12.0.2 --ignore-scripts
          echo "5dbb86c71d07a1957f2e90734092dd6a58bdcd9ebc2d8d41ca1c6e6a21d364e1  npm-12.0.2.tgz" \
            | sha256sum -c -

      - name: Build the real production daemon for conformance
        run: cargo build --bin tracedecay

      - name: Real-daemon conformance against the exact packed tarball
        working-directory: sdks/typescript
        run: npx vitest run test/installed-package.test.ts
        env:
          TRACEDECAY_SDK_TARBALL: ${{ github.workspace }}/sdks/typescript/${{ steps.pack.outputs.filename }}

      - name: Record artifact digests
        working-directory: sdks/typescript
        run: |
          sha256sum -- "${{ steps.pack.outputs.filename }}" \
            > "${{ steps.pack.outputs.filename }}.sha256"
          sha256sum -- npm-12.0.2.tgz > npm-12.0.2.tgz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: |
            sdks/typescript/${{ steps.pack.outputs.filename }}
            sdks/typescript/${{ steps.pack.outputs.filename }}.sha256
            sdks/typescript/npm-12.0.2.tgz
            sdks/typescript/npm-12.0.2.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  publish-typescript:
    needs: build-typescript
    if: github.repository == 'ScriptedAlchemy/tracedecay' && github.ref == 'refs/heads/master'
    name: Publish @tracedecay/sdk to npm
    runs-on: ubuntu-latest
    environment: npm-tracedecay-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: artifact

      - name: Verify the downloaded artifact digests
        working-directory: artifact
        run: sha256sum -c -- *.sha256

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - name: Publish the exact conformance-tested tarball with reviewed npm
        working-directory: artifact
        run: |
          set -euo pipefail
          tarball="$(ls -- tracedecay-sdk-*.tgz)"
          mkdir npm-cli
          tar -xzf npm-12.0.2.tgz -C npm-cli
          node npm-cli/package/bin/npm-cli.js \
            publish "$tarball" --provenance --access public
