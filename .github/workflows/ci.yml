name: CI

on:
  push:
    branches: [master, feature/holographic-memory]
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  AST_GREP_VERSION: "0.44.0"

jobs:
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install commit message lint dependencies
        run: npm ci

      - name: Reject tracked ignored files
        run: scripts/check-release-pr-integrity.sh HEAD HEAD

      - name: Validate PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commit_shas=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          while IFS= read -r commit_sha; do
            [[ -n "$commit_sha" ]] || continue
            git show --no-patch --format=%B "$commit_sha" | npm run --silent lint:commit --
          done <<<"$commit_shas"

      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              range="${HEAD_SHA}^..${HEAD_SHA}"
            else
              git show --no-patch --format=%B "$HEAD_SHA" | npm run lint:commit --
              exit 0
            fi
          else
            range="$BEFORE_SHA..$HEAD_SHA"
          fi
          commit_shas=$(git rev-list --no-merges "$range")
          while IFS= read -r commit_sha; do
            [[ -n "$commit_sha" ]] || continue
            git show --no-patch --format=%B "$commit_sha" | npm run --silent lint:commit --
          done <<<"$commit_shas"

  release-version-drift:
    name: Release Version Drift
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test release version drift guard
        run: bash tests/release_drift_check_test.sh

      # The workflow-contract pin scripts were replaced by the safety-guard
      # assertions (f3b065545) and the dogfood surface was retired (b73a8a396);
      # this job keeps the guards that protect the shipped release flow.
      - name: Check release safety guards
        run: bash tests/release_safety_test.sh

      - name: Test GitHub release installer
        run: bash tests/install_script_test.sh

      - name: Check release version drift
        run: scripts/check-release-drift.sh

  test:
    name: Test ${{ matrix.name }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: '"ubuntu-latest"'
          - name: macOS
            runner: '"macos-14"'

    steps:
      # Full history: the search-quality workload fixture pins a
      # `source_repository_commit`, and `validate_source_bindings` resolves that
      # object out of this checkout to prove the checked-in corpus really is the
      # product source at that commit. A depth-1 checkout carries only the tip,
      # so every candidate_output/report test fails with "resolve fixture source
      # commit: An object with id ... could not be found".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-linux-mold

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ast-grep
        run: |
          npm install --global "@ast-grep/cli@${AST_GREP_VERSION}"
          ast-grep --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-full-${{ runner.os }}
          cache-on-failure: true

      - name: Run tests
        run: cargo nextest run --workspace --profile ci --locked

      - name: Upload ${{ matrix.name }} nextest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  windows-build:
    name: Build Windows tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: windows-latest
    # Full-workspace `nextest archive` on hosted windows-latest has been
    # dying at exactly 30m with no failed step. 45 leaves headroom for a
    # cold cache without hiding a hung linker.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Tune Windows runner for build I/O
        shell: pwsh
        run: |
          # Defender real-time scanning taxes the compiler's many short-lived
          # object/incremental files; hosted runners are elevated, so turn it
          # off and exclude the hot paths as a fallback.
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          $exclusions = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP,
            [System.IO.Path]::GetTempPath(),
            $env:CARGO_HOME,
            $env:RUSTUP_HOME,
            "$env:USERPROFILE\.cargo",
            "$env:USERPROFILE\.rustup"
          ) | Where-Object { $_ } | Select-Object -Unique
          foreach ($path in $exclusions) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }

      - uses: dtolnay/rust-toolchain@stable

      - name: Use lld-link linker
        shell: pwsh
        run: |
          where.exe lld-link.exe
          lld-link.exe --version
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Node is only needed so build.rs can produce the embedded dashboard
      # dist assets (npm ci + npm run build) once, instead of once per shard.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Windows Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-full-windows-msvc-lld
          cache-on-failure: true

      - name: Build nextest archive
        shell: pwsh
        run: cargo nextest archive --workspace --locked --archive-file "$env:RUNNER_TEMP/nextest-archive.tar.zst"

      - name: Upload nextest archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0

  windows-test-shard:
    name: Test Windows shard ${{ matrix.partition }}/5
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    steps:
      # Full history for the same reason as the Linux/macOS test job: the
      # shards run the workspace suite remapped onto this checkout, so the
      # pinned search-quality fixture commit must be resolvable here too.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tune Windows runner for test I/O
        shell: pwsh
        run: |
          # Defender real-time scanning taxes the many short-lived SQLite/tempdir
          # files these tests create; hosted runners are elevated, so turn it off
          # and exclude the hot paths as a fallback.
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          $exclusions = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP,
            [System.IO.Path]::GetTempPath(),
            $env:CARGO_HOME,
            $env:RUSTUP_HOME,
            "$env:USERPROFILE\.cargo",
            "$env:USERPROFILE\.rustup"
          ) | Where-Object { $_ } | Select-Object -Unique
          foreach ($path in $exclusions) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          # Default user TEMP is on the slow C: drive; RUNNER_TEMP shares the
          # faster workspace drive. Point TMP/TEMP there so tempfile::TempDir in
          # the nextest test processes follows.
          $fastTemp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Path $fastTemp -Force | Out-Null
          "TMP=$fastTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$fastTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ast-grep
        shell: pwsh
        run: |
          npm install --global "@ast-grep/cli@$env:AST_GREP_VERSION"
          ast-grep --version

      # The architecture tests exec `cargo metadata` at runtime; without an
      # installed toolchain the rustup shim starts a mid-test component
      # download that flakes. Install up front like the build job does.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: windows-nextest-archive
          path: ${{ runner.temp }}

      - name: Run Windows tests
        env:
          TRACEDECAY_SQLITE_UNSAFE_FAST: "1"
        shell: pwsh
        # --extract-to must be the workspace so target/ lands at the same
        # absolute path as on the build job: integration tests bake
        # env!("CARGO_BIN_EXE_tracedecay") into the binaries at compile time.
        run: >-
          cargo-nextest nextest run --profile ci
          --archive-file "$env:RUNNER_TEMP/nextest-archive.tar.zst"
          --extract-to "$env:GITHUB_WORKSPACE"
          --workspace-remap "$env:GITHUB_WORKSPACE"
          --partition slice:${{ matrix.partition }}/5
          --test-threads num-cpus --status-level slow

      - name: Clean abandoned Windows test children
        if: always()
        shell: pwsh
        run: |
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $all = Get-CimInstance Win32_Process
          $liveProcessIds = [System.Collections.Generic.HashSet[uint32]]::new()
          foreach ($process in $all) {
            [void]$liveProcessIds.Add([uint32]$process.ProcessId)
          }
          $stale = foreach ($process in $all) {
            if ($process.Name -ne "tracedecay.exe") {
              continue
            }
            if (-not $process.CommandLine) {
              continue
            }
            $inCurrentWorkspace = $process.CommandLine.IndexOf($workspace, [StringComparison]::OrdinalIgnoreCase) -ge 0
            if (-not $inCurrentWorkspace) {
              continue
            }
            if (-not $liveProcessIds.Contains([uint32]$process.ParentProcessId)) {
              $process
            }
          }
          foreach ($process in $stale) {
            Write-Host "Stopping abandoned tracedecay child pid=$($process.ProcessId)"
            Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows nextest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nextest-junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  windows-test:
    name: Test Windows
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref)) }}
    needs: windows-test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Check Windows shards
        run: |
          if [ "${{ needs.windows-test-shard.result }}" != "success" ]; then
            echo "Windows shard result: ${{ needs.windows-test-shard.result }}"
            exit 1
          fi
          echo "All Windows shards passed."

  clippy:
    name: Clippy
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: ./.github/actions/setup-linux-mold

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-full-${{ runner.os }}
          cache-on-failure: true
      - name: Run blocking Clippy policy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Additive visibility lint. Not a required check yet — introduce Hawk, then
  # promote once the workspace is clean under `-D warnings`.
  hawk:
    name: Hawk
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      # renovate: datasource=github-releases depName=astral-sh/hawk
      HAWK_VERSION: 0.1.12
      RUSTUP_MAX_RETRIES: 10
      TRACEDECAY_SKIP_DASHBOARD_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/hawk"
          cache-workspace-crates: "false"
          cache-on-failure: true

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1

      - name: Install Hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh

      - name: Seed dashboard app-dist for the root build script
        run: |
          set -euo pipefail
          mkdir -p dashboard/app-dist
          printf '%s\n' '{"allFiles":["index.html"]}' > dashboard/app-dist/asset-manifest.json
          printf '%s\n' '<!doctype html><title>hawk</title>' > dashboard/app-dist/index.html

      - name: Hawk
        run: cargo +1.97.1 hawk check --target-dir target/hawk -D warnings

  fmt:
    name: Format
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  dashboard:
    name: Dashboard
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard assets
        working-directory: dashboard
        run: npm run build

      - name: Run dashboard unit tests
        working-directory: dashboard
        run: npm test

      # The dashboard is one rsbuild app emitting `app-dist/` (the legacy
      # shell/holographic/lcm/graph/savings bundle split no longer exists), so
      # the bundle validator is the artifact authority and the determinism
      # check hashes whatever the build actually produced.
      - name: Verify embedded dist artifacts
        working-directory: dashboard
        run: |
          set -euo pipefail
          python3 ../scripts/check-dashboard-bundle.py app-dist
          (cd app-dist && find . -type f | sort | xargs sha256sum) > /tmp/dashboard-dist.sha
          npm run build
          (cd app-dist && find . -type f | sort | xargs sha256sum) | diff /tmp/dashboard-dist.sha -

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-linux-mold

      - name: Install ast-grep
        run: |
          npm install --global "@ast-grep/cli@${AST_GREP_VERSION}"
          ast-grep --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-dashboard-full-${{ runner.os }}
          cache-on-failure: true

      - name: Run dashboard integration tests
        run: cargo nextest run --test dashboard_api_test --features test-transport --no-fail-fast --locked

  # WCAG 2.2 AA is an acceptance criterion, so the accessibility scans run in
  # CI rather than only on a developer's machine. Both harnesses exit nonzero
  # on an axe violation, an uncaught page error, or a failed state assertion —
  # a clean scan of a falsified reading is not a pass.
  #
  # Non-blocking by owner decision 2026-07-31: axe findings stay visible in
  # the run summary but no longer gate the branch. Zero-axe remains a release
  # acceptance criterion checked before release, not per push.
  # NOTHING may declare `needs: dashboard-accessibility`.
  dashboard-accessibility:
    name: Dashboard accessibility
    # `needs:` keeps this job from reporting a second red when the real fault
    # is that the dashboard bundle never built or its unit tests failed.
    needs: dashboard
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    # Locally axe:audit takes ~3.3 min and axe:explorer ~1.3 min, and each one
    # runs its OWN full `rsbuild build` (see dashboard/e2e/axe-harness.ts). At
    # ~3x for a 2-core runner rendering 2 themes x 3 widths that is ~14 min,
    # plus ~3 min for the Chromium and system-dependency install and ~1 min
    # for npm ci. 30 leaves headroom for a slow runner while still cutting off
    # a hung browser or wedged static server.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan (workspaces)
        working-directory: dashboard
        run: npm run axe:audit

      - name: Accessibility scan (Explorer)
        working-directory: dashboard
        run: npm run axe:explorer

  hermes-integration:
    name: Hermes integration (stock)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Stock (upstream) Hermes pin — the generated plugin must keep working
      # against this exact upstream commit. Bump deliberately after rerunning
      # scripts/hermes_stock_integration.sh against the new ref locally.
      HERMES_UPSTREAM_REPO: https://github.com/NousResearch/hermes-agent.git
      HERMES_UPSTREAM_REF: 9dd9ef0ec99a87f078f7272b4323df5440b4b3f9
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-linux-mold

      - name: Install ast-grep
        run: |
          npm install --global "@ast-grep/cli@${AST_GREP_VERSION}"
          ast-grep --version

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-hermes-integration-full-${{ runner.os }}
          cache-on-failure: true

      - name: Build tracedecay binary
        run: cargo build --bin tracedecay --locked

      - name: Run generated-plugin unit checks (no Hermes required)
        run: python3 scripts/hermes_plugin_unit_check.py

      - name: Clone stock Hermes at pinned ref
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/hermes-upstream"
          git -C "$RUNNER_TEMP/hermes-upstream" remote add origin "$HERMES_UPSTREAM_REPO"
          git -C "$RUNNER_TEMP/hermes-upstream" fetch --depth 1 origin "$HERMES_UPSTREAM_REF"
          git -C "$RUNNER_TEMP/hermes-upstream" checkout --detach FETCH_HEAD

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ runner.temp }}/hermes-upstream/uv.lock
          cache-suffix: hermes-${{ env.HERMES_UPSTREAM_REF }}

      - name: Set up stock Hermes environment
        working-directory: ${{ runner.temp }}/hermes-upstream
        run: uv sync --frozen --no-dev

      - name: Run stock Hermes integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
          HERMES_UPSTREAM_DIR: ${{ runner.temp }}/hermes-upstream
        run: scripts/hermes_stock_integration.sh

  host-stock-integration:
    name: Claude Code + OpenCode integration (stock)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Stock host pins — the installed bundle must keep working against these
      # exact host releases. Bump deliberately after rerunning
      # scripts/claude_stock_integration.sh and
      # scripts/opencode_stock_integration.sh against the new versions locally.
      CLAUDE_CODE_VERSION: 2.1.224
      OPENCODE_VERSION: 1.18.4
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-linux-mold

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-host-stock-integration-${{ runner.os }}
          cache-on-failure: true

      - name: Build tracedecay binary
        run: cargo build --bin tracedecay --locked

      - name: Install stock Claude Code and OpenCode at pinned versions
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "opencode-ai@${OPENCODE_VERSION}"
          claude --version
          opencode --version

      - name: Run stock Claude Code integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/claude_stock_integration.sh

      - name: Run stock OpenCode integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/opencode_stock_integration.sh
