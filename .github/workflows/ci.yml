name: Temporary asupersync compile measurement
run-name: Temporary asupersync compile measurement for ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asupersync-compile-measurement:
    name: Measure asupersync release compilation
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BAZEL_TIMEOUT: "3600"
      FLEET_CLIENT_ID: >-
        ${{ (github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
            || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID) || '' }}
    steps:
      - name: Require the trusted fleet identity
        run: |
          if [[ -z "$FLEET_CLIENT_ID" ]]; then
            echo 'Asupersync compile measurement requires an existing trusted Bazel fleet identity.' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          status=0
          sudo rm -rf /usr/local/lib/android &
          p1=$!
          sudo rm -rf /usr/share/dotnet &
          p2=$!
          sudo rm -rf /opt/ghc &
          p3=$!
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          p4=$!
          for pid in "$p1" "$p2" "$p3" "$p4"; do
            wait "$pid" || status=1
          done
          df -h /
          exit "$status"

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: release-x86_64-unknown-linux-gnu
          tailscale-client-id: ${{ env.FLEET_CLIENT_ID }}

      - name: Measure release asupersync compilation
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD
          uname -a
          uptime
          nproc
          timeout --signal=INT --kill-after=60s 30m \
            bazel build --config=release --config=ci \
            --verbose_failures \
            --materialize_param_files \
            --profile="$RUNNER_TEMP/asupersync-profile.json.gz" \
            --experimental_profile_include_target_label \
            --experimental_profile_include_target_configuration \
            --experimental_profile_include_primary_output \
            --execution_log_json_file="$RUNNER_TEMP/asupersync-exec.json" \
            --noexecution_log_sort \
            @c//:asupersync 2>&1 | tee "$RUNNER_TEMP/asupersync-console.log"

      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asupersync-compile-measurement
          path: |
            ${{ runner.temp }}/asupersync-profile.json.gz
            ${{ runner.temp }}/asupersync-exec.json
            ${{ runner.temp }}/asupersync-console.log
            bazel-out/k8-opt/bin/external/rules_rust++crate+c__asupersync-0.6.0/*.params
