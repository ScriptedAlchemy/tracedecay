name: CI

on:
  push:
    branches: [master, feature/holographic-memory]
  pull_request:
    branches: ['**']

permissions:
  contents: read

# One run per pull request (or per pushed ref). A newer push to a
# feature-branch pull request supersedes the run in flight: its verdict is for
# a head nobody can merge any more, and letting it finish only holds runners
# the current head is waiting for. Pull requests into `master` (the integration
# delivery and release PRs) keep every run to completion: their heads move
# often as child work lands, and a verdict for a slightly older tip is still
# the evidence those merges are judged by. `push` runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'master' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  AST_GREP_VERSION: "0.44.0"

jobs:
  # Single source of truth for the fork/base-branch guard: heavy jobs run on
  # pushes, on PRs from this repository, and on fork PRs that target an
  # integration branch. Guarded jobs `needs:`-check this job's output instead
  # of each repeating the expression, so the branch list lives in one place.
  scope-gate:
    name: Scope gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-heavy: ${{ steps.decide.outputs.run-heavy }}
    steps:
      - name: Decide whether guarded jobs run
        id: decide
        run: echo "run-heavy=${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["master","feature/holographic-memory"]'), github.event.pull_request.base.ref) }}" >> "$GITHUB_OUTPUT"

  # Exercises the checked-out PR head through the CLI against an isolated
  # daemon (scripts/ci-pr-dogfood-smoke.sh). The binary is the one `debug-cli`
  # builds from the merge ref: the smoke only needs an executable `tracedecay`,
  # and building a second one from the head cost a cold
  # `cargo build -p tracedecay-cli` that never fit this job's budget (runs
  # 34217290139 and 34231734416: kache and rust-cache both missed, the build
  # was cancelled after 29 minutes while `debug-cli` finished the same build
  # in 30-31 minutes and published it).
  pr-dogfood:
    name: PR checkout dogfood
    needs: [scope-gate, debug-cli]
    if: ${{ github.event_name == 'pull_request' && needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch the debug CLI built once for this run
        uses: actions/download-artifact@v4
        with:
          name: debug-tracedecay-cli
          path: target/debug
      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/debug/tracedecay

      - name: Test dogfood harnesses
        run: |
          python3 scripts/test-check-pr-dogfood-output.py
          python3 scripts/test-efficiency-scorecard.py
          python3 scripts/test-pr-dogfood-portability.py

      - name: Initialize checkout and exercise CLI tools
        run: scripts/ci-pr-dogfood-smoke.sh
        env:
          TRACEDECAY_BIN: target/debug/tracedecay
          TRACEDECAY_DOGFOOD_BASE_REF: ${{ github.event.pull_request.base.sha }}
          TRACEDECAY_DOGFOOD_HEAD_REF: ${{ github.event.pull_request.head.sha }}

  # One dev-profile `tracedecay` binary for every job that only exercises the
  # built CLI (`pr-dogfood`, Hermes, Claude Code, OpenCode). Each of those
  # jobs used to compile the whole workspace itself behind its own cache key,
  # so a cold cache cost the run several 30-minute builds instead of one and
  # tripped their timeouts.
  debug-cli:
    name: Build debug CLI
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-linux-mold

      # This is the workflow's only dev-profile build, so `ci-dev-*` has one
      # writer. rust-cache stores dependency artifacts only. The repository
      # cache is capped at 10 GB and was full of per-job copies of the same
      # dependencies (`pr-dogfood` and `dashboard` each built this graph too),
      # which evicted the test lanes' caches between runs and made every test
      # run a cold build.
      #
      # No kache store for the workspace crates: this build writes 4.3 GB
      # into the store (run 34231734416: 3.4 GB hardlinked + 0.9 GB copied)
      # against a 512 MiB LRU ceiling, so what survived to be saved was the
      # last-compiled tail — `tracedecay`, `tracedecay-application`, the
      # binary — exactly the crates a push changes, and the restore hit
      # 0 of 973 crates. Its 977 MB entry was re-saved on every push, part of
      # the 9.6 GB per push that evicted the lockfile-keyed dependency caches
      # this job and the test lanes do restore, and kache's memory-weighted
      # permit pool held the four cores to 1.5 compiles in flight (46 min of
      # compile work, 40 min waiting for a permit, 31m33s wall).
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-dev-${{ runner.os }}
          cache-on-failure: true

      - name: Build tracedecay binary
        run: cargo build -p tracedecay-cli --bin tracedecay --locked

      - name: Publish the binary for the host integration jobs
        uses: actions/upload-artifact@v4
        with:
          name: debug-tracedecay-cli
          path: target/debug/tracedecay
          if-no-files-found: error
          retention-days: 1

  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install commit message lint dependencies
        run: npm ci

      - name: Reject tracked ignored files
        run: scripts/check-release-pr-integrity.sh HEAD HEAD

      - name: Test bounded commit range linting
        run: python3 scripts/test-lint-commit-range.py

      - name: Validate PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/lint-commit-range.mjs --repository "$PWD" "$BASE_SHA" "$HEAD_SHA"

      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              base_sha="${HEAD_SHA}^"
            else
              git show --no-patch --format=%B "$HEAD_SHA" | npm run lint:commit --
              exit 0
            fi
          else
            base_sha="$BEFORE_SHA"
          fi
          node scripts/lint-commit-range.mjs --repository "$PWD" "$base_sha" "$HEAD_SHA"

  release-version-drift:
    name: Release Version Drift
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test release version drift guard
        run: bash tests/release_drift_check_test.sh

      # The workflow-contract pin scripts were replaced by the safety-guard
      # assertions (f3b065545) and the dogfood surface was retired (b73a8a396);
      # this job keeps the guards that protect the shipped release flow.
      - name: Check release safety guards
        run: bash tests/release_safety_test.sh

      - name: Test GitHub release installer
        run: bash tests/install_script_test.sh

      # These two sat unwired: they are the tests for
      # `scripts/check-release-pr-integrity.sh` and
      # `scripts/check-dashboard-bundle.py`, both of which CI does run. So the
      # guards were enforced while the tests proving the guards work were not,
      # which is the shape that let a `test-transport` target rot until it
      # stopped compiling. Three of the five `tests/*_test.sh` gates were wired;
      # these are the other two.
      - name: Test release PR integrity guard
        run: bash tests/release_pr_integrity_test.sh

      - name: Test dashboard bundle check
        run: bash tests/dashboard_bundle_check_test.sh

      - name: Check release version drift
        run: scripts/check-release-drift.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # macOS compiles and runs the suite in one job. Linux builds once in
  # `linux-build` and runs from a nextest archive across `linux-test-shard`,
  # the shape the Windows lane already uses.
  test:
    name: Test ${{ matrix.name }}
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: '"macos-14"'

    steps:
      # Full history: the search-quality workload fixture pins a
      # `source_repository_commit`, and `validate_source_bindings` resolves that
      # object out of this checkout to prove the checked-in corpus really is the
      # product source at that commit. A depth-1 checkout carries only the tip,
      # so every candidate_output/report test fails with "resolve fixture source
      # commit: An object with id ... could not be found".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `rust-analyzer` is a test dependency of this lane, not a convenience.
      # `runtime_surface_acceptance::production_lsp_negotiates_and_projects_\
      # canonical_context` asserts that a routed analyzer negotiates the
      # standard methods the client declared, and the upstream `initialize`
      # response is the only authority for those. Without the component the
      # runner still has rustup's `rust-analyzer` proxy on PATH, so the daemon
      # routes the language and only the spawn fails — the test would then
      # measure a missing component instead of the negotiation contract. This
      # action exports `RUSTUP_TOOLCHAIN`, so the component has to be installed
      # here rather than through `rust-toolchain.toml`, which it overrides.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer

      - uses: ./.github/actions/setup-linux-mold

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ast-grep
        uses: ./.github/actions/install-ast-grep
        with:
          version: ${{ env.AST_GREP_VERSION }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-full-${{ runner.os }}
          cache-on-failure: true

      - name: Enable kache
        id: kache
        uses: ./.github/actions/kache
        with:
          lane: test
          max-size: 2GiB

      # Every `crates/tracedecay` integration target declares
      # `required-features = ["test-helpers"]`, because the fixture surface it
      # gates is used by `tests/common/mod.rs`. Those targets are selected here
      # today only as a side effect of dev-dependency feature unification
      # (`tracedecay-cli` dev-depends on `tracedecay` with that feature), which
      # is not a property this lane should depend on: it would evaporate the
      # moment that dev-dependency changes, and nextest would then silently
      # select zero of them and report green having run nothing. Asking for the
      # feature explicitly makes the selection independent of that accident.
      # `tracedecay-search-eval` ships two binaries and has no test target of
      # its own, and cargo only links a package's bins for a test build when
      # that same package has a test or bench selected. `cargo nextest run`
      # therefore never produced them, and the acceptance tests that execute
      # them out of the profile directory
      # (`runtime_acceptance_suite::search_eval_cli_test`,
      # `product_surface_suite::packaged_semantic_evaluator`) failed closed.
      #
      # The package selection and features must match the test lane below
      # exactly. `tracedecay-search-eval` depends on `tracedecay-code-index`
      # with `default-features = false`, so a `-p tracedecay-search-eval` build
      # resolves without the language tiers and produces an evaluator that
      # cannot parse Rust ("no bundled Tree-sitter grammar is available for
      # language rust", exit 2 where the contract is exit 1). Only the same
      # `--workspace --features tracedecay/test-helpers` resolution turns the
      # tiers back on, and it makes these artifacts a cache hit for the run
      # that follows rather than a second, differently-featured build.
      #
      # Every build in this lane uses the `perf` cargo profile that
      # `cargo test-ci` (the test step below) compiles the suites with; see
      # [profile.perf] in Cargo.toml. A default-profile build here would be a
      # second, unshared dependency graph.
      #
      # Every cargo invocation in this lane also selects `--workspace` with
      # the same root feature, and every one of them includes dev-dependencies
      # in the resolution. Both decide feature unification: `-p tracedecay-cli`
      # resolves `tracedecay-code-index` without its grammar tier,
      # `-p tracedecay-search-eval` resolves 52 dependencies differently from
      # the workspace, and a plain `--bins` build (no dev-dependencies) gives
      # 60 dependencies — tokio and serde_json among them — a different feature
      # set from the one every test, example and nextest build uses. Each such
      # invocation compiled its own copy of the heaviest crates (run
      # 34138693824, cold cache, Linux: 33 min for the bins, 20 min for the
      # fixture example, 20 min for the parity helpers, 7 min for one isolated
      # unit test) before the suites themselves compiled. `--tests` here puts
      # the binaries in the test graph, so this step compiles that graph once
      # and everything below it is a cache hit.
      - name: Build workspace binaries and tests for the test lane
        id: build-test-graph
        run: cargo build --workspace --bins --tests --locked --profile perf --features tracedecay/test-helpers

      - name: Build host-CLI test fixture
        run: cargo build --workspace --example tracedecay-host-cli-fixture --locked --profile perf --features tracedecay/test-helpers

      # The `test-ci` alias (.cargo/config.toml) is the one maintained
      # definition of the hosted selection — workspace, nextest `ci` policy,
      # root fixture feature, perf cargo profile — so a local `cargo test-ci`
      # reproduces exactly this run. It compiles the whole test graph, so it
      # runs first: on a cold cache the suite's verdict is the evidence this
      # lane exists for and must land before anything optional can exhaust the
      # budget. Every later nextest run rewrites the `ci` profile's junit.xml,
      # so the report is uploaded immediately after this step.
      - name: Run tests
        run: cargo test-ci --locked

      - name: Upload ${{ matrix.name }} nextest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      # This parity test must execute separate feature-off/on binaries. Copy
      # each result immediately so the second Cargo resolution cannot replace
      # the first executable in target/perf/examples. Under the workspace
      # selection the feature-off build is a cache hit and the feature-on
      # build recompiles only the crates whose features change.
      - name: Build controlled-workload hotpath parity executables
        shell: bash
        run: python3 scripts/build-controlled-workload-hotpath-helpers.py --profile perf --workspace --features tracedecay/test-helpers

      - name: Verify controlled-workload hotpath parity
        run: |
          cargo test-ci --locked --run-ignored only \
            -E 'test(=controlled_workloads::tests::hotpath_off_vs_on_durable_results_are_identical)' \
            --no-tests=fail

      - name: Save kache store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.kache.outputs.store-path }}
          key: ${{ steps.kache.outputs.cache-key }}

  # Compiles the Linux suite once and publishes it as a nextest archive for
  # the `linux-test-shard` jobs. The archive is the first thing uploaded after
  # the build: a shard job can only start once this job has completed, so
  # every step after the upload delays the shards by its own duration. The
  # steps kept here are the ones that need this job's compiled `target/`
  # tree; a second job could only reproduce that tree by compiling it again.
  linux-build:
    name: Build Linux tests
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Full history, as on the shards: the tests this job runs after the
      # archive (dashboard integration, hotpath parity) get the checkout the
      # shards do; the shard job documents the fixture-commit reason.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same toolchain step as the shards (rust-analyzer included) so the
      # tests this job runs after the archive see the environment the shards
      # do.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer

      - uses: ./.github/actions/setup-linux-mold

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ast-grep
        uses: ./.github/actions/install-ast-grep
        with:
          version: ${{ env.AST_GREP_VERSION }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Same lineage as the single Linux test job this replaces. rust-cache
      # carries the dependency graph, keyed by toolchain and lockfile; the
      # workspace crates compile fresh every run. No kache compiler store:
      # the perf-profile test graph is far larger than any store the 10 GB
      # repository cache can hold, so a store only ever kept the tail of the
      # build.
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-full-Linux
          cache-on-failure: true

      # Selection, features and cargo profile match `cargo test-ci`
      # (.cargo/config.toml) and the archive below; the macOS lane documents
      # why every invocation in a test lane must share this exact resolution.
      - name: Build workspace binaries and tests for the test lane
        id: build-test-graph
        run: cargo build --workspace --bins --tests --locked --profile perf --features tracedecay/test-helpers

      # The example is not a test executable, so nextest does not archive it
      # on its own; `archive.include` in .config/nextest.toml carries it (and
      # the search-eval binaries the acceptance tests execute) to the shards.
      - name: Build host-CLI test fixture
        run: cargo build --workspace --example tracedecay-host-cli-fixture --locked --profile perf --features tracedecay/test-helpers

      # Same selection as `cargo test-ci`; nextest has no archive alias, so
      # the arguments are spelled out here as in the Windows lane. Everything
      # this command compiles is a cache hit from the build above.
      - name: Build nextest archive
        run: cargo nextest archive --workspace --profile ci --locked --features tracedecay/test-helpers --cargo-profile perf --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - name: Upload nextest archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # `dashboard_api_test` declares `required-features = ["test-transport"]`,
      # which `cargo test-ci` does not enable, so the archive above never
      # builds or runs it. It used to be the `dashboard` job's own
      # dev-profile `nextest run` in a 512 MiB kache lane: with the repository
      # cache at its 10 GB cap every restore missed and the cold build took
      # 22-26 minutes against a 25-minute budget (runs 34217290139 and
      # 34231734416 were cancelled). Here the graph is already compiled.
      # `tracedecay/test-transport` changes the resolved features of only
      # `tracedecay`, `-application`, `-agent-hosts` and `-host-admission`
      # (every crate below them already carries the feature through this
      # package's dev-dependencies), so `--test dashboard_api_test` recompiles
      # those four libraries plus their dependents and links one test binary —
      # 11.6 minutes on this runner (run 34265243847). One OS carries it: the
      # transport seam does not vary by host and macOS is the lane closest to
      # its budget. It runs after the archive is published so it cannot
      # displace the suite's own artifacts, and after a failed archive upload
      # but not after a build that failed to compile the graph it extends.
      # `--no-tests=fail` so a dropped feature cannot select zero tests and
      # report green.
      - name: Run dashboard integration tests
        if: ${{ !cancelled() && steps.build-test-graph.outcome == 'success' }}
        run: cargo test-ci --locked --features tracedecay/test-transport --test dashboard_api_test --no-tests=fail

      # This parity test must execute separate feature-off/on binaries. Copy
      # each result immediately so the second Cargo resolution cannot replace
      # the first executable in target/perf/examples. Under the workspace
      # selection the feature-off build is a cache hit and the feature-on
      # build recompiles only the crates whose features change.
      - name: Build controlled-workload hotpath parity executables
        shell: bash
        run: python3 scripts/build-controlled-workload-hotpath-helpers.py --profile perf --workspace --features tracedecay/test-helpers

      - name: Verify controlled-workload hotpath parity
        run: |
          cargo test-ci --locked --run-ignored only \
            -E 'test(=controlled_workloads::tests::hotpath_off_vs_on_durable_results_are_identical)' \
            --no-tests=fail

      # Compile-only gate for the features this lane does not enable. Both are
      # otherwise built for the first time at release (`--all-features`), so
      # anything that breaks them merges green and is discovered at tag time.
      # That is not hypothetical: `tests/mcp_suite/support.rs` called
      # `fs::create_dir_all` without importing `std::fs`, which made ten
      # `required-features = ["test-transport"]` targets unbuildable, and
      # nothing reported it.
      #
      # `check --all-targets` rather than `nextest run`: the point is that the
      # code still compiles, and the acceptance suites behind `test-transport`
      # spawn daemons, so running them here would change this lane's cost and
      # flakiness profile. Enable them as a real test lane separately once
      # they are confirmed green (`dashboard_api_test`, green in CI since it
      # had its own job, already runs above).
      #
      # These are dev-profile check builds, a graph this lane shares with
      # nothing else, and feature wiring does not vary by host, so one OS
      # carries the gate. The macOS runner compiles at roughly half the Linux
      # speed (run 34138693824: 62 min vs 33 min for the same binaries build)
      # and is the lane closest to its budget.
      - name: Check feature-gated surfaces compile
        run: |
          cargo check --workspace --all-targets --features test-transport --locked
          cargo check --workspace --all-targets --features hotpath,hotpath-mcp --locked

  # Four shards: the suite's serial test time was 160 min for 15,485 tests in
  # run 34231734416 (junit report), 21.7 min of wall time under the `ci`
  # profile's 8 threads. Replaying that report's durations through the same
  # 8-thread schedule per shard gives 11.9 min for the slowest of 2 shards,
  # 7.2 min for 4 and 5.0 min for 8: the floor is the five ~125 s
  # `daemon::tests::scheduler_config` tests and the serialized `cli-subprocess`
  # group, not the shard count, so doubling past four buys ~2 min against a
  # fixed ~4-5 min of setup, download and extraction per shard.
  linux-test-shard:
    name: Test Linux shard ${{ matrix.partition }}/4
    needs: linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      # Full history: the search-quality workload fixture pins a
      # `source_repository_commit`, and `validate_source_bindings` resolves that
      # object out of this checkout to prove the checked-in corpus really is the
      # product source at that commit. A depth-1 checkout carries only the tip,
      # so every candidate_output/report test fails with "resolve fixture source
      # commit: An object with id ... could not be found".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `rust-analyzer` is a test dependency of this lane, not a convenience.
      # `runtime_surface_acceptance::production_lsp_negotiates_and_projects_\
      # canonical_context` asserts that a routed analyzer negotiates the
      # standard methods the client declared, and the upstream `initialize`
      # response is the only authority for those. Without the component the
      # runner still has rustup's `rust-analyzer` proxy on PATH, so the daemon
      # routes the language and only the spawn fails — the test would then
      # measure a missing component instead of the negotiation contract. This
      # action exports `RUSTUP_TOOLCHAIN`, so the component has to be installed
      # here rather than through `rust-toolchain.toml`, which it overrides.
      # The toolchain also serves the architecture tests that exec `cargo
      # metadata` at runtime.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ast-grep
        uses: ./.github/actions/install-ast-grep
        with:
          version: ${{ env.AST_GREP_VERSION }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: linux-nextest-archive
          path: ${{ runner.temp }}

      # The archive keeps the build's selection, features and cargo profile,
      # so only the run policy is spelled out: the `ci` nextest profile
      # (`cargo test-ci`'s fail-fast off, one retry that still fails flaky
      # results, 8 threads, slow-timeout termination) and `--no-tests=fail`
      # so an empty partition cannot report green. `--extract-to` must be the
      # workspace so target/ lands at the same absolute path as on the build
      # job: integration tests bake env!("CARGO_BIN_EXE_tracedecay") into
      # the binaries at compile time, and the fixture helpers resolve the
      # search-eval binaries and the host-CLI fixture beside their own
      # executable. nextest applies `.cargo/config.toml`'s `[env]` from this
      # checkout, so the test profile and global-DB isolation hold here too.
      - name: Run Linux tests
        run: >-
          cargo nextest run --profile ci
          --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
          --extract-to "$GITHUB_WORKSPACE"
          --workspace-remap "$GITHUB_WORKSPACE"
          --partition slice:${{ matrix.partition }}/4
          --no-tests=fail

      - name: Upload Linux shard nextest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-Linux-shard-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 1

  # The one `Test Linux` verdict, as when a single job carried the suite: the
  # build's own tests (dashboard integration, hotpath parity, feature-gate
  # compile) and every shard must pass. It also folds the shard reports back
  # into the `nextest-junit-Linux` artifact the single job published.
  linux-test:
    name: Test Linux
    if: ${{ !cancelled() && needs.scope-gate.outputs.run-heavy == 'true' }}
    needs: [linux-build, linux-test-shard, scope-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each shard's junit.xml keeps its name under its shard's directory;
      # the shard artifacts themselves expire after a day.
      - name: Merge the shard reports into the Linux nextest report
        if: ${{ needs.linux-test-shard.result != 'skipped' }}
        uses: actions/upload-artifact/merge@v4
        with:
          name: nextest-junit-Linux
          pattern: nextest-junit-Linux-shard-*
          separate-directories: true
          retention-days: 7

      - name: Check Linux build and shards
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ needs.linux-build.result }}" != "success" ]; then
            echo "Linux build result: ${{ needs.linux-build.result }}"
            exit 1
          fi
          if [ "${{ needs.linux-test-shard.result }}" != "success" ]; then
            echo "Linux shard result: ${{ needs.linux-test-shard.result }}"
            exit 1
          fi
          echo "Linux build and all shards passed."

  windows-build:
    name: Build Windows tests
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: windows-latest
    # Build every Windows test once, then shard execution from the archive.
    # Keep a bounded guard around the hosted build; Cargo timings are retained
    # below so a slow or failed archive can be attributed instead of treating
    # the timeout itself as the defect. Measured 2026-09-05 (run 33954670866,
    # no parity rebuild): portability compile 31 min, archive still compiling
    # the root crate's test targets at the 75-minute bound, so the archive
    # never completed and the compiler caches never seeded. The bound is
    # widened so one archive can finish and seed them; shrink it back once a
    # warm run's timings show the real cost.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Tune Windows runner for build I/O
        uses: ./.github/actions/tune-windows-runner

      # Install only the toolchain pinned by rust-toolchain.toml. Installing
      # `stable` as well makes Swatinem/rust-cache include an unused compiler
      # in its environment key, fragmenting the cache whenever stable moves.
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Use lld-link linker
        shell: pwsh
        run: |
          where.exe lld-link.exe
          lld-link.exe --version
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Node is only needed so build.rs can produce the embedded dashboard
      # dist assets (npm ci + npm run build) once, instead of once per shard.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Windows Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-full-windows-msvc-lld
          cache-on-failure: true

      # Compile this portable historical-artifact journey before the large
      # root test binaries monopolize the hosted runner. The workspace,
      # feature and cargo-profile selection match the archive, so Cargo
      # reuses the result below.
      - name: Compile Windows search-quality portability target
        shell: pwsh
        run: cargo test --no-run --workspace --locked --profile perf --features tracedecay/test-helpers --test search_quality_suite

      # Acceptance tests execute the ordinary evaluator binaries. Match the
      # archive's features and perf profile to reuse dependency artifacts;
      # nextest's archive.include carries the executables to every shard.
      # `--tests` keeps the binaries in the dev-dependency graph the archive
      # is built from; a `--bins`-only build resolves 60 dependencies with
      # different features and compiles them a second time (see the Linux
      # lane).
      - name: Build workspace binaries and tests for the Windows test lane
        shell: pwsh
        run: cargo build --workspace --bins --tests --locked --profile perf --features tracedecay/test-helpers

      # `--workspace`, not `-p tracedecay-cli`: the package selection decides
      # feature unification, and the narrower one recompiles the code-index
      # and extraction crates in a second configuration (see the Linux lane).
      - name: Build Windows host-CLI test fixture
        shell: pwsh
        run: cargo build --workspace --example tracedecay-host-cli-fixture --locked --profile perf --features tracedecay/test-helpers

      # The controlled-workload Hotpath parity helpers are provisioned and
      # verified on the Linux test lane only. Building them here would put a
      # second, feature-on resolution of the search-eval dependency graph
      # inside this job's bound (18 of its 62 minutes before it was cancelled),
      # and the parity property does not depend on the platform.
      # Same selection as `cargo test-ci` (.cargo/config.toml); nextest has no
      # archive alias, so the arguments are spelled out here once.
      - name: Build nextest archive
        shell: pwsh
        run: cargo nextest archive --workspace --profile ci --locked --features tracedecay/test-helpers --cargo-profile perf --timings --archive-file "$env:RUNNER_TEMP/nextest-archive.tar.zst"

      - name: Upload Windows archive build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nextest-build-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload nextest archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0

  windows-test-shard:
    name: Test Windows shard ${{ matrix.partition }}/5
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    steps:
      # Full history for the same reason as the Linux/macOS test job: the
      # shards run the workspace suite remapped onto this checkout, so the
      # pinned search-quality fixture commit must be resolvable here too.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tune Windows runner for test I/O
        uses: ./.github/actions/tune-windows-runner
        with:
          redirect-temp: "true"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ast-grep
        uses: ./.github/actions/install-ast-grep
        with:
          version: ${{ env.AST_GREP_VERSION }}

      # The architecture tests exec `cargo metadata` at runtime, and they run
      # concurrently under nextest: without the pinned toolchain installed,
      # each test process's rustup shim races to self-install it and the
      # concurrent downloads corrupt each other's partial files. Install the
      # rust-toolchain.toml pin serially up front.
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: windows-nextest-archive
          path: ${{ runner.temp }}

      - name: Run Windows tests
        shell: pwsh
        # --extract-to must be the workspace so target/ lands at the same
        # absolute path as on the build job: integration tests bake
        # env!("CARGO_BIN_EXE_tracedecay") into the binaries at compile time.
        run: >-
          cargo-nextest nextest run --profile ci
          --archive-file "$env:RUNNER_TEMP/nextest-archive.tar.zst"
          --extract-to "$env:GITHUB_WORKSPACE"
          --workspace-remap "$env:GITHUB_WORKSPACE"
          --partition slice:${{ matrix.partition }}/5
          --test-threads num-cpus --status-level slow

      - name: Clean abandoned Windows test children
        if: always()
        shell: pwsh
        run: |
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $all = Get-CimInstance Win32_Process
          $liveProcessIds = [System.Collections.Generic.HashSet[uint32]]::new()
          foreach ($process in $all) {
            [void]$liveProcessIds.Add([uint32]$process.ProcessId)
          }
          $stale = foreach ($process in $all) {
            if ($process.Name -ne "tracedecay.exe") {
              continue
            }
            if (-not $process.CommandLine) {
              continue
            }
            $inCurrentWorkspace = $process.CommandLine.IndexOf($workspace, [StringComparison]::OrdinalIgnoreCase) -ge 0
            if (-not $inCurrentWorkspace) {
              continue
            }
            if (-not $liveProcessIds.Contains([uint32]$process.ParentProcessId)) {
              $process
            }
          }
          foreach ($process in $stale) {
            Write-Host "Stopping abandoned tracedecay child pid=$($process.ProcessId)"
            Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows nextest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nextest-junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  windows-test:
    name: Test Windows
    if: ${{ !cancelled() && needs.scope-gate.outputs.run-heavy == 'true' }}
    needs: [windows-test-shard, scope-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Windows shards
        run: |
          if [ "${{ needs.windows-test-shard.result }}" != "success" ]; then
            echo "Windows shard result: ${{ needs.windows-test-shard.result }}"
            exit 1
          fi
          echo "All Windows shards passed."

  clippy:
    name: Clippy
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: ./.github/actions/setup-linux-mold

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-full-${{ runner.os }}
          cache-on-failure: true
      - name: Enable kache
        id: kache
        uses: ./.github/actions/kache
        with:
          lane: clippy
          max-size: 1GiB

      - name: Run blocking Clippy policy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check lean build
        run: cargo check -p tracedecay --no-default-features --locked

      - name: Save kache store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.kache.outputs.store-path }}
          key: ${{ steps.kache.outputs.cache-key }}

  # Additive visibility lint. Not a required check yet — introduce Hawk, then
  # promote once the workspace is clean under `-D warnings`.
  hawk:
    name: Hawk
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      # renovate: datasource=github-releases depName=astral-sh/hawk
      HAWK_VERSION: 0.1.12
      RUSTUP_MAX_RETRIES: 10
      TRACEDECAY_SKIP_DASHBOARD_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/hawk"
          cache-workspace-crates: "false"
          cache-on-failure: true

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1

      - name: Install Hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh

      # Hawk compiles every workspace member, so the tracedecay-cli build
      # script runs here. Skip mode requires a validatable bundle plus its
      # digest, so the seed must pass scripts/check-dashboard-bundle.py.
      - name: Seed dashboard app-dist for the CLI build script
        run: |
          set -euo pipefail
          mkdir -p dashboard/app-dist/static/js
          printf '%s\n' '{"allFiles":["index.html","static/js/index.js"]}' > dashboard/app-dist/asset-manifest.json
          printf '%s\n' '<!doctype html><title>hawk</title><script src="/static/js/index.js"></script>' > dashboard/app-dist/index.html
          head -c 1024 /dev/zero | tr '\0' ';' > dashboard/app-dist/static/js/index.js
          digest="$(python3 scripts/check-dashboard-bundle.py dashboard/app-dist --print-digest)"
          echo "TRACEDECAY_DASHBOARD_BUNDLE_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Hawk
        # Reports, does not gate. The job header above states Hawk is not a
        # required check until the workspace is clean under `-D warnings`, but
        # the step hard-failed anyway, so Hawk showed as a red required check
        # while the workspace carries ~9k visibility findings. Keep `-D
        # warnings` so the report stays honest, and drop the gate until the
        # backlog is burned down and this line can be removed.
        continue-on-error: true
        run: cargo +1.97.1 hawk check --target-dir target/hawk -D warnings

  fmt:
    name: Format
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Judge formatting with the toolchain `rust-toolchain.toml` pins, not
      # whatever `stable` is on the runner. rustfmt's output changes between
      # releases — 1.98.1 breaks a `.unwrap_or_else(|err| { ... })` chain that
      # 1.97.1 keeps inline — so a `stable` rustfmt rejects a tree the pinned
      # rustfmt developers run formats exactly, and every contributor sees a
      # red lane they cannot reproduce. `dtolnay/rust-toolchain@stable` also
      # exports `RUSTUP_TOOLCHAIN`, which overrides the toolchain file rather
      # than deferring to it. Installing through rustup with no override keeps
      # the pin in one place: the toolchain file, components included.
      - name: Install the repository's pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  dashboard:
    name: Dashboard
    needs: scope-gate
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard assets
        working-directory: dashboard
        run: npm run build

      - name: Run dashboard unit tests
        working-directory: dashboard
        run: npm test

      # The dashboard is one rsbuild app emitting `app-dist/` (the legacy
      # shell/holographic/lcm/graph/savings bundle split no longer exists), so
      # the bundle validator is the artifact authority and the determinism
      # check hashes whatever the build actually produced.
      - name: Verify embedded dist artifacts
        working-directory: dashboard
        run: |
          set -euo pipefail
          python3 ../scripts/check-dashboard-bundle.py app-dist
          (cd app-dist && find . -type f | sort | xargs sha256sum) > /tmp/dashboard-dist.sha
          npm run build
          (cd app-dist && find . -type f | sort | xargs sha256sum) | diff /tmp/dashboard-dist.sha -

  hermes-integration:
    name: Hermes integration (stock)
    needs: [scope-gate, debug-cli]
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Stock (upstream) Hermes pin — the generated plugin must keep working
      # against this exact upstream commit. Bump deliberately after rerunning
      # scripts/hermes_stock_integration.sh against the new ref locally.
      HERMES_UPSTREAM_REPO: https://github.com/NousResearch/hermes-agent.git
      HERMES_UPSTREAM_REF: 9dd9ef0ec99a87f078f7272b4323df5440b4b3f9
    steps:
      - uses: actions/checkout@v7

      - name: Install ast-grep
        uses: ./.github/actions/install-ast-grep
        with:
          version: ${{ env.AST_GREP_VERSION }}
      - name: Fetch the debug CLI built once for this run
        uses: actions/download-artifact@v4
        with:
          name: debug-tracedecay-cli
          path: target/debug
      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/debug/tracedecay

      - name: Run generated-plugin unit checks (no Hermes required)
        run: python3 scripts/hermes_plugin_unit_check.py

      - name: Clone stock Hermes at pinned ref
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/hermes-upstream"
          git -C "$RUNNER_TEMP/hermes-upstream" remote add origin "$HERMES_UPSTREAM_REPO"
          git -C "$RUNNER_TEMP/hermes-upstream" fetch --depth 1 origin "$HERMES_UPSTREAM_REF"
          git -C "$RUNNER_TEMP/hermes-upstream" checkout --detach FETCH_HEAD

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ runner.temp }}/hermes-upstream/uv.lock
          cache-suffix: hermes-${{ env.HERMES_UPSTREAM_REF }}

      - name: Set up stock Hermes environment
        working-directory: ${{ runner.temp }}/hermes-upstream
        run: uv sync --frozen --no-dev

      - name: Run stock Hermes integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
          HERMES_UPSTREAM_DIR: ${{ runner.temp }}/hermes-upstream
        run: scripts/hermes_stock_integration.sh

  host-stock-integration:
    name: Claude Code + OpenCode integration (stock)
    needs: [scope-gate, debug-cli]
    if: ${{ needs.scope-gate.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Stock host pins — the installed bundle must keep working against these
      # exact host releases. Bump deliberately after rerunning
      # scripts/claude_stock_integration.sh and
      # scripts/opencode_stock_integration.sh against the new versions locally.
      CLAUDE_CODE_VERSION: 2.1.224
      OPENCODE_VERSION: 1.18.4
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the debug CLI built once for this run
        uses: actions/download-artifact@v4
        with:
          name: debug-tracedecay-cli
          path: target/debug
      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/debug/tracedecay

      - name: Install stock Claude Code and OpenCode at pinned versions
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "opencode-ai@${OPENCODE_VERSION}"
          claude --version
          opencode --version

      - name: Run stock Claude Code integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/claude_stock_integration.sh

      - name: Run stock OpenCode integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/opencode_stock_integration.sh
