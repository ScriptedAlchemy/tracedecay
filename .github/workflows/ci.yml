name: Windows crate input diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-crate-inputs:
    name: Windows crate input diagnostic
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bazel
        with:
          cache-key: ci-windows-crate-input-diagnostic
          cache-save: "false"

      - name: Compile the failing target and capture its Rustc inputs
        shell: pwsh
        run: scripts/bazel/diagnose-windows-crate-inputs.ps1

      - name: Upload compiler input diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-crate-input-diagnostic
          path: diagnostics/windows-crate-inputs
          if-no-files-found: error
          retention-days: 3
