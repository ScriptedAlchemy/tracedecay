name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('CI for PR #{0}', github.event.pull_request.number) || format('CI for {0}', github.ref_name) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [master, feature/holographic-memory]
  workflow_dispatch:
    inputs:
      run_os:
        description: "Also run native macOS and Windows tests"
        type: boolean
        default: false
      run_hosts:
        description: "Also run stock host integrations"
        type: boolean
        default: false
      native_platform:
        description: "Native platform to test when run_os is enabled"
        type: choice
        options: [all, macos, windows]
        default: all
      native_targets:
        description: "Space-separated Bazel target patterns for native tests"
        type: string
        default: "//..."

permissions:
  contents: read

# Explicit OS/host coverage must not be replaced by a default-coverage push
# while queued (separate group suffixes). Non-master refs cancel superseded
# runs for tip-fast feedback. Master finishes the in-progress snapshot so a
# green/red signal still lands when merges outpace the long pole; GitHub
# keeps only the newest pending tip. Shorter shards cut how long that tip
# may wait for first job — shard layout is owned elsewhere.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('os-{0}-{1}-hosts-{2}', inputs.run_os, inputs.native_platform, inputs.run_hosts) || 'default' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Drafts run repository and frontend checks. Ready PRs and pushes also run
  # the Bazel Linux authority; dispatch can request OS and host journeys.
  # Job conditions evaluate that policy before a runner is scheduled.

  # One dev-profile `tracedecay` binary for the explicitly requested stock
  # host integrations. Ordinary Linux validation needs no CLI artifact, so
  # this build is absent unless `run_hosts=true`.
  debug-cli:
    permissions:
      contents: read
      id-token: write
    name: Build debug CLI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosts }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build tracedecay binary
        uses: ./.github/actions/build-cli
        with:
          config: ci
          dest: target/debug
          cache-key: ci-linux-debug
          tailscale-client-id: >-
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                && ((github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
                    || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID)) || '' }}

      - name: Publish the binary for the host integration jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-tracedecay-cli
          path: target/debug/tracedecay
          if-no-files-found: error
          retention-days: 1

  benchmark-harness:
    name: Benchmark harness self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runtime benchmark harness produces the evidence PRs cite; its own
      # unit tests only count if something runs them.
      - name: Test the runtime benchmark harness
        working-directory: benchmark_data/runtime
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test benchmark result publication
        run: python3 scripts/test-claude-observation-benchmark-publication.py

  # The cheap repository gates in one job: commit lint, cache lineage, the
  # release guards, and rustfmt. Each used to hold its own ubuntu-latest
  # runner for a couple of minutes of work; on 20 free slots that is three
  # queue entries per push doing what one does.
  gates:
    permissions:
      contents: read
      id-token: write
    name: Repository gates
    runs-on: ubuntu-latest
    # The rustfmt build's crate_universe splice clones git-pinned crates from
    # scratch. asupersync's full history alone took over 7 minutes on a hosted
    # runner, so 15 minutes no longer fits.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: ./.github/actions/setup-pnpm

      # Reject invalid commit messages before fetching toolchains or running
      # repository-wide checks, without rejudging published history.
      - name: Validate commit messages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/lint-ci-commits.sh

      - name: Reject tracked ignored files
        run: scripts/check-release-pr-integrity.sh HEAD HEAD

      - name: Test bounded commit range linting
        run: python3 scripts/test-lint-commit-range.py

      - name: Test Windows checkout preserves generated and embedded bytes
        run: python3 scripts/test-checkout-bytes.py

      - name: Test worktree GC classification and build reclamation
        run: python3 scripts/test-worktree-gc.py

      - name: Test Bazel workspace provenance
        run: python3 scripts/test-bazel-workspace-status.py

      - name: Test Bazel default-feature alias collapse
        run: python3 scripts/test-gen-builds-default-alias.py

      - name: Test the real-repository hot-path benchmark harness
        run: python3 scripts/test-bench-hot-paths.py

      # Configure the output base and restore caches before the first Bazel
      # invocation so this job does not start two independent Bazel servers.
      - uses: ./.github/actions/setup-bazel
        with:
          cache-key: ci-format-linux
          tailscale-client-id: >-
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                && ((github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
                    || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID)) || '' }}

      - name: Test repository policies with Bazel workers
        run: >-
          bazel test --config=ci --test_output=errors
          //scripts:unused_tool_context_measure_test
          //scripts:sqlite_plan_stability_check_test
          //scripts:ambient_tokio_check_test
          //scripts:rusqlite_storage_boundary_test
          //scripts:packaged_lsp_bridge_test
          //scripts:configure_ci_fleet_test

      - name: Test the ranked-tail trim replay against the Rust rule cases
        run: bazel run //scripts:test-measure-ranked-tail-trim.py

      - name: Test the Hermes dashboard embed helpers
        run: python3 -m unittest discover -s dashboard/hermes-wrapper -p 'test_*.py'

      - name: Check superseded Actions cache selection and Rust cache lineage
        run: |
          python3 scripts/test-prune-superseded-actions-caches.py
          python3 scripts/test-rust-cache-lineage.py

      # Packager unit tests. They do not need a release binary, so they run
      # once here instead of once per release matrix target.
      - name: Test release packagers
        run: |
          python3 scripts/test-build-mcpb.py
          python3 scripts/test-package-release-archive.py
          python3 scripts/test-plan-release-recovery.py
          python3 scripts/test-check-release-artifacts.py
          python3 scripts/test-generate-release-inventory.py
          python3 scripts/test-update-release-checksums.py
          python3 scripts/test-neutralize-release-pr-closing-keywords.py
          bash tests/macos_stable_codesign_test.sh

      # Exercise the release guard scripts when admitting proposed changes.
      - name: Check the release guards
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          bash tests/release_drift_check_test.sh
          bash tests/release_safety_test.sh
          bash tests/install_script_test.sh
          bash tests/release_pr_integrity_test.sh
          bash tests/dashboard_bundle_check_test.sh
          bash tests/dashboard_digests_check_test.sh

      - name: Check formatting
        run: bazel build --config=ci //:rustfmt_check

      # Manifest edits that skip a gen_builds.py rerun leave stale BUILD
      # files; compare the committed files against a fresh generation.
      - name: Check generated Bazel BUILD files are current
        run: bazel run //scripts:bazel/gen_builds.py -- --check

      - name: Test and check dev skill host copies
        run: |
          python3 scripts/test-check-dev-skill-mirrors.py
          python3 scripts/check-dev-skill-mirrors.py check

      # Every SQLite connection plans with SQLITE_DBCONFIG_ENABLE_QPSG, so a
      # bound partial-index predicate or LIKE pattern silently scans.
      - name: Check SQL plans stay index-backed under QPSG
        run: python3 scripts/check-sqlite-plan-stability.py

      # `daemon run` drives its futures on native workers, which have no
      # ambient Tokio runtime; production code names its Tokio handle.
      - name: Check production code has no ambient Tokio call
        run: python3 scripts/check-ambient-tokio.py

      - name: Check rusqlite stays inside storage owners
        run: python3 scripts/check-rusqlite-storage-boundary.py

  # The macOS and Windows lanes run the same Bazel workspace the Linux
  # authority does, on demand: they exercise target-specific behavior the
  # Linux lane cannot prove.
  macos-test:
    permissions:
      contents: read
      id-token: write
    name: Test macOS
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_os && (inputs.native_platform == 'all' || inputs.native_platform == 'macos') }}
    runs-on: macos-26
    timeout-minutes: 330
    steps:
      # Full history: the search-quality workload fixture pins a
      # `source_repository_commit`, and `validate_source_bindings` resolves that
      # object out of this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Remove inactive Xcode installations
        shell: bash
        run: |
          df -h /
          python3 - <<'PYTHON'
          import pathlib
          import subprocess

          applications = pathlib.Path("/Applications")
          selected = pathlib.Path(subprocess.check_output(["xcode-select", "-p"], text=True).strip()).resolve(strict=True)
          active = next((path for path in selected.parents if path.suffix == ".app"), None)
          if active is None:
              raise SystemExit(f"Selected developer directory is not an Xcode application: {selected}")
          print(f"Selected Xcode before cleanup: {active}", flush=True)
          inactive = [path for path in applications.glob("Xcode*.app") if path.resolve() != active]
          for path in inactive:
              print(f"Removing inactive Xcode: {path}", flush=True)
              subprocess.run(["sudo", "rm", "-rf", "--", str(path)], check=True)
          after = pathlib.Path(subprocess.check_output(["xcode-select", "-p"], text=True).strip()).resolve(strict=True)
          if after != selected:
              raise SystemExit(f"Selected developer directory changed: {selected} -> {after}")
          print(f"Selected Xcode after cleanup: {active}", flush=True)
          PYTHON
          df -h /

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-macos-test
          tailscale-client-id: >-
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                && ((github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
                    || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID)) || '' }}

      # `bazel test` builds every target in the pattern, so tests start
      # while the rest of the workspace still links.
      - name: Build and test native targets
        shell: bash
        env:
          BAZEL_TARGETS: ${{ inputs.native_targets || '//...' }}
        run: |
          if [[ "$BAZEL_TARGETS" == *$'\n'* ]]; then
            echo "Native targets must be space-separated" >&2
            exit 1
          fi
          read -r -a targets <<< "$BAZEL_TARGETS"
          if (( ${#targets[@]} == 0 )); then
            echo "At least one native Bazel target is required" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            case "$target" in
              //?*|@*//?*) ;;
              *) echo "Expected a Bazel target pattern: $target" >&2; exit 1 ;;
            esac
          done
          bazel test --config=ci --test_output=all "${targets[@]}"

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-test-logs-${{ runner.os }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml

      - name: Save compiled Bazel actions
        if: always() && !cancelled() && github.ref == 'refs/heads/master' && steps.bazel.outputs.disk-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}

  # A trusted fleet run submits the whole workspace from one hosted runner.
  # Hosted-only runs retain their shards so local CPU and disk limits do not
  # serialize the entire workspace. Both routes feed the Test Linux check.
  linux-test:
    permissions:
      contents: read
      id-token: write
    name: Test Linux (${{ matrix.shard }})
    needs: gates
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_BAZEL_TIMEOUT: "3600"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && ((github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
            || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID))
          && '["fleet"]' || '["root-a","root-b","workspace-a","workspace-code","workspace-b","workspace-c"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The workspace build plus its test outputs outgrow the runner's free
      # space (run 37403143722 died with ENOSPC mid-test); drop preinstalled
      # SDKs this job never uses.
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          status=0
          sudo rm -rf /usr/local/lib/android &
          p1=$!
          sudo rm -rf /usr/share/dotnet &
          p2=$!
          sudo rm -rf /opt/ghc &
          p3=$!
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          p4=$!
          for pid in "$p1" "$p2" "$p3" "$p4"; do
            wait "$pid" || status=1
          done
          df -h /
          exit "$status"

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-linux-test-v2
          # Tailscale binds each client to this repository, workflow, and actor ID.
          # Fork PRs never receive a fleet identity.
          tailscale-client-id: >-
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                && ((github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
                    || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID)) || '' }}
          # Prefer v2; keep legacy prefixes as restore fallbacks if still present.
          extra-restore-keys: ci-linux-test,ci-linux-workspace-test

      - name: Select Linux test targets
        id: targets
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            fleet)
              targets=(//...)
              ;;
            root-a)
              targets=(
                //crates/tracedecay:mcp_suite
                //crates/tracedecay:dashboard_api_test
                //crates/tracedecay:daemon_suite
                //crates/tracedecay:storage_suite
                //crates/tracedecay-cli:refresh_memory_journey
              )
              ;;
            root-b)
              targets=(
                --
                //crates/tracedecay/...
                -//crates/tracedecay:mcp_suite
                -//crates/tracedecay:dashboard_api_test
                -//crates/tracedecay:daemon_suite
                -//crates/tracedecay:storage_suite
              )
              ;;
            workspace-a)
              targets=(
                //crates/tracedecay-agent-hosts/...
                //crates/tracedecay-api/...
                //crates/tracedecay-application/...
                //crates/tracedecay-automation/...
                //crates/tracedecay-automation-runtime/...
                //crates/tracedecay-capture/...
              )
              ;;
            workspace-code)
              targets=(
                --
                //crates/tracedecay-cli/...
                //crates/tracedecay-code-extraction/...
                //crates/tracedecay-code-index/...
                //crates/tracedecay-code-index-retention/...
                //crates/tracedecay-code-index-runtime/...
                -//crates/tracedecay-cli:refresh_memory_journey
              )
              ;;
            workspace-b)
              targets=(
                //crates/tracedecay-configuration/...
                //crates/tracedecay-contracts/...
                //crates/tracedecay-daemon-control/...
                //crates/tracedecay-daemon-identity/...
                //crates/tracedecay-daemon-protocol/...
                //crates/tracedecay-daemon-service/...
                //crates/tracedecay-dashboard-api/...
                //crates/tracedecay-domain/...
                //crates/tracedecay-framing/...
                //crates/tracedecay-global-db/...
                //crates/tracedecay-graph-db/...
                //crates/tracedecay-graph-query/...
                //crates/tracedecay-hooks/...
                //crates/tracedecay-host-admission/...
                //crates/tracedecay-host-integration/...
                //crates/tracedecay-lcm/...
                //crates/tracedecay-lsp/...
                //crates/tracedecay-maintenance/...
                //crates/tracedecay-mcp/...
                //crates/tracedecay-mcp-catalog/...
              )
              ;;
            workspace-c)
              targets=(
                --
                //...
                -//crates/tracedecay/...
                -//crates/tracedecay-agent-hosts/...
                -//crates/tracedecay-api/...
                -//crates/tracedecay-application/...
                -//crates/tracedecay-automation/...
                -//crates/tracedecay-automation-runtime/...
                -//crates/tracedecay-capture/...
                -//crates/tracedecay-cli/...
                -//crates/tracedecay-code-extraction/...
                -//crates/tracedecay-code-index/...
                -//crates/tracedecay-code-index-retention/...
                -//crates/tracedecay-code-index-runtime/...
                -//crates/tracedecay-configuration/...
                -//crates/tracedecay-contracts/...
                -//crates/tracedecay-daemon-control/...
                -//crates/tracedecay-daemon-identity/...
                -//crates/tracedecay-daemon-protocol/...
                -//crates/tracedecay-daemon-service/...
                -//crates/tracedecay-dashboard-api/...
                -//crates/tracedecay-domain/...
                -//crates/tracedecay-framing/...
                -//crates/tracedecay-global-db/...
                -//crates/tracedecay-graph-db/...
                -//crates/tracedecay-graph-query/...
                -//crates/tracedecay-hooks/...
                -//crates/tracedecay-host-admission/...
                -//crates/tracedecay-host-integration/...
                -//crates/tracedecay-lcm/...
                -//crates/tracedecay-lsp/...
                -//crates/tracedecay-maintenance/...
                -//crates/tracedecay-mcp/...
                -//crates/tracedecay-mcp-catalog/...
              )
              ;;
            *) echo "Unknown Linux test shard: $SHARD" >&2; exit 1 ;;
          esac
          resources=
          prebuild=true
          if [[ $SHARD == workspace-* ]]; then
            resources=--default_test_resources=cpu=1
            # workspace-c's filesystem durability timing tests require
            # compilation to finish before they run.
            if [[ $SHARD != workspace-c ]]; then
              prebuild=false
            fi
          fi
          if [[ $SHARD == fleet ]]; then
            # Keep test binaries and intermediate outputs in the remote CAS.
            # Bazel still downloads test logs and XML for failure diagnostics.
            echo 'build --remote_download_outputs=minimal' >> .bazelrc.local
          fi
          {
            echo "patterns=${targets[*]}"
            echo "resources=$resources"
            echo "prebuild=$prebuild"
          } >> "$GITHUB_OUTPUT"

      # Finish compilation before latency-sensitive daemon journeys run.
      - name: Build test binaries before latency-sensitive tests
        if: steps.targets.outputs.prebuild == 'true'
        run: bazel build --config=ci ${{ steps.targets.outputs.patterns }}

      - name: Build and test the selected targets
        run: bazel test --config=ci ${{ steps.bazel.outputs.fleet-enabled == 'true' && '--default_test_resources=cpu=HOST_CPUS' || steps.targets.outputs.resources }} ${{ steps.targets.outputs.patterns }}

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-test-logs-${{ runner.os }}-${{ matrix.shard }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml

      # Matrix shards share github.job, so they would race the same save key.
      # One writer keeps the 10 GiB Actions cache from holding several copies
      # that would evict this prefix (observed: 6.9 GiB workspace-only save).
      # An offline fleet matrix has one job, which becomes that writer.
      - name: Save compiled Bazel actions
        if: >-
          always() && !cancelled() && github.ref == 'refs/heads/master'
          && (matrix.shard == 'root-b'
            || (matrix.shard == 'fleet' && steps.bazel.outputs.fleet-enabled != 'true'))
          && steps.bazel.outputs.disk-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}

  # Preserves the "Test Linux" check name for branch protection.
  linux-test-result:
    name: Test Linux
    needs: linux-test
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Linux test shard
        run: test "${{ needs.linux-test.result }}" = "success"

  windows-test:
    # Branch protection requires this check name.
    name: Test Windows
    if: >-
      ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'workflow_dispatch' ||
      (inputs.run_os &&
      (inputs.native_platform == 'all' || inputs.native_platform == 'windows'))) }}
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      # Linux builds do not enable cfg(windows). Compile every Bazel target on
      # native Windows for ready PRs and pushes; full tests remain dispatch-only.
      # Full history: the search-quality workload fixture pins a
      # `source_repository_commit`, and `validate_source_bindings` resolves that
      # object out of this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tune Windows runner for build and test I/O
        uses: ./.github/actions/tune-windows-runner
        with:
          redirect-temp: "true"

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-windows-test

      - name: Build and type-check the Windows workspace
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        # Compile and link every target, but defer unused test runfiles trees.
        # Bazel still materializes runfiles required by build-time tools.
        run: bazel build --config=ci --nobuild_runfile_links //...

      - name: Build and test native targets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_os }}
        shell: bash
        env:
          BAZEL_TARGETS: ${{ inputs.native_targets || '//...' }}
        run: |
          if [[ "$BAZEL_TARGETS" == *$'\n'* ]]; then
            echo "Native targets must be space-separated" >&2
            exit 1
          fi
          read -r -a targets <<< "$BAZEL_TARGETS"
          if (( ${#targets[@]} == 0 )); then
            echo "At least one native Bazel target is required" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            case "$target" in
              //?*|@*//?*) ;;
              *) echo "Expected a Bazel target pattern: $target" >&2; exit 1 ;;
            esac
          done
          bazel test --config=ci --test_output=all "${targets[@]}"

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-test-logs-${{ runner.os }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml

      # The cache archive shares D: with the build output. Discard the
      # disposable output base after diagnostics are uploaded; the sibling
      # compiled and repository caches survive clean --expunge. Keep this
      # synchronous so the archive cannot race deletion for the same space.
      # Explicit dispatches can also prime and verify a branch's cache.
      - name: Reclaim Windows build outputs before caching
        id: windows-cache-space
        if: always() && !cancelled() && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && steps.bazel.outputs.disk-cache-key != ''
        shell: pwsh
        run: |
          $drive = [System.IO.DriveInfo]::new('D:\')
          Write-Host "Free bytes before output cleanup: $($drive.AvailableFreeSpace)"
          bazel clean --expunge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Free bytes after output cleanup: $($drive.AvailableFreeSpace)"

      - name: Save compiled Bazel actions
        if: always() && !cancelled() && steps.windows-cache-space.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}

      # cache/save treats archive and upload failures as warnings. A lookup
      # checks persistence without downloading the multi-GB archive again.
      - name: Look up the saved Windows action cache
        id: windows-cache-verify
        if: always() && !cancelled() && steps.windows-cache-space.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}
          lookup-only: true

      - name: Require the Windows action cache to be persisted
        if: always() && !cancelled() && steps.windows-cache-space.outcome == 'success'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.windows-cache-verify.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != true ]]; then
            echo '::error::The Windows compiled cache was not saved. Check archive and upload diagnostics above.'
            exit 1
          fi

  # Blocking Clippy policy over every Bazel Rust target, the
  # `cargo clippy --workspace --all-targets -D warnings` equivalent.
  clippy:
    permissions:
      contents: read
      id-token: write
    name: Clippy
    needs: gates
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Same image as Test Linux so rustc action keys can restore that job's
    # disk cache (proc-macros, build scripts, grammar cc, matching rlibs)
    # when this job's own prefix misses. ARM isolated Clippy from that
    # cache and paid a cold 55–61m `//...` on recent PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-linux-clippy
          # Tailscale binds each client to this repository, workflow, and actor ID.
          # Fork PRs never receive a fleet identity.
          tailscale-client-id: >-
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                && ((github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
                    || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID)) || '' }}
          extra-restore-keys: ci-linux-test-v2

      - name: Run blocking Clippy policy
        run: bazel build --config=ci --config=clippy //...

      - name: Save compiled Bazel actions
        if: always() && !cancelled() && github.ref == 'refs/heads/master' && steps.bazel.outputs.disk-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bazel.outputs.disk-cache-path }}
          key: ${{ steps.bazel.outputs.disk-cache-key }}

  # The production feature graph must exclude test-only surfaces. The
  # feature-gated variants themselves (every `test-transport` library and the
  # lean `--no-default-features` root, emitted by scripts/bazel/gen_builds.py)
  # are ordinary `//...` targets that the Clippy job compiles.
  feature-gates:
    name: Feature gates
    needs: gates
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One graph walk per push. The release resolver repeats it on the tag it
      # builds, since a release is dispatched without waiting on this run.
      - name: Check the production feature graph
        run: python3 scripts/check-production-feature-profile.py

  # The configuration users actually receive: the release build of
  # `tracedecay-cli`, whose default features are `production`. Nothing else on
  # a push compiles it, so a break confined to the release graph (the
  # mimalloc allocator, the embedded dashboard, opt-level 3) would otherwise
  # first appear while a release is being cut.
  shipped-cli:
    permissions:
      contents: read
      id-token: write
    name: Shipped CLI build (x86_64-linux)
    needs: gates
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the shipped binary
        id: cli
        uses: ./.github/actions/build-cli
        with:
          config: release
          dest: target/x86_64-unknown-linux-gnu/release
          cache-key: release-x86_64-unknown-linux-gnu
          tailscale-client-id: >-
            ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                && ((github.actor_id == '25274700' && vars.TS_BAZEL_CLIENT_ID)
                    || (github.actor_id == '158243242' && vars.TS_BAZEL_BOT_CLIENT_ID)) || '' }}

      - name: Read immutable packaging inputs
        id: packaging
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=v$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package and exercise the shipped artifacts
        uses: ./.github/actions/package-release
        with:
          binary: ${{ steps.cli.outputs.path }}
          tag: ${{ steps.packaging.outputs.tag }}
          asset-prefix: tracedecay-${{ steps.packaging.outputs.tag }}
          platform: x86_64-linux
          archive: tar.gz
          epoch: ${{ steps.packaging.outputs.epoch }}

      - name: Exercise shipped MCP and LSP transports
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/tracedecay"
          smoke_work="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_work"' EXIT
          TRACEDECAY_BIN="$binary" bazel run //scripts:mcp-conformance-smoke.sh
          bazel run //scripts:packaged_lsp_bridge -- "$binary" "$smoke_work/lsp"

  # Frontend checks require no Rust compilation and must also validate drafts.
  # Do not serialize them behind repository-wide Rust formatting and gates.
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          cache-key: ci-dashboard

      - name: Check frontend types, tests, and artifacts
        run: >-
          bazel test --config=ci --test_output=errors
          //dashboard:typecheck //dashboard:unit_test
          //dashboard:bundle_sha256 //dashboard:bundle_determinism_test
          //sdks/typescript:typecheck //sdks/typescript:unit_test
          //plugin/chatgpt-extension:typecheck
          //plugin/chatgpt-extension:adapter_test
          //plugin/chatgpt-extension:serve_client_test
          //plugin/chatgpt-extension:bridge_lifecycle_test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Committed embedded bytes are generated with the pnpm package layout.
      # Keep this comparison in that same layout; Bazel's package paths change
      # bundler module IDs even when the source and dependency versions match.
      - uses: ./.github/actions/setup-pnpm

      - name: Build TypeScript SDK for the embedded artifact check
        working-directory: sdks/typescript
        run: pnpm run build

      - name: Verify ChatGPT extension embedded artifacts
        working-directory: plugin/chatgpt-extension
        run: pnpm run check:embedded

      - name: Check Cursor extension types, diagnostics, and embedded artifact
        run: |
          bazel run @nodejs//:node -- "$GITHUB_WORKSPACE/plugin/cursor-native-extension/node_modules/typescript/bin/tsc" --noEmit -p "$GITHUB_WORKSPACE/plugin/cursor-native-extension/tsconfig.json"
          bazel run @nodejs//:node -- "$GITHUB_WORKSPACE/plugin/cursor-native-extension/node_modules/tsx/dist/cli.mjs" --test "$GITHUB_WORKSPACE/plugin/cursor-native-extension/test/nativeDiagnostics.test.ts"
          bazel run @nodejs//:node -- "$GITHUB_WORKSPACE/plugin/cursor-native-extension/scripts/build-extension.mjs" --check

      - name: Upload failed frontend test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-bazel-test-logs
          path: |
            bazel-testlogs/dashboard/**/test.log
            bazel-testlogs/sdks/typescript/**/test.log
            bazel-testlogs/plugin/chatgpt-extension/**/test.log

  hermes-integration:
    name: Hermes integration (stock)
    needs: debug-cli
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosts }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Stock (upstream) Hermes pin. The generated plugin must keep working
      # against this exact upstream commit. Bump deliberately after rerunning
      # scripts/hermes_stock_integration.sh against the new ref locally.
      HERMES_UPSTREAM_REPO: https://github.com/NousResearch/hermes-agent.git
      HERMES_UPSTREAM_REF: 9dd9ef0ec99a87f078f7272b4323df5440b4b3f9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the debug CLI built once for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-tracedecay-cli
          path: target/debug
      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/debug/tracedecay

      - name: Clone stock Hermes at pinned ref
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/hermes-upstream"
          git -C "$RUNNER_TEMP/hermes-upstream" remote add origin "$HERMES_UPSTREAM_REPO"
          git -C "$RUNNER_TEMP/hermes-upstream" fetch --depth 1 origin "$HERMES_UPSTREAM_REF"
          git -C "$RUNNER_TEMP/hermes-upstream" checkout --detach FETCH_HEAD

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: ${{ runner.temp }}/hermes-upstream/uv.lock
          cache-suffix: hermes-${{ env.HERMES_UPSTREAM_REF }}

      - name: Run generated-plugin unit checks (no Hermes required)
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: uv run --no-project --with PyYAML==6.0.3 python scripts/hermes_plugin_unit_check.py

      - name: Set up stock Hermes environment
        working-directory: ${{ runner.temp }}/hermes-upstream
        run: uv sync --frozen --no-dev

      - name: Run stock Hermes integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
          HERMES_UPSTREAM_DIR: ${{ runner.temp }}/hermes-upstream
        run: scripts/hermes_stock_integration.sh

  host-stock-integration:
    name: Claude Code + OpenCode integration (stock)
    needs: debug-cli
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosts }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Stock host pins. The installed bundle must keep working against these
      # exact host releases. Bump deliberately after rerunning
      # scripts/claude_stock_integration.sh and
      # scripts/opencode_stock_integration.sh against the new versions locally.
      CLAUDE_CODE_VERSION: 2.1.296
      OPENCODE_VERSION: 2.0.28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the debug CLI built once for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-tracedecay-cli
          path: target/debug
      - name: Restore the executable bit the artifact store drops
        run: chmod +x target/debug/tracedecay

      - name: Install stock Claude Code and OpenCode at pinned versions
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "@opencode/cli@${OPENCODE_VERSION}"
          claude --version
          opencode --version

      - name: Run MCP conformance smoke
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/mcp-conformance-smoke.sh

      - name: Run stock Claude Code integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/claude_stock_integration.sh

      - name: Run stock OpenCode integration checks
        env:
          TRACEDECAY_BIN: ${{ github.workspace }}/target/debug/tracedecay
        run: scripts/opencode_stock_integration.sh

