name: Pull request run hygiene

on:
  pull_request_target:
    types: [closed]

# This workflow runs trusted inline API calls only. It never checks out PR code.
permissions:
  actions: write
  pull-requests: read

# Share CI's PR key so closing cancels its run before cleanup gets a runner.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cache-cleanup:
    name: Delete closed PR caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CLOSED_AT: ${{ github.event.pull_request.closed_at }}
    steps:
      - name: Delete caches owned by the closed pull request
        run: |
          set -euo pipefail
          require_same_closure() {
            local current
            current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.state, .closed_at] | @tsv')
            if [[ "$current" != $'closed\t'"$CLOSED_AT" ]]; then
              echo "PR $PR_NUMBER has reopened or closed again; this event owns no further cleanup."
              exit 0
            fi
          }
          require_same_closure
          failed=0
          merge_ref="refs/pull/$PR_NUMBER/merge"
          caches=$(gh api --paginate "repos/$REPO/actions/caches?ref=$merge_ref&per_page=100" --jq '.actions_caches[].id')
          deleted=0
          for cache in $caches; do
            require_same_closure
            if gh api -X DELETE "repos/$REPO/actions/caches/$cache" >/dev/null; then
              deleted=$((deleted + 1))
            else
              failed=1
            fi
          done
          echo "deleted $deleted cache entry(ies) for PR $PR_NUMBER"
          exit "$failed"
