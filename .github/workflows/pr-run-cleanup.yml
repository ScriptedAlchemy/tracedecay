name: Pull request run hygiene

on:
  pull_request_target:
    types: [closed]

# This workflow runs trusted inline API calls only. It never checks out PR code.
permissions: {}

# A late close event must not cancel a reopened PR before its state is checked.
concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  cache-cleanup:
    name: Cancel closed PR runs and delete their caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CLOSED_AT: ${{ github.event.pull_request.closed_at }}
    steps:
      - name: Clean up the same closed pull request
        run: |
          set -euo pipefail
          require_same_closure() {
            local current
            current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.state, .closed_at] | @tsv')
            if [[ "$current" != $'closed\t'"$CLOSED_AT" ]]; then
              echo "PR $PR_NUMBER has reopened or closed again; this event owns no further cleanup."
              exit 0
            fi
          }
          require_same_closure
          failed=0
          runs=$(
            for state in queued in_progress waiting pending requested; do
              gh api --paginate -X GET "repos/$REPO/actions/workflows/ci.yml/runs" \
                -f event=pull_request -f per_page=100 -f status="$state" \
                --jq ".workflow_runs[] | select(.display_title == \"CI for PR #$PR_NUMBER\" and .created_at < \"$CLOSED_AT\") | .id" || exit 1
            done
          )
          runs=$(sort -u <<<"$runs")
          for run in $runs; do
            require_same_closure
            current=$(gh api "repos/$REPO/actions/runs/$run")
            # A queued first attempt can start after closure; a rerun keeps
            # the original creation time, so require its own start before closure.
            if ! jq -e --arg closed "$CLOSED_AT" \
              '.status != "completed" and (.run_attempt == 1 or ((.run_started_at | type) == "string" and .run_started_at < $closed))' <<<"$current" >/dev/null; then
              continue
            fi
            if ! gh api -X POST "repos/$REPO/actions/runs/$run/cancel" >/dev/null; then
              status=$(gh api "repos/$REPO/actions/runs/$run" --jq .status)
              [[ $status == completed ]] || failed=1
            fi
            # Cache post steps can still write after cancellation is requested.
            gh run watch "$run" --repo "$REPO" --interval 3 >/dev/null
          done
          [[ $failed == 0 ]] || exit 1
          merge_ref="refs/pull/$PR_NUMBER/merge"
          caches=$(gh api --paginate "repos/$REPO/actions/caches?ref=$merge_ref&per_page=100" --jq '.actions_caches[].id')
          deleted=0
          for cache in $caches; do
            require_same_closure
            if gh api -X DELETE "repos/$REPO/actions/caches/$cache" >/dev/null; then
              deleted=$((deleted + 1))
            else
              failed=1
            fi
          done
          echo "deleted $deleted cache entry(ies) for PR $PR_NUMBER"
          exit "$failed"
