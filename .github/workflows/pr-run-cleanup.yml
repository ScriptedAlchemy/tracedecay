name: Pull request run hygiene

on:
  pull_request_target:
    types: [closed]

# This workflow runs trusted inline API calls only. It never checks out PR code.
permissions:
  actions: write
  pull-requests: read

concurrency:
  group: pr-run-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel:
    name: Cancel superseded runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.url }}
      CLOSED_AT: ${{ github.event.pull_request.closed_at }}
      OWN_RUN: ${{ github.run_id }}
    steps:
      - name: Release runs and caches owned by the closed pull request
        run: |
          set -euo pipefail
          require_same_closure() {
            local current
            current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.state, .closed_at] | @tsv')
            if [[ "$current" != $'closed\t'"$CLOSED_AT" ]]; then
              echo "PR $PR_NUMBER has reopened or closed again; this event owns no further cleanup."
              exit 0
            fi
          }
          require_same_closure
          cancelled=0
          failed=0
          for status in queued in_progress waiting pending; do
            runs=$(gh api --paginate "repos/$REPO/actions/runs?event=pull_request&status=$status&per_page=100" |
              jq -r --argjson pr "$PR_NUMBER" --arg url "$PR_URL" --arg closed "$CLOSED_AT" --argjson own "$OWN_RUN" '
                .workflow_runs[]
                | select(.event == "pull_request" and .id != $own)
                | select((.created_at | fromdateiso8601) <= ($closed | fromdateiso8601))
                | select(any(.pull_requests[]?; .number == $pr and .url == $url))
                | .id')
            for run in $runs; do
              require_same_closure
              if gh api -X POST "repos/$REPO/actions/runs/$run/cancel" >/dev/null; then
                echo "cancelled run $run ($status) for PR $PR_NUMBER"
                cancelled=$((cancelled + 1))
              else
                failed=1
              fi
            done
          done
          require_same_closure
          merge_ref="refs/pull/$PR_NUMBER/merge"
          caches=$(gh api --paginate "repos/$REPO/actions/caches?ref=$merge_ref&per_page=100" --jq '.actions_caches[].id')
          deleted=0
          for cache in $caches; do
            require_same_closure
            if gh api -X DELETE "repos/$REPO/actions/caches/$cache" >/dev/null; then
              deleted=$((deleted + 1))
            else
              failed=1
            fi
          done
          echo "cancelled $cancelled run(s) and deleted $deleted cache entry(ies) for PR $PR_NUMBER"
          exit "$failed"
