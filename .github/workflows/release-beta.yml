name: Release (Beta)

# Dispatched on `master` by release-please after it creates the immutable
# tag. GitHub Actions caches are scoped by the workflow run ref: a run on a
# unique tag cannot restore the previous tag's cache, while master can reuse
# the same target/profile dependency cache across releases.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Prerelease tag to build or recover
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag }}
  # Prebuilt dashboard/app-dist is proven in this job; cargo embeds it instead
  # of running rsbuild a second time inside tracedecay-cli/build.rs.
  TRACEDECAY_SKIP_DASHBOARD_BUILD: "1"

concurrency:
  group: release-beta-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'ScriptedAlchemy/tracedecay' &&
      vars.BETA_CHANNEL_ENABLED == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      attestations: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_epoch: ${{ steps.source.outputs.source_epoch }}
      matrix: ${{ steps.source.outputs.matrix }}
      build_required: ${{ steps.source.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'true\tfalse'

      - name: Resolve immutable prerelease source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_epoch="$(git show -s --format=%ct "$source_sha")"
          version="$(tr -d '[:space:]' < version.txt)"
          test -n "$version"
          test "$version" != "null"
          [[ "$version" == *-* ]]
          test "$RELEASE_TAG" = "v${version}"
          test "$GITHUB_REF" = "refs/heads/master"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$source_sha"
          # Recovery may run after master has moved, but a release tag must
          # remain on master's history.
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "source_epoch=${source_epoch}" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          python3 scripts/plan-release-recovery.py \
            --manifest .github/release-targets.json \
            --tag "$RELEASE_TAG" \
            --profile beta \
            --asset-names remote-asset-names \
            --retained-output retained-asset-names \
            --github-output "$GITHUB_OUTPUT"
          mkdir retained-assets
          scripts/verify-retained-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-beta.yml" \
            --source-digest "$source_sha" \
            --signer-ref "refs/tags/${RELEASE_TAG}" \
            --signer-ref "refs/heads/master" \
            --asset-names retained-asset-names \
            --download-dir retained-assets

  build:
    needs: validate
    if: needs.validate.outputs.build_required == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - uses: ./.github/actions/setup-pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12.10 is the newest 3.12 patch published for every release
          # matrix architecture, including macOS 14 ARM.
          python-version: "3.12.10"

      - name: Build dashboard
        working-directory: dashboard
        run: pnpm run build

      - name: Export dashboard bundle digest for skip-mode builds
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python3 scripts/check-dashboard-bundle.py dashboard/app-dist --print-digest)"
          echo "TRACEDECAY_DASHBOARD_BUNDLE_SHA256=${digest}" >> "$GITHUB_ENV"

      # rust-toolchain.toml is the only compiler this job may install.
      # dtolnay/rust-toolchain@stable also installs floating stable, and
      # rust-cache hashes every rustc into the environment key, so each
      # stable bump (1.98.0 → 1.98.1 on beta.40 macOS) makes every release
      # prefix unrestorable. Windows CI already refuses that extra install.
      - name: Resolve pinned toolchain
        id: pin
        shell: bash
        run: |
          python3 -c 'import pathlib, tomllib; print("toolchain=" + tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.1 pin
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
          targets: ${{ matrix.target }}

      # Restore before the packaging compile. Tag runs can restore only
      # same-ref or default-branch caches; this shared-key must stay stable so
      # a later master writer can seed them. cache-workspace-crates stays
      # false: the 10 GB repo budget is already full of CI lineages.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-beta-${{ matrix.target }}
          cache-workspace-crates: "false"
          cache-on-failure: true

      - name: Resolve release source feature profile
        id: release-profile
        shell: bash
        run: |
          python3 scripts/resolve-release-source-profile.py \
            --source . \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"
          if [[ -f crates/tracedecay-cli/Cargo.toml ]]; then
            echo "binary_args=--package tracedecay-cli --bin tracedecay" >> "$GITHUB_OUTPUT"
          else
            echo "binary_args=--bin tracedecay" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mold
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: 2.41.0
          make-default: true

      - name: Verify mold is the default linker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mold --version
          ld --version | head -n 1 | grep -i mold

      - name: Use lld-link
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          where.exe lld-link
          lld-link --version
          "RUSTFLAGS=-C linker=lld-link.exe" >> $env:GITHUB_ENV

      # Re-signs the product after release strip (see .cargo/config.toml).
      # Cargo has no per-target wrapper, so only macOS runners set it.
      - name: Use the macOS rustc wrapper
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER=${GITHUB_WORKSPACE}/scripts/macos-rustc-wrapper.sh" >> "$GITHUB_ENV"

      - name: Build release binary for packaging
        run: cargo build ${{ steps.release-profile.outputs.binary_args }} --release --target ${{ matrix.target }} ${{ steps.release-profile.outputs.cargo_args }} --locked

      - name: Smoke release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          test -f "$binary"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Package MCPB
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          bundle="tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.mcpb"
          python3 scripts/build-mcpb.py build \
            --binary "$binary" \
            --output "$bundle" \
            --version "${RELEASE_TAG#v}" \
            --platform "${{ matrix.name }}"
          python3 scripts/build-mcpb.py verify \
            --bundle "$bundle" \
            --version "${RELEASE_TAG#v}" \
            --platform "${{ matrix.name }}"

      - name: Verify MCPB runtime (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle="tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.mcpb"
          rm -rf verify-mcpb
          # unzip applies the mode bits build-mcpb.py records in the archive,
          # which is what an MCPB host does. `python3 -m zipfile -e` drops
          # them, so `test -x` failed on every Unix target with no output.
          unzip -q "$bundle" -d verify-mcpb
          test -x verify-mcpb/server/tracedecay
          verify-mcpb/server/tracedecay --version
          verify-mcpb/server/tracedecay --help >/dev/null

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-beta-${{ matrix.name }}
          path: tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.mcpb
          if-no-files-found: error

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          source="target/${{ matrix.target }}/release/tracedecay"
          entry_name="tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source="${source}.exe"
            entry_name="${entry_name}.exe"
          fi
          python3 scripts/package-release-archive.py \
            --binary "$source" \
            --output "tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.${{ matrix.archive }}" \
            --format "${{ matrix.archive }}" \
            --entry-name "$entry_name" \
            --epoch "${{ needs.validate.outputs.source_epoch }}"

      - name: Verify binary archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          archive="tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.tar.gz"
          mkdir verify-binary
          tar xzf "$archive" -C verify-binary
          test -x verify-binary/tracedecay
          verify-binary/tracedecay --version
          verify-binary/tracedecay --help >/dev/null

      - name: Verify binary archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "tracedecay-beta-${env:RELEASE_TAG}-${{ matrix.name }}.zip"
          Expand-Archive -Path $archive -DestinationPath verify-binary
          & "./verify-binary/tracedecay.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged binary failed --version" }
          & "./verify-binary/tracedecay.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaged binary failed --help" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-${{ matrix.name }}
          # The exact archive, not `tracedecay-beta-*`: that glob also matched
          # the MCPB packaged beside it, so publish found MCPBs among the
          # binaries and refused the whole release (beta.43).
          path: tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: [validate, build]
    # A failed build matrix still publishes every target that did build. Six
    # consecutive betas shipped zero assets because one target's failure
    # withheld the other three; the recovery planner exists to rebuild only
    # the missing ones. Only a cancelled build withholds publication.
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.build.result != 'cancelled'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.build_required == 'true'
        with:
          pattern: beta-*
          path: new-binaries
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.build_required == 'true'
        with:
          pattern: mcpb-beta-*
          path: new-mcpbs
          merge-multiple: true

      - name: Assemble retained and newly built prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'true\tfalse'
          mkdir binaries mcpbs retained-assets
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          python3 scripts/plan-release-recovery.py \
            --manifest .github/release-targets.json \
            --tag "$RELEASE_TAG" \
            --profile beta \
            --asset-names remote-asset-names \
            --retained-output retained-asset-names \
            --github-output planner-output
          scripts/verify-retained-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-beta.yml" \
            --source-digest "$SOURCE_SHA" \
            --signer-ref "refs/tags/${RELEASE_TAG}" \
            --signer-ref "refs/heads/master" \
            --asset-names retained-asset-names \
            --download-dir retained-assets
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            if [[ "$asset" == *.mcpb ]]; then
              cp "retained-assets/$asset" "mcpbs/$asset"
            else
              cp "retained-assets/$asset" "binaries/$asset"
            fi
          done < retained-asset-names
          if [[ "${{ needs.validate.outputs.build_required }}" == "true" ]]; then
            # A target whose build failed left no artifact; nullglob keeps the
            # loop from copying the literal pattern.
            shopt -s nullglob
            for artifact in new-binaries/tracedecay-beta-*; do
              destination="binaries/$(basename "$artifact")"
              [[ -e "$destination" ]] || cp "$artifact" "$destination"
            done
            for artifact in new-mcpbs/*.mcpb; do
              destination="mcpbs/$(basename "$artifact")"
              [[ -e "$destination" ]] || cp "$artifact" "$destination"
            done
            shopt -u nullglob
          fi
          python3 scripts/check-release-artifacts.py \
            --manifest .github/release-targets.json \
            --profile beta \
            --tag "$RELEASE_TAG" \
            --binaries binaries \
            --mcpbs mcpbs \
            --allow-missing-targets
          for bundle in mcpbs/*.mcpb; do
            platform="${bundle#mcpbs/tracedecay-beta-"${RELEASE_TAG}"-}"
            platform="${platform%.mcpb}"
            python3 scripts/build-mcpb.py verify \
              --bundle "$bundle" \
              --version "${RELEASE_TAG#v}" \
              --platform "$platform"
          done

      - name: Count newly built artifacts
        id: built
        run: |
          shopt -s nullglob
          archives=(new-binaries/tracedecay-beta-*)
          bundles=(new-mcpbs/*.mcpb)
          echo "archives=${#archives[@]}" >>"$GITHUB_OUTPUT"
          echo "bundles=${#bundles[@]}" >>"$GITHUB_OUTPUT"

      - name: Attest newly built prerelease archives
        if: steps.built.outputs.archives != '0'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: new-binaries/tracedecay-beta-*

      - name: Attest newly built prerelease MCPBs
        if: steps.built.outputs.bundles != '0'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: new-mcpbs/*.mcpb

      - name: Upload missing prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (
            cd binaries
            sha256sum tracedecay-beta-* > ../SHA256SUMS
          )
          (
            cd mcpbs
            sha256sum -- *.mcpb
          ) >> SHA256SUMS
          mapfile -t archives < <(find binaries -maxdepth 1 -type f -name 'tracedecay-beta-*' -print | sort)
          test "${#archives[@]}" -gt 0
          mapfile -t bundles < <(find mcpbs -maxdepth 1 -type f -name '*.mcpb' -print | sort)
          test "${#bundles[@]}" -gt 0
          # `install.sh` ships with the prerelease as it does with a stable
          # release. README tells users to curl the installer from a release,
          # and only release.yml published one, so the hardened script on
          # master reached nobody following the beta line. The checkout is
          # pinned to the tag's source sha, so this is that tag's installer.
          release_assets=("${archives[@]}" "${bundles[@]}" SHA256SUMS install.sh)
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          for release_asset in "${release_assets[@]}"; do
            name="$(basename "$release_asset")"
            if grep -Fxq "$name" remote-asset-names; then
              if [[ "$name" == "SHA256SUMS" ]]; then
                # A recovery run adds targets, so the new manifest may be a
                # superset of the published one. Every published line must
                # survive unchanged (a retained asset's hash never moves);
                # then the superset replaces it.
                mkdir -p retained-metadata
                gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
                  --pattern "$name" --dir retained-metadata
                if ! cmp -s "$release_asset" "retained-metadata/$name"; then
                  while IFS= read -r line; do
                    [[ -z "$line" ]] && continue
                    grep -Fxq -- "$line" "$release_asset" || {
                      echo "::error::published SHA256SUMS line is not in the new manifest: $line"
                      exit 1
                    }
                  done < "retained-metadata/$name"
                  gh release upload "$RELEASE_TAG" "$release_asset" --clobber \
                    --repo "${{ github.repository }}"
                fi
              fi
            else
              gh release upload "$RELEASE_TAG" "$release_asset" \
                --repo "${{ github.repository }}"
            fi
          done
          # Verify by name, not by glob: a partial publish may have no .zip
          # (Windows) or no .tar.gz yet, and `gh release download --pattern`
          # fails on an empty match.
          mkdir verified-binaries verified-mcpbs
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          while IFS= read -r name; do
            case "$name" in
              tracedecay-beta-"${RELEASE_TAG}"-*.mcpb)
                gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
                  --pattern "$name" --dir verified-mcpbs ;;
              tracedecay-beta-"${RELEASE_TAG}"-*.tar.gz | tracedecay-beta-"${RELEASE_TAG}"-*.zip)
                gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
                  --pattern "$name" --dir verified-binaries ;;
            esac
          done < remote-asset-names
          python3 scripts/check-release-artifacts.py \
            --manifest .github/release-targets.json \
            --profile beta \
            --tag "$RELEASE_TAG" \
            --binaries verified-binaries \
            --mcpbs verified-mcpbs \
            --allow-missing-targets
          scripts/verify-retained-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-beta.yml" \
            --source-digest "${{ needs.validate.outputs.source_sha }}" \
            --signer-ref "refs/tags/${RELEASE_TAG}" \
            --signer-ref "refs/heads/master" \
            --files verified-binaries/* verified-mcpbs/*
