name: Release (Beta)

# Beta channel is enabled for GitHub prereleases.
#
# Keep BETA_CHANNEL_ENABLED as an emergency brake: set the repository variable
# to `false` or unset it to skip beta jobs without editing the workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing prerelease tag to rebuild and publish, for example v0.1.0-beta.1"
        required: true
        type: string

# Only runs for prerelease tags — stable releases handled by release.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
  TRACEDECAY_SKIP_DASHBOARD_BUILD: "1"

concurrency:
  group: release-beta-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  dashboard-assets:
    name: Build dashboard artifact
    if: vars.BETA_CHANNEL_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Validate dashboard bundle
        run: python3 .release-automation/scripts/check-dashboard-bundle.py dashboard/app-dist

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist
          if-no-files-found: error
          include-hidden-files: true

  build:
    name: Build ${{ matrix.name }}
    if: vars.BETA_CHANNEL_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease)
    needs: dashboard-assets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-macos
            runner: macos-14
            target: aarch64-apple-darwin
            bottle_tag: arm64_sonoma
            archive: tar.gz
          - name: x86_64-linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bottle_tag: x86_64_linux
            archive: tar.gz
          - name: aarch64-linux
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: x86_64-windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Validate manual prerelease rebuild
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)" = true

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Download dashboard artifact
        uses: actions/download-artifact@v7
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist

      - name: Validate downloaded dashboard bundle
        run: python3 .release-automation/scripts/check-dashboard-bundle.py dashboard/app-dist

      - name: Validate portable distribution harnesses
        run: |
          python3 .release-automation/scripts/test-check-packaged-lsp-bridge.py
          python3 .release-automation/scripts/test-build-mcpb.py
          python3 .release-automation/scripts/test-resolve-installed-binary.py
          python3 .release-automation/scripts/test-check-packaged-mcp-stdio.py
          python3 .release-automation/scripts/test-resolve-release-source-profile.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve release source feature profile
        id: release-profile
        shell: bash
        run: |
          python3 .release-automation/scripts/resolve-release-source-profile.py \
            --source . \
            --github-output "$GITHUB_OUTPUT"

      # Inline instead of ./.github/actions/setup-linux-mold: this workflow
      # can be dispatched with an old release_tag, and the checkout above
      # replaces the workspace with that tag, which may predate the local
      # action. make-default symlinks ld to mold, which works on this
      # runner's GCC 11 (unlike -fuse-ld=mold, which needs GCC 12+).
      - name: Install mold
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
        with:
          mold-version: 2.41.0
          make-default: true

      - name: Verify mold is the default linker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mold --version
          ld --version | head -n 1 | grep -i mold

      - name: Use lld-link
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          where.exe lld-link
          lld-link --version
          "RUSTFLAGS=-C linker=lld-link.exe" >> $env:GITHUB_ENV

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-beta-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-beta-
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Test release distribution
        run: cargo test --workspace --release --target ${{ matrix.target }} --all-features --locked

      # Runs before the default build so it never leaves an all-features
      # binary (e.g. test-transport) on disk at the shared release output
      # path for later packaging steps to pick up.
      - name: Verify all-feature release build compiles
        run: cargo build --release --target ${{ matrix.target }} --all-features --locked

      - name: Build release binary for packaging
        run: cargo build --release --target ${{ matrix.target }} ${{ steps.release-profile.outputs.cargo_args }} --locked

      - name: Install modern Bash for distribution acceptance
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Validate immutable FastEmbed fixture pins
        if: steps.release-profile.outputs.profile == 'production'
        shell: bash
        run: |
          set -euo pipefail
          gate="scripts/check-distribution-acceptance.sh"
          prepare="tests/distribution/fastembed/prepare_fixture.py"
          validator="tests/distribution/fastembed/validate_fixture.py"
          if [[ ! -x "$gate" || ! -f "$prepare" || ! -f "$validator" ]]; then
            echo "::error title=FastEmbed acceptance setup missing::Expected executable $gate plus $prepare and $validator from the distribution fixture work."
            exit 1
          fi
          # Pins live in-repo; real model bytes are acquired later by the gate.
          if ! python3 "$prepare" --check tests/distribution/fastembed; then
            echo "::error title=FastEmbed fixture pins invalid::The immutable Jina fixture pins must validate before release acceptance acquires real model bytes."
            exit 1
          fi
          cargo fetch --locked --target ${{ matrix.target }}

      - name: Run distribution acceptance
        if: steps.release-profile.outputs.profile == 'production'
        shell: bash
        run: |
          set -euo pipefail
          gate_shell="bash"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            gate_shell="$(brew --prefix)/bin/bash"
          fi
          lockfile_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest())')"
          # Allow curl fixture acquisition; keep Cargo and HF hub offline for the
          # packaged library/CLI and ORT inference phases inside the gate.
          CARGO_NET_OFFLINE=true HF_HUB_OFFLINE=1 \
            "$gate_shell" scripts/check-distribution-acceptance.sh
          actual_lockfile_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest())')"
          if [[ "$actual_lockfile_sha" != "$lockfile_sha" ]]; then
            echo "::error title=Cargo.lock changed::Distribution acceptance must preserve the checked-in lockfile."
            exit 1
          fi

      - name: Run historical release binary smoke
        if: steps.release-profile.outputs.profile == 'legacy-default'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          test -f "$binary"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --- MCP Registry bundle (all platforms) ---

      - name: Package MCPB
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          bundle="tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.mcpb"
          python3 .release-automation/scripts/build-mcpb.py build \
            --binary "$binary" \
            --output "$bundle" \
            --version "${{ steps.version.outputs.version }}" \
            --platform "${{ matrix.name }}"
          test -s "$bundle"

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v6
        with:
          name: mcpb-beta-${{ matrix.name }}
          path: tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.mcpb
          if-no-files-found: error

      # --- Binary archive (all platforms) ---

      - name: Package binary (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf ../../../tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.tar.gz tracedecay
          cd ../../..

      - name: Verify binary archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          archive="tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.tar.gz"
          rm -rf verify-binary
          mkdir verify-binary
          tar xzf "$archive" -C verify-binary
          test -x verify-binary/tracedecay
          verify-binary/tracedecay --version
          verify-binary/tracedecay --help >/dev/null

      - name: Package binary (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/tracedecay.exe -DestinationPath tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.zip

      - name: Verify binary archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.zip"
          Remove-Item verify-binary -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $archive -DestinationPath verify-binary
          & "./verify-binary/tracedecay.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged binary failed --version" }
          & "./verify-binary/tracedecay.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaged binary failed --help" }

      - name: Upload binary archive
        uses: actions/upload-artifact@v6
        with:
          name: binary-beta-${{ matrix.name }}
          path: tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.${{ matrix.archive }}

      # --- Homebrew bottle (only for platforms with bottle_tag) ---

      - name: Package Homebrew bottle
        if: matrix.bottle_tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BOTTLE_TAG="${{ matrix.bottle_tag }}"
          mkdir -p tracedecay-beta/${VERSION}/bin
          cp target/${{ matrix.target }}/release/tracedecay tracedecay-beta/${VERSION}/bin/tracedecay
          chmod +x tracedecay-beta/${VERSION}/bin/tracedecay
          tar czf "tracedecay-beta-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz" tracedecay-beta/

      - name: Verify Homebrew bottle
        if: matrix.bottle_tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BOTTLE_TAG="${{ matrix.bottle_tag }}"
          archive="tracedecay-beta-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz"
          rm -rf verify-bottle
          mkdir verify-bottle
          tar xzf "$archive" -C verify-bottle
          binary="verify-bottle/tracedecay-beta/${VERSION}/bin/tracedecay"
          test -x "$binary"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Upload bottle artifact
        if: matrix.bottle_tag
        uses: actions/upload-artifact@v6
        with:
          name: bottle-beta-${{ matrix.bottle_tag }}
          path: "tracedecay-beta-*.bottle.tar.gz"

  package-workspace:
    name: Validate workspace packages
    if: vars.BETA_CHANNEL_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease)
    needs: dashboard-assets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Download dashboard artifact
        uses: actions/download-artifact@v7
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist

      - name: Validate downloaded dashboard bundle
        run: python3 .release-automation/scripts/check-dashboard-bundle.py dashboard/app-dist

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release source feature profile
        id: release-profile
        shell: bash
        run: |
          python3 .release-automation/scripts/resolve-release-source-profile.py \
            --source . \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify release Cargo install
        shell: bash
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/tracedecay-install"
          cargo install --path . --root "$install_root" ${{ steps.release-profile.outputs.cargo_args }} --locked
          "$install_root/bin/tracedecay" --version
          "$install_root/bin/tracedecay" --help >/dev/null

      - name: Generate publishable workspace packages
        # Keep the V2 crates in one dependency-ordered package batch until
        # release-plz publishes their first registry releases.
        run: cargo package --workspace --locked --allow-dirty --no-verify

      - name: Verify generated crate archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(target/package/*.crate)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do
            test -s "$archive"
            tar tzf "$archive" >/dev/null
          done

          metadata="$(cargo metadata --no-deps --locked --format-version 1)"
          while IFS= read -r expected; do
            test -s "target/package/${expected}"
          done < <(jq -r '.packages[] | "\(.name)-\(.version).crate"' <<<"$metadata")

          version="$(jq -r '.packages[] | select(.name == "tracedecay") | .version' <<<"$metadata")"
          root_archive="target/package/tracedecay-${version}.crate"
          test -s "$root_archive"
          tar tzf "$root_archive" > root-archive-contents.txt
          grep -q "/dashboard/app-dist/" root-archive-contents.txt
          package_root="${RUNNER_TEMP}/tracedecay-package"
          rm -rf "$package_root"
          mkdir -p "$package_root"
          tar xzf "$root_archive" -C "$package_root"
          python3 .release-automation/scripts/check-dashboard-bundle.py \
            "$package_root/tracedecay-${version}/dashboard/app-dist"

  publish-assets:
    name: Publish beta release assets
    if: |
      vars.BETA_CHANNEL_ENABLED == 'true' &&
      needs.build.result == 'success' &&
      needs.package-workspace.result == 'success'
    needs: [build, package-workspace]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Download binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: binary-beta-*
          path: binaries
          merge-multiple: true

      - name: Download MCPB artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: mcpb-beta-*
          path: mcpbs
          merge-multiple: true

      - name: Verify complete beta MCPB platform set
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          for platform in aarch64-macos x86_64-linux aarch64-linux x86_64-windows; do
            bundle="mcpbs/tracedecay-beta-${RELEASE_TAG}-${platform}.mcpb"
            test -s "$bundle"
            python3 .release-automation/scripts/build-mcpb.py verify \
              --bundle "$bundle" \
              --version "$VERSION" \
              --platform "$platform"
          done
          shopt -s nullglob
          bundles=(mcpbs/*.mcpb)
          test "${#bundles[@]}" -eq 4

      - name: Upload binaries and MCPBs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(binaries/tracedecay-beta-* mcpbs/*.mcpb)
          test "${#assets[@]}" -eq 8
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "${{ github.repository }}" --clobber

  update-homebrew:
    name: Update Homebrew tap (beta)
    if: vars.BETA_CHANNEL_ENABLED == 'true' && needs.build.result == 'success' && needs.package-workspace.result == 'success' && needs.publish-assets.result == 'success'
    needs: [build, package-workspace, publish-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source

      - name: Resolve release source feature profile
        id: release-profile
        shell: bash
        run: |
          python3 scripts/resolve-release-source-profile.py \
            --source release-source \
            --github-output "$GITHUB_OUTPUT"

      - name: Get version
        id: version
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download bottle artifacts
        uses: actions/download-artifact@v7
        with:
          path: bottles
          merge-multiple: true
          pattern: bottle-beta-*

      - name: Upload bottles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in bottles/tracedecay-beta-*.bottle.tar.gz; do
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done

      - name: Download source tarball
        run: |
          set -euo pipefail
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${RELEASE_TAG}.tar.gz" -o "source.tar.gz"

      - name: Compute SHA256 hashes
        id: hashes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_SHA=$(sha256sum source.tar.gz | awk '{print $1}')
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          for f in bottles/tracedecay-beta-*.bottle.tar.gz; do
            tag=$(basename "$f" | sed "s/tracedecay-beta-${VERSION}\.\(.*\)\.bottle\.tar\.gz/\1/")
            sha=$(sha256sum "$f" | awk '{print $1}')
            echo "${tag}_sha=${sha}" >> "$GITHUB_OUTPUT"
          done

      # NOTE: the Homebrew tap (ScriptedAlchemy/homebrew-tap) is an external
      # repo — any previous beta formula there must be removed
      # separately; this step only writes Formula/tracedecay-beta.rb.
      - name: Update formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_SHA="${{ steps.hashes.outputs.source_sha }}"
          ARM64_SONOMA_SHA="${{ steps.hashes.outputs.arm64_sonoma_sha }}"
          X86_64_LINUX_SHA="${{ steps.hashes.outputs.x86_64_linux_sha }}"

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/ScriptedAlchemy/homebrew-tap.git" tap

          cat > tap/Formula/tracedecay-beta.rb << EOF
          class TracedecayBeta < Formula
            desc "Code intelligence tool (beta channel)"
            homepage "https://github.com/ScriptedAlchemy/tracedecay"
            url "https://github.com/ScriptedAlchemy/tracedecay/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SOURCE_SHA}"
            license "MIT"

            bottle do
              root_url "https://github.com/ScriptedAlchemy/tracedecay/releases/download/v${VERSION}"
              sha256 cellar: :any_skip_relocation, arm64_sonoma: "${ARM64_SONOMA_SHA}"
              sha256 cellar: :any_skip_relocation, x86_64_linux: "${X86_64_LINUX_SHA}"
            end

            depends_on "node" => :build
            depends_on "rust" => :build

            conflicts_with "tracedecay", because: "both install a 'tracedecay' binary"

            def install
              feature_args = "${{ steps.release-profile.outputs.cargo_args }}".split
              system "cargo", "install", *std_cargo_args, *feature_args, "--locked"
            end

            test do
              system "#{bin}/tracedecay", "--help"
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tracedecay-beta.rb
          git diff --cached --quiet || git commit -m "tracedecay-beta ${VERSION}"
          git push

  update-scoop:
    name: Update Scoop bucket (beta)
    if: vars.BETA_CHANNEL_ENABLED == 'true' && needs.build.result == 'success' && needs.package-workspace.result == 'success' && needs.publish-assets.result == 'success'
    needs: [build, package-workspace, publish-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "tracedecay-beta-${RELEASE_TAG}-x86_64-windows.zip" \
            --dir .
          SHA256=$(sha256sum "tracedecay-beta-${RELEASE_TAG}-x86_64-windows.zip" | cut -d' ' -f1)
          echo "sha256_win64=${SHA256}" >> "$GITHUB_OUTPUT"

      # NOTE: the Scoop bucket (ScriptedAlchemy/scoop-bucket) is an external
      # repo — any previous beta bucket manifest there must be removed
      # separately; this step only writes bucket/tracedecay-beta.json.
      - name: Update Scoop manifest
        env:
          SCOOP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          SHA256="${{ steps.release.outputs.sha256_win64 }}"

          cat > tracedecay-beta.json << EOF
          {
            "version": "${VERSION}",
            "description": "Code intelligence tool (beta channel)",
            "homepage": "https://github.com/ScriptedAlchemy/tracedecay",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "https://github.com/ScriptedAlchemy/tracedecay/releases/download/${TAG}/tracedecay-beta-${TAG}-x86_64-windows.zip",
                "hash": "${SHA256}"
              }
            },
            "bin": "tracedecay.exe",
            "pre_uninstall": "if (\$cmd -in @('update', 'uninstall')) { \$state = Join-Path \$env:LOCALAPPDATA 'TraceDecay/service/tracedecay-beta/scoop-state.json'; & (Join-Path \$dir 'tracedecay.exe') package-hook scoop prepare --package-id tracedecay-beta --state-file \$state; if (\$LASTEXITCODE -ne 0) { throw 'TraceDecay beta service prepare failed' } }",
            "post_install": "if (\$cmd -eq 'update') { \$state = Join-Path \$env:LOCALAPPDATA 'TraceDecay/service/tracedecay-beta/scoop-state.json'; & (Join-Path \$dir 'tracedecay.exe') package-hook scoop restore --package-id tracedecay-beta --state-file \$state; if (\$LASTEXITCODE -ne 0) { throw 'TraceDecay beta service restore failed' } }",
            "post_uninstall": "if (\$cmd -eq 'uninstall') { \$state = Join-Path \$env:LOCALAPPDATA 'TraceDecay/service/tracedecay-beta/scoop-state.json'; Remove-Item -LiteralPath \$state -Force -ErrorAction SilentlyContinue }",
            "checkver": {
              "github": "https://github.com/ScriptedAlchemy/tracedecay",
              "regex": "v([0-9.]+-beta[0-9.]*)"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/ScriptedAlchemy/tracedecay/releases/download/v\$version/tracedecay-beta-v\$version-x86_64-windows.zip"
                }
              }
            }
          }
          EOF

          git clone "https://x-access-token:${SCOOP_GITHUB_TOKEN}@github.com/ScriptedAlchemy/scoop-bucket.git" scoop-repo
          cd scoop-repo
          mkdir -p bucket
          cp ../tracedecay-beta.json bucket/tracedecay-beta.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/tracedecay-beta.json
          git diff --cached --quiet || git commit -m "tracedecay-beta ${VERSION}"
          git push
