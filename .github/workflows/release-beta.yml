name: Release (Beta)

# Dispatched on `master` by release-please after it creates the immutable
# tag. GitHub Actions caches are scoped by the workflow run ref: a run on a
# unique tag cannot restore the previous tag's cache, while master can reuse
# the same target/profile dependency cache across releases.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Prerelease tag to build or recover
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag }}

concurrency:
  group: release-beta-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'ScriptedAlchemy/tracedecay' &&
      vars.BETA_CHANNEL_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_epoch: ${{ steps.source.outputs.source_epoch }}
      matrix: ${{ steps.source.outputs.matrix }}
      build_required: ${{ steps.source.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'true\tfalse'

      - name: Resolve immutable prerelease source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_epoch="$(git show -s --format=%ct "$source_sha")"
          version="$(tr -d '[:space:]' < version.txt)"
          test -n "$version"
          test "$version" != "null"
          [[ "$version" == *-* ]]
          test "$RELEASE_TAG" = "v${version}"
          test "$GITHUB_REF" = "refs/heads/master"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$source_sha"
          # Recovery may run after master has moved, but a release tag must
          # remain on master's history.
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "source_epoch=${source_epoch}" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          python3 scripts/plan-release-recovery.py \
            --manifest .github/release-targets.json \
            --tag "$RELEASE_TAG" \
            --profile beta \
            --asset-names remote-asset-names \
            --retained-output retained-asset-names \
            --github-output "$GITHUB_OUTPUT"
          mkdir retained-assets
          scripts/verify-retained-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-beta.yml" \
            --source-digest "$source_sha" \
            --signer-ref "refs/tags/${RELEASE_TAG}" \
            --signer-ref "refs/heads/master" \
            --asset-names retained-asset-names \
            --download-dir retained-assets

  build:
    needs: validate
    if: needs.validate.outputs.build_required == 'true'
    name: Build ${{ matrix.name }}
    # Gold crashes in its Cortex-A53 erratum fixup during the ARM CLI link.
    # The workflow setting also recovers immutable release sources.
    env:
      BAZEL_LINKOPTS: ${{ matrix.name == 'aarch64-linux' && '-fuse-ld=bfd' || '' }}
    runs-on: ${{ matrix.runner }}
    # Windows 81 min, macOS 54 min on recent betas. 180 is ~2x the Windows max.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      # Composite actions come from the tag's checkout, so recovering an older
      # tag needs this here too; see .github/actions/setup-bazel.
      - name: Allow long git paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --system core.longpaths true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      # Bazel builds the dashboard bundle the binary embeds (//dashboard:app_dist).
      - name: Build release binary for packaging
        id: cli
        uses: ./.github/actions/build-cli
        with:
          config: dist
          dest: target/${{ matrix.target }}/release
          cache-key: release-${{ matrix.target }}

      # Packaging orchestration comes from this immutable workflow revision,
      # so recovery also works for tags predating the shared helper. The CLI
      # and its packager inputs still come from the validated release source.
      - name: Checkout release packaging helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-automation
          persist-credentials: false
          sparse-checkout: .github/actions/package-release

      - name: Package and verify native archive and MCPB
        uses: ./.release-automation/.github/actions/package-release
        with:
          binary: ${{ steps.cli.outputs.path }}
          tag: ${{ env.RELEASE_TAG }}
          asset-prefix: tracedecay-beta-${{ env.RELEASE_TAG }}
          platform: ${{ matrix.name }}
          archive: ${{ matrix.archive }}
          epoch: ${{ needs.validate.outputs.source_epoch }}

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb-beta-${{ matrix.name }}
          path: tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.mcpb
          if-no-files-found: error

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-${{ matrix.name }}
          path: tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: [validate, build]
    # Publish only a whole release. beta.86 shipped without macOS because a
    # failed target still published the rest (#3756), and `tracedecay upgrade`
    # then told Mac users the previous beta was current. Re-dispatching the tag
    # rebuilds only the targets the release lacks. `skipped` means every
    # asset is already published.
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.build_required == 'true'
        with:
          pattern: beta-*
          path: new-binaries
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.build_required == 'true'
        with:
          pattern: mcpb-beta-*
          path: new-mcpbs
          merge-multiple: true

      # Use the helpers from the running workflow revision for older-tag recovery.
      - name: Checkout release recovery helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-automation
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/assemble-release-artifacts.sh
            scripts/update-release-checksums.py

      - name: Assemble retained and newly built prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TAG: ${{ env.RELEASE_TAG }}
          BUILD_REQUIRED: ${{ needs.validate.outputs.build_required }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'true\tfalse'
          bash .release-automation/scripts/assemble-release-artifacts.sh \
            "$TAG" "$SOURCE_SHA" "${{ github.repository }}" beta \
            "${{ github.repository }}/.github/workflows/release-beta.yml" "$BUILD_REQUIRED"

      - name: Count newly built artifacts
        id: built
        run: |
          shopt -s nullglob
          archives=(new-binaries/tracedecay-beta-*)
          bundles=(new-mcpbs/*.mcpb)
          echo "archives=${#archives[@]}" >>"$GITHUB_OUTPUT"
          echo "bundles=${#bundles[@]}" >>"$GITHUB_OUTPUT"

      - name: Attest newly built prerelease archives
        if: steps.built.outputs.archives != '0'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: new-binaries/tracedecay-beta-*

      - name: Attest newly built prerelease MCPBs
        if: steps.built.outputs.bundles != '0'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: new-mcpbs/*.mcpb

      - name: Upload missing prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (
            cd binaries
            sha256sum tracedecay-beta-* > ../SHA256SUMS
          )
          (
            cd mcpbs
            sha256sum -- *.mcpb
          ) >> SHA256SUMS
          mapfile -t archives < <(find binaries -maxdepth 1 -type f -name 'tracedecay-beta-*' -print | sort)
          test "${#archives[@]}" -gt 0
          mapfile -t bundles < <(find mcpbs -maxdepth 1 -type f -name '*.mcpb' -print | sort)
          test "${#bundles[@]}" -gt 0
          # `install.sh` ships with the prerelease as it does with a stable
          # release. README tells users to curl the installer from a release,
          # and only release.yml published one, so the hardened script on
          # master reached nobody following the beta line. The checkout is
          # pinned to the tag's source sha, so this is that tag's installer.
          release_assets=("${archives[@]}" "${bundles[@]}" SHA256SUMS install.sh)
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          for release_asset in "${release_assets[@]}"; do
            name="$(basename "$release_asset")"
            if grep -Fxq "$name" remote-asset-names; then
              if [[ "$name" == "SHA256SUMS" ]]; then
                python3 .release-automation/scripts/update-release-checksums.py \
                  --tag "$RELEASE_TAG" --repo "${{ github.repository }}" --checksums "$release_asset"
              fi
            else
              gh release upload "$RELEASE_TAG" "$release_asset" \
                --repo "${{ github.repository }}"
            fi
          done
          # Verify by name, not by glob: a partial publish may have no .zip
          # (Windows) or no .tar.gz yet, and `gh release download --pattern`
          # fails on an empty match.
          mkdir verified-binaries verified-mcpbs
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          while IFS= read -r name; do
            case "$name" in
              tracedecay-beta-"${RELEASE_TAG}"-*.mcpb)
                gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
                  --pattern "$name" --dir verified-mcpbs ;;
              tracedecay-beta-"${RELEASE_TAG}"-*.tar.gz | tracedecay-beta-"${RELEASE_TAG}"-*.zip)
                gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
                  --pattern "$name" --dir verified-binaries ;;
            esac
          done < remote-asset-names
          python3 scripts/check-release-artifacts.py \
            --manifest .github/release-targets.json \
            --profile beta \
            --tag "$RELEASE_TAG" \
            --binaries verified-binaries \
            --mcpbs verified-mcpbs
          scripts/verify-retained-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-beta.yml" \
            --source-digest "${{ needs.validate.outputs.source_sha }}" \
            --signer-ref "refs/tags/${RELEASE_TAG}" \
            --signer-ref "refs/heads/master" \
            --files verified-binaries/* verified-mcpbs/*
