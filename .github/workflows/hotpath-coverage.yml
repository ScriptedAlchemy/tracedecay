# Runtime coverage for the production Hotpath probes exercised by focused
# storage, session, LCM, capture, and temporal-query journeys.
#
# Two lanes, same test set:
#   1. feature off  — every `#[hotpath::measure]` macro must stay a no-op;
#   2. `--features hotpath` — the `hotpath_coverage` tests wrap a real
#      workload in a HotpathGuard and assert the JSON report carries the
#      crates' exact existing measure labels.
#
# Cargo's resolved feature graph proves that the default package graphs keep
# collection disabled. No manifest source parsing or fixed-port ownership
# assertion stands in for that contract.
name: hotpath-coverage

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: hotpath-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HOTPATH_METRICS_SERVER_OFF: "1"
  HOTPATH_COVERAGE_PACKAGES: >-
    tracedecay-rusqlite-runtime
    tracedecay-global-db
    tracedecay-sessions
    tracedecay-session-memory
    tracedecay-session-runtime
    tracedecay-session-temporal-store
    tracedecay-lcm
    tracedecay-capture
    tracedecay-temporal-query

jobs:
  slice-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: kache compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/kache
            ~/.cache/kache
          key: kache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: kache-${{ runner.os }}-
      - name: Enable kache
        shell: bash
        run: |
          command -v kache >/dev/null 2>&1 || cargo install kache --locked
          kache init --no-service
          echo "RUSTC_WRAPPER=kache" >> "$GITHUB_ENV"

      - name: Default package graphs exclude Hotpath collection
        shell: bash
        run: |
          read -ra packages <<< "$HOTPATH_COVERAGE_PACKAGES"
          for package in "${packages[@]}"; do
            graph="$(
              cargo tree -p "$package" -e features -f '{p} {f}' \
                --prefix none --locked | sort -u
            )"
            printf '%s\n' "$graph" | grep '^hotpath v'
            if grep -Eq '^hotpath v[^ ]+ .*hotpath' <<< "$graph"; then
              echo "::error::$package default graph enables Hotpath collection"
              exit 1
            fi
          done

      # `test-helpers` only unlocks the registered-store fixture used by the
      # global-db journey; it gates no production code.
      - name: Runtime journeys (hotpath off)
        shell: bash
        run: |
          read -ra packages <<< "$HOTPATH_COVERAGE_PACKAGES"
          package_args=()
          for package in "${packages[@]}"; do
            package_args+=(-p "$package")
          done
          cargo test --locked "${package_args[@]}" \
            --features tracedecay-global-db/test-helpers \
            --test hotpath_coverage -- --test-threads=1

      - name: Runtime journeys (hotpath on)
        shell: bash
        run: |
          read -ra packages <<< "$HOTPATH_COVERAGE_PACKAGES"
          package_args=()
          feature_names=(tracedecay-global-db/test-helpers)
          for package in "${packages[@]}"; do
            package_args+=(-p "$package")
            feature_names+=("$package/hotpath")
          done
          features="$(IFS=,; echo "${feature_names[*]}")"
          cargo test --locked "${package_args[@]}" --features "$features" \
            --test hotpath_coverage -- --test-threads=1
