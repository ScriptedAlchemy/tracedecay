name: Release-plz

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRACEDECAY_SKIP_DASHBOARD_BUILD: "1"

# Publishing mutates crates.io and GitHub release state. Serialize master
# updates, but never cancel a publication after it has started.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dashboard-assets:
    name: Build dashboard artifact
    if: github.repository == 'ScriptedAlchemy/tracedecay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Validate dashboard bundle
        run: python3 scripts/check-dashboard-bundle.py dashboard/app-dist

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist
          if-no-files-found: error
          include-hidden-files: true

  release-plz-release:
    name: Publish crate and create GitHub release
    if: github.repository == 'ScriptedAlchemy/tracedecay'
    needs: dashboard-assets
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist

      - name: Validate downloaded dashboard bundle
        run: python3 scripts/check-dashboard-bundle.py dashboard/app-dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-linux-mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-plz-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-plz-release-
            ${{ runner.os }}-cargo-

      - name: Validate root crate package inputs
        run: |
          set -euo pipefail
          cargo package --package tracedecay --locked --allow-dirty --list \
            > root-package-files.txt
          grep -Fxq "build-support/dashboard_cache.rs" root-package-files.txt
          grep -Eq "^dashboard/app-dist/.+" root-package-files.txt

      - name: Run release-plz release
        id: release
        uses: release-plz/action@v0.5
        continue-on-error: true
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Retry release-plz release after transient GitHub API failure
        id: release_retry
        if: steps.release.outcome == 'failure'
        uses: release-plz/action@v0.5
        continue-on-error: true
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Fail when release-plz release still fails
        if: steps.release.outcome == 'failure' && steps.release_retry.outcome == 'failure'
        run: exit 1

      - name: Check release version drift
        if: always()
        run: scripts/check-release-drift.sh

  release-plz-pr:
    name: Open or update release PR
    if: github.repository == 'ScriptedAlchemy/tracedecay'
    needs: [dashboard-assets, release-plz-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist

      - name: Validate downloaded dashboard bundle
        run: python3 scripts/check-dashboard-bundle.py dashboard/app-dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-linux-mold

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-plz-pr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-plz-pr-
            ${{ runner.os }}-cargo-

      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
