name: Release-plz

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRACEDECAY_SKIP_DASHBOARD_BUILD: "1"

# Publishing mutates crates.io and GitHub release state. Serialize master
# updates, but never cancel a publication after it has started.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dashboard-assets:
    name: Build dashboard artifact
    if: github.repository == 'ScriptedAlchemy/tracedecay' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Validate dashboard bundle
        run: python3 scripts/check-dashboard-bundle.py dashboard/app-dist

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist
          if-no-files-found: error
          include-hidden-files: true

  release-plz-release:
    name: Publish crate and create GitHub release
    if: github.repository == 'ScriptedAlchemy/tracedecay' && github.ref == 'refs/heads/master'
    needs: dashboard-assets
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download dashboard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist

      - name: Validate downloaded dashboard bundle
        run: python3 scripts/check-dashboard-bundle.py dashboard/app-dist

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: ./.github/actions/setup-linux-mold

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-plz-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-plz-release-
            ${{ runner.os }}-cargo-

      - name: Validate root crate package inputs
        run: |
          set -euo pipefail
          cargo package --package tracedecay --locked --allow-dirty --list \
            > root-package-files.txt
          grep -Fxq "build-support/dashboard_cache.rs" root-package-files.txt
          grep -Eq "^dashboard/app-dist/.+" root-package-files.txt

      - name: Run release-plz release
        id: release
        uses: release-plz/action@d89ddd5260792f5ebff817008db8f222bbdd61b4 # v0.5.115
        continue-on-error: true
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Retry release-plz release after transient GitHub API failure
        id: release_retry
        if: steps.release.outcome == 'failure'
        uses: release-plz/action@d89ddd5260792f5ebff817008db8f222bbdd61b4 # v0.5.115
        continue-on-error: true
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Fail when release-plz release still fails
        if: steps.release.outcome == 'failure' && steps.release_retry.outcome == 'failure'
        run: exit 1

      - name: Check release version drift
        if: always()
        run: scripts/check-release-drift.sh

  release-plz-pr:
    name: Open or update release PR
    if: github.repository == 'ScriptedAlchemy/tracedecay' && github.ref == 'refs/heads/master'
    needs: [dashboard-assets, release-plz-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download dashboard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-app-dist
          path: dashboard/app-dist

      - name: Validate downloaded dashboard bundle
        run: python3 scripts/check-dashboard-bundle.py dashboard/app-dist

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: ./.github/actions/setup-linux-mold

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-plz-pr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-plz-pr-
            ${{ runner.os }}-cargo-

      - name: Run release-plz release-pr
        uses: release-plz/action@d89ddd5260792f5ebff817008db8f222bbdd61b4 # v0.5.115
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
