name: SDK conformance

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/release-targets.json"
      - "crates/tracedecay-api/**"
      - "crates/tracedecay-contracts/**"
      - "crates/tracedecay-daemon-service/**"
      - "crates/tracedecay-domain/**"
      - "crates/tracedecay-sdk/**"
      - "crates/tracedecay-tool-catalog/**"
      - "dashboard/codegen/**"
      - "dashboard/package.json"
      - "sdks/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-sdk-publish-workflow.py"
      - "scripts/test-check-sdk-publish-workflow.py"
      - "scripts/check-github-hosted-runners.py"
      - "scripts/test-check-github-hosted-runners.py"
      - "scripts/package-release-archive.py"
      - "scripts/test-package-release-archive.py"
      - "scripts/plan-release-recovery.py"
      - "scripts/test-plan-release-recovery.py"
      - "tests/release_safety_test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python3 -m pip install pyyaml==6.0.2
      - name: Check npm publication authority
        run: |
          python3 scripts/test-check-sdk-publish-workflow.py
          python3 scripts/check-sdk-publish-workflow.py
      - name: Check GitHub-hosted runner authority
        run: |
          python3 scripts/test-check-github-hosted-runners.py
          python3 scripts/check-github-hosted-runners.py
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          expected="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          tar xzf "$archive" actionlint
      - name: actionlint
        run: >-
          ./actionlint
          .github/workflows/sdk-conformance.yml
          .github/workflows/release.yml
          .github/workflows/release-beta.yml
          .github/workflows/release-please.yml
          .github/workflows/release-pr-integrity.yml
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: ./.github/actions/setup-pnpm
      # Cargo reads .cargo/config.toml from the working directory, and the
      # codegen workspace has its own pnpm-vendored sources and lockfile.
      - run: cargo test
        working-directory: sdks/codegen
      - run: pnpm run contracts:check
        working-directory: dashboard
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: bazel test --config=ci //crates/tracedecay-sdk/...
      - run: pnpm run typecheck
        working-directory: sdks/typescript
      - run: pnpm test
        working-directory: sdks/typescript

  production-router:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: ./.github/actions/setup-pnpm
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # This job owns every sdk_suite test that needs the production daemon,
      # which Bazel hands the suite as TRACEDECAY_TEST_BIN. Including the
      # ignored tests is what keeps a daemon-backed test from silently never
      # executing anywhere.
      - run: >-
          bazel test --config=ci //crates/tracedecay-sdk:sdk_suite
          --test_arg=--include-ignored
      - name: Point the installed-package journey at the same daemon
        run: |
          set -euo pipefail
          built="$(bazel cquery --config=ci --output=files //crates/tracedecay-cli:tracedecay 2>/dev/null)"
          echo "TRACEDECAY_TEST_BIN=${GITHUB_WORKSPACE}/${built}" >> "$GITHUB_ENV"
      - run: pnpm run test:installed
        working-directory: sdks/typescript
