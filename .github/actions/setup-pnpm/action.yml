name: Install the pnpm workspace
description: >
  Installs the pnpm version pinned by `packageManager` in package.json,
  restores the pnpm store, and runs `pnpm install --frozen-lockfile`. The
  install provides the npm packages and the Cargo sources that the committed
  `.cargo/config.toml` points at, so every job that runs cargo or a workspace
  script needs this action first.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
        cache_dependency_path: |
          pnpm-lock.yaml
          Cargo.lock
          sdks/codegen/Cargo.lock
    - name: Install npm packages and Cargo sources
      shell: bash
      run: pnpm install --frozen-lockfile
