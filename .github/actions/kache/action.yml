name: Enable kache
description: >-
  Install kache as RUSTC_WRAPPER and restore this lane's compiler store from
  the Actions cache. The job must end with a `Save kache store` step
  (`actions/cache/save`, `if: always()`) fed by the `store-path` and
  `cache-key` outputs, so a failed or timed-out suite still publishes every
  crate it compiled.

# Why this wraps kache-action instead of using its own GitHub cache backend:
# that backend keys the store on the lockfile hash and treats "cache already
# exists" as up to date, so after the first save per lockfile the store never
# changes again and every workspace-crate edit misses until Cargo.lock moves.
# The store here is keyed per run and restored from the newest entry of the
# same lane, so each run publishes what it compiled. rust-cache still carries
# dependency artifacts; cargo never invokes rustc for those, so the kache
# store holds the workspace crates rust-cache deliberately leaves out.
inputs:
  lane:
    description: >-
      Store name. One store per job shape: jobs with different cargo
      profiles or feature sets can never hit each other's artifacts.
    required: true
  max-size:
    description: >-
      LRU ceiling for the local store (kache's KACHE_MAX_SIZE). It must hold
      one build's whole output: kache evicts oldest-first, so a store smaller
      than the build keeps the last-compiled tail — the root crates a push
      changes — and restores nothing useful. The perf-profile test lanes
      (15.7–17.8 GB per build) and the dev CLI build (4.3 GB) were dropped
      for that reason; kache's memory-weighted permit scheduler also
      serialized their builds (macOS test lane: 2.6 h of compile, 5.0 h of
      permit wait, run 34168826002). Clippy's check-only build writes
      1.2 GB, at the 1 GiB ceiling's 10% GC slack.
    required: true

outputs:
  store-path:
    description: Directory to pass to actions/cache/save.
    value: ${{ steps.identity.outputs.store }}
  cache-key:
    description: Run-unique key to pass to actions/cache/save.
    value: ${{ steps.identity.outputs.key }}

runs:
  using: composite
  steps:
    # kache's key computation can change between releases, so the pinned
    # version is part of the cache key: an upgrade starts a fresh lineage
    # instead of restoring a store the new binary cannot hit.
    - name: Resolve store identity
      id: identity
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        KACHE_VERSION: v0.18.0
      run: |
        set -euo pipefail
        {
          echo "version=$KACHE_VERSION"
          echo "store=$RUNNER_TEMP/kache"
          echo "key=kache-store-$LANE-$RUNNER_OS-$KACHE_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "restore=kache-store-$LANE-$RUNNER_OS-$KACHE_VERSION-"
        } >> "$GITHUB_OUTPUT"

    - name: Restore kache store
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.identity.outputs.store }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.restore }}

    - name: Install kache
      uses: kunobi-ninja/kache-action@v1
      with:
        version: ${{ steps.identity.outputs.version }}
        github-cache: "false"
        cache-dir: ${{ steps.identity.outputs.store }}
        max-size: ${{ inputs.max-size }}
        pr-comment: "false"

    # kache's permit scheduler paces compiles machine-wide by measured peak
    # RSS (`ceil(rss / 512 MiB)` slots of `available_parallelism()`), which on
    # a 3–4 core hosted runner lets one large unit own the whole pool: the
    # perf-profile test lanes compiled one crate at a time (macOS run
    # 34168826002: 2.6 h of compile work behind 5.0 h of permit waits). Cargo
    # already bounds concurrency with its own jobserver, so the scheduler is
    # turned off here and the wrapper stays a cache.
    - name: Leave compile pacing to cargo
      shell: bash
      run: echo "KACHE_SCHEDULER=0" >> "$GITHUB_ENV"
