name: Clean abandoned Windows test children
description: >-
  Stop abandoned tracedecay.exe processes launched from this workspace and
  service-E2E task children scoped to this run's temporary profile root.

runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
        $runnerTemp = (Resolve-Path $env:RUNNER_TEMP).Path
        $serviceE2EProfilePrefix = Join-Path $runnerTemp "tracedecay-service-e2e-"
        $all = Get-CimInstance Win32_Process
        $liveProcessIds = [System.Collections.Generic.HashSet[uint32]]::new()
        foreach ($process in $all) {
          [void]$liveProcessIds.Add([uint32]$process.ProcessId)
        }
        $stale = foreach ($process in $all) {
          if ($process.Name -ne "tracedecay.exe") {
            continue
          }
          if (-not $process.CommandLine) {
            continue
          }
          $inCurrentWorkspace = $process.CommandLine.IndexOf($workspace, [StringComparison]::OrdinalIgnoreCase) -ge 0
          $inServiceE2EProfile = $process.CommandLine.IndexOf($serviceE2EProfilePrefix, [StringComparison]::OrdinalIgnoreCase) -ge 0
          $orphanedWorkspaceChild = $inCurrentWorkspace -and -not $liveProcessIds.Contains([uint32]$process.ParentProcessId)
          # Task Scheduler owns native-service children, so their parent stays
          # alive after the E2E PowerShell process exits. The unique profile
          # prefix is the per-run ownership boundary for those task children.
          if ($orphanedWorkspaceChild -or $inServiceE2EProfile) {
            $process
          }
        }
        foreach ($process in $stale) {
          Write-Host "Stopping abandoned tracedecay child pid=$($process.ProcessId) command=$($process.CommandLine)"
          Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
        }
