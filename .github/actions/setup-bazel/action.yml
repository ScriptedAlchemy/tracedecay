name: Set up Bazel
description: >
  Installs Bazel through the pinned bazelisk, refreshes its dependency cache, and
  restores a disk cache for hosted-only execution named by `cache-key`. Only master saves
  automatically: PRs
  restore master's entry; explicit native Windows dispatches may also prime
  their branch's cache. Jobs with the same configuration and
  runner image share a restore prefix; master callers save fresh
  action outputs after the build, including failed tests. Test runtimes are
  declared Bazel inputs.

inputs:
  cache-key:
    description: Disk-cache name; jobs with the same runner image and flags share it.
    required: true
  extra-restore-keys:
    description: >
      Comma-separated extra disk-cache names restored after this job's own
      prefix misses. Use when two jobs share rustc flags and runner image so
      Clippy can reuse Test Linux action outputs.
    default: ""
  remote-download-outputs:
    description: Remote outputs to materialize; packaging jobs require toplevel.
    default: "minimal"
  cache-save:
    description: Whether master jobs may save Bazelisk and newly fetched dependencies.
    default: "true"
  windows-redirect-temp:
    description: Put Windows test temporary files on the runner workspace drive.
    default: "false"
  tailscale-client-id:
    description: OIDC client for trusted Linux/macOS/Windows CI; empty keeps the hosted-only build.
    default: ""

outputs:
  fleet-enabled:
    description: Whether Tailscale enrollment and executor connectivity enabled the fleet.
    value: ${{ steps.fleet.outputs.enabled }}
  disk-cache-path:
    description: Action-cache directory to save after the caller's build.
    value: ${{ steps.disk-cache-config.outputs.path }}
  disk-cache-key:
    description: Run-specific save key returned by the cache restore action.
    value: ${{ steps.disk-cache.outputs.cache-primary-key }}

  repository-cache-path:
    description: Checksum-addressed dependency cache to publish after the build.
    value: ${{ steps.disk-cache-config.outputs.repository-path }}
  repository-cache-key:
    description: Fresh save key; empty when this job cannot publish dependencies.
    value: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && inputs.cache-save == 'true' && steps.repository-cache.outputs.cache-primary-key || '' }}
  repository-cache-entries:
    description: Restored entry count, used to avoid uploading an unchanged cache.
    value: ${{ steps.repository-cache-state.outputs.entries }}

runs:
  using: composite
  steps:
    - name: Free runner disk space
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        df -h /
        status=0
        sudo rm -rf /usr/local/lib/android &
        p1=$!
        sudo rm -rf /usr/share/dotnet &
        p2=$!
        sudo rm -rf /opt/ghc &
        p3=$!
        sudo rm -rf /opt/hostedtoolcache/CodeQL &
        p4=$!
        for pid in "$p1" "$p2" "$p3" "$p4"; do
          wait "$pid" || status=1
        done
        df -h /
        exit "$status"

    - name: Remove inactive Xcode installations
      if: runner.os == 'macOS' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        df -h /
        python3 - <<'PYTHON'
        import pathlib
        import subprocess

        applications = pathlib.Path("/Applications")
        selected = pathlib.Path(subprocess.check_output(["xcode-select", "-p"], text=True).strip()).resolve(strict=True)
        active = next((path for path in selected.parents if path.suffix == ".app"), None)
        if active is None:
            raise SystemExit(f"Selected developer directory is not an Xcode application: {selected}")
        print(f"Selected Xcode before cleanup: {active}", flush=True)
        inactive = [path for path in applications.glob("Xcode*.app") if path.resolve() != active]
        for path in inactive:
            print(f"Removing inactive Xcode: {path}", flush=True)
            subprocess.run(["sudo", "rm", "-rf", "--", str(path)], check=True)
        after = pathlib.Path(subprocess.check_output(["xcode-select", "-p"], text=True).strip()).resolve(strict=True)
        if after != selected:
            raise SystemExit(f"Selected developer directory changed: {selected} -> {after}")
        print(f"Selected Xcode after cleanup: {active}", flush=True)
        PYTHON
        df -h /

    - name: Verify Windows build runner configuration
      if: runner.os == 'Windows' && runner.environment == 'github-hosted'
      shell: pwsh
      env:
        REDIRECT_TEMP: ${{ inputs.windows-redirect-temp }}
      run: '& "$env:GITHUB_ACTION_PATH/tune_windows.ps1" -RedirectTemp:($env:REDIRECT_TEMP -eq "true")'

    # crate_universe's cargo checks out git dependencies under D:/b; asupersync
    # carries paths past MAX_PATH there, which libgit2 refuses without this.
    - name: Allow long git paths
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.longpaths true
        git config --system core.longpaths true

    # Fleet credentials are for disposable GitHub-hosted runners. A persistent
    # or self-hosted machine must never exchange this repository's OIDC token
    # for a Tailscale node, because the node would outlive the job and the
    # machine would keep the identity.
    - name: Require a disposable runner for fleet enrollment
      if: inputs.tailscale-client-id != ''
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_ENVIRONMENT" != github-hosted ]]; then
          echo "::error::Tailscale OIDC enrollment is restricted to GitHub-hosted runners."
          exit 1
        fi

    # Cache versions include the literal path. Keep setup-bazel's existing
    # directory and key prefix to restore previously compiled outputs.
    - name: Resolve Bazel cache locations
      id: disk-cache-config
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.cache-key }}
        EXTRA_RESTORE_KEYS: ${{ inputs.extra-restore-keys }}
      run: |
        node <<'JS'
        const fs = require('node:fs');
        const os = require('node:os');
        const windowsRoot = process.platform === 'win32'
          ? require('node:path').win32.parse(process.env.GITHUB_WORKSPACE).root.replace(/\\/g, '/')
          : '';
        const path = process.platform === 'win32'
          ? `${windowsRoot}b-disk`
          : `${os.homedir().replace(/\\/g, '/')}/.cache/bazel-disk`;
        const repositoryPath = windowsRoot
          ? `${windowsRoot}b-repo`
          : `${os.homedir().replace(/\\/g, '/')}/.cache/bazel-repo`;
        const repositoryPrefix = `setup-bazel-1-${process.platform}-${os.arch()}-repository-`;
        const names = [process.env.CACHE_NAME, ...(process.env.EXTRA_RESTORE_KEYS || '')
          .split(',')
          .map((name) => name.trim())
          .filter(Boolean)];
        const prefixes = names.map((name) =>
          `setup-bazel-1-${process.platform}-${os.arch()}-disk-${name}-`);
        fs.appendFileSync(
          process.env.GITHUB_OUTPUT,
          `repository-path=${repositoryPath}\nrepository-prefix=${repositoryPrefix}\npath=${path}\noutput-base=${windowsRoot ? `${windowsRoot}b` : ''}\nprefix=${prefixes[0]}\nrestore-keys<<EOF\n${prefixes.join('\n')}\nEOF\n`,
        );
        JS

    - name: Preserve the runner network environment for Tailscale
      if: runner.os == 'Linux' && inputs.tailscale-client-id != ''
      shell: bash
      run: |
        # Ubuntu's sudo-rs ignores -E. Tailscale's action uses sudo for both
        # the token exchange and daemon, which must retain any runner proxy
        # and CA settings. Keep only these variables, scoped to its binaries.
        network_env="HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR"
        for name in $network_env; do
          if [[ -v "$name" ]]; then
            echo "Preserving runner network variable: $name"
          fi
        done
        printf 'Defaults!/usr/local/bin/tailscale,/usr/local/bin/tailscaled env_keep += "%s"\n' "$network_env" |
          sudo tee /etc/sudoers.d/tailscale-ci-network >/dev/null
        sudo chmod 0440 /etc/sudoers.d/tailscale-ci-network
        sudo visudo -cf /etc/sudoers.d/tailscale-ci-network

    - name: Connect to the private Bazel fleet
      id: tailscale
      if: inputs.tailscale-client-id != ''
      # Private infrastructure is optional; compilation and test failures are not.
      continue-on-error: true
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: api.tailscale.com/${{ inputs.tailscale-client-id }}
        tags: tag:bazel-ci
        # Public dependency downloads keep the hosted runner's DNS resolver.
        args: --accept-dns=false
        ping: ubuntu-main

    - name: Select private executor or hosted execution
      id: fleet
      shell: bash
      env:
        TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
        REMOTE_DOWNLOAD_OUTPUTS: ${{ inputs.remote-download-outputs }}
      run: |
        if [[ "$TAILSCALE_OUTCOME" == success ]]; then
          # Resolve the peer through the local API without changing runner DNS.
          tailscale_cli=$(command -v tailscale || true)
          if [[ "$RUNNER_OS" == Windows ]]; then
            tailscale_cli="/c/Program Files/Tailscale/tailscale.exe"
          fi
          if coordinator=$("$tailscale_cli" ip -4 ubuntu-main); then
            export BAZEL_FLEET_HOST="$coordinator"
          else
            export TAILSCALE_OUTCOME=failure
          fi
        fi
        python3 "$GITHUB_ACTION_PATH/configure_fleet.py"

    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        repository-cache: false
        disk-cache: false
        bazelrc: |
          common --repository_cache=${{ steps.disk-cache-config.outputs.repository-path }}
          build --disk_cache=${{ steps.fleet.outputs.enabled != 'true' && steps.disk-cache-config.outputs.path || '' }}
        cache-save: ${{ github.ref == 'refs/heads/master' && inputs.cache-save == 'true' }}
        # Windows build-script runfiles nest each vendored crate's sources
        # under its repository name twice; keep the output base short.
        output-base: ${{ steps.disk-cache-config.outputs.output-base }}

    # Restore by manifest, then platform. Publishing uses a fresh key only
    # when the caller fetched new blobs, so a partial snapshot can grow.
    - name: Restore dependency cache
      id: repository-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.disk-cache-config.outputs.repository-path }}
        key: ${{ steps.disk-cache-config.outputs.repository-prefix }}${{ hashFiles('MODULE.bazel', 'Cargo.lock', 'pnpm-lock.yaml', '.bazelversion') }}-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.cache-key }}
        restore-keys: |
          ${{ steps.disk-cache-config.outputs.repository-prefix }}${{ hashFiles('MODULE.bazel', 'Cargo.lock', 'pnpm-lock.yaml', '.bazelversion') }}-
          ${{ steps.disk-cache-config.outputs.repository-prefix }}

    - name: Measure restored dependency cache
      id: repository-cache-state
      shell: bash
      env:
        CACHE_PATH: ${{ steps.disk-cache-config.outputs.repository-path }}
      run: |
        node <<'JS'
        const fs = require('node:fs');
        const path = process.env.CACHE_PATH;
        const entries = fs.existsSync(path) ? fs.readdirSync(path, { recursive: true }).length : 0;
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `entries=${entries}\n`);
        JS

    - name: Map the shared Windows compiler path
      if: steps.fleet.outputs.enabled == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'MSVC installation not found' }
        $vc = Join-Path $vs 'VC'
        $compiler = Join-Path $vc 'Tools\MSVC\14.44.35207\bin\Hostx64\x64\cl.exe'
        if (-not (Test-Path $compiler)) { throw 'Fleet requires MSVC 14.44.35207' }
        if (Test-Path 'V:\') {
          $mapping = @(& subst) | Where-Object { $_ -match '^V:\\: => ' }
          if (-not $mapping -or ($mapping -replace '^V:\\: => ', '') -ine $vs) {
            throw 'Fleet toolchain drive V: belongs to another path'
          }
        } else {
          subst V: $vs
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map the fleet compiler drive' }
        }
        (Get-Item $compiler).VersionInfo | Select-Object FileVersion, ProductVersion | Format-List

    - name: Prepare the Linux fleet toolchain cache
      if: steps.fleet.outputs.enabled == 'true' && runner.os == 'Linux'
      shell: bash
      run: mkdir -p /tmp/zig-cache

    # Bazel validates action contents itself. A fresh save key retains new
    # source-build outputs even when MODULE.bazel and BUILD files are unchanged.
    # Restore after enrollment so an offline private executor gets the same
    # hosted cache as a job without a fleet identity.
    - name: Restore master action cache
      id: disk-cache
      if: steps.fleet.outputs.enabled != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.disk-cache-config.outputs.path }}
        key: ${{ steps.disk-cache-config.outputs.prefix }}run-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        restore-keys: ${{ steps.disk-cache-config.outputs.restore-keys }}

    - name: Report available build storage
      continue-on-error: true
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/report_disk.sh"
