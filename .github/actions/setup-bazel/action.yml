name: Set up Bazel
description: >
  Installs Bazel through the pinned bazelisk with its repository cache, and a
  disk cache named by `cache-key` that only master saves automatically: PRs
  restore master's entry; explicit native Windows dispatches may also prime
  their branch's cache. Jobs with the same configuration and
  runner image share a restore prefix; master callers save fresh
  action outputs after the build, including failed tests. Test runtimes are
  declared Bazel inputs.

inputs:
  cache-key:
    description: Disk-cache name; jobs with the same runner image and flags share it.
    required: true
  extra-restore-keys:
    description: >
      Comma-separated extra disk-cache names restored after this job's own
      prefix misses. Use when two jobs share rustc flags and runner image so
      Clippy can reuse Test Linux action outputs.
    default: ""
  cache-save:
    description: Whether this setup may save Bazelisk and repository caches.
    default: "true"
  tailscale-client-id:
    description: OIDC client for trusted Linux/macOS/Windows CI; empty keeps the hosted-only build.
    default: ""

outputs:
  fleet-enabled:
    description: Whether Tailscale enrollment and executor connectivity enabled the fleet.
    value: ${{ steps.fleet.outputs.enabled }}
  disk-cache-path:
    description: Action-cache directory to save after the caller's build.
    value: ${{ steps.disk-cache-config.outputs.path }}
  disk-cache-key:
    description: Run-specific save key returned by the cache restore action.
    value: ${{ steps.disk-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # crate_universe's cargo checks out git dependencies under D:/b; asupersync
    # carries paths past MAX_PATH there, which libgit2 refuses without this.
    - name: Allow long git paths
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.longpaths true
        git config --system core.longpaths true

    # Cache versions include the literal path. Keep setup-bazel's existing
    # directory and key prefix to restore previously compiled outputs.
    - name: Resolve action cache location
      id: disk-cache-config
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.cache-key }}
        EXTRA_RESTORE_KEYS: ${{ inputs.extra-restore-keys }}
      run: |
        node <<'JS'
        const fs = require('node:fs');
        const os = require('node:os');
        const path = process.platform === 'win32'
          ? 'D:/b-disk'
          : `${os.homedir().replace(/\\/g, '/')}/.cache/bazel-disk`;
        const names = [process.env.CACHE_NAME, ...(process.env.EXTRA_RESTORE_KEYS || '')
          .split(',')
          .map((name) => name.trim())
          .filter(Boolean)];
        const prefixes = names.map((name) =>
          `setup-bazel-1-${process.platform}-${os.arch()}-disk-${name}-`);
        fs.appendFileSync(
          process.env.GITHUB_OUTPUT,
          `path=${path}\nprefix=${prefixes[0]}\nrestore-keys<<EOF\n${prefixes.join('\n')}\nEOF\n`,
        );
        JS

    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        repository-cache: true
        disk-cache: false
        bazelrc: >-
          build --disk_cache=${{ steps.disk-cache-config.outputs.path }}
        cache-save: ${{ github.ref == 'refs/heads/master' && inputs.cache-save == 'true' }}
        # Windows build-script runfiles nest each vendored crate's sources
        # under its repository name twice; a short output base (default
        # D:/_bazel) keeps MSVC's header paths under MAX_PATH.
        output-base: ${{ runner.os == 'Windows' && 'D:/b' || '' }}

    - name: Preserve the runner network environment for Tailscale
      if: runner.os == 'Linux' && inputs.tailscale-client-id != ''
      shell: bash
      run: |
        # Ubuntu's sudo-rs ignores -E. Tailscale's action uses sudo for both
        # the token exchange and daemon, which must retain any runner proxy
        # and CA settings. Keep only these variables, scoped to its binaries.
        network_env="HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR"
        for name in $network_env; do
          if [[ -v "$name" ]]; then
            echo "Preserving runner network variable: $name"
          fi
        done
        printf 'Defaults!/usr/local/bin/tailscale,/usr/local/bin/tailscaled env_keep += "%s"\n' "$network_env" |
          sudo tee /etc/sudoers.d/tailscale-ci-network >/dev/null
        sudo chmod 0440 /etc/sudoers.d/tailscale-ci-network
        sudo visudo -cf /etc/sudoers.d/tailscale-ci-network

    - name: Connect to the private Bazel fleet
      id: tailscale
      if: inputs.tailscale-client-id != ''
      # Private infrastructure is optional; compilation and test failures are not.
      continue-on-error: true
      uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: api.tailscale.com/${{ inputs.tailscale-client-id }}
        tags: tag:bazel-ci
        ping: ubuntu-main

    - name: Select private executor or hosted execution
      id: fleet
      shell: bash
      env:
        TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
      run: |
        python3 "$GITHUB_ACTION_PATH/configure_fleet.py"

    - name: Map the shared Windows compiler path
      if: steps.fleet.outputs.enabled == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'MSVC installation not found' }
        $vc = Join-Path $vs 'VC'
        $compiler = Join-Path $vc 'Tools\MSVC\14.44.35207\bin\Hostx64\x64\cl.exe'
        if (-not (Test-Path $compiler)) { throw 'Fleet requires MSVC 14.44.35207' }
        if (Test-Path 'V:\') { throw 'Fleet toolchain drive V: is already in use' }
        subst V: $vc
        if ($LASTEXITCODE -ne 0) { throw 'Cannot map the fleet compiler drive' }
        (Get-Item $compiler).VersionInfo | Select-Object FileVersion, ProductVersion | Format-List

    - name: Prepare the Linux fleet toolchain cache
      if: steps.fleet.outputs.enabled == 'true' && runner.os == 'Linux'
      shell: bash
      run: mkdir -p /tmp/zig-cache

    # Bazel validates action contents itself. A fresh save key retains new
    # source-build outputs even when MODULE.bazel and BUILD files are unchanged.
    # Restore after enrollment so an offline private executor gets the same
    # hosted cache as a job without a fleet identity.
    - name: Restore master action cache
      id: disk-cache
      if: steps.fleet.outputs.enabled != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.disk-cache-config.outputs.path }}
        key: ${{ steps.disk-cache-config.outputs.prefix }}run-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        restore-keys: ${{ steps.disk-cache-config.outputs.restore-keys }}
