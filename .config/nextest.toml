[profile.default]
# CI remains separately capped at 8 threads.
test-threads = 16

[profile.ci]
fail-fast = false
retries = 1
flaky-result = "fail"
test-threads = 8
slow-timeout = { period = "10s", terminate-after = 36 }
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# Heavy daemon git-metadata-watcher tests do real work — 50 sequential `git
# commit`s, concurrent extractions, worktree add + store-layout GC. Their
# assertions are order-independent (final indexed state / GC report /
# single-flight outcome), so they are correct regardless of interleaving, but
# under parallel CI load the real git+extraction work can be STARVED past the
# global 6-minute slow-timeout and killed. Raising the terminate ceiling for
# just these tests removes that wall-time-budget sensitivity without touching
# any assertion or adding a sleep. Applies on all hosts (the flake is a
# scheduler-starvation timeout, not a Windows-only concern).
[[profile.ci.overrides]]
filter = '(binary(=daemon_suite) & test(/^git_watch_test::(fifty_commit_rebase_needs_one_sync|concurrent_syncs_are_single_flight|deleted_branch_store_gc_fails_closed_without_daemon_administration)$/)) | (binary(=tracedecay) & test(~daemon::git_watch::tests::))'
slow-timeout = { period = "60s", terminate-after = 10 }

[test-groups]
cli-subprocess = { max-threads = 1 }
windows-tracedecay-init = { max-threads = 32 }
windows-init-heavy = { max-threads = 32 }
windows-profile-storage = { max-threads = 32 }
windows-session-sqlite = { max-threads = 32 }
windows-process-heavy = { max-threads = 32 }
windows-subprocess = { max-threads = 32 }
windows-memory-eval = { max-threads = 32 }
windows-timing-sensitive = { max-threads = 32 }

[[profile.ci.overrides]]
filter = 'binary(=dashboard_api_test)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'binary(=dashboard_api_test)'
threads-required = "num-cpus"

[[profile.ci.overrides]]
filter = 'binary(=core_cli_suite) & test(/^tool_daemon_test::(daemon_socket_is_owner_only|daemon_sigterm_exits_while_authenticated_project_client_is_connected)$/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'binary(=core_cli_suite) & test(/^tool_daemon_test::(daemon_socket_is_owner_only|daemon_sigterm_exits_while_authenticated_project_client_is_connected)$/)'
threads-required = "num-cpus"

[[profile.ci.overrides]]
filter = '(binary(=core_cli_suite) & test(/^cli_non_interactive_test::/)) | (binary(=mcp_suite) & test(/^(mcp_cli_serve_test|serve_template_path_test)::/))'
test-group = 'cli-subprocess'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = '(binary(=core_cli_suite) & test(/^cli_non_interactive_test::/)) | (binary(=mcp_suite) & test(/^(mcp_cli_serve_test|serve_template_path_test)::/))'
test-group = 'cli-subprocess'
threads-required = "num-cpus"

[[profile.ci.overrides]]
filter = 'binary(=agent_suite) | (binary(=core_cli_suite) & test(/^cli_non_interactive_test::/)) | (binary(=mcp_suite) & test(/^(mcp_cli_serve_test|serve_template_path_test)::/))'
platform = { host = 'cfg(windows)' }
test-group = 'windows-tracedecay-init'

[[profile.ci.overrides]]
filter = '(binary(=automation_runner_test) & !test(~backend::)) | (binary(=core_cli_suite) & test(/^(integration_test|regression_core_engine_test|tracedecay_test)::/))'
platform = { host = 'cfg(windows)' }
test-group = 'windows-init-heavy'

[[profile.ci.overrides]]
filter = '(binary(=storage_suite) & (test(/^storage_resolver_test::/) | test(/^profile_storage_reset_test::/))) | (binary(=transcript_ingest_suite) & test(~cursor::))'
platform = { host = 'cfg(windows)' }
test-group = 'windows-profile-storage'

[[profile.ci.overrides]]
filter = 'binary(=session_suite) | (binary(=transcript_ingest_suite) & (test(~codex::) | test(~hermes::) | test(~cline_like::))) | (binary(=storage_suite) & (test(/^corruption_test::/) | test(/^db_query_test::/))) | (binary(=memory_suite) & test(/^memory_test::/)) | (binary(=mcp_suite) & (test(/^mcp_handler_test::/) | test(/^mcp_server_test::/) | test(/^multi_mcp_coordination_test::/)))'
platform = { host = 'cfg(windows)' }
test-group = 'windows-session-sqlite'

[[profile.ci.overrides]]
filter = '(binary(=core_cli_suite) & test(/^tool_first_touch_test::/)) | (binary(=mcp_suite) & test(/^mcp_dashboard_tool_test::/)) | (binary(=hooks_lsp_suite) & test(/^lsp_code_diagnostics_test::/))'
platform = { host = 'cfg(windows)' }
test-group = 'windows-process-heavy'

[[profile.ci.overrides]]
filter = 'binary(=automation_runner_test) & test(~backend::)'
platform = { host = 'cfg(windows)' }
test-group = 'windows-subprocess'

[[profile.ci.overrides]]
filter = 'binary(=memory_suite) & test(/^memory_eval_test::/)'
platform = { host = 'cfg(windows)' }
test-group = 'windows-memory-eval'

[[profile.ci.overrides]]
filter = 'test(=graph_test::dead_code_marker_resolve_is_single_pass)'
platform = { host = 'cfg(windows)' }
test-group = 'windows-timing-sensitive'
