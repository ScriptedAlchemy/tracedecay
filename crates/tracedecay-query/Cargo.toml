[package]
name = "tracedecay-query"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay exact/lexical/graph code retrieval query kernel and search-quality candidate/profile inputs"

[dependencies]
# Raw deflate for lexical row text; already in the tree through
# `tracedecay-code-index`.
flate2.workspace = true
fst = { version = "=0.4.7", default-features = false, features = ["levenshtein"] }
gix = { version = "=0.89.0", default-features = false, features = ["revision", "parallel", "sha1", "sha256"] }
hex.workspace = true
hmac.workspace = true
rayon.workspace = true
roaring = { version = "=0.11.5", default-features = false }
# Lexical artifact finalization installs a SQLite progress_handler, and
# receipt-verification tests install an authorizer. Both APIs live behind
# rusqlite's `hooks` feature and must be selected by this storage owner.
rusqlite = { workspace = true, features = ["cache", "functions", "hooks"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
# For `git_open`, the one authority that opens a `gix` repository. Already in
# this crate's tree through `tracedecay-code-index`, so the edge costs no build.
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query" }
zeroize.workspace = true

[features]
# Explicit opt-in (same policy as `test-transport` on the runtime crate):
# exposes `*_for_test` constructors to dependent crates' test builds only.
test-helpers = ["tracedecay-temporal-query/test-helpers"]
# The grammar tier the shipped product indexes with, forwarded exactly as
# `tracedecay-cli`'s `production` forwards `tracedecay/production`. Only the
# `tracedecay-index-bench` binary needs it: a profiling run must parse the
# same languages production parses, or it measures a workload no user has.
production = ["tracedecay-code-index/lite", "tracedecay-code-index/full"]

[dev-dependencies]
static_assertions.workspace = true
tempfile.workspace = true
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
# Test-only: the relocated search-quality suites build lexical/exact fixtures
# through the code-index intake and the extracted language registry, which
# needs the bundled lite grammar tier (Rust).
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false, features = ["lang-markdown", "lite"] }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = ["lite", "test-helpers"] }
tracedecay-graph-db = { path = "../tracedecay-graph-db", features = ["test-helpers"] }

[[bench]]
name = "code_lexical_catchup"
harness = false

[[bin]]
name = "tracedecay-index-bench"
path = "src/bin/tracedecay_index_bench.rs"
test = false
required-features = ["production"]

[[test]]
name = "index_bench_workload"
required-features = ["production"]

[package.metadata.bazel.test_sizes]
index_bench_workload = "large"

# Daemon-free search-lane query latency workload over a published artifact.
[[bin]]
name = "tracedecay-search-bench"
path = "src/bin/tracedecay_search_bench.rs"
test = false
