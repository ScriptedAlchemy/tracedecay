[package]
name = "tracedecay-query"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "TraceDecay code retrieval query kernel"
include = ["/src/**"]

[dependencies]
hex = "0.4"
hmac = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-policy = { path = "../tracedecay-policy", version = "0.1.0" }
zeroize = "1.9.0"

[features]
# Explicit opt-in (same policy as `test-transport` on the runtime crate):
# exposes `*_for_test` constructors to dependent crates' test builds only.
test-helpers = []

[dev-dependencies]
static_assertions = "1.1.0"
# Test-only: the relocated search-quality suites build lexical/exact fixtures
# through the code-index intake/extraction pipeline, which needs the bundled
# medium grammar tier (Rust). Normal dependents keep `default-features = false`
# above and never pull grammars through this crate.
tracedecay-code-index = { path = "../tracedecay-code-index", features = ["lite"] }
