[package]
name = "tracedecay-query"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "TraceDecay code retrieval query kernel"
include = ["/src/**"]

[dependencies]
fst = { version = "=0.4.7", default-features = false, features = ["levenshtein"] }
hex = "0.4"
hmac = "0.13.0"
roaring = { version = "=0.11.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", version = "0.1.0" }
zeroize = "1.9.0"

[features]
# Explicit opt-in (same policy as `test-transport` on the runtime crate):
# exposes `*_for_test` constructors to dependent crates' test builds only.
test-helpers = ["tracedecay-temporal-query/test-helpers"]

[dev-dependencies]
static_assertions = "1.1.0"
tempfile = "3"
# Test-only: the relocated search-quality suites build lexical/exact fixtures
# through the code-index intake and the extracted language registry, which
# needs the bundled lite grammar tier (Rust).
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", features = ["lite"] }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = ["lite"] }
