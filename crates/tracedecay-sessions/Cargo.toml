[package]
name = "tracedecay-sessions"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "TraceDecay session contracts, provider-neutral ports, and the session runtime"
include = ["/src/**", "/tests/**"]

[features]
# Repo-wide `test-helpers` convention: exposes this crate's test-only helper
# surfaces to dependent crates' test builds only. Never gates production code.
test-helpers = []

[dependencies]
axum = "0.8"
base64 = "0.22"
dirs = "6"
gix = { version = "0.81", default-features = false, features = ["revision", "blob-diff", "sha1", "status"] }
hex = "0.4"
rayon = "1"
regex = "1"
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-capture = { path = "../tracedecay-capture", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", version = "0.1.0" }
url = "2"

[dev-dependencies]
# `runtime::vibe` and `runtime::workflow_ingest` tests backdate file mtimes.
filetime = "0.2"
# This crate's own test target needs the kernel's `db::engine::TestConnection`.
# Declaring the same path dependency with the feature keeps it out of the lib
# build while feature unification supplies it to every test target here.
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
