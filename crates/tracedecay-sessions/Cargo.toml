[package]
name = "tracedecay-sessions"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay session parsing and retrieval primitives"
include = ["/src/**", "/tests/**"]

[features]
# Repo-wide `test-helpers` convention: exposes this crate's test-only helper
# surfaces to dependent crates' test builds only. Never gates production code.
test-helpers = []

[dependencies]
asupersync.workspace = true
base64.workspace = true
futures-util.workspace = true
gix = { version = "=0.89.0", default-features = false, features = ["revision", "blob-diff", "parallel", "sha1", "sha256", "status"] }
hex.workspace = true
rayon.workspace = true
rusqlite = { workspace = true, features = ["cache"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing.workspace = true
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-capture = { path = "../tracedecay-capture" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-framing = { path = "../tracedecay-framing" }
tracedecay-lcm = { path = "../tracedecay-lcm" }
tracedecay-privacy = { path = "../tracedecay-privacy" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
tracedecay-store = { path = "../tracedecay-store" }
url.workspace = true
getrandom.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
# `runtime::vibe` and `runtime::workflow_ingest` tests backdate file mtimes.
filetime.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# This crate's own test target needs the kernel's `db::engine::TestConnection`.
# Declaring the same path dependency with the feature keeps it out of the lib
# build while feature unification supplies it to every test target here.
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }

[[bench]]
name = "host_transcript_io"
harness = false

[[bench]]
name = "cursor_dispatch_model"
harness = false
