[package]
name = "tracedecay-sessions"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "TraceDecay session parsing and retrieval primitives"

[dependencies]
dirs = "6"
gix = { version = "0.81", default-features = false, features = ["revision", "blob-diff", "sha1"] }
hex = "0.4"
libsql = "0.9.30"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
