[package]
name = "tracedecay-sessions"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "TraceDecay session contracts and provider-neutral ports"
include = ["/src/**", "/tests/**"]

[dependencies]
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
