[package]
name = "tracedecay-store-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Daemon project-store and session-registry runtime for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
hotpath = [
    "hotpath/hotpath",
    "hotpath/tokio",
    "tracedecay-application/hotpath",
    "tracedecay-automation-runtime/hotpath",
    "tracedecay-code-index/hotpath",
    "tracedecay-code-index-retention/hotpath",
    "tracedecay-code-index-runtime/hotpath",
    "tracedecay-daemon-identity/hotpath",
    "tracedecay-domain/hotpath",
    "tracedecay-global-db/hotpath",
    "tracedecay-graph-db/hotpath",
    "tracedecay-private-fs/hotpath",
    "tracedecay-runtime-core/hotpath",
    "tracedecay-rusqlite-runtime/hotpath",
    "tracedecay-session-memory/hotpath",
    "tracedecay-session-runtime/hotpath",
    "tracedecay-session-temporal-store/hotpath",
    "tracedecay-sessions/hotpath",
    "tracedecay-store/hotpath",
    "tracedecay-usecases/hotpath",
]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "tracedecay-application/hotpath-alloc",
    "tracedecay-automation-runtime/hotpath-alloc",
    "tracedecay-code-index/hotpath-alloc",
    "tracedecay-code-index-retention/hotpath-alloc",
    "tracedecay-code-index-runtime/hotpath-alloc",
    "tracedecay-daemon-identity/hotpath-alloc",
    "tracedecay-domain/hotpath-alloc",
    "tracedecay-global-db/hotpath-alloc",
    "tracedecay-graph-db/hotpath-alloc",
    "tracedecay-private-fs/hotpath-alloc",
    "tracedecay-runtime-core/hotpath-alloc",
    "tracedecay-rusqlite-runtime/hotpath-alloc",
    "tracedecay-session-memory/hotpath-alloc",
    "tracedecay-session-runtime/hotpath-alloc",
    "tracedecay-session-temporal-store/hotpath-alloc",
    "tracedecay-sessions/hotpath-alloc",
    "tracedecay-store/hotpath-alloc",
    "tracedecay-usecases/hotpath-alloc",
]
hotpath-cpu = [
    "hotpath",
    "hotpath/hotpath-cpu",
    "tracedecay-application/hotpath-cpu",
    "tracedecay-automation-runtime/hotpath-cpu",
    "tracedecay-code-index/hotpath-cpu",
    "tracedecay-code-index-retention/hotpath-cpu",
    "tracedecay-code-index-runtime/hotpath-cpu",
    "tracedecay-daemon-identity/hotpath-cpu",
    "tracedecay-domain/hotpath-cpu",
    "tracedecay-global-db/hotpath-cpu",
    "tracedecay-graph-db/hotpath-cpu",
    "tracedecay-private-fs/hotpath-cpu",
    "tracedecay-runtime-core/hotpath-cpu",
    "tracedecay-rusqlite-runtime/hotpath-cpu",
    "tracedecay-session-memory/hotpath-cpu",
    "tracedecay-session-runtime/hotpath-cpu",
    "tracedecay-session-temporal-store/hotpath-cpu",
    "tracedecay-sessions/hotpath-cpu",
    "tracedecay-store/hotpath-cpu",
    "tracedecay-usecases/hotpath-cpu",
]
# Cross-crate fixture surface for composition-root store-runtime tests:
# schema-convergence gates and remote-recovery authority reads exercised by
# the root crate's store_runtime_tests / HTTP suites. Production code is
# never gated by this feature.
test-helpers = []

[dependencies]
hex = "0.4"
hotpath.workspace = true
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime", version = "0.1.0" }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-code-index-retention = { path = "../tracedecay-code-index-retention", version = "0.1.0" }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", version = "0.1.0", default-features = false }
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0" }
tracedecay-graph-db = { path = "../tracedecay-graph-db", version = "0.1.0" }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime", version = "0.1.0" }
tracedecay-session-memory = { path = "../tracedecay-session-memory", version = "0.1.0" }
tracedecay-session-runtime = { path = "../tracedecay-session-runtime", version = "0.1.0" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store", version = "0.1.0" }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
tracedecay-usecases = { path = "../tracedecay-usecases", version = "0.1.0" }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
# Test-only helper surfaces reached across crate boundaries by this crate's
# test targets. Feature unification supplies them to the test build only.
# code-index-runtime/test-helpers is the same fixture surface the root test
# binary used: CodeIndexWorktreeSchedulerV1::ensure_worker_plan auto-installs
# the process worker plan instead of answering WorkerPlanNotInstalled.
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false, features = ["test-helpers"] }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", version = "0.1.0", default-features = false, features = ["test-helpers"] }
# graph-sealed-store mirrors the root test lane: root's default `production`
# feature compiles graph-db's sealed lane in, and the moved cold-activation
# recovery tests exercise it. Without it the lane is compiled out and cold
# reopen answers Unavailable instead of serving the verified sealed artifact.
tracedecay-graph-db = { path = "../tracedecay-graph-db", version = "0.1.0", features = ["graph-sealed-store"] }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
tracedecay-semantic = { path = "../tracedecay-semantic", version = "0.1.0" }
