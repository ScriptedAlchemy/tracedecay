[package]
name = "tracedecay-store-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Canonical TraceDecay store runtime: project-store, shard, and session lifecycle over the database kernels"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Cross-crate fixture surface for composition-root store-runtime tests:
# schema-convergence gates and remote-recovery authority reads exercised by
# the root crate's store_runtime_tests / HTTP suites. Production code is
# never gated by this feature.
test-helpers = []

[dependencies]
asupersync.workspace = true
futures-util.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-code-index-retention = { path = "../tracedecay-code-index-retention" }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", default-features = false }
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-hooks = { path = "../tracedecay-hooks" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-session-runtime = { path = "../tracedecay-session-runtime" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }

# glibc `malloc_trim` for allocator release, and `statfs(2)` for the store
# locator resolver's macOS store-locality detection (Linux reads
# `/proc/self/mountinfo` instead; `MNT_LOCAL` is the kernel's direct answer
# to "is this volume local").
[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")))'.dependencies]
libc.workspace = true

# Windows store-locality detection: drive type and volume filesystem name for
# the locator's metadata (`GetDriveTypeW`, `GetVolumeInformationW`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
gix.workspace = true
rusqlite.workspace = true
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# Test-only helper surfaces reached across crate boundaries by this crate's
# test targets. Feature unification supplies them to the test build only.
# code-index-runtime/test-helpers is the same fixture surface the root test
# binary used: CodeIndexWorktreeSchedulerV1::ensure_worker_plan auto-installs
# the process worker plan instead of answering WorkerPlanNotInstalled.
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = ["test-helpers"] }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", default-features = false, features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }

[[test]]
name = "code_index_ignored_dependencies_test"
path = "tests/code_index_ignored_dependencies_test/main.rs"
required-features = ["test-helpers"]
