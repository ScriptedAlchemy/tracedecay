[package]
name = "tracedecay-global-db"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "TraceDecay user-level global database: project registry, observations, session temporal store"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
include = ["/src/**"]

[features]
# Explicit opt-in (same policy as the query kernel): exposes the registered
# global-db harness to dependent crates' test builds only.
test-helpers = []

[dependencies]
futures-util = "0.3.33"
getrandom = "0.2"
hex = "0.4"
hmac = { version = "0.13.0", features = ["zeroize"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zeroize = "1.9.0"
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-capture = { path = "../tracedecay-capture", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime", version = "0.1.0" }
tracedecay-semantic = { path = "../tracedecay-semantic", version = "0.1.0" }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }
# Test-only harnesses in this crate build temporary stores; kept as a normal
# dependency because `#[cfg(test)]` modules are compiled inside the lib target
# and the root crate re-exports `tests::` harness helpers.
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
# Test-only helper surfaces this crate's test targets reach across crate
# boundaries: engine fixtures, session normalizers, and temporal page requests.
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0", features = ["test-helpers"] }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", version = "0.1.0", features = ["test-helpers"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }
