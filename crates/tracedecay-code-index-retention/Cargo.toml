[package]
name = "tracedecay-code-index-retention"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Liveness-based retention for immutable code-index generations"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
# Sealed-generation store fixtures for retention tests in dependent crates.
test-helpers = []

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
metrics.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }

tracing = "0.1"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
