[package]
name = "tracedecay-private-fs"
version = "0.1.0"
publish = false
edition.workspace = true
description = "Cross-platform owner-private filesystem authority for TraceDecay stores"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
# Fixture fsync latency injection (`framed_log::sync_latency`) for consumer tests.
test-helpers = []

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
