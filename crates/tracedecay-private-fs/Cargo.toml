[package]
name = "tracedecay-private-fs"
version = "0.1.0"
publish = false
edition.workspace = true
description = "Cross-platform owner-private filesystem authority and process OS primitives for TraceDecay stores"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
# Repo-wide `test-helpers` convention: exposes this crate's test-only helper
# surfaces (isolated background CPU authorities) to dependent crates' test
# builds. Never gates production code.
test-helpers = []

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
hotpath.workspace = true
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
