[package]
name = "tracedecay-search-eval"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "TraceDecay search-quality evaluator: candidate generation, direct evaluation, and native semantic measurement"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
include = ["/assets/**", "/src/**"]

[dependencies]
gix = { version = "=0.86.0", default-features = false, features = [
    "revision",
    "blob-diff",
    "parallel",
    "sha1",
    "sha256",
    "status",
] }
hex = "0.4"
hotpath.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0", features = [
    "native-git",
] }
tracedecay-capture = { path = "../tracedecay-capture", version = "0.1.0" }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false, features = ["eval-helpers"] }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0" }

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
hotpath = [
    "tracedecay-domain/hotpath",
    "hotpath/hotpath",
    "tracedecay-application/hotpath",
    "tracedecay-capture/hotpath",
    "tracedecay-code-index/hotpath",
    "tracedecay-private-fs/hotpath",
    "tracedecay-query/hotpath",
]
hotpath-alloc = [
    "tracedecay-domain/hotpath-alloc",
    "hotpath",
    "hotpath/hotpath-alloc",
    "tracedecay-application/hotpath-alloc",
    "tracedecay-capture/hotpath-alloc",
    "tracedecay-code-index/hotpath-alloc",
    "tracedecay-private-fs/hotpath-alloc",
    "tracedecay-query/hotpath-alloc",
]
hotpath-cpu = [
    "tracedecay-domain/hotpath-cpu",
    "hotpath",
    "hotpath/hotpath-cpu",
    "tracedecay-application/hotpath-cpu",
    "tracedecay-capture/hotpath-cpu",
    "tracedecay-code-index/hotpath-cpu",
    "tracedecay-private-fs/hotpath-cpu",
    "tracedecay-query/hotpath-cpu",
]
# Language tiers forwarded to the code-index owner the evaluator mounts. Off by
# default so a composing binary keeps its own tier selection authoritative; the
# checked-in evaluator corpus is Rust, so the crate's own tests enable `lite`
# through the self dev-dependency below.
lite = ["tracedecay-code-index/lite"]
lang-dockerfile = ["tracedecay-code-index/lang-dockerfile"]
# Exactly the tiers the checked-in evaluator workload declares.
evaluator-corpus-languages = ["lite", "lang-dockerfile"]

[dev-dependencies]
# Self dev-dependency: the crate's own test build needs the extraction tiers
# the checked-in corpus declares. Composing binaries still choose their own.
tracedecay-search-eval = { path = ".", features = ["evaluator-corpus-languages"] }
