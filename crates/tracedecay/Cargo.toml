[package]
name = "tracedecay"
version.workspace = true
publish = false
edition.workspace = true
description = "Local semantic code intelligence, project memory, and workflow context for AI coding agents."
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
homepage = "https://github.com/ScriptedAlchemy/tracedecay"
readme = "../../README.md"
keywords = ["code-intelligence", "knowledge-graph", "mcp", "tree-sitter", "semantic-search"]
categories = ["development-tools", "command-line-utilities"]
# Explicit source-archive whitelist retained for local distribution validation.
# Frontend sources and the prebuilt dashboard/app-dist are deliberately
# excluded: the CLI package stages and embeds the dashboard bundle and
# registers it into this library at process start.
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/rust-toolchain.toml",
    "/.cargo/config.toml",
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/fixtures/analytics/**",
    "/tests/fixtures/packaged_host_events/**",
    "/tests/fixtures/provider_normalization/**",
    "/tests/fixtures/redundancy_eval_labeled.json",
    "/tests/fixtures/transcript_golden/cline_like/**",
    "/benchmark_data/queries/default.toml",
    "/benchmark_data/claude-observation/**",
    "/benchmark_data/session-temporal/**",
    "/benchmark_data/query-code-index/**",
    "/scripts/run-session-temporal-benchmark.sh",
    "/plugin/.claude-plugin/**",
    "/plugin/.cursor-plugin/**",
    "/plugin/.codex-plugin/**",
    "/plugin/.kimi-plugin/**",
    "/plugin/.lsp.json",
    "/plugin/.mcp.json",
    "/plugin/README*.md",
    "/plugin/agents/**",
    "/plugin/commands/**",
    "/plugin/hooks/**",
    "/plugin/mcp-cursor.json",
    "/plugin/opencode/**",
    "/plugin/overlays/**",
    "/plugin/rules/**",
    "/plugin/skills/**",
    "/plugin/cursor-native-extension/package.json",
    "/plugin/cursor-native-extension/README.md",
    "/plugin/cursor-native-extension/LICENSE",
    "/plugin/cursor-native-extension/embedded/extension.js",
    "/vendor/**",
    "/dashboard/hermes-wrapper/manifest.json",
    "/dashboard/hermes-wrapper/plugin_api.py",
    "/dashboard/hermes-wrapper/src/**",
]

[features]
# Default and explicitly selected production artifacts resolve through the
# same feature. Release packaging selects exactly `production`; profiling is a
# separate feature-enabled build because Hotpath 0.24 has no runtime-off mode.
# `--all-features` is test-only because it includes `test-transport`.
default = ["production"]

# Opt-in profiling. Never in `default` and never in `production`.
#
# Hotpath 0.24 decides what every macro expands to from the features of the
# single `hotpath` / `hotpath-macros` build that cargo unifies across the whole
# dependency graph: with no profiling feature selected every macro is a no-op,
# and once a binary selects `hotpath/hotpath` every `#[hotpath::measure]`,
# `measure_block!`, `gauge!`, `future!`, ... in every crate is live, no
# per-crate feature is involved. The crates listed below are the runtime owners
# whose *compiled behaviour* changes under profiling (`cfg(feature = "hotpath")`
# sites: allocation/lock/IO wrappers, observation sinks, the axum server layer,
# the process guard); their thin features forward nowhere else. `tracedecay-sdk`
# is the one exception: its build script compiles hotpath-instrumented crates in
# the host context, so it mirrors every selected backend onto that side.
#
# `hotpath` alone gives wall-clock timing. The other three layer on top of it:
# `hotpath-alloc` installs the counting global allocator, `hotpath-cpu` adds
# on-CPU sampling, and `hotpath-mcp` exposes the live query server (port 6771
# by default, `HOTPATH_MCP_PORT` overrides). `hotpath/tokio` is required by
# `hotpath::tokio_runtime!` and the tokio lock wrappers, and `hotpath/ureq-3`
# by the GitHub client reached from here, so no second HTTP stack is
# introduced. The axum 0.8 server layer is selected by the crates that mount
# routers, `tracedecay-daemon-service` and `tracedecay-dashboard-api`.
hotpath = [
    "hotpath/hotpath",
    "hotpath/tokio",
    "hotpath/ureq-3",
    "tracedecay-application/hotpath",
    "tracedecay-automation-runtime/hotpath",
    "tracedecay-code-extraction/hotpath",
    "tracedecay-code-index/hotpath",
    "tracedecay-code-index-runtime/hotpath",
    "tracedecay-contracts/hotpath",
    "tracedecay-daemon-service/hotpath",
    "tracedecay-dashboard-api/hotpath",
    "tracedecay-global-db/hotpath",
    "tracedecay-graph-db/hotpath",
    "tracedecay-hooks/hotpath",
    "tracedecay-lcm/hotpath",
    "tracedecay-mcp/hotpath",
    "tracedecay-project/hotpath",
    "tracedecay-query/hotpath",
    "tracedecay-rusqlite-runtime/hotpath",
    "tracedecay-sdk/hotpath",
    "tracedecay-session-temporal-store/hotpath",
    "tracedecay-sessions/hotpath",
    "tracedecay-store-runtime/hotpath",
]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "tracedecay-sdk/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu", "tracedecay-sdk/hotpath-cpu"]
# Binary-only: the live query server runs in this process, so no library crate
# needs a passthrough for it.
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]
# Opt-in spill for graph index buffers. Never in `default` or `production`.
# See `crates/tracedecay-graph-db/Cargo.toml` for why the live LPG stays in RAM.
graph-disk-tier = ["tracedecay-graph-db/graph-disk-tier"]

production = [
    "token-counting",
    "lite",
    "full",
]

# Exact token counting for the Savings & Cost dashboard (tiktoken BPE).
# Embeds the o200k_base/cl100k_base vocabularies (~4 MB of binary weight);
# vocab decoding is lazy (first count pays it, idle servers never do).
# Disable for a leaner binary, cost estimation falls back to chars/4.
token-counting = ["tracedecay-agent-hosts/token-counting", "tracedecay-dashboard-api/token-counting"]

# Lite tier (11 languages), always compiled, no feature flag needed:
# Rust, Go, Java, Scala, TypeScript/JavaScript, Python, C, C++, Kotlin, C#, Swift.
# Markdown joins them: documentation is architecture content, every repository
# has it, and a build that indexes code but not its docs is not a shippable
# tier. Its grammar lives in the (monolithic) large bundle, so `lite` now links
# that bundle, the compile-weight cost of making docs unconditional.
lite = ["tracedecay-code-index/lite", "tracedecay-code-index-runtime/lite"]

medium = ["tracedecay-code-index/medium"]
full = ["tracedecay-code-index/full", "tracedecay-code-index-runtime/full"]

# These aliases are intentionally repeated at the binary boundary: Cargo
# cannot expose a dependency feature as a caller-selectable local feature.
# Tier membership remains owned by tracedecay-code-extraction and reaches this
# package through the aggregate forwards above.
lang-dart = ["tracedecay-code-index/lang-dart"]
lang-pascal = ["tracedecay-code-index/lang-pascal"]
lang-php = ["tracedecay-code-index/lang-php"]
lang-ruby = ["tracedecay-code-index/lang-ruby"]
lang-bash = ["tracedecay-code-index/lang-bash"]
lang-protobuf = ["tracedecay-code-index/lang-protobuf"]
lang-powershell = ["tracedecay-code-index/lang-powershell"]
lang-nix = ["tracedecay-code-index/lang-nix"]
lang-vbnet = ["tracedecay-code-index/lang-vbnet"]
lang-lua = ["tracedecay-code-index/lang-lua"]
lang-zig = ["tracedecay-code-index/lang-zig"]
lang-objc = ["tracedecay-code-index/lang-objc"]
lang-perl = ["tracedecay-code-index/lang-perl"]
lang-batch = ["tracedecay-code-index/lang-batch"]
lang-fortran = ["tracedecay-code-index/lang-fortran"]
lang-cobol = ["tracedecay-code-index/lang-cobol"]
lang-msbasic2 = ["tracedecay-code-index/lang-msbasic2"]
lang-gwbasic = ["tracedecay-code-index/lang-gwbasic"]
lang-qbasic = ["tracedecay-code-index/lang-qbasic"]
lang-dockerfile = ["tracedecay-code-index/lang-dockerfile"]
lang-glsl = ["tracedecay-code-index/lang-glsl"]
lang-wgsl = ["tracedecay-code-index/lang-wgsl"]
lang-hlsl = ["tracedecay-code-index/lang-hlsl"]
lang-metal = ["tracedecay-code-index/lang-metal"]
lang-markdown = ["tracedecay-code-index/lang-markdown"]
lang-json = ["tracedecay-code-index/lang-json"]
lang-r = ["tracedecay-code-index/lang-r"]
lang-sql = ["tracedecay-code-index/lang-sql"]
lang-julia = ["tracedecay-code-index/lang-julia"]
lang-haskell = ["tracedecay-code-index/lang-haskell"]
lang-ocaml = ["tracedecay-code-index/lang-ocaml"]
lang-clojure = ["tracedecay-code-index/lang-clojure"]
lang-erlang = ["tracedecay-code-index/lang-erlang"]
lang-elixir = ["tracedecay-code-index/lang-elixir"]
lang-fsharp = ["tracedecay-code-index/lang-fsharp"]
lang-quint = ["tracedecay-code-index/lang-quint"]
lang-toml = ["tracedecay-code-index/lang-toml"]
lang-lean = ["tracedecay-code-index/lang-lean"]

# Integration fixture surface. `HostAdmissionTestRuntimeV1` and the registered
# database scaffolding it owns are assembled by the composition root, so they
# live in the product library rather than a test crate. This feature keeps them
# out of a default or `production` build: they compile only under `cfg(test)`
# or when a consumer asks for them explicitly.
test-helpers = [
    "tracedecay-project/test-helpers",
    "tracedecay-mcp/test-helpers",
    "tracedecay-automation-runtime/test-helpers",
    "tracedecay-code-index-runtime/test-helpers",
    "tracedecay-daemon-service/test-helpers",
    "tracedecay-host-admission/test-helpers",
    "tracedecay-maintenance/test-helpers",
    "tracedecay-runtime-core/test-helpers",
    "tracedecay-session-runtime/test-helpers",
    "tracedecay-sessions/test-helpers",
    "tracedecay-store-runtime/test-helpers",
    "dep:tracedecay-temporal-query",
]

test-transport = [
    "test-helpers",
    "tracedecay-project/test-transport",
    "tracedecay-rusqlite-runtime/test-transport",
    "tracedecay-runtime-core/test-transport",
    "tracedecay-session-memory/test-transport",
    "tracedecay-agent-hosts/test-transport",
    "tracedecay-automation-runtime/test-transport",
    "tracedecay-dashboard-api/test-transport",
    "tracedecay-host-admission/test-transport",
    "tracedecay-application/test-transport",
    "tracedecay-graph-query/test-helpers",
    "tracedecay-mcp/test-transport",
    # The observation-seed fixture bridge (`dashboard::observation_seed`) is
    # test-transport-gated and drives the global-db session-temporal refresh
    # helpers; plain builds (no dev-dep feature unification) need the forward.
    "tracedecay-global-db/test-helpers",
    "tracedecay-session-temporal-store/test-helpers",
    # The graph-projection fixture bridge
    # (`dashboard::graph_projection_fixture`) publishes the hermetic code-graph
    # generation dashboard neighbor reads take their adjacency from.
    "tracedecay-code-index/test-helpers",
    "tracedecay-code-index-runtime/test-helpers",
    "tracedecay-code-index-runtime/test-transport",
]

# Links the search-quality evaluator library. Cargo rejects optional
# dev-dependencies, and an unconditional one links the evaluator into every
# test target. Journeys that compare the CLI receipt to the library enable
# this feature. `test-transport` and `production` must not.
search-eval = ["dep:tracedecay-search-eval"]

# The typed RMCP benchmark is the only consumer of the client-side RMCP
# transport. Keep that surface out of ordinary integration-fixture builds:
# the benchmark enables its complete client/runtime dependency set explicitly.
rmcp-benchmark = [
    "test-transport",
    "rmcp/client",
    "rmcp/transport-async-rw",
]

[lib]
name = "tracedecay"

# Integration harnesses that intentionally exercise in-process daemon/test
# transport seams stay out of the default production feature graph.
[[test]]
name = "dashboard_api_test"
path = "tests/dashboard_api_test/main.rs"
required-features = ["test-transport"]

# Former single-file test-transport targets, compiled as modules of one binary.
[[test]]
name = "transport_acceptance_suite"
path = "tests/transport_acceptance_suite/main.rs"
required-features = ["test-transport"]

# Shared with the extracted rusqlite-runtime package's restart/parity tests;
# keep one repository-level source while preserving this package target.
[[test]]
name = "storage_runtime_rusqlite_suite"
path = "../../tests/storage_runtime_rusqlite_suite/main.rs"

[dependencies]
axum = "0.8"
# `tokio` always: `hotpath::wrap::tokio::sync::Mutex` names the lock type in
# both modes (the plain tokio mutex until a binary selects the backend).
hotpath = { workspace = true, features = ["tokio"] }
tower = "0.5"
constant_time_eq = "0.5.0"
tracedecay-agent-hosts = { path = "../tracedecay-agent-hosts" }
tracedecay-api = { path = "../tracedecay-api" }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-code-index-retention = { path = "../tracedecay-code-index-retention" }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", default-features = false }
tracedecay-configuration = { path = "../tracedecay-configuration" }
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api" }
tracedecay-daemon-control = { path = "../tracedecay-daemon-control" }
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tracedecay-daemon-service = { path = "../tracedecay-daemon-service" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-framing = { path = "../tracedecay-framing" }
tracedecay-hooks = { path = "../tracedecay-hooks" }
tracedecay-host-admission = { path = "../tracedecay-host-admission" }
tracedecay-mcp = { path = "../tracedecay-mcp" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tracedecay-maintenance = { path = "../tracedecay-maintenance" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-graph-query = { path = "../tracedecay-graph-query" }
tracedecay-policy = { path = "../tracedecay-policy" }
tracedecay-privacy = { path = "../tracedecay-privacy" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
# Workspace-versioned like this crate: it owns `version::PACKAGE_VERSION`.
tracedecay-project = { path = "../tracedecay-project" }
tracedecay-query = { path = "../tracedecay-query" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-session-runtime = { path = "../tracedecay-session-runtime" }
tracedecay-store-runtime = { path = "../tracedecay-store-runtime" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store" }
# Only the `test-helpers` session-temporal bench fixture names this crate.
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", optional = true }
tracedecay-lcm = { path = "../tracedecay-lcm" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-source-edit = { path = "../tracedecay-source-edit" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracedecay-application = { path = "../tracedecay-application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
url = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
sha2 = "0.11"
walkdir = "2"
gix.workspace = true
zeroize = "1.9.0"
keyring = { version = "4.1.5", features = ["v1"] }
tempfile = "3"
futures-util = "0.3.33"
rmcp = { version = "3.0.1", default-features = false, features = ["server"] }
# Opt-in. Cargo rejects optional dev-dependencies, and an unconditional one
# links the evaluator into every test target. Default and `production` builds
# leave it off, so the shipped CLI does not link it.
tracedecay-search-eval = { path = "../tracedecay-search-eval", optional = true }

# `kill(2)` for the daemon integration suites' physical-restart journeys
# (tests/daemon_suite). Store-locality detection lives in tracedecay-store-runtime.
[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")))'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
tree-sitter = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
glob = "0.3"
hex = "0.4"
toml = "1"
regex = "1.12.3"
filetime = "0.2"
rmcp = { version = "3.0.1", default-features = false, features = ["client", "server", "transport-async-rw"] }
criterion = { version = "0.5", features = ["async_tokio"] }
# test-util enables tokio::test(start_paused = true) so timer-driven unit
# tests (daemon restart-grace windows) run on virtual time instead of real
# sleeps.
tokio = { version = "1", features = ["full", "test-util"] }
jsonschema = { version = "0.46.8", default-features = false }
tracedecay-sdk = { path = "../tracedecay-sdk" }
tracedecay-capture = { path = "../tracedecay-capture" }
# Test builds opt into the query kernel's `*_for_test` constructors; the
# feature stays off for production builds.
tracedecay-query = { path = "../tracedecay-query", features = ["test-helpers"] }
# Production already forwards `lite`/`full` through the `production` feature.
# Keep this edge grammar-free so tests do not also pull `medium` (code-index
# defaults) and so the test graph matches the CLI lane plus `test-helpers`.
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = ["test-helpers"] }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", default-features = false, features = ["test-helpers", "test-transport"] }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", features = ["test-helpers"] }
# Same policy for the extracted global-db harness the root test suite drives.
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-graph-query = { path = "../tracedecay-graph-query", features = ["test-helpers"] }
# The root's cfg(test) host-admission support composes the dashboard test
# authority, which lives behind the dashboard-api test-transport feature.
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api", features = ["test-transport"] }
# ChannelTransport used to be cfg(test) in this crate. After the move it lives
# behind tracedecay-mcp's test-transport feature, so root unit tests must
# enable that feature without putting it on the production CLI lane.
tracedecay-mcp = { path = "../tracedecay-mcp", features = ["test-helpers", "test-transport"] }
# The registered host-admission test runtime and the explicit
# `TraceDecay::*_for_test` constructors root unit tests open projects through.
# Only `test-helpers`: the project crate's `test-transport` reroutes the plain
# `TraceDecay::init`/`open` API onto the fixture, and the root's
# `test-helpers`-only suites exercise the production standalone path.
tracedecay-project = { path = "../tracedecay-project", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
tracedecay-sessions = { path = "../tracedecay-sessions", features = ["test-helpers"] }
tracedecay-host-admission = { path = "../tracedecay-host-admission", features = ["test-helpers"] }
tracedecay-application = { path = "../tracedecay-application", features = ["test-helpers"] }
# Journal tests in the composition root call effect_runtime journal internals
# that stay crate-private in production and compile only under test-helpers.
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime", features = ["test-helpers"] }
# Root lib tests call daemon-service fixture constructors (`invoke`,
# publication gates). Feature unification keeps them off the CLI lane.
tracedecay-daemon-service = { path = "../tracedecay-daemon-service", features = ["test-helpers"] }
# Root host-admission integration tests drive session-runtime worker pass
# internals; the fixture surface stays off the CLI lane.
tracedecay-session-runtime = { path = "../tracedecay-session-runtime", features = ["test-helpers"] }
# Root store-runtime integration tests drive schema-convergence gates that
# stay off the CLI lane.
tracedecay-store-runtime = { path = "../tracedecay-store-runtime", features = ["test-helpers"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }

