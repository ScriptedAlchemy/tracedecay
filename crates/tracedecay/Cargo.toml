[[test]]
name = "search_quality_suite"
path = "tests/search_quality_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "session_suite"
path = "tests/session_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "storage_suite"
path = "tests/storage_suite/main.rs"
required-features = ["test-helpers"]

# Both reach the shared `tests/common` harness, which builds the host-admission
# fixture runtime. The other integration targets stay ungated on purpose so a
# default-feature `cargo test -p tracedecay` still runs everything that does not
# need the fixture surface.
[[test]]
name = "graph_suite"
path = "tests/graph_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "transcript_ingest_suite"
path = "tests/transcript_ingest_suite/main.rs"
required-features = ["test-helpers"]

# Former standalone default-feature singles, compiled as modules of one binary.
[[test]]
name = "product_surface_suite"
path = "tests/product_surface_suite/main.rs"
