fs2 = "0.4"
same-file = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Raw filesystem watcher for the daemon git-metadata watcher (src/daemon/git_watch.rs).
# We deliberately use the raw watcher (not notify-debouncer-full) and debounce
# ourselves so a monorepo's git-ref churn coalesces into a single sync.
notify = "6"
zeroize = "1.9.0"
keyring = { version = "4.1.5", features = ["v1"] }
tempfile = "3"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
schemars = "1.2.1"
futures-util = "0.3.33"
tokio-util = { version = "0.7.19", features = ["codec"] }
rmcp = { version = "3.0.1", default-features = false, features = ["server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# `statfs(2)` for daemon store-locality detection (src/daemon/store_runtime/
# resolver.rs). Linux reads `/proc/self/mountinfo` instead; macOS has no such
# file, and `MNT_LOCAL` is the kernel's direct answer to "is this volume local".
[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")))'.dependencies]
libc = "0.2"

[dev-dependencies]
sha2 = "0.11"
hex = "0.4"
regex = "1.12.3"
filetime = "0.2"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
# test-util enables tokio::test(start_paused = true) so timer-driven unit
# tests (daemon restart-grace windows) run on virtual time instead of real
# sleeps.
tokio = { version = "1", features = ["full", "test-util"] }
jsonschema = { version = "0.46.8", default-features = false }
tracedecay-sdk = { path = "../tracedecay-sdk", version = "0.1.0" }
# Test builds opt into the query kernel's `*_for_test` constructors; the
# feature stays off for production builds.
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0", features = ["test-helpers"] }
# Production already forwards `lite`/`full` through the `production` feature.
# Keep this edge grammar-free so tests do not also pull `medium` (code-index
# defaults) and so the test graph matches the CLI lane plus `test-helpers`.
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false, features = ["test-helpers"] }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", version = "0.1.0", default-features = false, features = ["test-helpers", "test-transport"] }
tracedecay-semantic = { path = "../tracedecay-semantic", version = "0.1.0", features = ["test-helpers"] }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", version = "0.1.0", features = ["test-helpers"] }
# Same policy for the extracted global-db harness the root test suite drives.
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0", features = ["test-helpers"] }
tracedecay-graph-query = { path = "../tracedecay-graph-query", version = "0.1.0", features = ["test-helpers"] }
# The root's cfg(test) host-admission support composes the dashboard test
# authority, which lives behind the dashboard-api test-transport feature.
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api", version = "0.1.0", features = ["test-transport"] }
# ChannelTransport used to be cfg(test) in this crate. After the move it lives
# behind tracedecay-mcp's test-transport feature, so root unit tests must
# enable that feature without putting it on the production CLI lane.
tracedecay-mcp = { path = "../tracedecay-mcp", version = "0.1.0", features = ["test-transport"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0", features = ["test-helpers"] }
tracedecay-host-admission = { path = "../tracedecay-host-admission", version = "0.1.0", features = ["test-helpers"] }
tracedecay-usecases = { path = "../tracedecay-usecases", version = "0.1.0", features = ["test-helpers"] }
# Journal tests in the composition root call effect_runtime journal internals
# that stay crate-private in production and compile only under test-helpers.
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime", version = "0.1.0", features = ["test-helpers"] }
# Root lib tests call daemon-service fixture constructors (`invoke`,
# publication gates). Feature unification keeps them off the CLI lane.
tracedecay-daemon-service = { path = "../tracedecay-daemon-service", version = "0.1.0", features = ["test-helpers"] }
# Root host-admission integration tests drive session-runtime worker pass
# internals; the fixture surface stays off the CLI lane.
tracedecay-session-runtime = { path = "../tracedecay-session-runtime", version = "0.1.0", features = ["test-helpers"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }

[[bench]]
name = "large_repos"
path = "benches/large_repos.rs"
harness = false
required-features = ["test-transport"]

[[bench]]
name = "queries"
path = "benches/queries.rs"
required-features = ["test-transport"]

[[bench]]
name = "session_temporal"
path = "benches/session_temporal.rs"
harness = false
# The harness module is gated out of the shipped library, so the bench selects
# it the same way the integration lanes do.
required-features = ["test-helpers"]
# The custom benchmark CLI is not a libtest harness and cannot answer the
# `--list --format terse` probe used by `cargo test` and nextest.
test = false

[[test]]
name = "runtime_acceptance_suite"
path = "tests/runtime_acceptance_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "agent_suite"
path = "tests/agent_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "automation_runner_test"
path = "tests/automation_runner_test/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "daemon_suite"
path = "tests/daemon_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "hermes_suite"
path = "tests/hermes_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "hooks_lsp_suite"
path = "tests/hooks_lsp_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "mcp_suite"
path = "tests/mcp_suite/main.rs"
required-features = ["test-helpers"]

[[test]]
name = "memory_suite"
path = "tests/memory_suite/main.rs"
