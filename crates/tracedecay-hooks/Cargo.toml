[package]
name = "tracedecay-hooks"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Bounded Hook V2 and Context Scout contracts for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-framing = { path = "../tracedecay-framing" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }

[dev-dependencies]
asupersync.workspace = true
tracedecay-private-fs = { path = "../tracedecay-private-fs", features = ["test-helpers"] }
