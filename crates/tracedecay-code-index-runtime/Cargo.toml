[package]
name = "tracedecay-code-index-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Daemon code-index scheduler, git watch, and git transactions runtime"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
# No type in this crate names hotpath's on-mode `InstrumentedIo`: `io!` results
# stay in local `let` bindings whose type is inferred, so selecting the backend
# without this feature still compiles.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
lite = ["tracedecay-code-extraction/lite", "tracedecay-code-index/lite"]
full = ["tracedecay-code-extraction/full", "tracedecay-code-index/full"]
# Forwards the kernel test-transport seam so this crate's unit tests can
# reach `Database::publish_test_runtime` / `DatabaseAuthority::acquire_test`.
test-transport = ["tracedecay-runtime-core/test-transport"]
test-helpers = [
    "tracedecay-code-index/test-helpers",
    "tracedecay-global-db/test-helpers",
    "tracedecay-graph-db/test-helpers",
    "tracedecay-runtime-core/test-helpers",
    "tracedecay-application/test-helpers",
]

[dependencies]
futures-util = "0.3.33"
gix = { version = "=0.87.1", default-features = false, features = [
    "revision",
    "blob-diff",
    "parallel",
    "sha1",
    "sha256",
    "status",
] }
# `tokio` always: `hotpath::wrap::tokio::sync::Mutex` names the lock type in
# both modes (the plain tokio mutex until a binary selects the backend).
hotpath = { workspace = true, features = ["tokio"] }
rayon = "1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
walkdir = "2"

tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-code-index-retention = { path = "../tracedecay-code-index-retention" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-graph-query = { path = "../tracedecay-graph-query" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tracedecay-policy = { path = "../tracedecay-policy" }
tracedecay-privacy = { path = "../tracedecay-privacy" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-query = { path = "../tracedecay-query" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store" }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracedecay-application = { path = "../tracedecay-application" }

[target.'cfg(unix)'.dependencies]
notify = "6"

[dev-dependencies]
filetime = "0.2"
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = [
    "test-helpers",
    "lite",
] }
tracedecay-configuration = { path = "../tracedecay-configuration" }
tracedecay-global-db = { path = "../tracedecay-global-db", features = [
    "test-helpers",
] }
tracedecay-graph-db = { path = "../tracedecay-graph-db", features = [
    "test-helpers",
] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = [
    "test-helpers",
] }
tracedecay-application = { path = "../tracedecay-application", features = [
    "test-helpers",
] }
