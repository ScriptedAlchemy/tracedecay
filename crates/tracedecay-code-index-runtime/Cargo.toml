[package]
name = "tracedecay-code-index-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Daemon code-index scheduler, git watch, git transactions, and semantic evaluation runtime"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
# Type-coupled: `git_index_transactions::ProfiledFile` names the on-mode
# `hotpath::io::InstrumentedIo` (hotpath 0.24 has no mode-agnostic `wrap`
# alias for I/O), so any build that selects the backend with this crate in
# its graph must select this feature too.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
lite = [
    "tracedecay-code-extraction/lite",
    "tracedecay-code-index/lite",
    "tracedecay-search-eval/lite",
]
full = ["tracedecay-code-extraction/full", "tracedecay-code-index/full"]
semantic-fastembed = [
    "tracedecay-semantic/semantic-fastembed",
    "tracedecay-application/semantic-fastembed",
]
semantic-model2vec = [
    "tracedecay-semantic/semantic-model2vec",
    "tracedecay-application/semantic-model2vec",
]
# Forwards the kernel test-transport seam so this crate's unit tests can
# reach `Database::publish_test_runtime` / `DatabaseAuthority::acquire_test`.
test-transport = ["tracedecay-runtime-core/test-transport"]
test-helpers = [
    "tracedecay-code-index/test-helpers",
    "tracedecay-global-db/test-helpers",
    "tracedecay-graph-db/test-helpers",
    "tracedecay-runtime-core/test-helpers",
    "tracedecay-semantic/test-helpers",
    "tracedecay-application/test-helpers",
]

[dependencies]
futures-util = "0.3.33"
gix = { version = "=0.86.0", default-features = false, features = [
    "revision",
    "blob-diff",
    "parallel",
    "sha1",
    "sha256",
    "status",
] }
# `tokio` always: `hotpath::wrap::tokio::sync::Mutex` names the lock type in
# both modes (the plain tokio mutex until a binary selects the backend).
hotpath = { workspace = true, features = ["tokio"] }
rayon = "1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
walkdir = "2"

tracedecay-contracts = { path = "../tracedecay-contracts", version = "0.1.0" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", version = "0.1.0", default-features = false }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-code-index-retention = { path = "../tracedecay-code-index-retention", version = "0.1.0" }
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0" }
tracedecay-graph-db = { path = "../tracedecay-graph-db", version = "0.1.0" }
tracedecay-graph-query = { path = "../tracedecay-graph-query", version = "0.1.0" }
tracedecay-lsp = { path = "../tracedecay-lsp", version = "0.1.0" }
tracedecay-policy = { path = "../tracedecay-policy", version = "0.1.0" }
tracedecay-privacy = { path = "../tracedecay-privacy", version = "0.1.0" }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-search-eval = { path = "../tracedecay-search-eval", version = "0.1.0" }
tracedecay-semantic = { path = "../tracedecay-semantic", version = "0.1.0" }
tracedecay-semantic-contracts.workspace = true
tracedecay-session-memory = { path = "../tracedecay-session-memory", version = "0.1.0" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }

[target.'cfg(unix)'.dependencies]
notify = "6"

[dev-dependencies]
filetime = "0.2"
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false, features = [
    "test-helpers",
    "lite",
] }
tracedecay-configuration = { path = "../tracedecay-configuration", version = "0.1.0" }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0", features = [
    "test-helpers",
] }
tracedecay-graph-db = { path = "../tracedecay-graph-db", version = "0.1.0", features = [
    "test-helpers",
] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = [
    "test-helpers",
] }
tracedecay-semantic = { path = "../tracedecay-semantic", version = "0.1.0", features = [
    "test-helpers",
] }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0", features = [
    "test-helpers",
] }
