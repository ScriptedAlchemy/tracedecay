[package]
name = "tracedecay-graph-query"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "Generation-pinned verified code-graph queries and code-index-backed source readers"

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-tokenizer = { path = "../tracedecay-tokenizer" }
tracing.workspace = true

[features]
# Explicit opt-in: exposes the fixture-only `VerifiedGraphQuery`
# constructors (`from_fixture_reader`, `with_source`) to dependent crates'
# test builds. Never part of `default`.
test-helpers = []

[dev-dependencies]
asupersync.workspace = true
tempfile.workspace = true
# Isolated crate tests need a grammar bundle so the patched Rust grammar
# registers (`ts_provider` only serves Rust alongside a bundle). Production
# callers already unify `lite`/`full` through the composition root.
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false, features = ["lite"] }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
