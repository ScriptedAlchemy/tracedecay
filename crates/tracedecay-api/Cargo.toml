[package]
name = "tracedecay-api"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Thin HTTP/SSE adapter over TraceDecay application contracts"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
axum.workspace = true
flate2.workspace = true
futures-util = "0.3"
http_encoding_headers = { version = "0.2", default-features = false }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
