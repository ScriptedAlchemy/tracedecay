[package]
name = "tracedecay-api"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Thin HTTP/SSE adapter over TraceDecay application contracts"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
axum = "0.8"
flate2 = "1"
futures-util = "0.3"
http_encoding_headers = { version = "0.2", default-features = false }
schemars.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
