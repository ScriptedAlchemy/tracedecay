[package]
name = "tracedecay-automation-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "TraceDecay automation runner, ledger, scheduler, and managed-skill runtime"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
default = []
# Forwards the kernel test-transport seam so this crate's unit tests can
# reach `Database::publish_test_runtime` / `DatabaseAuthority::acquire_test`.
test-transport = ["tracedecay-runtime-core/test-transport"]
test-helpers = [
    "tracedecay-global-db/test-helpers",
    "tracedecay-runtime-core/test-helpers",
]

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
getrandom.workspace = true
hex.workspace = true
rustls = { workspace = true, features = [
    "ring",
    "std",
    "tls12",
] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tracing.workspace = true
url.workspace = true
webpki-roots = "1"

tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-hooks = { path = "../tracedecay-hooks" }
tracedecay-policy = { path = "../tracedecay-policy" }
tracedecay-privacy = { path = "../tracedecay-privacy" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store" }
tracedecay-lcm = { path = "../tracedecay-lcm" }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# Dev-only cycle: materialization tests bind the production host-config write
# surface that agent-hosts registers at process start.
tracedecay-agent-hosts = { path = "../tracedecay-agent-hosts" }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
