[package]
name = "tracedecay-domain"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Pure domain contracts for TraceDecay V2"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[dependencies]
hotpath.workspace = true
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
url = "2"

[dev-dependencies]
# Canonical serialization must stay byte-identical to `serde_json::to_value`
# even for the private `RawValue` struct token, which needs the feature on to
# exercise.
serde_json = { version = "1", features = ["raw_value"] }
