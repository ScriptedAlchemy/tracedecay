[package]
name = "tracedecay-daemon-identity"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Daemon authority records, profile identity, and credential discovery for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
hotpath.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracedecay-contracts = { path = "../tracedecay-contracts", version = "0.1.0" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
