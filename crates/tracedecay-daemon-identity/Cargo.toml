[package]
name = "tracedecay-daemon-identity"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Daemon authority records, profile identity, and credential discovery for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
