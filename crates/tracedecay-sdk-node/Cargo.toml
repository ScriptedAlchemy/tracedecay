[package]
name = "tracedecay-sdk-node"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Node-API binding that runs the Rust SDK lifecycle protocol for @tracedecay/sdk"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

# Node loads the addon; nothing links it as a Rust library. Its behavior is
# proven through the TypeScript package's conformance suite.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
napi = { version = "3.15.0", default-features = false, features = ["napi8", "dyn-symbols", "async"] }
napi-derive = "3.6.13"
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }
tokio-util.workspace = true
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-sdk = { path = "../tracedecay-sdk" }

[build-dependencies]
napi-build = "2.6.0"
