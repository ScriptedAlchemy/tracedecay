[package]
name = "tracedecay-code-index"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "TraceDecay language extraction and code-index kernel"
include = ["/src/**"]

[features]
default = [
    "lite",
    "medium",
    "full",
]
# Markdown is admitted by every tier, not just `full` — see the note on the
# extraction crate's `lite` feature.
lite = ["tracedecay-code-extraction/lite", "lang-markdown"]
medium = ["lang-dart", "lang-pascal", "lang-php", "lang-ruby", "lang-bash", "lang-protobuf", "lang-powershell", "lang-nix", "lang-vbnet"]
full = ["medium", "lang-lua", "lang-zig", "lang-objc", "lang-perl", "lang-batch", "lang-fortran", "lang-cobol", "lang-msbasic2", "lang-gwbasic", "lang-qbasic", "lang-dockerfile", "lang-glsl", "lang-wgsl", "lang-hlsl", "lang-metal", "lang-markdown", "lang-r", "lang-sql", "lang-julia", "lang-haskell", "lang-ocaml", "lang-clojure", "lang-erlang", "lang-elixir", "lang-fsharp", "lang-quint", "lang-toml", "lang-lean"]
test-helpers = ["tracedecay-graph-db/test-helpers"]
eval-helpers = ["tracedecay-graph-db/eval-helpers"]
lang-dart = ["tracedecay-code-extraction/lang-dart"]
lang-pascal = ["tracedecay-code-extraction/lang-pascal"]
lang-php = ["tracedecay-code-extraction/lang-php"]
lang-ruby = ["tracedecay-code-extraction/lang-ruby"]
lang-bash = ["tracedecay-code-extraction/lang-bash"]
lang-protobuf = ["tracedecay-code-extraction/lang-protobuf"]
lang-powershell = ["tracedecay-code-extraction/lang-powershell"]
lang-nix = ["tracedecay-code-extraction/lang-nix"]
lang-vbnet = ["tracedecay-code-extraction/lang-vbnet"]
lang-lua = ["tracedecay-code-extraction/lang-lua"]
lang-zig = ["tracedecay-code-extraction/lang-zig"]
lang-objc = ["tracedecay-code-extraction/lang-objc"]
lang-perl = ["tracedecay-code-extraction/lang-perl"]
lang-batch = ["tracedecay-code-extraction/lang-batch"]
lang-fortran = ["tracedecay-code-extraction/lang-fortran"]
lang-cobol = ["tracedecay-code-extraction/lang-cobol"]
lang-msbasic2 = ["tracedecay-code-extraction/lang-msbasic2"]
lang-gwbasic = ["tracedecay-code-extraction/lang-gwbasic"]
lang-qbasic = ["tracedecay-code-extraction/lang-qbasic"]
lang-dockerfile = ["tracedecay-code-extraction/lang-dockerfile"]
lang-glsl = ["tracedecay-code-extraction/lang-glsl"]
lang-wgsl = ["tracedecay-code-extraction/lang-wgsl"]
lang-hlsl = ["tracedecay-code-extraction/lang-hlsl"]
lang-metal = ["tracedecay-code-extraction/lang-metal"]
lang-markdown = ["tracedecay-code-extraction/lang-markdown"]
lang-r = ["tracedecay-code-extraction/lang-r"]
lang-sql = ["tracedecay-code-extraction/lang-sql"]
lang-julia = ["tracedecay-code-extraction/lang-julia"]
lang-haskell = ["tracedecay-code-extraction/lang-haskell"]
lang-ocaml = ["tracedecay-code-extraction/lang-ocaml"]
lang-clojure = ["tracedecay-code-extraction/lang-clojure"]
lang-erlang = ["tracedecay-code-extraction/lang-erlang"]
lang-elixir = ["tracedecay-code-extraction/lang-elixir"]
lang-fsharp = ["tracedecay-code-extraction/lang-fsharp"]
lang-quint = ["tracedecay-code-extraction/lang-quint"]
lang-toml = ["tracedecay-code-extraction/lang-toml"]
lang-lean = ["tracedecay-code-extraction/lang-lean"]

[dependencies]
ast-grep-core = "0.44"
hex = "0.4"
ignore = "0.4"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", version = "0.1.0", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-graph-db = { path = "../tracedecay-graph-db", version = "0.1.0" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
tempfile = "3"
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", version = "0.1.0", features = ["test-helpers"] }
tracedecay-graph-db = { path = "../tracedecay-graph-db", version = "0.1.0", features = ["test-helpers"] }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
tree-sitter = "0.26"

[[bench]]
name = "code_index_chunks"
harness = false
test = false

[[bench]]
name = "retained_parse"
harness = false
test = false

[[bench]]
name = "source_search"
harness = false
test = false

[[bench]]
name = "git_ancestry"
harness = false
test = false
