[package]
name = "tracedecay-source-edit"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Durable source-edit preview, apply, rollback, and reconciliation"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
hotpath.workspace = true
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracedecay-contracts = { path = "../tracedecay-contracts", version = "0.1.0" }
# Grammar-free entry only: the admitted graph handle wraps the interactive
# reader, so no tree-sitter bundle is linked into this crate.
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-graph-db = { path = "../tracedecay-graph-db", version = "0.1.0" }
tracedecay-graph-query = { path = "../tracedecay-graph-query", version = "0.1.0" }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
# Test-only helper surfaces reached across crate boundaries by this crate's
# test targets. Feature unification supplies them to the test build only.
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false, features = ["test-helpers"] }
