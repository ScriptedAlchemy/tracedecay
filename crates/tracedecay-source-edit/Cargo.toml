[package]
name = "tracedecay-source-edit"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Durable source-edit preview, apply, rollback, and reconciliation"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
gix = { version = "=0.87.1", default-features = false, features = ["revision", "blob-diff", "parallel", "sha1", "sha256", "status"] }
hotpath.workspace = true
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tree-sitter = "0.26"
tracing = "0.1"
tracedecay-contracts = { path = "../tracedecay-contracts" }
# The admitted graph handle wraps the interactive reader. Move-symbol import
# analysis needs the Rust grammar so `try_language("rust")` is registered.
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false, features = ["lite"] }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-graph-query = { path = "../tracedecay-graph-query" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Test-only helper surfaces reached across crate boundaries by this crate's
# test targets. Feature unification supplies them to the test build only.
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = ["test-helpers"] }
