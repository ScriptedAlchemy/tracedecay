[package]
name = "tracedecay-dashboard-api"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
description = "Shared HTTP and SQL helpers for the TraceDecay dashboard API"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
axum = "0.8"
libsql = "0.9.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
