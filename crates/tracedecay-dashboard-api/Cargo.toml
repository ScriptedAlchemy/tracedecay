[package]
name = "tracedecay-dashboard-api"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "HTTP dashboard API surface (routes, read models and services) for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
axum = "0.8"
hotpath.workspace = true
schemars = "1.2.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiktoken-rs = { version = "0.12", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tracing = "0.1"
tracedecay-api = { path = "../tracedecay-api", version = "0.1.0" }
tracedecay-automation = { path = "../tracedecay-automation", version = "0.1.0" }
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime", version = "0.1.0" }
tracedecay-contracts = { path = "../tracedecay-contracts", version = "0.1.0" }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-configuration = { path = "../tracedecay-configuration", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0" }
tracedecay-graph-db = { path = "../tracedecay-graph-db", version = "0.1.0" }
tracedecay-graph-query = { path = "../tracedecay-graph-query", version = "0.1.0" }
tracedecay-hooks = { path = "../tracedecay-hooks", version = "0.1.0" }
tracedecay-lsp = { path = "../tracedecay-lsp", version = "0.1.0" }
tracedecay-privacy = { path = "../tracedecay-privacy", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-semantic-contracts.workspace = true
tracedecay-session-memory = { path = "../tracedecay-session-memory", version = "0.1.0" }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
hotpath = ["hotpath/hotpath", "hotpath/axum-0-8"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
default = []
# Mirrors the root crate's features; the root forwards its own selections here.
# Exact BPE counting lives in this crate (`tiktoken-rs`); no agent-hosts forward.
token-counting = ["dep:tiktoken-rs"]
test-transport = [
    "tracedecay-automation-runtime/test-transport",
]

[dev-dependencies]
tempfile = "3"
# The dashboard lib-test target owns registered-store and engine fixtures.
# Dev-only feature unification keeps those helpers out of production builds.
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
