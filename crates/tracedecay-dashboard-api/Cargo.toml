[package]
name = "tracedecay-dashboard-api"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
description = "Dashboard HTTP routes, read models, and services for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
axum = "0.8"
dirs = "6"
glob = "0.3"
libsql = "0.9.30"
open = "5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = { version = "0.12", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
tracedecay-agent-hosts = { path = "../tracedecay-agent-hosts" }
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-usecases = { path = "../tracedecay-usecases" }

[features]
default = []
token-counting = ["dep:tiktoken-rs"]
test-transport = []

[dev-dependencies]
tempfile = "3"
