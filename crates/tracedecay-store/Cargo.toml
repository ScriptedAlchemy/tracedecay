[package]
name = "tracedecay-store"
version = "0.1.0"
publish = false
edition.workspace = true
description = "Store-facing persistence contracts for TraceDecay"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
flate2.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query" }
tracing.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }
