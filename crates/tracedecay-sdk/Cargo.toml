[package]
name = "tracedecay-sdk"
version = "0.1.0"
publish = false
edition.workspace = true
autobins = false
license = "MIT"
description = "Native Rust lifecycle client for canonical TraceDecay operations"
readme = "README.md"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracedecay-api = { path = "../tracedecay-api" }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracing = "0.1"

# `build.rs` renders `src/operations.rs` from the canonical registry through
# `src/codegen.rs`. These mirror the runtime dependencies the descriptors are
# projected from; no crate here depends on this one, so there is no cycle.
[build-dependencies]
serde_json = "1"
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"

# The TypeScript codegen binary is compiled by sdks/codegen via a [[bin]] path
# reference; it is intentionally not a target of this crate (autobins = false).
[package.metadata.cargo-shear]
ignored-paths = ["src/bin/generate.rs"]
