[package]
name = "tracedecay-sdk"
version = "0.1.0"
publish = false
edition.workspace = true
autobins = false
license = "MIT"
description = "Native Rust lifecycle client for canonical TraceDecay operations"
readme = "README.md"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Not for anything this crate measures: `build.rs` pulls contracts and
# tool-catalog into the *host* context, where their `#[hotpath::measure]`
# sites expand through the one `hotpath-macros` build cargo shares with the
# target context. Resolver 3 keeps host and target `hotpath` lib features
# apart, so whichever backend a binary selects must be mirrored onto the
# build-dependency below or the host-side expansion references items the
# host `hotpath` lib does not have. Roots forward these alongside their own.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[dependencies]
hotpath.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracedecay-api = { path = "../tracedecay-api", version = "0.1.0" }
tracedecay-contracts = { path = "../tracedecay-contracts", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }

# `build.rs` renders `src/operations.rs` from the canonical registry through
# `src/codegen.rs`. These mirror the runtime dependencies the descriptors are
# projected from; no crate here depends on this one, so there is no cycle.
[build-dependencies]
# `hotpath` is not used by build.rs itself; it is the host-context handle the
# `hotpath*` features above forward the selected backend onto (see there).
hotpath.workspace = true
serde_json = "1"
tracedecay-contracts = { path = "../tracedecay-contracts", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"

# The TypeScript codegen binary is compiled by sdks/codegen via a [[bin]] path
# reference; it is intentionally not a target of this crate (autobins = false).
[package.metadata.cargo-shear]
ignored = ["hotpath"]
ignored-paths = ["src/bin/generate.rs"]
