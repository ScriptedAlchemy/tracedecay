[package]
name = "tracedecay-sdk"
version = "0.1.0"
publish = false
edition.workspace = true
autobins = false
license = "MIT"
description = "Native Rust lifecycle client for canonical TraceDecay operations"
readme = "README.md"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracing.workspace = true

[dev-dependencies]
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tempfile.workspace = true

# The TypeScript codegen binary is compiled by //sdks/codegen:generate;
# it is intentionally not a Cargo target of this crate (autobins = false).
[package.metadata.cargo-shear]
ignored-paths = ["src/bin/generate.rs"]
