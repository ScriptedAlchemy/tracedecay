[package]
name = "tracedecay-storage-parity"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Golden receipt trace and logical dump that pin owned-store behavior across storage engines"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dev-dependencies]
hex = "0.4"
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers", "test-transport"] }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
tracedecay-sql = { path = "../tracedecay-sql" }
tracedecay-store = { path = "../tracedecay-store" }
