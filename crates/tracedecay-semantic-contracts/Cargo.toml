[package]
name = "tracedecay-semantic-contracts"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "Provider-free semantic configuration, artifact, lifecycle, and runtime contracts"
include = ["/src/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
