[package]
name = "tracedecay-mcp"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Portable MCP catalog, rendering, and JSON-RPC transport for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
# Type-coupled: `transport::ProfiledStdin`/`ProfiledStdout` name the on-mode
# `hotpath::io::InstrumentedIo` (hotpath 0.24 has no mode-agnostic `wrap`
# alias for I/O), so any build that selects the backend with this crate in
# its graph must select this feature too.
hotpath = ["hotpath/hotpath"]
# Gates in-memory ChannelTransport. ReplayTransport stays on the default
# graph because production initialize-root replay uses it.
test-transport = []
# Source-parsing analysis (field receiver typing, the unmounted-files
# handler) needs the canonical Rust and TypeScript grammar tier. The
# composition root mounts this production feature where that tier is already
# part of the shipped code-index closure.
source-analysis = ["tracedecay-code-extraction/lite"]

[dependencies]
gix.workspace = true
glob = "0.3"
hotpath.workspace = true
libc = "0.2"
rmcp = { version = "3.0.1", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
toml = "1"
tracedecay-api = { path = "../tracedecay-api", version = "0.1.0" }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-contracts = { path = "../tracedecay-contracts", version = "0.1.0" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", version = "0.1.0", default-features = false }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false, features = ["lite"] }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", version = "0.1.0" }
tracedecay-configuration = { path = "../tracedecay-configuration", version = "0.1.0" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol", version = "0.1.0" }
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-framing = { path = "../tracedecay-framing", version = "0.1.0" }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0" }
tracedecay-graph-query = { path = "../tracedecay-graph-query", version = "0.1.0" }
tracedecay-hooks = { path = "../tracedecay-hooks", version = "0.1.0" }
tracedecay-privacy = { path = "../tracedecay-privacy", version = "0.1.0" }
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-session-memory = { path = "../tracedecay-session-memory", version = "0.1.0" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store", version = "0.1.0" }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
tracedecay-store-runtime = { path = "../tracedecay-store-runtime", version = "0.1.0" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }
tracing = "0.1"
tree-sitter = "0.26"

[dev-dependencies]
rmcp = { version = "3.0.1", default-features = false, features = ["client", "server", "transport-async-rw"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity", version = "0.1.0" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol", version = "0.1.0", features = ["test-helpers"] }
tracedecay-framing = { path = "../tracedecay-framing", version = "0.1.0", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0", features = ["test-helpers"] }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0", features = ["test-helpers"] }
