[package]
name = "tracedecay-mcp"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Portable MCP catalog, rendering, and JSON-RPC transport for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
# `transport::ProfiledStdin`/`ProfiledStdout` erase the stdio halves behind a
# trait object, so no type here names hotpath's on-mode `InstrumentedIo` and
# selecting the backend without this feature still compiles. `hotpath/tokio`
# supplies the async I/O impls the instrumented halves are stored as.
hotpath = ["hotpath/hotpath", "hotpath/tokio"]
# Gates in-memory ChannelTransport. ReplayTransport stays on the default
# graph because production initialize-root replay uses it.
test-transport = []
# Cross-crate fixture surface: the session-authority composition over the
# registered host-admission test runtime. Production code is never gated by it.
test-helpers = ["tracedecay-project/test-helpers"]
# Source-parsing analysis (field receiver typing, the unmounted-files
# handler) needs the canonical Rust and TypeScript grammar tier. The
# composition root mounts this production feature where that tier is already
# part of the shipped code-index closure.
source-analysis = ["tracedecay-code-extraction/lite"]

[dependencies]
futures-util = "0.3.33"
gix.workspace = true
glob = "0.3"
hex = "0.4"
hotpath.workspace = true
libc = "0.2"
rmcp = { version = "3.0.1", default-features = false, features = ["server"] }
# The multi-root execute tool derives its input schema from the contracts DTO.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
toml = "1"
tracedecay-agent-hosts = { path = "../tracedecay-agent-hosts" }
tracedecay-api = { path = "../tracedecay-api" }
tracedecay-application = { path = "../tracedecay-application" }
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime" }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = ["lite"] }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime" }
tracedecay-configuration = { path = "../tracedecay-configuration" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tracedecay-daemon-service = { path = "../tracedecay-daemon-service" }
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-framing = { path = "../tracedecay-framing" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-graph-query = { path = "../tracedecay-graph-query" }
tracedecay-hooks = { path = "../tracedecay-hooks" }
tracedecay-host-admission = { path = "../tracedecay-host-admission" }
tracedecay-lcm = { path = "../tracedecay-lcm" }
tracedecay-maintenance = { path = "../tracedecay-maintenance" }
tracedecay-mcp-catalog = { path = "../tracedecay-mcp-catalog" }
tracedecay-privacy = { path = "../tracedecay-privacy" }
tracedecay-project = { path = "../tracedecay-project" }
tracedecay-query = { path = "../tracedecay-query" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-session-runtime = { path = "../tracedecay-session-runtime" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-store-runtime = { path = "../tracedecay-store-runtime" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracing = "0.1"
tree-sitter = "0.26"
url = "2"

[dev-dependencies]
rmcp = { version = "3.0.1", default-features = false, features = ["client", "server", "transport-async-rw"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol", features = ["test-helpers"] }
# The dashboard LCM adapter's unit tests build request controls through the
# dashboard-api test-transport constructor.
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api", features = ["test-transport"] }
tracedecay-framing = { path = "../tracedecay-framing", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
# The moved handler tests open projects through the registered test runtime
# and the explicit `TraceDecay::*_for_test` constructors.
tracedecay-project = { path = "../tracedecay-project", features = ["test-helpers"] }
tracedecay-sessions = { path = "../tracedecay-sessions", features = ["test-helpers"] }
