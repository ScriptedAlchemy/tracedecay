[package]
name = "tracedecay-privacy"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay privacy authority: credential detection, record sanitization, and protected structural identifiers"

[features]
default = []

[dependencies]
aho-corasick = "1.1.5"
jsonc-parser.workspace = true
percent-encoding = "2"
# The engine `regex` wraps, with the features `regex` enables by default. Used
# directly for its explicit search caches (see `rules.rs`).
regex-automata = { version = "0.4.18", default-features = false, features = [
    "std",
    "syntax",
    "meta",
    "nfa-pikevm",
    "nfa-backtrack",
    "hybrid",
    "dfa-onepass",
    "perf",
    "unicode",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracedecay-capture = { path = "../tracedecay-capture" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-store = { path = "../tracedecay-store" }
url.workspace = true

[dev-dependencies]
asupersync.workspace = true
hex.workspace = true
tempfile.workspace = true
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-store-runtime = { path = "../tracedecay-store-runtime", features = ["test-helpers"] }
