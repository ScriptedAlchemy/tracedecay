[package]
name = "tracedecay-framing"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Bounded wire-frame limits, readers, and oversized-frame errors for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
async-channel.workspace = true
tracing.workspace = true
