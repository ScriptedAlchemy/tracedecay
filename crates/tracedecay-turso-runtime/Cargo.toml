[package]
name = "tracedecay-turso-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Guarded native Turso execution for TraceDecay storage and search"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
turso_core.workspace = true
turso_parser.workspace = true
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-domain = { path = "../tracedecay-domain" }

[dev-dependencies]
tempfile = "3"
