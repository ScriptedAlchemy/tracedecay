[package]
name = "tracedecay-sqlite-parity-protocol"
version = "0.1.0"
publish = false
edition.workspace = true
description = "Driver-free wire DTOs for TraceDecay SQLite parity probes"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
