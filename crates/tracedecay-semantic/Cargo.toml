[package]
name = "tracedecay-semantic"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay semantic code runtime: artifact store, model lifecycle, and embedding projection"
include = ["/src/**"]

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
hotpath.workspace = true
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-semantic-contracts.workspace = true
url = "2"
hf-hub = { version = "0.5", optional = true, default-features = false, features = ["ureq", "rustls-tls"] }
# Model2Vec static-embedding runtime (`model2vec_adapter.rs`): a safetensors
# token-embedding table summed and L2-normalized in-process, with no ONNX
# Runtime. All three crates already sit in `Cargo.lock` as FastEmbed
# transitive dependencies, so enabling them adds no new lock entries; they
# are still optional so a build that wants neither embedding backend links
# neither. `tokenizers` mirrors FastEmbed's exact feature selection
# (`onig`, no defaults) so feature unification never changes the FastEmbed
# tokenizer build. Exact pins keep `MODEL2VEC_RUNTIME_BUILD_REVISION_V1`
# truthful; a version bump must bump that revision so vector generations
# replay under the new identity.
half = { version = "=2.7.1", optional = true, default-features = false, features = ["std"] }
safetensors = { version = "=0.8.0", optional = true, default-features = false, features = ["std"] }
tokenizers = { version = "=0.22.2", optional = true, default-features = false, features = ["onig"] }

[target.'cfg(not(windows))'.dependencies]
# Library-first FastEmbed: disable hub/image defaults so the adapter can only
# construct from local verified artifact bytes (no model-hub / cache discovery).
# FastEmbed's bundled ORT backend is unsupported on Windows, where the typed
# unavailable runtime is compiled instead. Keep this exact runtime pin
# synchronized with `FASTEMBED_RUNTIME_BUILD_REVISION_V1`; FastEmbed 5.17.3
# itself pins ORT rc.12.
fastembed = { version = "=5.17.3", optional = true, default-features = false }
# GPU execution providers (Plan 31 follow-up, strictly opt-in). Pinned to the
# exact `ort` version FastEmbed 5.17.3 depends on so Cargo unifies it into the
# same compiled instance.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false }
# WARN-level fallback logging when a requested GPU execution provider is
# unavailable. Only the non-Windows FastEmbed runtime needs it.
tracing = { version = "0.1", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
fsys = "1.1.0"

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
hotpath = ["hotpath/hotpath"]
# SEMANTIC FastEmbed adapter (Plan 31). On non-Windows targets it bundles ORT
# while leaving FastEmbed's image defaults disabled. Windows keeps this feature
# name for production feature-set compatibility but compiles the typed
# unavailable backend and no FastEmbed/ORT dependency.
semantic-fastembed = [
    "dep:fastembed",
    "dep:hf-hub",
    "dep:tracing",
    "fastembed/ort-download-binaries-rustls-tls",
    "fastembed/hf-hub-rustls-tls",
]
# GPU execution providers for the FastEmbed/ORT runtime. A compiled provider is
# selected automatically on its supported platform; the environment can force
# CPU or explicitly request a provider. Missing runtime support falls back to
# CPU without failing the session (see `execution_provider.rs`).
semantic-gpu-coreml = ["semantic-fastembed", "dep:ort", "ort/coreml", "ort/tracing"]
semantic-gpu-cuda = ["semantic-fastembed", "dep:ort", "ort/cuda", "ort/tracing"]
# SEMANTIC Model2Vec static-embedding runtime. Independent of
# `semantic-fastembed`: a build may ship either backend or both, and the
# catalog entry's declared backend selects which runtime serves a model. The
# daemon-owned hf-hub acquisition is shared by both backends, so this feature
# pulls `hf-hub` too; without it a Model2Vec model could be selected but never
# acquired. Inference still loads only locally verified member bytes.
semantic-model2vec = ["dep:half", "dep:hf-hub", "dep:safetensors", "dep:tokenizers"]
# Explicit opt-in (same policy as the query kernel): exposes the pooled-session
# and catalog test constructors to dependent crates' test builds only.
test-helpers = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
