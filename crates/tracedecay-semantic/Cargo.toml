[package]
name = "tracedecay-semantic"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay semantic code runtime: artifact store, model lifecycle, and embedding projection"
include = ["/src/**"]

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
hotpath.workspace = true
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-semantic-contracts.workspace = true
url = "2"
# Library-first FastEmbed: disable hub/image defaults so the adapter can only
# construct from local verified artifact bytes (no model-hub / cache discovery).
# The `semantic-fastembed` feature adds the bundled ORT runtime and hf-hub
# acquisition separately. Keep this exact runtime pin synchronized with
# `FASTEMBED_RUNTIME_BUILD_REVISION_V1`; FastEmbed 5.17.3 itself pins ORT rc.12.
fastembed = { version = "=5.17.3", optional = true, default-features = false }
hf-hub = { version = "0.5", optional = true, default-features = false, features = ["ureq", "rustls-tls"] }
# GPU execution providers (Plan 31 follow-up, strictly opt-in). Pinned to the
# exact `ort` version FastEmbed 5.17.3 depends on so Cargo unifies it into the
# same compiled instance: activating `ort/coreml` or `ort/cuda` here turns
# those execution providers on for FastEmbed's own session builder too,
# without this crate touching FastEmbed's session-construction code path.
# `default-features = false` keeps this from re-enabling anything (tls,
# download-binaries, tracing) beyond what `semantic-fastembed` already asks
# for; only the `semantic-gpu-coreml` / `semantic-gpu-cuda` features pull it
# in at all.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false }
# WARN-level fallback logging when a requested GPU execution provider is
# unavailable (missing feature, unsupported platform, or a probe failure).
# Only compiled with `semantic-fastembed`; the stub runtime path never needs
# it.
tracing = { version = "0.1", optional = true, default-features = false }
# Model2Vec static-embedding runtime (`model2vec_adapter.rs`): a safetensors
# token-embedding table summed and L2-normalized in-process, with no ONNX
# Runtime. All three crates already sit in `Cargo.lock` as FastEmbed
# transitive dependencies, so enabling them adds no new lock entries; they
# are still optional so a build that wants neither embedding backend links
# neither. `tokenizers` mirrors FastEmbed's exact feature selection
# (`onig`, no defaults) so feature unification never changes the FastEmbed
# tokenizer build. Exact pins keep `MODEL2VEC_RUNTIME_BUILD_REVISION_V1`
# truthful; a version bump must bump that revision so vector generations
# replay under the new identity.
half = { version = "=2.7.1", optional = true, default-features = false, features = ["std"] }
safetensors = { version = "=0.8.0", optional = true, default-features = false, features = ["std"] }
tokenizers = { version = "=0.22.2", optional = true, default-features = false, features = ["onig"] }

[target.'cfg(windows)'.dependencies]
fsys = "1.1.0"

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
# This crate has no reqwest 0.12 client, so `hotpath/reqwest-0-12` and
# `hotpath::http!` stay unused; download vs decode are timed separately.
hotpath = [
    "tracedecay-domain/hotpath",
    "hotpath/hotpath",
    "tracedecay-code-index/hotpath",
    "tracedecay-query/hotpath",
    "tracedecay-runtime-core/hotpath",
]
hotpath-alloc = [
    "tracedecay-domain/hotpath-alloc",
    "hotpath",
    "hotpath/hotpath-alloc",
    "tracedecay-code-index/hotpath-alloc",
    "tracedecay-query/hotpath-alloc",
    "tracedecay-runtime-core/hotpath-alloc",
]
hotpath-cpu = [
    "tracedecay-domain/hotpath-cpu",
    "hotpath",
    "hotpath/hotpath-cpu",
    "tracedecay-code-index/hotpath-cpu",
    "tracedecay-query/hotpath-cpu",
    "tracedecay-runtime-core/hotpath-cpu",
]
# SEMANTIC FastEmbed adapter (Plan 31). Bundles ORT while leaving FastEmbed's
# image defaults disabled. Runtime inference still loads only from locally
# verified artifact bytes; daemon-owned acquisition uses hf-hub against the
# immutable catalog pins, never query-time ambient cache discovery.
semantic-fastembed = [
    "dep:fastembed",
    "dep:hf-hub",
    "dep:tracing",
    "fastembed/ort-download-binaries-rustls-tls",
    "fastembed/hf-hub-rustls-tls",
]
# Opt-in GPU execution providers for the FastEmbed/ORT runtime (owner request:
# CoreML on macOS, CUDA on Linux). Neither feature is in `default`, and
# compiling one in changes nothing by itself: the adapter only registers the
# execution provider when `TRACEDECAY_EMBED_EXECUTION_PROVIDER=coreml|cuda`
# also selects it at runtime (default `cpu`), so a default build — and a
# GPU-featured build left at the default env — stays byte-identical to the
# CPU-only adapter. A missing platform/driver/library falls back to the CPU
# execution provider with a WARN log; it never fails the session (see
# `execution_provider.rs`).
semantic-gpu-coreml = ["semantic-fastembed", "dep:ort", "ort/coreml", "ort/tracing"]
semantic-gpu-cuda = ["semantic-fastembed", "dep:ort", "ort/cuda", "ort/tracing"]
# SEMANTIC Model2Vec static-embedding runtime. Independent of
# `semantic-fastembed`: a build may ship either backend or both, and the
# catalog entry's declared backend selects which runtime serves a model. The
# daemon-owned hf-hub acquisition is shared by both backends, so this feature
# pulls `hf-hub` too; without it a Model2Vec model could be selected but never
# acquired. Inference still loads only locally verified member bytes.
semantic-model2vec = ["dep:half", "dep:hf-hub", "dep:safetensors", "dep:tokenizers"]
# Explicit opt-in (same policy as the query kernel): exposes the pooled-session
# and catalog test constructors to dependent crates' test builds only.
test-helpers = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
