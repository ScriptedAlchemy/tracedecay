[package]
name = "tracedecay-jsonrpc"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "JSON-RPC 2.0 contracts for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[dependencies]
hotpath.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
