[package]
name = "tracedecay-configuration"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Transport-neutral configuration control plane and runtime pin surfaces"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
# In-process pin cache and setting publication for tests that drive
# configuration-gated runtime paths (for example LCM summarizer executables)
# without the composition root's cache. Production code is never gated by it.
test-helpers = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-lcm = { path = "../tracedecay-lcm" }
tracedecay-policy = { path = "../tracedecay-policy" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracing.workspace = true

[dev-dependencies]
asupersync.workspace = true
tempfile.workspace = true
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
