[package]
name = "tracedecay-graph-db"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Embedded graph and vector storage boundary for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
include = ["/src/**"]

[dependencies]
grafeo-adapters = { version = "=0.5.42", default-features = false, features = ["algos"] }
grafeo-common = { version = "=0.5.42", default-features = false }
grafeo-core = { version = "=0.5.42", default-features = false, features = ["lpg", "vector-index"] }
grafeo-engine = { version = "=0.5.42", default-features = false, features = ["lpg", "gql", "algos", "wal", "grafeo-file", "vector-index"] }
hex = "0.4"
parking_lot = { version = "0.12", features = ["arc_lock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "native_state_100k"
harness = false
