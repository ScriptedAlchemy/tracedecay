[package]
name = "tracedecay-graph-db"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Embedded graph storage boundary for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
include = ["/src/**"]

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
test-helpers = []
eval-helpers = []

# Opt-in tiered graph storage (never in `default`).
#
# Split in two on purpose, because grafeo 0.5.42 bundles two unrelated
# things under the "tiered" name and only one of them is usable here.
#
# `graph-disk-tier` is the half that *could* be disk-backed:
#   * `grafeo-engine/mmap` + `compact-store` (always on, see the
#     dependency block below) compile in `database/compact_tiered.rs`,
#     which serializes a `CompactStore`, mmaps it, and serves reads from
#     the mapping.
#   * `grafeo-engine/spill` enables the buffer manager's spill loop so
#     `Config::with_spill_path` has any effect at all.
# It also makes `GraphDbOpen` hand grafeo a spill directory and a bounded
# memory budget; see `crates/tracedecay-graph-db/src/location.rs`.
#
# Compiling it in is not enough, and today it buys nothing. Reaching the
# mmap tier takes an explicit `GrafeoDB::compact()` (grafeo-engine
# `database/mod.rs`), which nothing in this crate calls, so the feature is
# inert: measured against baseline at 100k/500k rows it moves peak RSS by
# under 1%, inside run-to-run noise. Leave it off until something calls
# `compact()`.
#
# Even then it would not tier the live graph. `SectionType::LpgStore` is
# `mmap_able: false` (grafeo-common `storage/section.rs`), and
# `SectionConsumer::can_spill()` returns exactly that flag, so every live
# node and edge record is heap-resident by construction -- `TierOverride::
# ForceDisk` on the LPG section is a silent no-op that frees zero bytes.
# `compact()` freezes a columnar snapshot into the disk-eligible
# `CompactStore`; all writes still land in a RAM-only `LpgStore` overlay.
# Spilling covers the vector/text/ring index buffers and query scratch,
# never LPG data.
graph-disk-tier = ["grafeo-engine/spill"]

[dependencies]
grafeo-adapters.workspace = true
grafeo-common.workspace = true
# Per-generation sealed compact stores (`src/sealed_store.rs`) are the one
# production seal path: every verified generation's rows are streamed into a
# columnar `CompactStore` (`IncrementalCompactStoreBuilder`) and written as
# their own single-generation container (`GrafeoDB::write_compact_container`),
# then served read-only after a recovered-digest proof. `compact-store`
# supplies the builder and the columnar section, `mmap` the mmap-backed base
# on reopen. `spill` stays opt-in (`graph-disk-tier`) so the staging
# database's memory behavior is untouched. `TRACEDECAY_GRAPH_SEALED_STORE=off`
# is the runtime kill-switch that keeps reads on the staging database.
grafeo-core = { workspace = true, features = ["compact-store"] }
grafeo-engine = { workspace = true, features = ["mmap", "compact-store"] }
grafeo-storage.workspace = true
base64 = "0.22"
hex = "0.4"
hotpath.workspace = true
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-store = { path = "../tracedecay-store" }
# A rebuild the daemon pays for on every open is the failure this crate
# is least able to notice from the inside: it is silent, correct, and
# slow. The fallback paths say so out loud.
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
tempfile = "3"
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }

[[bench]]
name = "native_state_100k"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "code_traversal"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "mixed_read_write"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "replay_after_mismatch"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "publication_scale"
harness = false
required-features = ["test-helpers"]

# Every contract suite that needs the `test-helpers` fixture surface is a
# module of this one binary (tests/graph_db_suite/), so the crate links the
# closure once instead of once per former tests/<contract>.rs file.
[[test]]
name = "graph_db_suite"
required-features = ["test-helpers"]

# Peak-RSS measurement harness for the tiered storage features. Every test in
# it is `#[ignore]`d, so it costs a compile and nothing else in a normal run.
[[test]]
name = "tiered_storage_rss"
required-features = ["test-helpers"]

# Residency probe for consecutive generation cycles (stage, retire, repeat)
# on one incarnation, the issue #762 cross-cycle retention journey. Also
# `#[ignore]`d.
[[test]]
name = "generation_cycle_rss"
required-features = ["test-helpers"]

# At-rest snapshot probe: reopen cost of a sealed generation, full LPG replay
# vs a columnar CompactStore base. Also `#[ignore]`d. The `compact` half needs
# `graph-disk-tier` for `GrafeoDB::compact()`; the `replay` baseline runs under
# either feature state. See `docs/graph-at-rest/README.md`.
[[test]]
name = "at_rest_snapshot"
required-features = ["test-helpers"]

# Schema-neutral companion to `at_rest_snapshot`: the same close/reopen cycle
# straight against grafeo, under a handful of shared labels instead of
# TraceDecay's one-key-label-per-entity index. Prices the schema change.
[[test]]
name = "at_rest_grafeo_probe"
required-features = ["test-helpers"]
