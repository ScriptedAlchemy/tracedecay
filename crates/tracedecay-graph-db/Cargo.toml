[package]
name = "tracedecay-graph-db"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Embedded graph and vector storage boundary for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
include = ["/src/**"]

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
hotpath = [
    "hotpath/hotpath",
    "tracedecay-private-fs/hotpath",
    "tracedecay-store/hotpath",
]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "tracedecay-private-fs/hotpath-alloc",
    "tracedecay-store/hotpath-alloc",
]
hotpath-cpu = [
    "hotpath",
    "hotpath/hotpath-cpu",
    "tracedecay-private-fs/hotpath-cpu",
    "tracedecay-store/hotpath-cpu",
]
test-helpers = []
eval-helpers = []

# Opt-in tiered graph storage (never in `default`).
#
# Split in two on purpose, because grafeo 0.5.42 bundles two unrelated
# things under the "tiered" name and only one of them is usable here.
#
# `graph-disk-tier` is the genuinely disk-backed half:
#   * `grafeo-engine/mmap` + `compact-store` compile in
#     `database/compact_tiered.rs`, which serializes a `CompactStore`,
#     mmaps it, and serves reads from the mapping.
#   * `grafeo-engine/spill` enables the buffer manager's spill loop so
#     `Config::with_spill_path` has any effect at all.
# It also makes `GraphDbOpen` hand grafeo a spill directory and a bounded
# memory budget; see `crates/tracedecay-graph-db/src/location.rs`.
graph-disk-tier = [
    "grafeo-engine/mmap",
    "grafeo-engine/compact-store",
    "grafeo-engine/spill",
]

# `graph-tiered-storage` adds grafeo-core's own `tiered-storage` feature on
# top. Despite the name that feature is NOT about disk: it swaps the LPG
# store's `FxHashMap<Id, VersionChain<Record>>` for an arena + `VersionIndex`
# + compressed `EpochStore`, all of which are heap-resident (the arena calls
# `std::alloc::alloc`; `EpochStore` holds `RwLock<HashMap<EpochId, ..>>`).
#
# KNOWN BROKEN at grafeo 0.5.42 — do not enable outside experiments.
# `Arena::alloc_value_with_offset` only ever allocates into `chunks.first()`,
# because `HotVersionRef` addresses records by a u32 offset within a single
# chunk. That primary chunk is `DEFAULT_CHUNK_SIZE` = 1 MiB and `LpgStore`
# hardcodes `ArenaAllocator::new()`, so there is no way to raise it from
# here. `NodeRecord` is 32 bytes, giving a hard ceiling near 32 Ki records
# per epoch, after which `node_ops.rs` *panics* on `AllocError::
# InsufficientSpace` rather than returning an error. See the failure
# inventory in the commit that introduced this feature.
graph-tiered-storage = [
    "graph-disk-tier",
    "grafeo-core/tiered-storage",
    "grafeo-core/mmap",
]

[dependencies]
grafeo-adapters.workspace = true
grafeo-common.workspace = true
grafeo-core.workspace = true
grafeo-engine.workspace = true
hex = "0.4"
hotpath.workspace = true
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
tempfile = "3"
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }

[[bench]]
name = "native_state_100k"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "code_traversal"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "vector_search"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "mixed_read_write"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "replay_after_mismatch"
harness = false
required-features = ["test-helpers"]

[[test]]
name = "backup_contract"
required-features = ["test-helpers"]

[[test]]
name = "cross_projection_contract"
required-features = ["test-helpers"]

[[test]]
name = "durability_crash_contract"
required-features = ["test-helpers"]

[[test]]
name = "open_error_contract"
required-features = ["test-helpers"]

[[test]]
name = "point_read_contract"
required-features = ["test-helpers"]

[[test]]
name = "projection_read_contract"
required-features = ["test-helpers"]

[[test]]
name = "registry_contract"
required-features = ["test-helpers"]

[[test]]
name = "runtime_contract"
required-features = ["test-helpers"]

[[test]]
name = "semantic_vector_staging_contract"

[[test]]
name = "verified_generation_contract"
required-features = ["test-helpers"]

# Peak-RSS measurement harness for the tiered storage features. Every test in
# it is `#[ignore]`d, so it costs a compile and nothing else in a normal run.
[[test]]
name = "tiered_storage_rss"
required-features = ["test-helpers"]
