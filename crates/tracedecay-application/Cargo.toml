[package]
name = "tracedecay-application"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Transport-neutral application contracts for TraceDecay V2"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
# Mounts the native `gix` historical-blob reader beside its port. Off by
# default so the crate stays a pure contract surface for consumers that only
# need the typed values.
native-git = ["dep:gix"]

[dependencies]
gix = { version = "0.81", default-features = false, features = [
    "revision",
    "blob-diff",
    "sha1",
    "status",
], optional = true }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-policy = { path = "../tracedecay-policy", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }
