[package]
name = "tracedecay-application"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay product use cases shared by CLI, MCP, HTTP, hooks, and daemon adapters"
include = ["/src/**"]

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
hotpath = ["hotpath/hotpath", "hotpath/ureq-3"]
default = []
# Exposes test-only helper surfaces to dependent crates' test builds without
# enabling in-process transports. Forwards to tracedecay-sessions so the
# re-exported wire test helpers (read_bounded_line, line_outcome_to_io) resolve
# when this crate is built standalone with the feature.
test-helpers = ["tracedecay-graph-db/test-helpers", "tracedecay-session-temporal-store/test-helpers", "tracedecay-sessions/test-helpers"]
# Mirrors the root crate's `test-transport`: enables the in-process transport
# seams used by integration harnesses.
test-transport = [
    "test-helpers",
    "tracedecay-rusqlite-runtime/test-transport",
    "tracedecay-runtime-core/test-transport",
]

[dependencies]
cap-std = "4.0.2"
getrandom = "0.2"
gix = { version = "=0.87.1", default-features = false, features = ["revision", "blob-diff", "parallel", "sha1", "sha256", "status"] }
glob = "0.3"
hex = "0.4"
hotpath.workspace = true
same-file = "1"
schemars.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
url = "2"
zeroize = "1.9.0"
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
# Grammar-free schema-evidence types only: native-integration analysis compares
# retained schema facts and never links a tree-sitter bundle into this crate.
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false }
tracedecay-configuration = { path = "../tracedecay-configuration" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-graph-query = { path = "../tracedecay-graph-query" }
tracedecay-hooks = { path = "../tracedecay-hooks" }
tracedecay-host-integration = { path = "../tracedecay-host-integration" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tracedecay-policy = { path = "../tracedecay-policy" }
tracedecay-privacy = { path = "../tracedecay-privacy" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-query = { path = "../tracedecay-query" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }

[dev-dependencies]
static_assertions = "1.1.0"
# Test-only helper surfaces reached across crate boundaries by this crate's
# test targets. Feature unification supplies them to the test build only.
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false, features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-graph-db = { path = "../tracedecay-graph-db", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
tracedecay-sessions = { path = "../tracedecay-sessions", features = ["test-helpers"] }

# Dual-mode self-check via benches/hotpath_coverage.rs: feature off must
# not write a report; feature on must record exact journey labels.
[[bench]]
name = "work_rollup"
harness = false

