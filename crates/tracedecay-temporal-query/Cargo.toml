[package]
name = "tracedecay-temporal-query"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay temporal retrieval and context assembly kernel"
include = ["/src/**"]

[dependencies]
hex = "0.4"
hmac = "0.13.0"
hotpath.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
zeroize = "1.9.0"

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
hotpath = ["hotpath/hotpath", "tracedecay-domain/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "tracedecay-domain/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu", "tracedecay-domain/hotpath-cpu"]
# Exposes package-owned fixture constructors to dependent package tests only.
test-helpers = []
