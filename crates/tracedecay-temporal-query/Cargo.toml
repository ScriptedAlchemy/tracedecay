[package]
name = "tracedecay-temporal-query"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay temporal retrieval and context assembly kernel"

[dependencies]
hex.workspace = true
hmac.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracedecay-domain = { path = "../tracedecay-domain" }
tracing.workspace = true
zeroize.workspace = true

[features]
# Exposes package-owned fixture constructors to dependent package tests only.
test-helpers = []
