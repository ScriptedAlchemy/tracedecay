[package]
name = "tracedecay-temporal-query"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "TraceDecay temporal retrieval and context assembly kernel"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
include = ["/src/**"]

[dependencies]
hex = "0.4"
hmac = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
zeroize = "1.9.0"

[features]
# Exposes package-owned fixture constructors to dependent package tests only.
test-helpers = []
