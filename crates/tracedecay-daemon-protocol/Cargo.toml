[package]
name = "tracedecay-daemon-protocol"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Daemon invocation wire contract, client, and leaf transport for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Repo-wide `test-helpers` convention: exposes this crate's test-only helper
# surfaces to dependent crates' test builds only. Never gates production code.
test-helpers = ["tokio/net"]

[dependencies]
asupersync.workspace = true
hex.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_path_to_error = "0.1"
# Non-blocking Unix connect that reports a full listen backlog (see transport.rs).
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-framing = { path = "../tracedecay-framing" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
