[package]
name = "tracedecay-sql"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "The owned-store SQL driver: one rusqlite-shaped API over the engine selected at build time"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
rusqlite = { workspace = true, features = ["bundled", "hooks", "limits"] }
turso_core.workspace = true
turso_parser.workspace = true
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[package.metadata.bazel]
engine_flag = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(td_engine, values("native"))'] }
