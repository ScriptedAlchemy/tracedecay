[package]
name = "tracedecay-host-integration"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Root-free host integration manifests, receipts, journals, and evidence"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
