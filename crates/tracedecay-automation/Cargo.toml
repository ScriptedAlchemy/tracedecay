[package]
name = "tracedecay-automation"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
description = "TraceDecay automation configuration and evidence contracts"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
