[package]
name = "tracedecay-cli"
version.workspace = true
publish = false
edition.workspace = true
description = "TraceDecay command-line interface and daemon binary"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
# Packaged-crate whitelist. `/dashboard/app-dist/**` is staged into the crate
# directory by release packaging (the distribution gate validates it); the
# packaged-crate mode in build.rs embeds it from there, mirroring the old
# root-crate arrangement.
include = [
    "/build.rs",
    "/build-support/**",
    "/src/**",
    "/tests/**",
    "/dashboard/app-dist/**",
    "!/src/resources/logo.png",
]

[[bin]]
name = "tracedecay"
path = "src/main.rs"
# The public library owns target/doc/tracedecay; the binary would overwrite it.
doc = false

# Built explicitly by test workflows. Keeping the fake as an example leaves
# ordinary product `--bin` / `--bins` builds free of test executables.
[[example]]
name = "tracedecay-host-cli-fixture"
path = "build-support/host_cli_fixture.rs"

# The host-lifecycle and opencode journeys share this one test-transport
# binary (tests/host_journeys_suite/); work_loop_journey stays separate
# because it mutates process environment variables in-process.
[[test]]
name = "host_journeys_suite"
path = "tests/host_journeys_suite/main.rs"
required-features = ["test-transport"]

[[test]]
name = "c_library_allocator"
path = "tests/c_library_allocator.rs"
required-features = ["alloc-mimalloc"]

[[test]]
name = "retained_parse_heap"
path = "tests/retained_parse_heap.rs"
required-features = ["alloc-mimalloc"]

[[test]]
name = "process_allocator_heaps"
path = "tests/process_allocator_heaps.rs"
required-features = ["alloc-mimalloc"]

[[test]]
name = "refresh_memory_journey"
path = "tests/refresh_memory_journey.rs"
required-features = ["alloc-mimalloc"]

[[test]]
name = "work_loop_journey"
path = "tests/work_loop_journey.rs"
required-features = ["test-transport"]

# Timed out at 300.1s running alone on ubuntu-latest (run 37978596669, all
# compilation already complete); the native medium limit is 300s.
[package.metadata.bazel.test_sizes]
refresh_memory_journey = "large"

[features]
default = ["production"]
production = ["tracedecay/production", "alloc-mimalloc"]
# Opt-in tiered graph storage; not part of `production`.
graph-disk-tier = ["tracedecay/graph-disk-tier"]
token-counting = ["tracedecay/token-counting"]
lite = ["tracedecay/lite"]
medium = ["tracedecay/medium"]
full = ["tracedecay/full"]
test-transport = ["tracedecay/test-transport"]
lang-dart = ["tracedecay/lang-dart"]
lang-pascal = ["tracedecay/lang-pascal"]
lang-php = ["tracedecay/lang-php"]
lang-ruby = ["tracedecay/lang-ruby"]
lang-bash = ["tracedecay/lang-bash"]
lang-protobuf = ["tracedecay/lang-protobuf"]
lang-powershell = ["tracedecay/lang-powershell"]
lang-nix = ["tracedecay/lang-nix"]
lang-vbnet = ["tracedecay/lang-vbnet"]
lang-lua = ["tracedecay/lang-lua"]
lang-zig = ["tracedecay/lang-zig"]
lang-objc = ["tracedecay/lang-objc"]
lang-perl = ["tracedecay/lang-perl"]
lang-batch = ["tracedecay/lang-batch"]
lang-fortran = ["tracedecay/lang-fortran"]
lang-cobol = ["tracedecay/lang-cobol"]
lang-msbasic2 = ["tracedecay/lang-msbasic2"]
lang-gwbasic = ["tracedecay/lang-gwbasic"]
lang-qbasic = ["tracedecay/lang-qbasic"]
lang-dockerfile = ["tracedecay/lang-dockerfile"]
lang-glsl = ["tracedecay/lang-glsl"]
lang-wgsl = ["tracedecay/lang-wgsl"]
lang-hlsl = ["tracedecay/lang-hlsl"]
lang-metal = ["tracedecay/lang-metal"]
lang-markdown = ["tracedecay/lang-markdown"]
lang-json = ["tracedecay/lang-json"]
lang-r = ["tracedecay/lang-r"]
lang-sql = ["tracedecay/lang-sql"]
lang-julia = ["tracedecay/lang-julia"]
lang-haskell = ["tracedecay/lang-haskell"]
lang-ocaml = ["tracedecay/lang-ocaml"]
lang-clojure = ["tracedecay/lang-clojure"]
lang-erlang = ["tracedecay/lang-erlang"]
lang-elixir = ["tracedecay/lang-elixir"]
lang-fsharp = ["tracedecay/lang-fsharp"]
lang-quint = ["tracedecay/lang-quint"]
lang-toml = ["tracedecay/lang-toml"]
lang-lean = ["tracedecay/lang-lean"]
# Global allocators for the shipped binary (daemon included). `production`
# ships mimalloc: glibc malloc has no setting that fits a daemon indexing on
# dozens of worker threads. Measured on beta.41 on a 96-core host warming 12
# projects: with MALLOC_ARENA_MAX=2, 60% of daemon CPU was the two arena
# locks; with the cap removed, 747 arenas held 14 GB of freed-but-retained
# heap out of 18 GB RSS, and because admission trusts measured RSS the graph
# could never activate again after one peak. mimalloc has per-thread heaps
# without the lock and purges freed segments, so RSS follows live data (peak
# unchanged, ~18 GB during the warm; back to 8-13 GB between phases) and the
# resident-memory refusal clears on its own. When several allocator features
# are enabled at once (e.g. `--all-features`), main.rs resolves them by fixed
# precedence instead of failing the build:
#
# alloc-jemalloc turns jemalloc background purge threads on by default:
# without them an idle daemon never returns dirty pages to the OS (measured
# 5-8 GiB retained after an index+publish cycle settles), which is worse than
# the glibc default. `_RJEM_MALLOC_CONF=background_thread:false` still
# overrides at run time.
alloc-jemalloc = ["dep:tikv-jemallocator", "tikv-jemallocator/background_threads"]
alloc-mimalloc = ["dep:mimalloc"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
futures-util = "0.3.33"
hex = "0.4"
rayon = "1"
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-words = "1.1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracedecay = { path = "../tracedecay", default-features = false }
tracedecay-agent-hosts = { path = "../tracedecay-agent-hosts" }
tracedecay-application = { path = "../tracedecay-application" }
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime" }
tracedecay-api = { path = "../tracedecay-api" }
# Language tiers stay selected through `tracedecay/{lite,medium,full}` above;
# the direct edge only names the parallelism status the runtime installs.
tracedecay-code-index = { path = "../tracedecay-code-index", default-features = false }
tracedecay-configuration = { path = "../tracedecay-configuration" }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-daemon-control = { path = "../tracedecay-daemon-control" }
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tracedecay-daemon-service = { path = "../tracedecay-daemon-service" }
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-framing = { path = "../tracedecay-framing" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-hooks = { path = "../tracedecay-hooks" }
tracedecay-host-integration = { path = "../tracedecay-host-integration" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tracedecay-maintenance = { path = "../tracedecay-maintenance" }
tracedecay-mcp = { path = "../tracedecay-mcp" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-project = { path = "../tracedecay-project" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-sdk = { path = "../tracedecay-sdk" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-store-runtime = { path = "../tracedecay-store-runtime" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracing = "0.1"
tree-sitter = "0.26"
# Self-update authenticates a release archive by its GitHub build-provenance
# attestation against the embedded Sigstore public-good trust root; without
# `tuf` the root is pinned by this version rather than fetched at runtime.
sigstore-verify = { version = "0.13", default-features = false }
# GitHub serves some attestation bundles only through `bundle_url`, as a raw
# snappy block.
snap = "1"
ureq = { version = "3", features = ["json"] }
url = "2"
tikv-jemallocator = { version = "0.7.0", optional = true }
# `no_thp`: mimalloc otherwise madvises its arenas MADV_HUGEPAGE, and each
# refault after its 10 ms purge runs synchronous huge-page compaction. On a
# loaded 96-core host a restart reindex spent 9m22s of kernel CPU in zone-lock
# compaction and TLB shootdowns against 52s of user CPU.
mimalloc = { version = "0.1.52", optional = true, features = ["no_thp"] }

# Windows release archives are `.zip` (Unix ships `.tar.gz` via flate2/tar);
# consumed by the self-update extraction in src/upgrade.rs.
[target.'cfg(windows)'.dependencies]
# Keep the flate2 backend selected by the workspace: sealed segment digests
# must not change when Windows archive support is enabled.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# sigstore-verify links aws-lc; on x86_64 MSVC it needs NASM unless its
# prebuilt assembly objects are allowed, and release runners carry no NASM.
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }
# Owner-heap footprints read page residency with `QueryWorkingSetEx`.
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dirs = "6"
socket2 = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
toml = "1"
tower = "0.5"
tracedecay = { path = "../tracedecay", default-features = false, features = ["test-helpers"] }
tracedecay-application = { path = "../tracedecay-application", features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
# The shared root fixture (`crates/tracedecay/tests/common`) names the LCM
# contracts directly since the lcm extraction; CLI test targets compile that
# fixture via `#[path]` and need the extern.
tracedecay-lcm = { path = "../tracedecay-lcm" }
tracedecay-project = { path = "../tracedecay-project", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction" }
tree-sitter-rust = "0.24"

[target.'cfg(target_os = "linux")'.dev-dependencies]
xattr = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }

[build-dependencies]
flate2 = "1"
serde_json = "1"
sha2 = "0.11"
