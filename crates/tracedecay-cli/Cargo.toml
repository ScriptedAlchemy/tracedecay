[package]
name = "tracedecay-cli"
version.workspace = true
publish = false
edition.workspace = true
description = "TraceDecay command-line interface and daemon binary"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
# Packaged-crate whitelist. `/dashboard/app-dist/**` is staged into the crate
# directory by release packaging (the distribution gate validates it); the
# packaged-crate mode in build.rs embeds it from there, mirroring the old
# root-crate arrangement.
include = [
    "/build.rs",
    "/build-support/**",
    "/src/**",
    "/tests/**",
    "/dashboard/app-dist/**",
]

[[bin]]
name = "tracedecay"
path = "src/main.rs"

# Built explicitly by test workflows. Keeping the fake as an example leaves
# ordinary product `--bin` / `--bins` builds free of test executables.
[[example]]
name = "tracedecay-host-cli-fixture"
path = "build-support/host_cli_fixture.rs"

# The host-lifecycle and opencode journeys share this one test-transport
# binary (tests/host_journeys_suite/); work_loop_journey stays separate
# because it mutates process environment variables in-process.
[[test]]
name = "host_journeys_suite"
path = "tests/host_journeys_suite/main.rs"
required-features = ["test-transport"]

[[test]]
name = "work_loop_journey"
path = "tests/work_loop_journey.rs"
required-features = ["test-transport"]

[features]
default = ["production"]
# Opt-in profiling; never in `default`/`production`. Backend selection lives
# here and in the composition root: `tracedecay/hotpath` names the runtime
# owners whose compiled behaviour changes, and cargo's feature unification
# lights every other crate's hotpath macros from `hotpath/hotpath` alone.
# `tracedecay-sdk` mirrors the selected backend onto its build-script (host)
# context — see its manifest. `dep:regex` backs the `HOTPATH_FOCUS` validation
# in `main.rs`.
hotpath = [
    "dep:regex",
    "tracedecay/hotpath",
    "tracedecay-sdk/hotpath",
    "hotpath/hotpath",
    "hotpath/tokio",
    "hotpath/ureq-3",
]
hotpath-alloc = [
    "hotpath",
    "tracedecay/hotpath-alloc",
    "tracedecay-sdk/hotpath-alloc",
    "hotpath/hotpath-alloc",
]
hotpath-cpu = [
    "hotpath",
    "tracedecay/hotpath-cpu",
    "tracedecay-sdk/hotpath-cpu",
    "hotpath/hotpath-cpu",
]
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]
production = ["tracedecay/production"]
# Opt-in tiered graph storage; not part of `production`.
graph-disk-tier = ["tracedecay/graph-disk-tier"]
graph-tiered-storage = ["tracedecay/graph-tiered-storage"]
token-counting = ["tracedecay/token-counting"]
lite = ["tracedecay/lite"]
medium = ["tracedecay/medium"]
full = ["tracedecay/full"]
semantic-fastembed = ["tracedecay/semantic-fastembed"]
semantic-model2vec = ["tracedecay/semantic-model2vec"]
# Opt-in GPU execution providers for the embedded FastEmbed/ORT runtime.
# A compiled provider is selected automatically on its supported platform;
# `TRACEDECAY_EMBED_EXECUTION_PROVIDER=cpu` opts out.
semantic-gpu-coreml = ["tracedecay/semantic-gpu-coreml"]
semantic-gpu-cuda = ["tracedecay/semantic-gpu-cuda"]
semantic-gpu-webgpu = ["tracedecay/semantic-gpu-webgpu"]
test-transport = ["tracedecay/test-transport"]
lang-dart = ["tracedecay/lang-dart"]
lang-pascal = ["tracedecay/lang-pascal"]
lang-php = ["tracedecay/lang-php"]
lang-ruby = ["tracedecay/lang-ruby"]
lang-bash = ["tracedecay/lang-bash"]
lang-protobuf = ["tracedecay/lang-protobuf"]
lang-powershell = ["tracedecay/lang-powershell"]
lang-nix = ["tracedecay/lang-nix"]
lang-vbnet = ["tracedecay/lang-vbnet"]
lang-lua = ["tracedecay/lang-lua"]
lang-zig = ["tracedecay/lang-zig"]
lang-objc = ["tracedecay/lang-objc"]
lang-perl = ["tracedecay/lang-perl"]
lang-batch = ["tracedecay/lang-batch"]
lang-fortran = ["tracedecay/lang-fortran"]
lang-cobol = ["tracedecay/lang-cobol"]
lang-msbasic2 = ["tracedecay/lang-msbasic2"]
lang-gwbasic = ["tracedecay/lang-gwbasic"]
lang-qbasic = ["tracedecay/lang-qbasic"]
lang-dockerfile = ["tracedecay/lang-dockerfile"]
lang-glsl = ["tracedecay/lang-glsl"]
lang-wgsl = ["tracedecay/lang-wgsl"]
lang-hlsl = ["tracedecay/lang-hlsl"]
lang-metal = ["tracedecay/lang-metal"]
lang-markdown = ["tracedecay/lang-markdown"]
lang-r = ["tracedecay/lang-r"]
lang-sql = ["tracedecay/lang-sql"]
lang-julia = ["tracedecay/lang-julia"]
lang-haskell = ["tracedecay/lang-haskell"]
lang-ocaml = ["tracedecay/lang-ocaml"]
lang-clojure = ["tracedecay/lang-clojure"]
lang-erlang = ["tracedecay/lang-erlang"]
lang-elixir = ["tracedecay/lang-elixir"]
lang-fsharp = ["tracedecay/lang-fsharp"]
lang-quint = ["tracedecay/lang-quint"]
lang-toml = ["tracedecay/lang-toml"]
lang-lean = ["tracedecay/lang-lean"]
# Opt-in global allocators for the shipped binary (daemon included). The
# default stays glibc malloc; selecting an allocator is a deploy decision.
# When several allocator features are enabled at once (e.g. `--all-features`),
# main.rs resolves them by fixed precedence instead of failing the build:
# hotpath-alloc (measurement) > alloc-jemalloc > alloc-mimalloc > system.
#
# alloc-jemalloc turns jemalloc background purge threads on by default:
# without them an idle daemon never returns dirty pages to the OS (measured
# 5-8 GiB retained after an index+publish cycle settles), which is worse than
# the glibc default. `_RJEM_MALLOC_CONF=background_thread:false` still
# overrides at run time.
alloc-jemalloc = ["dep:tikv-jemallocator", "tikv-jemallocator/background_threads"]
alloc-mimalloc = ["dep:mimalloc"]

[dependencies]
crossterm = "0.28"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
futures-util = "0.3.33"
hex = "0.4"
hotpath.workspace = true
open = "5.3"
rayon = "1"
regex = { version = "1.12.3", optional = true }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-words = "1.1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracedecay = { path = "../tracedecay", version = "0.1.0-beta.37", default-features = false }
tracedecay-agent-hosts = { path = "../tracedecay-agent-hosts", version = "0.1.0" }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime", version = "0.1.0" }
tracedecay-api = { path = "../tracedecay-api", version = "0.1.0" }
tracedecay-configuration = { path = "../tracedecay-configuration", version = "0.1.0" }
tracedecay-contracts = { path = "../tracedecay-contracts", version = "0.1.0" }
tracedecay-daemon-control = { path = "../tracedecay-daemon-control", version = "0.1.0" }
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity", version = "0.1.0" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol", version = "0.1.0" }
tracedecay-daemon-service = { path = "../tracedecay-daemon-service", version = "0.1.0" }
tracedecay-dashboard-api = { path = "../tracedecay-dashboard-api", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0" }
tracedecay-hooks = { path = "../tracedecay-hooks", version = "0.1.0" }
tracedecay-host-integration = { path = "../tracedecay-host-integration", version = "0.1.0" }
tracedecay-lsp = { path = "../tracedecay-lsp", version = "0.1.0" }
tracedecay-maintenance = { path = "../tracedecay-maintenance", version = "0.1.0" }
tracedecay-mcp = { path = "../tracedecay-mcp", version = "0.1.0" }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-sdk = { path = "../tracedecay-sdk", version = "0.1.0" }
tracedecay-session-memory = { path = "../tracedecay-session-memory", version = "0.1.0" }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0" }
tracedecay-store-runtime = { path = "../tracedecay-store-runtime", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
url = "2"
tikv-jemallocator = { version = "0.7.0", optional = true }
mimalloc = { version = "0.1.52", optional = true }

# Windows release archives are `.zip` (Unix ships `.tar.gz` via flate2/tar);
# consumed by the self-update extraction in src/upgrade.rs.
[target.'cfg(windows)'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
dirs = "6"
fs2 = "0.4"
regex = "1.12.3"
tokio = { version = "1", features = ["full", "test-util"] }
toml = "1"
tower = "0.5"
tracedecay = { path = "../tracedecay", version = "0.1.0-beta.37", default-features = false, features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0", features = ["test-helpers"] }
# The shared root fixture (`crates/tracedecay/tests/common`) names the LCM
# contracts directly since the lcm extraction; CLI test targets compile that
# fixture via `#[path]` and need the extern.
tracedecay-lcm = { path = "../tracedecay-lcm", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
tracedecay-semantic = { path = "../tracedecay-semantic", version = "0.1.0", features = ["test-helpers"] }
tracedecay-semantic-contracts.workspace = true
tracedecay-session-temporal-store = { path = "../tracedecay-session-temporal-store", version = "0.1.0" }
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
xattr = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }

# `fs2` is consumed only by `../tracedecay/tests/common/fixture.rs`, which
# this crate's integration test binaries pull in through relative `#[path]`
# attributes. Cargo-shear's per-crate scan cannot see files outside this
# crate's directory tree, so it reports a false positive.
[package.metadata.cargo-shear]
ignored = ["fs2"]

[build-dependencies]
serde_json = "1"
sha2 = "0.11"
