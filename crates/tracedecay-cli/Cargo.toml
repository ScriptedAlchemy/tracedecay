[package]
name = "tracedecay-cli"
version.workspace = true
publish = false
edition.workspace = true
description = "TraceDecay command-line interface and daemon binary"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[[bin]]
name = "tracedecay"
path = "src/main.rs"

[[test]]
name = "cli_boundary"
path = "tests/cli_boundary.rs"

[[test]]
name = "host_lifecycle_cli_acceptance"
path = "tests/host_lifecycle_cli_acceptance.rs"
required-features = ["test-transport"]

[[test]]
name = "opencode_one_analyzer_journey"
path = "tests/opencode_one_analyzer_journey.rs"
required-features = ["test-transport"]

[[test]]
name = "work_loop_journey"
path = "tests/work_loop_journey.rs"
required-features = ["test-transport"]

[features]
default = ["production"]
hotpath = [
    "tracedecay-domain/hotpath",
    "dep:regex",
    "hotpath/hotpath",
    "hotpath/tokio",
    "hotpath/axum-0-8",
    "hotpath/ureq-3",
    "tracedecay/hotpath",
    "tracedecay-agent-hosts/hotpath",
    "tracedecay-api/hotpath",
    "tracedecay-application/hotpath",
    "tracedecay-global-db/hotpath",
    "tracedecay-hooks/hotpath",
    "tracedecay-host-integration/hotpath",
    "tracedecay-lsp/hotpath",
    "tracedecay-private-fs/hotpath",
    "tracedecay-runtime-core/hotpath",
    "tracedecay-sessions/hotpath",
    "tracedecay-tool-catalog/hotpath",
    "tracedecay-usecases/hotpath",
]
hotpath-alloc = [
    "tracedecay-domain/hotpath-alloc",
    "hotpath",
    "hotpath/hotpath-alloc",
    "tracedecay/hotpath-alloc",
    "tracedecay-agent-hosts/hotpath-alloc",
    "tracedecay-api/hotpath-alloc",
    "tracedecay-application/hotpath-alloc",
    "tracedecay-global-db/hotpath-alloc",
    "tracedecay-hooks/hotpath-alloc",
    "tracedecay-host-integration/hotpath-alloc",
    "tracedecay-lsp/hotpath-alloc",
    "tracedecay-private-fs/hotpath-alloc",
    "tracedecay-runtime-core/hotpath-alloc",
    "tracedecay-sessions/hotpath-alloc",
    "tracedecay-tool-catalog/hotpath-alloc",
    "tracedecay-usecases/hotpath-alloc",
]
hotpath-cpu = [
    "tracedecay-domain/hotpath-cpu",
    "hotpath",
    "hotpath/hotpath-cpu",
    "tracedecay/hotpath-cpu",
    "tracedecay-agent-hosts/hotpath-cpu",
    "tracedecay-api/hotpath-cpu",
    "tracedecay-application/hotpath-cpu",
    "tracedecay-global-db/hotpath-cpu",
    "tracedecay-hooks/hotpath-cpu",
    "tracedecay-host-integration/hotpath-cpu",
    "tracedecay-lsp/hotpath-cpu",
    "tracedecay-private-fs/hotpath-cpu",
    "tracedecay-runtime-core/hotpath-cpu",
    "tracedecay-sessions/hotpath-cpu",
    "tracedecay-tool-catalog/hotpath-cpu",
    "tracedecay-usecases/hotpath-cpu",
]
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]
production = ["tracedecay/production"]
# Opt-in tiered graph storage; not part of `production`.
graph-disk-tier = ["tracedecay/graph-disk-tier"]
graph-tiered-storage = ["tracedecay/graph-tiered-storage"]
token-counting = ["tracedecay/token-counting"]
lite = ["tracedecay/lite"]
medium = ["tracedecay/medium"]
full = ["tracedecay/full"]
semantic-fastembed = ["tracedecay/semantic-fastembed"]
# Opt-in GPU execution providers for the embedded FastEmbed/ORT runtime.
# Still requires `TRACEDECAY_EMBED_EXECUTION_PROVIDER=coreml|cuda` at runtime;
# compiling the feature in alone changes nothing.
semantic-gpu-coreml = ["tracedecay/semantic-gpu-coreml"]
semantic-gpu-cuda = ["tracedecay/semantic-gpu-cuda"]
test-transport = ["tracedecay/test-transport"]
lang-dart = ["tracedecay/lang-dart"]
lang-pascal = ["tracedecay/lang-pascal"]
lang-php = ["tracedecay/lang-php"]
lang-ruby = ["tracedecay/lang-ruby"]
lang-bash = ["tracedecay/lang-bash"]
lang-protobuf = ["tracedecay/lang-protobuf"]
lang-powershell = ["tracedecay/lang-powershell"]
lang-nix = ["tracedecay/lang-nix"]
lang-vbnet = ["tracedecay/lang-vbnet"]
lang-lua = ["tracedecay/lang-lua"]
lang-zig = ["tracedecay/lang-zig"]
lang-objc = ["tracedecay/lang-objc"]
lang-perl = ["tracedecay/lang-perl"]
lang-batch = ["tracedecay/lang-batch"]
lang-fortran = ["tracedecay/lang-fortran"]
lang-cobol = ["tracedecay/lang-cobol"]
lang-msbasic2 = ["tracedecay/lang-msbasic2"]
lang-gwbasic = ["tracedecay/lang-gwbasic"]
lang-qbasic = ["tracedecay/lang-qbasic"]
lang-dockerfile = ["tracedecay/lang-dockerfile"]
lang-glsl = ["tracedecay/lang-glsl"]
lang-wgsl = ["tracedecay/lang-wgsl"]
lang-hlsl = ["tracedecay/lang-hlsl"]
lang-metal = ["tracedecay/lang-metal"]
lang-markdown = ["tracedecay/lang-markdown"]
lang-r = ["tracedecay/lang-r"]
lang-sql = ["tracedecay/lang-sql"]
lang-julia = ["tracedecay/lang-julia"]
lang-haskell = ["tracedecay/lang-haskell"]
lang-ocaml = ["tracedecay/lang-ocaml"]
lang-clojure = ["tracedecay/lang-clojure"]
lang-erlang = ["tracedecay/lang-erlang"]
lang-elixir = ["tracedecay/lang-elixir"]
lang-fsharp = ["tracedecay/lang-fsharp"]
lang-quint = ["tracedecay/lang-quint"]
lang-toml = ["tracedecay/lang-toml"]
lang-lean = ["tracedecay/lang-lean"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
futures-util = "0.3.33"
hex = "0.4"
hotpath.workspace = true
open = "5.3"
rayon = "1"
regex = { version = "1.12.3", optional = true }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracedecay = { path = "../tracedecay", version = "0.1.0-beta.37", default-features = false }
tracedecay-agent-hosts = { path = "../tracedecay-agent-hosts", version = "0.1.0" }
tracedecay-api = { path = "../tracedecay-api", version = "0.1.0" }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0", features = ["native-git"] }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0" }
tracedecay-hooks = { path = "../tracedecay-hooks", version = "0.1.0" }
tracedecay-host-integration = { path = "../tracedecay-host-integration", version = "0.1.0" }
tracedecay-lsp = { path = "../tracedecay-lsp", version = "0.1.0" }
tracedecay-private-fs = { path = "../tracedecay-private-fs", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }
tracedecay-usecases = { path = "../tracedecay-usecases", version = "0.1.0" }
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
url = "2"

[dev-dependencies]
axum = "0.8"
dirs = "6"
fs2 = "0.4"
regex = "1.12.3"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
toml = "1"
tower = "0.5"
tracedecay = { path = "../tracedecay", version = "0.1.0-beta.37", default-features = false, features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
xattr = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }

# `fs2` is consumed only by `../tracedecay/tests/common/fixture.rs`, which
# this crate's integration test binaries pull in through relative `#[path]`
# attributes. Cargo-shear's per-crate scan cannot see files outside this
# crate's directory tree, so it reports a false positive.
[package.metadata.cargo-shear]
ignored = ["fs2"]

[build-dependencies]
logo-art = "0.2"
