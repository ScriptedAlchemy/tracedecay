[package]
name = "tracedecay-capture"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
homepage = "https://github.com/ScriptedAlchemy/tracedecay"
description = "Bounded event capture primitives for TraceDecay"
readme = "README.md"
keywords = ["ai", "code-intelligence", "observability", "capture"]
categories = ["development-tools", "parsing"]
include = ["/src/**", "/tests/**", "/README.md"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-tokenizer = { path = "../tracedecay-tokenizer" }

tracing.workspace = true