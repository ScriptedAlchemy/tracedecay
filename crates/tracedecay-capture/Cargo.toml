[package]
name = "tracedecay-capture"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
homepage = "https://github.com/ScriptedAlchemy/tracedecay"
description = "Bounded event capture primitives for TraceDecay"
readme = "README.md"
keywords = ["ai", "code-intelligence", "observability", "capture"]
categories = ["development-tools", "parsing"]
include = ["/src/**", "/tests/**", "/README.md"]

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features); this
# feature only selects the on-mode hotpath test/bench targets of this crate.
hotpath = ["hotpath/hotpath"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
hex = "0.4"
hotpath.workspace = true
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
