[package]
name = "tracedecay-contracts"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Transport-neutral application contracts for TraceDecay V2"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
hotpath = ["hotpath/hotpath"]

[dependencies]
hotpath.workspace = true
schemars = "1.2.1"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-policy = { path = "../tracedecay-policy", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# These are test modules declared inside automation/tests.rs, which is linked
# into the lib via #[path]; shear cannot follow #[path] inclusions.
[package.metadata.cargo-shear]
ignored-paths = ["src/retained_surfaces/sdk/results/automation/admission_binding.rs", "src/retained_surfaces/sdk/results/automation/outer_partial.rs"]
