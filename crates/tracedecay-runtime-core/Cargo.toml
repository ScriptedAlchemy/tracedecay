[package]
name = "tracedecay-runtime-core"
version = "0.1.0"
publish = false
edition = "2024"
description = "Low-level runtime utilities for TraceDecay"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
amari-holographic = "0.23.0"
bincode = "1.3"
dirs = "6"
fs2 = "0.4"
getrandom = "0.2"
gix = { version = "0.81", default-features = false, features = ["revision", "blob-diff", "sha1"] }
glob = "0.3"
hex = "0.4"
libsql = "0.9.30"
regex = "1.12.3"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracedecay-capture = { path = "../tracedecay-capture" }
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tree-sitter = "0.26"

[dev-dependencies]
tempfile = "3"
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false, features = ["lite"] }
