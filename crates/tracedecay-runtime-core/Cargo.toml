[package]
name = "tracedecay-runtime-core"
version = "0.1.0"
publish = false
edition.workspace = true
description = "TraceDecay runtime kernel: cancellation, leases, resource accounting, storage layout and identity, database engine, and shard runtime"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
default = []
# Forwarded from the root package. Gates daemonless fixture runtimes and the
# in-process transport doubles used by storage-runtime tests.
test-transport = ["tracedecay-rusqlite-runtime/test-transport"]
# Repo-wide `test-helpers` convention: exposes this crate's test-only helper
# surfaces (engine fixtures and explicit database fixture runtimes) to
# dependent crates' test builds. Never gates production code or forwards a
# dependency feature. Distinct from `test-transport`, which gates in-process
# transport doubles and forwards a dependency feature.
test-helpers = ["dep:tracing-subscriber"]

[dependencies]
asupersync.workspace = true
tracedecay-capture = { path = "../tracedecay-capture" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-graph-db = { path = "../tracedecay-graph-db" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
tracedecay-store = { path = "../tracedecay-store" }

getrandom.workspace = true
gix = { version = "=0.89.0", default-features = false, features = ["revision", "blob-diff", "merge", "parallel", "sha1", "sha256", "status"] }
hex.workspace = true
reflink-copy = "0.1"
rusqlite = { workspace = true, features = ["backup"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
criterion.workspace = true
tracedecay-graph-db = { path = "../tracedecay-graph-db", features = ["test-helpers"] }

tokio = { workspace = true, features = ["full", "test-util"] }

[[test]]
name = "tracing_capture_keepalive"
required-features = ["test-helpers"]

[[test]]
name = "git_discovery_authority"
required-features = ["test-helpers"]

[[bench]]
name = "exact_sql_writer_workload"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "git_repository_authority"
harness = false

[[bench]]
name = "native_timer"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(tracedecay_observation_fault_harness)",
    "cfg(tokio_unstable)",
    # Gates the one db::coverage test that drives a real graph query; the
    # `GraphQueryManager` it needs lives above this kernel.
    "cfg(tracedecay_graph_query_tests)",
] }
