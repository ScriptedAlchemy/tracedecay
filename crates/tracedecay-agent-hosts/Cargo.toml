[package]
name = "tracedecay-agent-hosts"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Agent host integrations and self-improvement automation for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
build = "build.rs"

[lib]
doctest = false

[features]
default = []
# Exact token counting for automation artifact budgeting (tiktoken BPE).
# Mirrors the root crate's `token-counting` feature; forwarded by the root.
token-counting = ["dep:tiktoken-rs"]
# Test-only transport wiring; mirrors the root crate's `test-transport`.
# Forwards to the kernel so this crate's test targets can reach the hidden
# `Database::publish_test_runtime` / `DatabaseAuthority::acquire_test` seams.
test-transport = [
    "tracedecay-runtime-core/test-transport",
    "tracedecay-automation-runtime/test-transport",
]

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
same-file = "1.0.6"
getrandom = "0.2"
hex = "0.4"
hotpath.workspace = true
jsonc-parser = { version = "0.33.2", features = ["serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-words = "1.1"
thiserror = "2"
tiktoken-rs = { version = "0.12", optional = true }
tokio = { version = "1", features = ["full"] }
gix = { version = "=0.87.1", default-features = false, features = ["revision", "blob-diff", "parallel", "sha1", "sha256", "status"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
url = "2"
yaml-edit = { version = "0.2.3", default-features = false }

tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-automation-runtime = { path = "../tracedecay-automation-runtime" }
tracedecay-framing = { path = "../tracedecay-framing" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-hooks = { path = "../tracedecay-hooks" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tracedecay-mcp-catalog = { path = "../tracedecay-mcp-catalog" }
tracedecay-host-integration = { path = "../tracedecay-host-integration" }
tracedecay-policy = { path = "../tracedecay-policy" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime" }
tracedecay-lcm = { path = "../tracedecay-lcm" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-store = { path = "../tracedecay-store" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracedecay-application = { path = "../tracedecay-application" }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", default-features = false }
tracedecay-query = { path = "../tracedecay-query" }

# Linux-only extended-attribute probe in `agents::mod` (host install provenance).
[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracedecay-code-index-runtime = { path = "../tracedecay-code-index-runtime", default-features = false, features = ["test-helpers"] }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
