[package]
name = "tracedecay-agent-hosts"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
description = "Agent host profile schemas and configuration parsing for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
build = false

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracedecay-automation = { path = "../tracedecay-automation" }
