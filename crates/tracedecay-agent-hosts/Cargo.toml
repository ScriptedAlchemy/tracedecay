[package]
name = "tracedecay-agent-hosts"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
description = "Agent host integrations and self-improvement automation for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
build = "build.rs"

[lib]
doctest = false

[dependencies]
dirs = "6"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
libsql = "0.9.30"
regex = "1.12.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
url = "2"
webpki-roots = "1"

tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-lsp = { path = "../tracedecay-lsp" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
