[package]
name = "tracedecay-code-extraction"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "Tree-sitter language extraction for TraceDecay"
build = "build.rs"
include = [
    "/src/**",
    "/fixtures/**",
    "/tests/**",
    "/vendor/tree-sitter-wgsl/src/**",
    "/vendor/tree-sitter-wgsl/LICENSE",
    "/vendor/tree-sitter-wgsl/PROVENANCE.md",
    "/build.rs",
]

[features]
# Opt-in profiling. Hotpath macros are no-ops until the *binary* selects the
# `hotpath/hotpath` backend (cargo unifies the proc-macro's features), so this
# feature exists only for the `cfg(feature = "hotpath")` sites in this crate
# that change compiled behaviour under profiling. It forwards nowhere else.
hotpath = ["hotpath/hotpath"]
default = ["lite", "medium", "full"]
test-helpers = []
# Markdown rides in `lite` as well as `full`: docs are architecture content and
# every repository has them, so no shipped tier may index code without also
# indexing its documentation. Its grammar is the dedicated `tree-sitter-md`
# crate (byte-identical parser/scanner sources to the copy vendored in the
# large bundle), so `lite` never links the large bundle.
lite = ["medium-grammars", "lang-markdown"]
# The two grammar bundles are the only compile-time registration points: every
# `lang-*` feature names the bundle that ships its grammar, and `ts_provider`
# builds the lookup from whichever bundles are enabled.
medium-grammars = ["dep:tracedecay-medium-treesitters"]
large-grammars = ["dep:tracedecay-large-treesitters"]
medium = ["lang-dart", "lang-pascal", "lang-php", "lang-ruby", "lang-bash", "lang-protobuf", "lang-powershell", "lang-nix", "lang-vbnet"]
full = ["medium", "lang-lua", "lang-zig", "lang-objc", "lang-perl", "lang-batch", "lang-fortran", "lang-cobol", "lang-msbasic2", "lang-gwbasic", "lang-qbasic", "lang-dockerfile", "lang-glsl", "lang-wgsl", "lang-hlsl", "lang-metal", "lang-markdown", "lang-r", "lang-sql", "lang-julia", "lang-haskell", "lang-ocaml", "lang-clojure", "lang-erlang", "lang-elixir", "lang-fsharp", "lang-quint", "lang-toml", "lang-lean"]
lang-dart = ["medium-grammars"]
lang-pascal = ["large-grammars"]
lang-php = ["medium-grammars"]
lang-ruby = ["medium-grammars"]
lang-bash = ["medium-grammars"]
lang-protobuf = ["large-grammars"]
lang-powershell = ["large-grammars"]
lang-nix = ["large-grammars"]
lang-vbnet = ["large-grammars"]
lang-lua = ["medium-grammars"]
lang-zig = ["large-grammars"]
lang-objc = ["large-grammars"]
lang-perl = ["large-grammars"]
lang-batch = ["large-grammars"]
lang-fortran = ["large-grammars"]
lang-cobol = ["large-grammars"]
lang-msbasic2 = ["large-grammars"]
lang-gwbasic = ["large-grammars"]
lang-qbasic = ["large-grammars"]
lang-dockerfile = ["large-grammars"]
lang-glsl = ["large-grammars"]
lang-wgsl = []
lang-hlsl = ["dep:tree-sitter-hlsl"]
# Metal is a C++ superset parsed by the C++ grammar; the medium bundle already
# ships that grammar, so the adapter never needs the large bundle.
lang-metal = ["medium-grammars"]
lang-markdown = ["dep:tree-sitter-md"]
lang-r = ["large-grammars"]
lang-sql = ["large-grammars"]
lang-julia = ["large-grammars"]
lang-haskell = ["large-grammars"]
lang-ocaml = ["large-grammars"]
lang-clojure = ["large-grammars"]
lang-erlang = ["large-grammars"]
lang-elixir = ["large-grammars"]
lang-fsharp = ["large-grammars"]
lang-quint = ["large-grammars"]
lang-toml = ["large-grammars"]
lang-lean = ["large-grammars"]

[dependencies]
hotpath.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-large-treesitters = { package = "tokensave-large-treesitters", version = "0.5.0", optional = true }
tracedecay-medium-treesitters = { package = "tokensave-medium-treesitters", version = "0.2.0", optional = true }
tree-sitter = "0.26"
tree-sitter-hlsl = { version = "0.2.0", optional = true }
tree-sitter-md = { version = "=0.5.3", default-features = false, optional = true }
tree-sitter-language = "0.1"
# Resolved through the workspace [patch.crates-io] git pin, which carries the
# struct-pattern field attribute fix (tree-sitter/tree-sitter-rust#301).
tree-sitter-rust = "0.24"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
cc = "1"
