[package]
name = "tracedecay-policy"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Deterministic, side-effect-free policy evaluators for TraceDecay V2"
repository = "https://github.com/ScriptedAlchemy/tracedecay"


[dependencies]
hotpath.workspace = true
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }

[features]
# Opt-in profiling passthrough so workspace `--features hotpath*` resolve.
hotpath = ["hotpath/hotpath", "tracedecay-domain/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "tracedecay-domain/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu", "tracedecay-domain/hotpath-cpu"]

[dev-dependencies]
serde_json = "1"
