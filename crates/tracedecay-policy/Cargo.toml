[package]
name = "tracedecay-policy"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Deterministic, side-effect-free policy evaluators for TraceDecay V2"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
schemars.workspace = true
serde = { version = "1", features = ["derive"] }
shell-words = "1.1"
tracedecay-domain = { path = "../tracedecay-domain" }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
