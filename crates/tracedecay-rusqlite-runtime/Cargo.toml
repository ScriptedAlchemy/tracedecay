[package]
name = "tracedecay-rusqlite-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
description = "Bundled SQLite runtime for TraceDecay storage adapters"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
test-helpers = []
test-transport = []

[dependencies]
async-channel = "2.5.0"
dunce = "1.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17.14"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-sql = { path = "../tracedecay-sql" }
tracedecay-store = { path = "../tracedecay-store" }
tracing = "0.1"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3"
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracedecay-sql = { path = "../tracedecay-sql", features = ["test-helpers"] }

[[test]]
name = "crash"
path = "tests/crash/main.rs"
required-features = ["test-helpers"]

[package.metadata.bazel]
test_sizes = { crash = "large" }

[[bench]]
name = "storage_contention"
harness = false
required-features = ["test-transport"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }
