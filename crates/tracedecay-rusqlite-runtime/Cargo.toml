[package]
name = "tracedecay-rusqlite-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
description = "Bundled SQLite runtime for TraceDecay storage adapters"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
test-transport = []

[dependencies]
async-channel = "2.5.0"
dunce = "1.0.5"
futures-util = "0.3.33"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache", "hooks", "limits", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17.14"
sha2 = "0.11.0"
thiserror = "2"
asupersync.workspace = true
# Synchronous storage ports wait on the writer from Tokio daemon workers; see
# `recv_writer_reply`.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-store = { path = "../tracedecay-store" }
tracing = "0.1"

# Thread CPU time for the debug-build long-poll guard on native tasks.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3"
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }
