[package]
name = "tracedecay-rusqlite-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
description = "Bundled SQLite runtime for TraceDecay storage adapters"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
test-transport = []
# Starts a default native runtime on first use when the host never called
# `native_runtime::install`. Tests only; production hosts install at startup.
test-runtime = []

[dependencies]
async-channel.workspace = true
dunce = "1.0.5"
futures-util.workspace = true
rusqlite = { workspace = true, features = ["bundled", "cache", "hooks", "limits", "trace"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ring = "0.17.14"
sha2 = "0.11.0"
thiserror.workspace = true
asupersync.workspace = true
# `native_runtime::tokio_handle` hands the daemon's Tokio runtime to the sites
# that still need one.
tokio = { version = "1", default-features = false, features = ["rt"] }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-store = { path = "../tracedecay-store" }
tracing.workspace = true

# Thread CPU time for the long-poll count on native tasks.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Self dev-dependency: every workspace test build shares one resolution, so
# this gives each test the lazy default runtime.
tracedecay-rusqlite-runtime = { path = ".", features = ["test-runtime"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile.workspace = true
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracedecay_observation_fault_harness)"] }
