[package]
name = "tracedecay-usecases"
version = "0.1.0"
publish = false
edition = "2024"
description = "Root-free reusable TraceDecay operations"
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
hex = "0.4"
libsql = "0.9.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
tracedecay-automation = { path = "../tracedecay-automation" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }

[dev-dependencies]
tempfile = "3"
