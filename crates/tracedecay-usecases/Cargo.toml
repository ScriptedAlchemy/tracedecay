[package]
name = "tracedecay-usecases"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "TraceDecay product use cases shared by CLI, MCP, HTTP, hooks, and daemon adapters"
# PACKAGING SEAM: `semantic_runtime::bundled_query` byte-pins the shipped query
# profile with `include_str!` against two repo-root fixtures that live outside
# this package. `cargo check` resolves them; `cargo package` will not. See
# SEAMS.md — the fixtures must be vendored under `/src` or produced by a build
# script before this crate can be published.
include = ["/src/**"]

[features]
default = []
# Mirrors the root crate's `semantic-fastembed`: gates the embedded fastembed
# provider wiring inside `semantic_runtime`.
semantic-fastembed = ["tracedecay-semantic/semantic-fastembed"]
# Exposes test-only helper surfaces to dependent crates' test builds without
# enabling in-process transports. Forwards to tracedecay-sessions so the
# re-exported wire test helpers (read_bounded_line, line_outcome_to_io) resolve
# when this crate is built standalone with the feature.
test-helpers = ["tracedecay-sessions/test-helpers"]
# Mirrors the root crate's `test-transport`: enables the in-process transport
# seams used by integration harnesses.
test-transport = [
    "test-helpers",
    "tracedecay-rusqlite-runtime/test-transport",
    "tracedecay-runtime-core/test-transport",
]

[dependencies]
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
getrandom = "0.2"
fs2 = "0.4"
gix = { version = "0.81", default-features = false, features = ["revision", "blob-diff", "sha1", "status"] }
glob = "0.3"
hex = "0.4"
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
regex = "1"
same-file = "1"
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
url = "2"
zeroize = "1.9.0"
ignore = "0.4"
tracedecay-api = { path = "../tracedecay-api", version = "0.1.0" }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0", features = ["native-git"] }
tracedecay-automation = { path = "../tracedecay-automation", version = "0.1.0" }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0" }
tracedecay-hooks = { path = "../tracedecay-hooks", version = "0.1.0" }
tracedecay-host-integration = { path = "../tracedecay-host-integration", version = "0.1.0" }
tracedecay-lsp = { path = "../tracedecay-lsp", version = "0.1.0" }
tracedecay-policy = { path = "../tracedecay-policy", version = "0.1.0" }
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-rusqlite-runtime = { path = "../tracedecay-rusqlite-runtime", version = "0.1.0" }
tracedecay-search-eval = { path = "../tracedecay-search-eval", version = "0.1.0" }
tracedecay-semantic = { path = "../tracedecay-semantic", version = "0.1.0" }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0" }
tracedecay-store = { path = "../tracedecay-store", version = "0.1.0" }
tracedecay-temporal-query = { path = "../tracedecay-temporal-query", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }

[dev-dependencies]
static_assertions = "1.1.0"
# Test-only helper surfaces reached across crate boundaries by this crate's
# test targets. Feature unification supplies them to the test build only.
tracedecay-global-db = { path = "../tracedecay-global-db", version = "0.1.0", features = ["test-helpers"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
tracedecay-semantic = { path = "../tracedecay-semantic", version = "0.1.0", features = ["test-helpers"] }
tracedecay-sessions = { path = "../tracedecay-sessions", version = "0.1.0", features = ["test-helpers"] }
