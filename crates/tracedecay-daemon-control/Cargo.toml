[package]
name = "tracedecay-daemon-control"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "OS service lifecycle, readiness probing, and daemon control for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[dependencies]
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tracedecay-domain = { path = "../tracedecay-domain" }
# Used only by `service/windows_task.rs`, but declared for every target: the
# Bazel graph is generated from the Linux resolution and cannot carry a
# Windows-only member dependency.
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracing.workspace = true

# COM Task Scheduler bindings for the per-user Windows daemon task
# (`service/windows_task.rs`). `Win32_System_Ole` is not imported by name but
# is required by the `windows` crate's VARIANT/TaskScheduler machinery.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

[dev-dependencies]
socket2.workspace = true
tempfile.workspace = true
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
