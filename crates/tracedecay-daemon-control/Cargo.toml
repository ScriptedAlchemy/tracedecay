[package]
name = "tracedecay-daemon-control"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "OS service lifecycle, readiness probing, and daemon control for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[lib]
doctest = false

[features]
# Opt-in profiling (never in `default`). Every hotpath macro is a no-op with
# the feature off, so instrumented call sites compile identically both ways.
hotpath = [
    "hotpath/hotpath",
    "tracedecay-daemon-identity/hotpath",
    "tracedecay-daemon-protocol/hotpath",
    "tracedecay-domain/hotpath",
    "tracedecay-runtime-core/hotpath",
]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "tracedecay-daemon-identity/hotpath-alloc",
    "tracedecay-daemon-protocol/hotpath-alloc",
    "tracedecay-domain/hotpath-alloc",
    "tracedecay-runtime-core/hotpath-alloc",
]
hotpath-cpu = [
    "hotpath",
    "hotpath/hotpath-cpu",
    "tracedecay-daemon-identity/hotpath-cpu",
    "tracedecay-daemon-protocol/hotpath-cpu",
    "tracedecay-domain/hotpath-cpu",
    "tracedecay-runtime-core/hotpath-cpu",
]

[dependencies]
dirs = "6"
hex = "0.4"
hotpath.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracedecay-daemon-identity = { path = "../tracedecay-daemon-identity", version = "0.1.0" }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol", version = "0.1.0" }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }

# COM Task Scheduler bindings for the per-user Windows daemon task
# (`service/windows_task.rs`). `Win32_System_Ole` is not imported by name but
# is required by the `windows` crate's VARIANT/TaskScheduler machinery.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile = "3"
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0", features = ["test-helpers"] }
