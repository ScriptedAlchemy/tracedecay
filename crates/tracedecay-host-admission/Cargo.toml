[package]
name = "tracedecay-host-admission"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Host-event admission broker, spool, and observation capture"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[features]
# Forwards the sessions fixture surface for this crate's own tests.
test-helpers = ["tracedecay-sessions/test-helpers"]
# Forwards the kernel test-transport seam for consumers that publish test
# runtimes through this crate's feature graph.
test-transport = ["test-helpers", "tracedecay-runtime-core/test-transport"]

[dependencies]
hotpath.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tracing = "0.1"
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-global-db = { path = "../tracedecay-global-db" }
tracedecay-privacy = { path = "../tracedecay-privacy" }
tracedecay-private-fs = { path = "../tracedecay-private-fs" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-session-memory = { path = "../tracedecay-session-memory" }
tracedecay-sessions = { path = "../tracedecay-sessions" }
tracedecay-store = { path = "../tracedecay-store" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracedecay-global-db = { path = "../tracedecay-global-db", features = ["test-helpers"] }
tracedecay-sessions = { path = "../tracedecay-sessions", features = ["test-helpers"] }
