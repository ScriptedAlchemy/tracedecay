[package]
name = "tracedecay-tool-catalog"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Inert capability catalog contracts for TraceDecay V2"
repository = "https://github.com/ScriptedAlchemy/tracedecay"


[dependencies]
hotpath.workspace = true
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[features]
# Opt-in profiling passthrough so workspace `--features hotpath*` resolve.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
