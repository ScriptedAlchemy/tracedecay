[package]
name = "tracedecay-lsp"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
description = "Store-free LSP diagnostics support for TraceDecay"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
