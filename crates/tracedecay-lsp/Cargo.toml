[package]
name = "tracedecay-lsp"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Store-free LSP framing, protocol, and session contracts for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
constant_time_eq = "0.5.0"
futures-util = { version = "0.3", features = ["sink"] }
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", version = "0.1.0", default-features = false, features = ["lite"] }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog", version = "0.1.0" }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
