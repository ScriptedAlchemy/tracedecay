[package]
name = "tracedecay-lsp"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
description = "Store-free LSP diagnostics support for TraceDecay"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
async-channel.workspace = true
constant_time_eq.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
globset.workspace = true
jsonc-parser = { workspace = true, features = ["serde"] }
lsp-types = "0.97.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracedecay-contracts = { path = "../tracedecay-contracts" }
tracedecay-code-extraction = { path = "../tracedecay-code-extraction", default-features = false, features = ["lite"] }
tracedecay-daemon-protocol = { path = "../tracedecay-daemon-protocol" }
tracedecay-domain = { path = "../tracedecay-domain" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core" }
tracedecay-tool-catalog = { path = "../tracedecay-tool-catalog" }
tracing.workspace = true
url.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", features = ["test-helpers"] }
