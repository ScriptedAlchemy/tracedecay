[release]
compatibility_gate = "Every V1 read, write, action, error, and retained-data family has a generated disposition plus passing semantic parity and migration receipts."
rollback_gate = "Keep non-disposable V1 stores and the old shell read-only until the release-cell rollback window closes and a restore drill succeeds."
v1_removal_gate = "Remove a V1 route only after inventory ownership, shadow parity, cutover, rollback-window, stale-client rejection, and negative-code receipts pass."
waves = ["contracts-and-inventory", "shadow-and-backfill", "surface-cutover", "v1-retirement"]

