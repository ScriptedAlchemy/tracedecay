[governance]
inventory_generator = "plan-12-pr-3r"
inventory_output = "target/tracedecay-v2-inventory"
adapter_final_pr = "PR 37"
adapter_final_state = "zero-live-compatibility-adapters"
package_admission_rule = "two-consumers-or-demonstrated-firewall-plus-merger-review"
waiver_rule = "named-owner-evidence-and-expiry-before-PR-37"

[budgets]
rust_package_ceiling = 11
definite_duplicate_body_lines = 10
default_binary_ratio_max = 1.25
idle_rss_ratio_max = 1.25
hot_build_ratio_max = 1.25
clean_build_ratio_max = 1.5
parity_replacement = "handwritten-v2-lines-less-than-retired-v1-plus-adapter-lines"
complexity = "zero-new-non-waived-hard-file-function-or-complexity-violations"
generated_accounting = "generated-lines-separate-with-generator-size-and-generation-time"

