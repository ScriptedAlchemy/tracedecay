packages:
  - dashboard
  - sdks/typescript
  - plugin/cursor-native-extension
  - plugin/chatgpt-extension

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
  core-js: false
  msw: false

overrides:
  esbuild: ^0.28.1

minimumReleaseAge: 0

verifyDepsBeforeRun: error

# @openai/mcp-extensions 0.2.0 peers ext-apps ^1.7.5 only for its `./app`
# helpers. The extension imports `./server`, which binds to the SDK 2.x
# `@modelcontextprotocol/server` that ext-apps 2.x also uses.
peerDependencyRules:
  allowedVersions:
    "@openai/mcp-extensions>@modelcontextprotocol/ext-apps": "2"
